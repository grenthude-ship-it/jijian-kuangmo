{id:"c6",c:"俱乐部",t:"功勋老帅病重住院",d:"把球队从低谷带出来的老帅突发重病住院，球迷自发去医院送花，全队的心都揪着。",o:[["包揽医疗费+全队探望",80,.95,["俱乐部包揽费用，探望照片感动全网，球队带着老帅的祝福拿下关键战。",-80,5,4,5,1000,0,0,""],["",0,0,0,0,0,0,0,""]],["设立老帅康复基金向球迷开放",30,.85,["基金三天募满，球迷和俱乐部的心意一起送到病房，老帅感动落泪。",-30,4,3,5,800,0,0,""],["",0,0,0,0,0,0,0,""]],["低调处理，不占用公共资源",0,.6,["低调探望完成，球队把关心放在心里，训练更拼了。",0,1,2,1,0,0,0,""],["低调被误读为冷漠，球迷质问俱乐部「忘了恩人」，口碑受损。",0,-4,-1,-4,0,1,0,""]]]},
{id:"c7",c:"俱乐部",t:"训练基地遭居民投诉",d:"周边居民联名投诉基地夜间灯光和噪音扰民，环保部门开出限期整改通知，基地可能被迫缩短训练时间。",o:[["加装隔音屏+灯光改造",110,.9,["改造后居民撤诉，俱乐部还开放基地参观日，邻里关系变融洽了。",-110,3,1,2,0,0,0,""],["改造验收没达标，还要二次施工，又多花一笔。",-180,-1,0,0,0,1,0,""]],["给社区送福利：免费开放球场",40,.75,["社区孩子每周来踢球，居民从投诉方变成球迷，投诉自然撤销。",-40,4,1,3,600,0,0,""],["开放日管理混乱，草坪被踩坏，居民也没领情。",-70,-2,0,-1,0,0,0,""]],["法务硬顶：基地用地合法",0,.45,["法务赢了程序，但居民天天来门口举牌，球队训练心神不宁。",0,-1,-2,-1,0,2,0,""],["硬顶上了地方新闻头条，市政府出面约谈，俱乐部被动极了。",0,-5,-2,-2,0,3,0,""]]]},
{id:"c8",c:"俱乐部",t:"官网和票务系统被黑",d:"黑客攻破了票务系统，部分球迷数据泄露，抢票链接被黄牛脚本霸占，客服电话被打爆。",o:[["请顶级安全团队应急+补偿球迷",130,.85,["安全团队 6 小时修复并溯源，补偿方案大方，球迷反而夸处理专业。",-130,3,0,3,0,0,0,""],["修复后又被二次攻击，数据问题扩大，监管部门介入。",-200,-4,0,-4,0,2,0,""]],["先道歉，再慢慢修",30,.65,["诚恳道歉稳住情绪，系统三天后恢复，就是丢了些票房。",-80,1,0,1,0,0,0,""],["慢修期间黄牛横行，真球迷买不到票，怨声载道。",-120,-3,0,-5,0,1,0,""]],["声称是谣言，系统只是拥挤",0,.3,["声明暂时压住质疑，但技术论坛已经把攻击证据贴出来了，热度在涨。",0,-1,0,-1,0,3,0,""],["证据实锤，俱乐部被指撒谎，信任危机+监管罚单一起到。",-150,-7,0,-6,0,5,0,""]]]},
{id:"e1",c:"外部",t:"死敌俱乐部高薪挖角主帅",d:"死敌开出双倍年薪挖你的主教练，还附赠「全权组队」承诺。教练没表态，但训练场上的气氛已经变了。",o:[["匹配薪资+续约三年",220,.75,["续约官宣，教练在发布会上说「我的心在这里」，死敌白挖一场。",-220,3,4,2,0,0,0,""],["加薪也没能留住他的心，教练开始和死敌眉来眼去，只能启动换帅预案。",-100,-3,-5,-2,0,1,0,""]],["放他走，提拔助教",0,.6,["助教上位打出连胜，球迷惊呼「因祸得福」，还省了一大笔薪资。",100,2,3,1,0,0,0,""],["助教压不住更衣室，战绩滑坡，球迷开始怀念前任。",0,-3,-5,-2,0,0,0,""]],["公开谴责对手挖角行为",0,.55,["谴责引来舆论支持，对手被足协口头警告，挖角不了了之。",0,3,1,1,0,1,0,""],["谴责没拦住人，教练还是走了，俱乐部显得既输人又输阵。",0,-4,-6,-3,0,1,0,""]]]},
{id:"e2",c:"外部",t:"联赛官方启动财务调查",d:"因为近期转会操作频繁，联赛官方宣布对俱乐部近三年账目进行财务公平调查，需要提交全部凭证。",o:[["全力配合，开放全部账目",40,.85,["调查结论：账目干净。官方通报反而成了俱乐部的信用背书。",-40,4,1,0,0,-2,0,""],["配合中发现两笔凭证缺失，调查升级，热度飙升。",-40,-3,-2,0,0,5,0,""]],["请顶级审计所先自查",120,.8,["自查提前补上所有漏洞，官方调查走个过场就结束。",-120,3,0,0,0,-1,0,""],["自查查出真问题！审计所建议主动上报，俱乐部陷入两难。",-120,-2,-3,0,0,4,0,""]],["拖延提交，边踢边看",0,.35,["拖延暂时没事，但调查组的耐心在消耗。（热度+）",0,0,0,0,0,4,0,""],["官方以「不配合」开出罚单并扩大调查范围，事情闹大了。",-150,-5,-2,0,0,7,0,""]]]},
{id:"e3",c:"外部",t:"经济下行，赞助市场遇冷",d:"大环境不好，三家意向赞助商同时放缓谈判，商业部门预计本赛季赞助收入要缩水三成。",o:[["打包权益降价促销",0,.7,["打包方案性价比拉满，中小赞助商排队签约，总量反超去年。",150,2,1,1,0,0,0,""],["降价也没人买账，还拉低了品牌档次，老赞助商要求跟着降价。",-50,-2,0,-1,0,0,0,""]],["开发球迷付费会员新财源",70,.75,["会员体系上线首月就爆了，球迷愿意为情怀买单，新财源稳了。",200,3,2,4,2000,0,0,""],["会员权益设计翻车，被骂「割韭菜」，退订潮涌来。",-70,-3,0,-4,0,1,0,""]],["砍商业部门预算过冬",0,.6,["预算砍了，骨干也走了两个，商业开发进入慢车道。",90,0,-1,0,0,0,0,""],["砍预算砍到大动脉，续约谈判全线停滞，收入雪崩。",-120,-3,-2,-1,0,0,0,""]]]},
{id:"e4",c:"外部",t:"国家队征召抽走半数主力",d:"国际比赛日，国家队一口气征召你队中五名主力，其中两人还有伤病隐患，回来还要踢魔鬼赛程。",o:[["全力支持放行，为国争光",0,.8,["国脚们带着国家队的好状态回来，俱乐部「顾大局」的名声传遍联赛。",0,4,2,3,800,0,0,""],["一名主力在国家队受伤，俱乐部只能吞下苦果。",0,-2,-4,-1,0,0,0,"inj"]],["和足协协商少征两人",20,.6,["协商成功，两名有伤隐患的球员留队休整，各方都能接受。",-20,1,1,0,0,0,0,""],["协商被拒，还被扣上「不爱国」的帽子，舆论压力山大。",-20,-4,-2,-3,0,1,0,""]],["让球员自己「诈伤」推掉",0,.3,["这次混过去了，但这种事做多了迟早露馅。（热度+）",0,0,0,0,0,3,0,""],["诈伤被国家队队医识破，球员被内部停赛，俱乐部声誉扫地。",0,-6,-4,-4,0,5,0,"inj"]]]},
{id:"e5",c:"外部",t:"同城德比对手球迷挑衅",d:"德比前夜，对手球迷在你的主场外墙涂鸦挑衅，自家球迷群情激愤，扬言要「回敬」。",o:[["连夜清理+呼吁文明观赛",25,.85,["涂鸦清理干净，俱乐部的文明倡议被官媒转发，德比平安踢完。",-25,4,0,3,0,0,0,""],["清理时和对方球迷撞个正着，小摩擦上了社会新闻。",-25,-2,0,-2,0,1,0,""]],["用幽默海报回击",15,.75,["神回应的海报刷爆社交网络，营销号自发传播，对手球迷被噎得说不出话。",-15,4,1,4,1200,0,0,""],["海报被指挑事，官方要求撤下并道歉，里外不是人。",-15,-3,0,-2,0,2,0,""]],["不理睬，专注比赛",0,.65,["球队用一场大胜回击一切，球迷扬眉吐气。",0,3,3,3,0,0,0,""],["场上输了球，场外的涂鸦成了对手庆祝的背景板，扎心。",0,-3,-3,-3,0,0,0,""]]]},
{id:"e6",c:"外部",t:"转播商要求更改开球时间",d:"转播商为了黄金档收视，要求把你的主场开球时间改到工作日深夜，球迷协会明确表示反对。",o:[["接受改期，拿转播补偿",0,.8,["补偿到位，还和转播商谈下下赛季的转播分成提升，双赢。",180,1,0,-1,0,0,0,""],["深夜场上座率惨淡，电视镜头里看台空荡荡，反而丢了面子。",80,-2,0,-4,-1500,0,0,""]],["拒绝改期，力挺球迷",0,.65,["球迷感动得拉起横幅「俱乐部和我们站在一起」，主场氛围爆棚。",0,3,1,5,1000,0,0,""],["转播商记仇，下赛季转播场次被砍，收入受损。",-80,-1,0,-1,0,0,0,""]],["折中：改到周末晚间黄金档",10,.75,["折中方案各方满意，转播收视和上座率双丰收。",120,2,0,2,500,0,0,""],["折中没谈成，最后还是被安排到深夜，球迷和转播商都不满意。",-30,-1,0,-3,0,0,0,""]]]},
{id:"e7",c:"外部",t:"假球传闻波及俱乐部",d:"联赛爆出假球窝案，虽然和你无关，但有一名前任球员涉案，媒体开始「顺藤摸瓜」往你身上引。",o:[["主动声明+开放历史账目自证",30,.85,["自证清白干净利落，官方点名表扬配合调查，俱乐部信誉反涨。",-30,4,1,1,0,-3,0,""],["声明发了，但一笔旧转会还是被翻出来反复炒作，热度居高不下。",-30,-2,0,-1,0,3,0,""]],["起诉造谣媒体",90,.65,["胜诉！媒体公开道歉赔偿，谣言不攻自破。",60,3,0,1,0,-1,0,""],["官司打了一年还没结果，传闻在诉讼里被反复提及，越描越黑。",-90,-3,-1,-1,0,3,0,""]],["沉默是金，不回应",0,.45,["风头过去，传闻无人再提，球队没受影响。",0,0,0,0,0,1,0,""],["沉默被当成心虚，赞助商暂停续约观望，损失不小。",-100,-4,0,-2,0,4,0,""]]]},
{id:"b1",c:"商业",t:"跨界餐饮门店持续亏损",d:"俱乐部旗下的主题餐饮店连亏三个月，店长说地段人流不行，再亏下去要拖累集团报表了。",o:[["换网红店长+改菜单翻新",90,.65,["翻新后成了球迷打卡地，排队排到街口，餐饮板块转亏为盈。",120,2,0,2,800,0,0,""],["翻新花了钱，客流还是不行，亏损继续扩大。",-140,-1,-1,-1,0,0,0,""]],["果断关店止损",0,.8,["及时止损，店面转租出去还赚了一笔转让费。",70,1,0,0,0,0,0,""],["关店引发员工安置纠纷，补偿金比预想的多花不少。",-60,-2,0,-1,0,1,0,""]],["和外卖平台合作自救",40,.6,["外卖单量爆了，堂食冷清但总账扭亏，店长松了口气。",60,1,0,1,0,0,0,""],["外卖抽成太高，卖得越多亏得越多，只能认栽。",-80,0,0,-1,0,0,0,""]]]},
{id:"b2",c:"商业",t:"品牌合作方产品翻车",d:"和你联名的品牌方被曝产品质量问题，联名款正在热卖，球迷开始要求俱乐部切割。",o:[["立即下架联名款+发声明",60,.85,["下架果断，声明诚恳，球迷点赞「有担当」，品牌口碑保住了。",-60,4,0,3,0,0,0,""],["下架慢了半拍，退货潮+投诉一起涌来，客服被骂哭。",-120,-3,0,-4,0,1,0,""]],["等品牌方自己澄清",0,.5,["品牌方澄清给力，联名款销量不降反升，虚惊一场。",40,1,0,1,0,0,0,""],["品牌方越描越黑，俱乐部被连带骂上热搜，代言人也要解约。",-80,-5,0,-4,0,2,0,""]],["反手收购对方渠道救火",300,.55,["收购后渠道为我所用，联名款换个牌子继续卖，危机变商机。",150,2,1,1,0,0,0,""],["收购踩了坑，对方的窟窿比想象中大，集团被拖下水。",-350,-2,-1,-1,0,1,0,""]]]},

function crisisPick(){var pool=CRISES.filter(function(c){return!G.crisis.seen[c.id]});if(!pool.length){G.crisis.seen={};pool=CRISES.slice()}return pick(pool)}
function crisisRoll(chance){if(!G||!G.started||G.ended||window._crisisOpen)return!1;crisisEnsure();if(G.crisis.pending){crisisShowPending();return!0}if(Math.random()>=chance)return!1;var c=crisisPick();G.crisis.pending=c.id,G.crisis.last=G.month,showCrisis(c);return!0}
