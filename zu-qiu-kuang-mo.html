<script>
"use strict";
/* ================= 新系统（七大经营系统，全部与钱/士气/能力/声望/热度/球迷/青训/转会/设施挂钩） =================
   1 训练与发展：训练强度 + 理疗投入（growPlayers / 单场引擎 / 月度财务已接入）
   2 转会与建队：足球总监四种策略（含零引援锁买人）
   3 俱乐部运营：董事会耐心/预算/设施拨款 + 城市赛事运营（门票加成已接入 matchGate）
   4 数据球探：残缺报告（完整度=球探+数据中心）、适配度、考察任务带回独家候选
   5 更衣室：心情月结、出场承诺兑现/食言
   6 人际关系：谈话 / 承诺首发 / 续约（续约球员不被报价挖角）
   7 媒体关系：发布会四种表态 + 公开表扬/批评（批评有概率激出状态，growPlayers 已接入） */
function playerByName(name){ var f=null; if(G) G.squad.forEach(function(p){ if(p.name===name) f=p; }); return f; }
function hasScout(){ return !!(G && G.staff.some(function(x){ return x.role==='首席球探'; })); }
function scoutLevel(){ return 1 + (hasScout()?1:0) + ((G&&G.fac.data)||0); } // 报告完整度：1 起步，首席球探 +1，数据中心每级 +1

/* ---- 1. 训练计划 ---- */
function setTrainIntensity(v){
  if(!G.train) G.train={intensity:'标准', physio:1};
  G.train.intensity=v;
  log('🏋️ 训练强度调整为「'+v+'」：'+(v==='高强度'?'成长加速、年轻人涨得更快，但体能掉得快、训练伤和比赛伤都变多，老将掉状态也更快。':(v==='恢复调养'?'成长放缓，换全队体能和健康——赛程密、伤号多的时候用它保人。':'按常规节奏训练，成长、体能、伤病都走中间路线。')),'');
  render();
}
function setPhysio(lv){
  if(!G.train) G.train={intensity:'标准', physio:1};
  G.train.physio=lv;
  log('🩹 理疗投入调整为 '+(lv===0?'0 级（不投入：省钱，但训练伤概率最高）':(lv===1?'标准理疗 · 25万/月':'顶级理疗 · 50万/月（训练伤概率再降，伤员每天多恢复 1 天）'))+'。费用在每月运营费里扣。','');
  render();
}
function trainCardHTML(){
  var t=G.train||{intensity:'标准', physio:1};
  var intens=['恢复调养','标准','高强度'].map(function(v){ return '<button class="btn sm '+(t.intensity===v?'pri':'')+'" onclick="setTrainIntensity(\''+v+'\')">'+v+'</button>'; }).join('');
  var phys=[0,1,2].map(function(lv){ return '<button class="btn sm '+((t.physio||0)===lv?'pri':'')+'" onclick="setPhysio('+lv+')">'+(lv===0?'不投入':(lv===1?'标准理疗 · 25万/月':'顶级理疗 · 50万/月'))+'</button>'; }).join('');
  return '<div class="card"><h3><span class="no">训练</span>训练与球员发展<span class="hint">重点定方向 · 强度定取舍 · 理疗定伤病</span></h3>'
  +'<p class="desc">训练重点在上面阵容卡里选（进攻演练/防守体系/体能储备/青训提拔）。这里定<b>强度</b>和<b>理疗投入</b>：高强度让成长 ×1.5、年轻人涨得更快，但体能消耗、训练伤、比赛伤和老将掉状态全都变多；恢复调养正好反过来。年龄、主教练风格、训练基地、医疗中心和理疗投入一起决定谁涨球、谁受伤——永远在「现在多练」和「以后还有人用」之间取舍。</p>'
  +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;"><span class="mini">训练强度：</span>'+intens+'</div>'
  +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span class="mini">理疗投入：</span>'+phys+'</div>'
  +'<p class="mini" style="margin-top:8px;">当前生效：强度「'+t.intensity+'」· 理疗 '+(t.physio||0)+' 级（每级让训练伤概率 -5%）· 训练基地 '+G.fac.training+' 级 · 医疗中心 '+G.fac.medical+' 级 · 主教练 '+esc(G.coach.name)+'（'+G.coach.spec+'）· 数据分析中心 '+(G.fac.data||0)+' 级</p></div>';
}

/* ---- 4. 数据球探与情报 ---- */
function fitScore(p){
  var F=FORMATIONS[G.formation||'4-3-3']||FORMATIONS['4-3-3'];
  var need={'门将':1,'后卫':F.DF,'中场':F.MF,'前锋':F.FW};
  var have={}; G.squad.forEach(function(q){ have[q.pos]=(have[q.pos]||0)+1; });
  var gap=(need[p.pos]||3)-(have[p.pos]||0);
  var starters=G.squad.slice().sort(function(a,b){ return b.ab-a.ab; }).slice(0,11);
  var avgAb=starters.length? starters.reduce(function(s2,q){ return s2+q.ab; },0)/starters.length : 55;
  var score=55 + gap*7 + (p.ab-avgAb)*2.2 - Math.max(0,p.age-27)*1.6 - Math.max(0,p.wage-6)*1.2 + (p.pot-p.ab)*0.9;
  return Math.round(clamp(score,5,99));
}
function scoutReportFor(p){ if(!G || !G.scout || !p) return null; return G.scout.reports[p.name]||null; }
function makeReport(p){
  var lv=scoutLevel();
  var spread=Math.max(0, 9-lv*2); // 完整度越高，潜力区间越窄：1 级 ±7，3 级 ±3，5 级起精确
  var risks=[];
  if(p.age>=31) risks.push('年龄偏大，状态下滑风险高，买的是即战力');
  if(p.age>=29 && p.pot<=p.ab) risks.push('已过巅峰，没有成长空间');
  if(p.wage>=10) risks.push('工资高，会抬高更衣室薪资结构');
  if(p.pot-p.ab>=14) risks.push('成长空间大，但需要出场时间喂，买回来坐板凳会废');
  if(!risks.length) risks.push('暂无明显风险点');
  var verdict= p.price!=null? (p.price<p.value*0.92? '挂牌价低于身价，属于被低估' : (p.price>p.value*1.25? '挂牌价明显溢价，慎重' : '价格与身价基本匹配')) : '';
  return {lv:lv, potLo:Math.max(p.ab, p.pot-spread), potHi:p.pot+(spread>0? Math.round(spread/2):0), fit:fitScore(p), risks:risks, verdict:verdict, month:G.month};
}
function scoutPlayer(i){
  var p=G.market[i]; if(!p) return;
  if(!G.scout) G.scout={reports:{}, used:0, mission:null};
  if(G.scout.reports[p.name]){ toast('已经有 '+p.name+' 的球探报告了'); return; }
  if(G.scout.used>=3){ toast('球探本月已经出了 3 份报告，下个月再来——情报也是要花时间的'); return; }
  if(G.cash<8){ toast('球探差旅费 8万，现金不够'); return; }
  G.cash-=8; G.scout.used++;
  var r=makeReport(p); G.scout.reports[p.name]=r;
  log('🔭 球探报告：'+p.name+'（'+p.pos+'）—— 适配度 '+r.fit+'/100，真实潜力约 '+r.potLo+'~'+r.potHi+'（报告完整度 '+r.lv+' 级）。'+r.verdict+'。','');
  toast('报告到手：'+p.name+' 适配度 '+r.fit+'/100');
  render();
}
function scoutMission(region){
  if(!G.scout) G.scout={reports:{}, used:0, mission:null};
  if(G.scout.mission){ toast('球探已经在外考察了，等他下个月回来'); return; }
  var cost= region==='国内'? 30 : 60;
  if(G.cash<cost){ toast('考察经费 '+cost+'万，现金不够'); return; }
  G.cash-=cost;
  G.scout.mission={region:region, due:G.month+1};
  log('✈️ 球探团队出发去'+region+'考察（经费 '+fmt(cost)+'），下个月带回 1~2 名独家候选，附完整报告。','');
  render();
}
function scoutMissionArrive(){
  if(!G.scout || !G.scout.mission) return;
  if(G.month < G.scout.mission.due) return;
  var region=G.scout.mission.region; G.scout.mission=null;
  var n=ri(1,2), names=[];
  for(var i=0;i<n;i++){
    var p= region==='国内'? genPlayer(Math.random()<0.5?'young':'good') : genPlayer('star');
    if(region!=='国内' && p.ab<66) p.ab=ri(66,78);
    p.price=Math.round(p.value*rnd(0.95,1.15));
    G.market.unshift(p);
    G.scout.reports[p.name]=makeReport(p);
    names.push(p.name+'（'+p.pos+' · 能力 '+p.ab+' · 潜力 '+p.pot+'）');
  }
  log('✈️ 球探从'+region+'回来了，带回独家候选：'+names.join('、')+'，已置顶放进转会市场，报告一并附上。','good');
}
function pageIntel(){
  var lv=scoutLevel();
  var rows=G.market.map(function(p,i){
    var r=scoutReportFor(p);
    return '<div class="item"><div class="grow"><div class="nm">'+esc(p.name)+(p.foreign?' <span class="pill">外援</span>':'')+' '+posPill(p.pos)+(r?' <span class="pill up">已有报告</span>':'')+'</div>'
    +'<div class="meta">'+p.age+' 岁 · 能力 '+p.ab+' · 标称潜力 '+p.pot+' · 月薪 '+p.wage+'万 · 挂牌价 '+fmt(p.price)+' · 身价 '+fmt(p.value)+'</div>'
    +(r? '<div class="meta">🔭 报告（完整度 '+r.lv+' 级）：真实潜力约 <b>'+r.potLo+'~'+r.potHi+'</b> · 适配度 <b>'+r.fit+'/100</b>（按当前阵型 '+ (G.formation||'4-3-3') +' 的位置缺口、能力差、年龄和工资算）'+(r.verdict?' · '+r.verdict:'')+' · 风险：'+r.risks.join('；')+'</div>' : '<div class="meta">暂无报告：只有标称潜力——那是经纪人报的数。派球探看过，才知道真实潜力和适不适合你的阵型。</div>')
    +'</div><div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto;">'+(r?'':'<button class="btn sm" onclick="scoutPlayer('+i+')">派球探 · 8万</button>')+'<button class="btn pri sm" onclick="buyPlayer('+i+')">签下</button></div></div>';
  }).join('') || '<p class="desc">市场暂时没人，等下个月刷新。</p>';
  var missionHTML= (G.scout && G.scout.mission)
    ? '<p class="desc">✈️ 球探正在<b>'+G.scout.mission.region+'</b>考察，下个月带回独家候选（附完整报告）。</p>'
    : '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn sm" onclick="scoutMission(\'国内\')">派去国内考察 · 30万</button><button class="btn sm" onclick="scoutMission(\'欧洲\')">派去欧洲考察 · 60万</button><button class="btn sm" onclick="scoutMission(\'南美\')">派去南美考察 · 60万</button></div>';
  return '<div class="kpis">'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--blue)"></span>报告完整度</div><div class="vl num">'+lv+' 级</div><div class="sub">首席球探 +1 · 数据中心每级 +1 · 5 级潜力精确</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--green)"></span>本月已出报告</div><div class="vl num">'+((G.scout&&G.scout.used)||0)+' / 3</div><div class="sub">每份 8万差旅费 · 每月最多 3 份</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--orange)"></span>数据分析中心</div><div class="vl num">'+(G.fac.data||0)+' 级</div><div class="sub">在「俱乐部」页升级 · 还加球队强度</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--gold)"></span>首席球探</div><div class="vl" style="font-size:19px;">'+(hasScout()?'孙立平 · 在队':'未聘请')+'</div><div class="sub">在阵容页「教练组与职员」里聘请</div></div>'
  +'</div>'
  +'<div class="card"><h3><span class="no">情报</span>数据球探与情报<span class="hint">在信息差里赌潜力与适配</span></h3>'
  +'<p class="desc">转会市场上的「潜力」是经纪人报的数，真假只有球探知道。派球探（8万/份，每月 3 份）拿到<b>残缺报告</b>：真实潜力只给区间，报告越完整区间越窄——首席球探和数据分析中心等级决定完整度。适配度按你当前阵型的位置缺口、和首发的差距、年龄、工资综合算。赌的就是这个信息差：区间下限都比标称高，是捡漏；上限还不如标称，是坑。</p>'
  + missionHTML + '</div>'
  +'<div class="card"><h3><span class="no">对比</span>市场情报对比<span class="hint">现金 '+fmt(G.cash)+' · 阵容 '+G.squad.length+'/40</span></h3>'+rows+'</div>';
}

/* ---- 2. 转会策略与足球总监 ---- */
var DIRECTOR_MODES=[
  {id:'manual', nm:'手动引援', ds:'一切你说了算，足球总监只看不动手。适合每笔钱都要自己拍板的人。'},
  {id:'star', nm:'巨星路线', ds:'每月结算后，总监自动追市场里能力最高的球员（保留 300万 保底现金）；收到高于身价 35% 的报价也会自动卖。没首席球探把关时，每笔自动签约有 20% 概率看走眼（能力 -2）。'},
  {id:'youth', nm:'青训低买高卖', ds:'每月结算后，总监专挑 20 岁以下、潜力 ≥75 的最便宜苗子自动签下（保留 200万 保底现金）；高价报价同样自动卖。买回来靠训练和青训练出来，涨了身价再卖——低买高卖的循环。'},
  {id:'none', nm:'零引援', ds:'关窗锁门：不买任何人，买人按钮直接锁住。只靠原班人马 + 青训提拔过日子，卖人和提拔不受影响。最省钱，也最考验耐心。'}
];
function setDirectorMode(m){
  if(!G.director) G.director={mode:'manual'};
  G.director.mode=m;
  var d=DIRECTOR_MODES.filter(function(x){ return x.id===m; })[0];
  log('🧭 建队策略切换为「'+d.nm+'」：'+d.ds,'');
  toast('建队策略：'+d.nm); render();
}
function directorAct(){
  if(!G.director || G.director.mode==='manual' || G.director.mode==='none') return;
  if(G.board && G.board.frozen>0) return;
  if(G.squad.length<40){
    if(G.director.mode==='star'){
      var best=null; G.market.forEach(function(p){ if(!best || p.ab>best.ab) best=p; });
      if(best && G.cash>best.price+300){
        G.cash-=best.price; best.cost=best.price; best.signNote='';
        var idx=G.market.indexOf(best); if(idx>=0) G.market.splice(idx,1);
        squadPush(best);
        if(!hasScout() && Math.random()<0.2){ best.ab=Math.max(40,best.ab-2); best.value=Math.round(Math.max(5,Math.pow(Math.max(best.ab-38,2),2)*0.16*(best.age>30?0.75:1))); log('🧭 足球总监签下 '+best.name+'（签约费 '+fmt(best.cost)+'），但没有首席球探把关，看走眼了：实际能力只有 '+best.ab+'。','bad'); }
        else log('🧭 足球总监按「巨星路线」自动签下 '+best.name+'（能力 '+best.ab+'），签约费 '+fmt(best.cost)+'。','good');
      }
    } else if(G.director.mode==='youth'){
      var cand=null; G.market.forEach(function(p){ if(p.age<=20 && p.pot>=75 && (!cand || p.price<cand.price)) cand=p; });
      if(cand && G.cash>cand.price+200){
        G.cash-=cand.price; cand.cost=cand.price; cand.signNote='';
        var idx2=G.market.indexOf(cand); if(idx2>=0) G.market.splice(idx2,1);
        squadPush(cand);
        log('🧭 足球总监按「低买高卖」自动签下小将 '+cand.name+'（'+cand.age+' 岁，潜力 '+cand.pot+'），签约费 '+fmt(cand.cost)+'。练出来就是利润。','good');
      }
    }
  }
  if(G.offers && G.squad.length>15){
    for(var i=0;i<G.offers.length;i++){
      var o=G.offers[i];
      if(o.price>o.player.value*1.35){
        var ix=G.squad.indexOf(o.player); if(ix<0) continue;
        G.cash+=o.price; G.squad.splice(ix,1); G.offers.splice(i,1);
        log('🧭 足球总监自动接受高价报价：'+o.player.name+' 以 '+fmt(o.price)+' 离队（身价 '+fmt(o.player.value)+'，溢价 35% 以上，落袋为安）。','good');
        break;
      }
    }
  }
}
function directorCardHTML(){
  var mode=(G.director&&G.director.mode)||'manual';
  var cur=DIRECTOR_MODES.filter(function(m){ return m.id===mode; })[0];
  var btns=DIRECTOR_MODES.map(function(m){ return '<button class="btn sm '+(mode===m.id?'pri':'')+'" onclick="setDirectorMode(\''+m.id+'\')">'+m.nm+'</button>'; }).join('');
  return '<div class="card"><h3><span class="no">建队</span>转会策略与足球总监<span class="hint">当前：'+cur.nm+'</span></h3>'
  +'<p class="desc">'+cur.ds+'</p>'
  +'<div style="display:flex;gap:8px;flex-wrap:wrap;">'+btns+'</div>'
  +'<p class="mini" style="margin-top:8px;">四条建队路线：自己动手、赌巨星、赌青训低买高卖、或者干脆零引援只靠原班人马和青训。总监的眼光取决于球探团队——首席球探在队，总监从不看走眼；不在队，自动签约有翻车风险。想先看清再下手，就去「数据球探」页拿报告。</p></div>';
}

/* ---- 5+6. 更衣室与球员关系 ---- */
function talkPlayer(name){
  var p=playerByName(name); if(!p) return;
  if(p.talkM===G.month){ toast('本月已经和 '+name+' 谈过了'); return; }
  p.talkM=G.month;
  p.mood=clamp((p.mood||60)+8,0,100); p.trust=clamp((p.trust||55)+4,0,100);
  log('💬 你和 '+name+' 一对一谈了一次：出场、待遇、未来，他都说了，你也给了回应。他的心情 +8、信任 +4（现在心情 '+p.mood+'、信任 '+p.trust+'）。','');
  render();
}
function promisePlayer(name){
  var p=playerByName(name); if(!p) return;
  if(p.promise){ toast(name+' 身上已经有一个承诺在等着兑现了'); return; }
  p.promise={need:2, due:G.month+1, base:p.played||0};
  p.mood=clamp((p.mood||60)+6,0,100); p.trust=clamp((p.trust||55)+3,0,100);
  log('🤝 你向 '+name+' 承诺：下个月至少让他首发 2 场。承诺记在他心里——兑现了信任大涨，食言了整个更衣室都会看不起你。','');
  render();
}
function renewPlayer(name){
  var p=playerByName(name); if(!p) return;
  var fee=Math.round(p.wage*6);
  if(G.cash<fee){ toast('续约签字费 '+fmt(fee)+'，现金不够'); return; }
  G.cash-=fee;
  p.wage=Math.round(p.wage*1.2*10)/10;
  p.trust=clamp((p.trust||55)+20,0,100); p.mood=clamp((p.mood||60)+15,0,100);
  p.value=Math.round(p.value*1.1);
  p.renewedUntil=G.month+3;
  log('✍️ '+name+' 续约完成：签字费 '+fmt(fee)+'，月薪涨到 '+p.wage+'万，身价 +10% → '+fmt(p.value)+'。未来 3 个月不会有球队报价挖他，他的信任 +20、心情 +15。','good');
  render();
}
function processPromises(){
  G.squad.forEach(function(p){
    if(p.promise && G.month>=p.promise.due){
      var played=(p.played||0)-(p.promise.base||0);
      if(played>=p.promise.need){ p.trust=clamp((p.trust||55)+15,0,100); p.mood=clamp((p.mood||60)+10,0,100); log('✅ 承诺兑现：'+p.name+' 上个月首发了 '+played+' 场，你说话算话。他的信任 +15、心情 +10，更衣室都看在眼里。','good'); }
      else { p.trust=clamp((p.trust||55)-25,0,100); p.mood=clamp((p.mood||60)-20,0,100); G.morale=clamp(G.morale-3,5,100); log('❌ 承诺食言：你答应给 '+p.name+' 至少 '+p.promise.need+' 次首发，实际只有 '+played+' 次。他的信任 -25、心情 -20，全队士气 -3——球员记承诺，也记仇。','bad'); }
      p.promise=null;
    }
  });
}
function monthlySystems(){
  processPromises();
  // 更衣室心情月结：能力靠前却打不上比赛的人会一直不满，长期不满拖全队士气
  var sorted=G.squad.slice().sort(function(a,b){ return b.ab-a.ab; });
  var unhappy=[];
  G.squad.forEach(function(p){
    var mp=(p.played||0)-(p.playedSnap||0); p.playedSnap=p.played||0;
    var rank=sorted.indexOf(p);
    if(mp===0 && rank>=0 && rank<14 && !(p.inj>0)) p.mood=clamp((p.mood||60)-6,0,100);
    if(mp>=2) p.mood=clamp((p.mood||60)+3,0,100);
    if(p.trust==null) p.trust=55;
    p.trust=clamp(p.trust+(p.trust<55?1:(p.trust>55?-1:0)),0,100);
    if((p.mood||60)<35) unhappy.push(p.name);
  });
  if(unhappy.length){ G.morale=clamp(G.morale-unhappy.length*2,5,100); log('😤 更衣室有 '+unhappy.length+' 名球员心情低落（'+unhappy.join('、')+'），全队士气 -'+(unhappy.length*2)+'。去阵容页的「更衣室」找他们谈话、给首发承诺，或者用轮换让他们上场。','bad'); }
  // 董事会耐心月结：看排名与声望；耗尽会冻结下个月预算
  var b=G.board;
  if(b){
    var rank=myRank();
    var delta= rank<=2?6 : (rank<=4?2 : (rank>=7?-8 : -2));
    if(G.rep>=60) delta+=2;
    b.patience=clamp((b.patience==null?70:b.patience)+delta,0,100);
    if(b.frozen>0) b.frozen--;
    if(b.patience<=0){ b.frozen=1; b.patience=35; G.rep=clamp(G.rep-3,0,100); log('🏛️ 董事会耐心耗尽！董事会冻结下个月的引援与设施预算，并公开质疑了你的执教（声望 -3）。先把成绩打回来，再谈花钱。','bad'); }
    else if(b.patience<30) log('🏛️ 董事会耐心只剩 '+b.patience+'：再不拿出成绩，下个月的预算可能被冻结。发布会上低调一点、把球赢下来，都能续命。','bad');
  }
}
function dressingCardHTML(){
  var rows=G.squad.slice().sort(function(a,b){ return (a.mood||60)-(b.mood||60); }).map(function(p){
    var mood=p.mood||60, trust=p.trust||55;
    return '<div class="item"><div class="grow"><div class="nm">'+esc(p.name)+' '+posPill(p.pos)+(p.promise?' <span class="pill">🤝 承诺待兑现</span>':'')+(p.renewedUntil&&p.renewedUntil>G.month?' <span class="pill up">已续约</span>':'')+'</div>'
    +'<div class="meta">心情 '+mood+'/100'+(mood<35?' <b style="color:var(--red)">低落 · 在拖士气</b>':'')+' · 信任 '+trust+'/100 · 本赛季出场 '+(p.played||0)+' 次 · 月薪 '+p.wage+'万</div></div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;"><button class="btn sm" onclick="talkPlayer(\''+esc(p.name)+'\')">一对一谈话</button><button class="btn sm" onclick="promisePlayer(\''+esc(p.name)+'\')">承诺首发</button><button class="btn sm" onclick="renewPlayer(\''+esc(p.name)+'\')">续约 · '+fmt(Math.round(p.wage*6))+'</button></div></div>';
  }).join('');
  return '<div class="card"><h3><span class="no">更衣室</span>更衣室与球员关系<span class="hint">按心情从低到高排 · 最危险的在最上面</span></h3>'
  +'<p class="desc">球员都记承诺、看待遇：<b>谈话</b>每月每人一次，心情 +8、信任 +4；<b>承诺首发</b>是下个月至少首发 2 场，兑现信任 +15、心情 +10，食言信任 -25、心情 -20 还拖全队士气；<b>续约</b>花签字费（月薪 ×6）换工资 +20%、信任 +20、身价 +10%，3 个月内不被报价挖走。能力排前 14 却整月没上场的人，心情每月 -6；心情掉到 35 以下，每人每月拖全队士气 -2。用谈话、承诺、续约和轮换，把派系不满压在冒头之前。</p>'+rows+'</div>';
}

/* ---- 3. 董事会与城市运营 ---- */
function boardBudget(){
  var b=G.board; if(!b) return;
  var season=G.seasonsPlayed||0;
  if(b.budgetSeason===season){ toast('本赛季已经申请过预算了'); return; }
  b.budgetSeason=season;
  if(b.patience>=60){ var amt=ri(200,400); G.cash+=amt; log('🏛️ 董事会预算申请通过：追加运营预算 '+fmt(amt)+'。董事会说：成绩摆在那儿，这钱批得痛快。','good'); }
  else if(b.patience>=40){ var amt2=ri(100,200); G.cash+=amt2; b.patience=clamp(b.patience-3,0,100); log('🏛️ 董事会勉强批了 '+fmt(amt2)+' 预算，但撂下话：下赛季要看到回报（耐心 -3）。',''); }
  else { b.patience=clamp(b.patience-5,0,100); log('🏛️ 预算申请被驳回：“先把成绩打出来，再来谈钱。”董事会耐心 -5。先赢球，再开口。','bad'); }
  render();
}
function boardFacGrant(){
  var b=G.board; if(!b) return;
  var season=G.seasonsPlayed||0;
  if(b.facGrant){ toast('已经有一笔设施拨款没用，下一次升级自动半价'); return; }
  if(b.grantSeason===season){ toast('本赛季已经申请过设施拨款了'); return; }
  b.grantSeason=season;
  if(b.patience>=50){ b.facGrant=true; log('🏛️ 设施拨款申请通过：下一次设施升级半价，董事会出一半。去俱乐部页升级任意设施时自动抵扣。','good'); }
  else { b.patience=clamp(b.patience-4,0,100); log('🏛️ 设施拨款被驳回：董事会耐心只有 '+b.patience+'，觉得你应该先证明自己（耐心 -4）。','bad'); }
  render();
}
function cityAct(kind){
  var b=G.board; if(!b) return;
  var season=G.seasonsPlayed||0;
  if(kind==='carnival'){
    if(G.cash<60){ toast('嘉年华经费 60万，现金不够'); return; }
    G.cash-=60; b.cityRep=clamp(b.cityRep+5,0,100); G.fans+=2000; G.rel.fans=clamp(G.rel.fans+3,0,100);
    log('🎉 城市足球嘉年华办成了：球迷 +2,000、球迷会关系 +3、城市声望 +5 → '+b.cityRep+(b.cityRep>=60?'（门票 +5% 已生效）':'（到 60 解锁门票 +5%）')+'。','good');
  } else if(kind==='invitational'){
    if(b.citySeason===season){ toast('本赛季已经办过大型赛事了'); return; }
    if(G.cash<120){ toast('邀请赛成本 120万，现金不够'); return; }
    G.cash-=120; b.citySeason=season;
    var inc=Math.round(ri(150,260)*(0.7+G.rep/100)+G.fac.stadium*30);
    G.cash+=inc; b.cityRep=clamp(b.cityRep+8,0,100); G.fans+=3500; G.rep=clamp(G.rep+2,0,100);
    log('🏙️ 城市邀请赛圆满落幕：你以赛事组织者的身份操盘了整届比赛，转播与赞助分成 +'+fmt(inc)+'，球迷 +3,500、声望 +2、城市声望 +8。','good');
  } else if(kind==='hostbid'){
    if(G.fac.stadium<3){ toast('申办全国大赛要求主场球场 ≥3 级'); return; }
    if(b.citySeason===season){ toast('本赛季已经用过大型赛事名额了'); return; }
    if(G.cash<300){ toast('申办费用 300万，现金不够'); return; }
    G.cash-=300; b.citySeason=season;
    if(Math.random() < clamp(0.3 + b.cityRep*0.005 + G.rep*0.003, 0.2, 0.9)){
      var inc2=ri(600,1000); G.cash+=inc2; G.rep=clamp(G.rep+5,0,100); b.cityRep=clamp(b.cityRep+12,0,100); G.fans+=8000;
      log('🏆 申办成功！全国性赛事落户本市：赛事补贴与转播分成 +'+fmt(inc2)+'，声望 +5、球迷 +8,000、城市声望 +12。这座城市开始以你的球队为荣。','good');
    } else { b.cityRep=clamp(b.cityRep+3,0,100); log('🏙️ 申办大赛落选：评审觉得城市配套还差一点。300万打了水漂，只换来城市声望 +3 和一堆经验。把球场升上去、城市声望养高，下赛季再冲。','bad'); }
  }
  render();
}
function boardCityHTML(){
  var b=G.board||{patience:70, cityRep:35, frozen:0, budgetSeason:-1, grantSeason:-1, facGrant:false, citySeason:-1};
  var season=G.seasonsPlayed||0;
  return '<div class="card"><h3><span class="no">董事会</span>董事会与预算<span class="hint">耐心 '+(b.patience==null?70:b.patience)+'/100'+(b.frozen>0?' · ⚠️ 本月预算冻结中':'')+'</span></h3>'

  +'<p class="desc">不止管球队，也能当赛事组织者经营这座城市：嘉年华攒人气，邀请赛赚分成，球场够大还能申办全国大赛。城市声望越高，申办越容易成，主场门票也卖得越贵。</p>'
  +'<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn sm" onclick="cityAct(\'carnival\')">城市足球嘉年华 · 60万</button><button class="btn sm" '+(b.citySeason===season?'disabled':'')+' onclick="cityAct(\'invitational\')">'+(b.citySeason===season?'本赛季已办大型赛事':'城市邀请赛 · 120万（每赛季一次）')+'</button><button class="btn sm" '+(b.citySeason===season?'disabled':'')+' onclick="cityAct(\'hostbid\')">申办全国大赛 · 300万（需球场 3 级）</button></div></div>';
}

/* ---- 7. 媒体关系 ---- */
function mediaAct(kind){

/* 登录成功（或已有登录状态）后进入游戏：读当前账号（或游客默认存档）的存档，
   读不到就走海报 → 开局界面。原启动的二次抢救逻辑原样保留，只是存档键换成
   当前账号的键 curSaveKey()，哪个账号登录就抢救哪个账号的存档。 */
function enterGame(){
try{
  if(loadAutoSave()){
    PAGE='home';
    render();
    toast('💾 已自动读取上次存档：'+G.club+' · 第 '+G.month+' 个月，接着玩！');
    startPosterChain(false); // 每次进游戏：未删除的海报依次全弹（C罗 → 梅西 → 游戏创作者），然后接每周签到
  } else {
    render();
    startPosterChain(true); // 新玩家：先依次看完未删除的海报，再进开局界面
  }
  window.__hmBooted=true;
}catch(bootErr){
  try{
    var badRaw=null;
    try{ badRaw=localStorage.getItem(curSaveKey()); }catch(e1){}
    if(badRaw){ try{ localStorage.setItem(curSaveKey()+'-bak', badRaw); }catch(e2){} }
    var rescued=false;
    try{ rescued=loadAutoSave(); }catch(e3){ rescued=false; }
    /* 逐级兜底，每一级都单独包好：读档渲染失败 → 开局界面 → 登录界面。
       旧版只有前两级且共用一个 try：第二级的 render() 再抛错就被最外层吞掉，
       __hmBooted 永远置不上，看门狗面板成了唯一的「界面」，而旧面板的按钮又
       只管游客存档——账号玩家就这样被永久锁死。现在只要有任何一屏画出来，
       就置 __hmBooted，游戏至少能进；三级全灭才轮到看门狗面板。 */
    var shown=false;
    if(rescued){
      try{
        PAGE='home';
        render();
        toast('💾 已自动读取上次存档：'+G.club+' · 第 '+G.month+' 个月，接着玩！');
        startPosterChain(false);

      }catch(e6){ shown=false; }
    }

      /* 抢救失败也绝不自动清档：存档原样保留，只进开局界面兜底显示。 */
      try{
        G=null; PAGE='home';
        render();
        startPosterChain(true);
        toast('⚠️ 这次没能读出旧存档，但它还完整保存在本机、没有被删除。退出重开一次通常就能恢复。');
        shown=true;
      }catch(e7){
        try{ G=null; showLoginScreen('login'); shown=true; }catch(e8){}
      }
    }
    if(shown) window.__hmBooted=true;
  }catch(fallbackErr){ /* 看门狗接管，显示一键修复面板 */ }
}
}
function hmBoot(){
  /* 先看登录状态：没登录（或账号已被删）就停在登录界面，不进大厅；
     已登录（账号或游客）保持登录状态，直接进游戏。
     整个启动包在 try 里：主流程任何一步抛错，都退到完全不读存档的登录界面，
     绝不让启动死在半路、只剩看门狗面板。 */
  try{
    fetchAdminData(); /* 启动先拉一次后台数据（封禁 / 邮件 / 公告），拉不到不影响进游戏 */
    initSession();
    if(!SESSION){ showLoginScreen('login'); window.__hmBooted=true; return; }

    try{ G=null; showLoginScreen('login'); window.__hmBooted=true; }
    catch(e2){ /* 登录界面也画不出来才交给看门狗面板 */ }
  }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', hmBoot); }
else{ hmBoot(); }

  ensureBiz(); var dl=G.biz.deal; if(!dl) return;

  +'<p class="mini" style="margin-top:8px;">经营要点：扩店能放大收入盘子，也放大固定支出；行情差的月份可能亏钱，连亏时可以退出止损，盈利的行业退出时还能按累计利润加价回款。</p></div>'
  +'<div class="card"><h3><span class="no">账本</span>月度盈亏<span class="hint">每月结算后自动记账，最多保留近 8 个月</span></h3>'+hist+'</div>';
}
/* ---------------- 深度经营月度结算（月末随主账一起走） ---------------- */
function processBiz(){
  if(!G || !G.biz) return;
  var b=G.biz, notes=[], bizNet=0;
  /* 海外俱乐部：每月 3 场联赛 + 收入支出 + 青训出苗 */
  Object.keys(b.overseas||{}).forEach(function(id){
    var d=ovDef(id), c=b.overseas[id]; if(!d || !c) return;
    if(!c.squad) c.squad=[]; if(!c.youth) c.youth=[]; if(!c.results) c.results=[];
    var avg=ovAvgAb(c), w=0, dr=0, l=0, res=[];
    for(var i=0;i<3;i++){
      var pWin=clamp(0.34+(c.lv-1)*0.09+(avg-58)*0.012, 0.12, 0.72), r=Math.random();
      if(r<pWin){ res.push('胜'); w++; } else if(r<pWin+0.27){ res.push('平'); dr++; } else { res.push('负'); l++; }
      c.squad.forEach(function(p){ if(p.age<=24 && Math.random()<0.10 && p.ab<85) p.ab++; });
    }
    c.w+=w; c.d+=dr; c.l+=l;
    c.rank=clamp(c.rank + (l>=2? ri(0,2):0) - (w>=2? ri(0,2):0), 1, 10);
    c.results.unshift(G.year+'年'+G.mon+'月 · '+res.join(' ')+' · 第 '+c.rank+' 名');
    if(c.results.length>8) c.results.length=8;
    var inc=Math.round(ri(d.inc[0],d.inc[1])*(1+0.55*(c.lv-1))*(c.rank<=3?1.25:(c.rank>=8?0.8:1)));
    var up=Math.round(d.upkeep*(1+0.35*(c.lv-1)));
    var net=inc-up; c.lastNet=net; c.cumNet=(c.cumNet||0)+net; b.ovCum=(b.ovCum||0)+net; bizNet+=net;
    if(c.rank<=2 && Math.random()<0.3){ G.rep=clamp(G.rep+1,0,100); notes.push('🌍 '+d.club+' 在'+d.league+'高居第 '+c.rank+' 名，当地媒体报道母队 '+G.club+'，声望 +1。'); }
    if(c.youth.length<3 && Math.random()<0.30+0.06*c.lv){
      var yp=mkPlayer(pick(d.names), pick(POS), ri(50,60), ri(16,19), true);
      yp.pot=ri(74,90); yp.cost=0; yp.signNote=d.city+'青训输送';
      c.youth.push(yp);
      notes.push('🌍 '+d.club+' 青训营冒出苗子：'+yp.name+'（'+yp.pos+'，'+yp.age+' 岁，潜力 '+yp.pot+'），去海外俱乐部页可以把他输送回主队免签。');
    }
  });
  /* 自有品牌：销量与品牌价值 */
  var br=b.brand;
  if(br && br.founded){
    var bestAb=G.squad.length? G.squad.slice().sort(function(a2,b2){ return b2.ab-a2.ab; })[0].ab : 60;
    var starIn=br.star && G.squad.some(function(p){ return p.name===br.star; });
    var starOn=starIn && br.starUntil>=G.month;
    var expo=0.45 + G.fans/70000 + G.rep/130 + Math.max(0,(bestAb-60))/55 + (starOn?0.28:0);
    var vol=[1.35,1,0.6][br.price]||1, rev=[0.85,1.35,2.3][br.price]||1.35;
    var units=(br.lines.jersey*26 + br.lines.scarf*14 + br.lines.shoe*34);
    var sales=Math.round(units*expo*vol*rev*(br.mktUntil>=G.month?1.5:1));
    var bcost=Math.round(22 + (br.lines.jersey+br.lines.scarf+br.lines.shoe)*9 + (starOn?15:0));
    var bnet=sales-bcost;
    br.lastNet=bnet; br.cum=(br.cum||0)+bnet; bizNet+=bnet;
    var newTitle=(G.titles||0)>(br.lt||0);
    var growth=Math.round(bnet*0.5 + expo*22 + (newTitle?300:0));
    if(hasVent('brand')) growth=Math.round(growth*1.3);
    br.value=Math.max(50, Math.round((br.value||0)+growth));
    if(newTitle) notes.push('👕 球队夺冠，品牌「'+br.name+'」价值跳涨 +'+fmt(300)+'：冠军同款球衣卖断货了。');
    br.lt=G.titles||0;
  }
  /* 品牌合作：年费按月发 + 夺冠奖金 + 到期 */
  if(b.deal){
    var fee=Math.round(b.deal.annual/12);
    bizNet+=fee; b.dealCum=(b.dealCum||0)+fee;
    b.deal.left--;
    if(b.deal.left<=0){ var dn=dealDef(b.deal.id); notes.push('🤝 与 '+(dn? dn.name : '赞助商')+' 的合同到期结束。去品牌合作页续约或换一家更大的。'); b.deal=null; }
  }
  if((G.titles||0)>(b.dealTitles||0) && b.deal){
    var nb=(G.titles||0)-(b.dealTitles||0);
    var bonus=b.deal.bonus*nb;
    bizNet+=bonus; b.dealCum=(b.dealCum||0)+bonus;
    var dd=dealDef(b.deal.id);
    notes.push('🤝 夺冠奖金到账：'+(dd? dd.name : '赞助商')+' 按合同支付 '+fmt(bonus)+'，大字标题都帮你想好了。');
  }
  b.dealTitles=G.titles||0;
  /* 跨行业：逐个行业算月度盈亏，行情有波动 */
  var crossSum=0;
  Object.keys(b.cross||{}).forEach(function(id){
    var d=crossDef(id), c=b.cross[id]; if(!d || !c) return;
    if(!c.hist) c.hist=[];
    var net=Math.round(ri(d.inc[0],d.inc[1])*(1+0.55*(c.lv-1)) - d.up*(1+0.3*(c.lv-1)));
    if(Math.random()<0.07){ var wind=ri(150,400); net+=wind; notes.push('🏭 '+d.name+' 撞上风口：单月额外 +'+fmt(wind)+'，账面一下就好看了。'); }
    else if(Math.random()<0.05){ var loss=ri(80,200); net-=loss; notes.push('🏭 '+d.name+' 踩了个坑：单月额外 -'+fmt(loss)+'，做生意就是有赚有赔。'); }
    c.lastNet=net; c.cum=(c.cum||0)+net; b.crossCum=(b.crossCum||0)+net; crossSum+=net; bizNet+=net;
    c.hist.unshift({m:G.year+'年'+G.mon+'月', net:net});
    if(c.hist.length>8) c.hist.length=8;
  });
  b.crossNet=crossSum;
  if(bizNet!==0) G.cash+=bizNet;
  var hasBiz=Object.keys(b.overseas||{}).length || (br && br.founded) || b.deal || Object.keys(b.cross||{}).length;
  if(hasBiz) log('🏢 深度经营本月合计：'+(bizNet>=0?'+':'')+fmt(bizNet)+'（海外俱乐部 / 自有品牌 / 品牌合作 / 跨行业，明细在各自页面）。', bizNet>=0?'good':'bad');
  notes.forEach(function(n){ log(n,'good'); });
}
</script>
<script>
"use strict";
/* ================= 赛后战报 + 直播观赛 =================
   战报明细由比赛结算的那一刻、按已定的真实赛果生成（进球分钟、红黄牌、
   伤病、事件时间线、最佳球员、双方阵容与数据），挂在 result.detail 上随
   存档保存。直播观赛先用正式引擎把下一场结算掉，再把这份明细按分钟
   逐条放出来——所以直播里看到的比分、进球者与积分/射手榜结算完全一致，
   不存在看一场算一场。每场踢完把战报排进 pendingReports，推进动作结束
   后统一弹：单场弹完整战报，连推多场弹汇总（可逐场看详情），一场不丢。
   全自动模拟期间只攒不弹，停下时再出汇总。 */
var pendingReports=[], reportOpen=false, reportFromQueue=false, batchDepth=0, flushTries=0;
function queueMatchReport(result){ if(result && result.detail) pendingReports.push(result); if(result && result.detail && result.detail.res==='胜') noteMatchWin(); }
function flushReports(){
  if(reportOpen || !pendingReports.length || !G || G.ended) return;
  if($modal.innerHTML.trim()){ if(flushTries++<60) setTimeout(flushReports, 700); return; } // 有别的弹窗（如突发事件）先让它处理完
  flushTries=0; reportOpen=true; reportFromQueue=true;
  noteTitleWin();
  if(pendingReports.length===1) showReportDetail(pendingReports[0], false);
  else showReportSummary();
}
function closeReport(){
  reportOpen=false;
  if(reportFromQueue){ pendingReports=[]; reportFromQueue=false; }
  $modal.innerHTML='';
  maybeCelebPopup(); // 战报关掉后，若有赢球/夺冠限时礼包，顺势弹出来
}
function showReportSummary(){
  var rows=pendingReports.map(function(rec,i){
    var d=rec.detail; if(!d) return '';
    return '<div class="mr-row"><span class="pill '+(d.res==='胜'?'up':(d.res==='负'?'dn':''))+'">'+d.res+'</span><div class="grow"><div style="font-weight:700;" class="num">'+esc(G.club)+' '+d.gf+' : '+d.ga+' '+esc(d.opp)+'</div><div class="mini">'+d.dateTxt+(d.cup?' · 🏆 足协杯':' · 联赛')+(d.myGoals.length?' · 进球：'+d.myGoals.map(function(g){ return esc(g.name)+' '+g.min+'\''; }).join('、'):' · 无进球')+'</div></div><button class="btn sm" onclick="showQueuedReport('+i+')">详情</button></div>';
  }).join('');
  $modal.innerHTML='<div class="overlay"><div class="modal"><div class="hero"><div class="big" style="font-size:22px;">📋 比赛战报汇总</div><div class="sub">这段时间一共踢了 '+pendingReports.length+' 场，逐场结果都在这里，点「详情」看完整战报</div></div>'
  +'<div class="body"><div class="mr-list">'+rows+'</div></div>'
  +'<div class="foot"><button class="btn pri" onclick="closeReport()">关闭，继续经营</button></div></div></div>';
}
function showQueuedReport(i){ var rec=pendingReports[i]; if(rec && rec.detail) showReportDetail(rec, true); }
function showReportDetail(rec, fromList){
  var d=rec.detail; if(!d) return;
  $modal.innerHTML='<div class="overlay"><div class="modal"><div class="hero"><div class="big" style="font-size:22px;">📋 赛后战报</div><div class="sub">'+d.dateTxt+' · '+(d.cup?'🏆 足协杯':'联赛')+(d.tag?' · '+esc(d.tag):'')+'</div></div>'
  +'<div class="body">'+reportBodyHTML(rec)+'</div>'
  +'<div class="foot">'+(fromList?'<button class="btn" onclick="showReportSummary()">← 返回汇总</button>':'')+'<button class="btn pri" onclick="closeReport()">关闭，继续</button></div></div></div>';
}
function reportBodyHTML(rec){
  var d=rec.detail;
  var myG= d.myGoals.length? d.myGoals.map(function(g){ return '<div class="gl"><span class="mn num">'+g.min+'\'</span><span>⚽ '+esc(g.name)+'</span></div>'; }).join('') : '<div class="gl"><span class="mini">无进球</span></div>';
  var opG= d.oppGoals.length? d.oppGoals.map(function(g){ return '<div class="gl opp"><span>⚽ '+esc(g.name)+'</span><span class="mn num">'+g.min+'\'</span></div>'; }).join('') : '<div class="gl opp"><span class="mini">无进球</span></div>';
  var evs=d.events.map(function(e){
    var cls= e.type==='goal'?'goal':'';
    var icon= e.type==='goal'?'⚽': e.type==='yellow'?'🟨': e.type==='red'?'🟥': e.type==='injury'?'🚑': e.type==='chance'?'🎯': e.type==='sub'?'🔄': e.type==='pens'?'🎲': e.type==='ht'?'⏸️': e.type==='ft'?'🏁':'📣';
    return '<div class="mr-ev '+cls+'"><span class="mn num">'+e.min+'\'</span><span>'+icon+' '+esc(e.text)+'</span></div>';
  }).join('');
  var disc= d.cards.length? d.cards.map(function(c){ return (c.color==='红牌'?'🟥':'🟨')+' '+esc(c.name)+'（'+(c.side==='me'?esc(G.club):esc(d.opp))+'）'+c.min+'\' '+c.color; }).join('<br>') : '全场无红黄牌，踢得干净。';
  var injT= d.injuries.length? d.injuries.map(function(x){ return '🚑 '+esc(x.name)+'（'+x.min+'\' 受伤，预计缺阵约 '+x.days+' 天）'; }).join('<br>') : '双方均无新增伤病。';
  var poss=d.stats.poss;
  return '<div class="mr-score"><span class="tm">'+esc(G.club)+'</span><span class="sc num">'+d.gf+' : '+d.ga+'</span><span class="tm">'+esc(d.opp)+'</span></div>'
  +'<div style="text-align:center;"><span class="pill '+(d.res==='胜'?'up':(d.res==='负'?'dn':''))+'">'+d.res+'</span><span class="mini" style="margin-left:8px;">'+(d.home?'主场':'客场')+(rec.gate?' · 门票 +'+fmt(rec.gate):'')+'</span></div>'
  +'<div class="mr-sec"><h4>⚽ 进球时间</h4><div class="mr-goals"><div>'+myG+'</div><div>'+opG+'</div></div></div>'
  +(d.motm? '<div class="mr-sec"><h4>⭐ 全场最佳球员</h4><div style="font-size:14px;"><b>'+esc(d.motm.name)+'</b>（'+(d.motm.side==='me'?esc(G.club):esc(d.opp))+'）· 评分 <b class="num">'+d.motm.rating.toFixed(1)+'</b></div></div>' : '')
  +'<div class="mr-sec"><h4>📊 本场数据</h4><div class="mini" style="font-size:12.5px;line-height:1.9;">射门 '+d.stats.myShots+' : '+d.stats.oppShots+' · 射正 '+d.stats.myOT+' : '+d.stats.oppOT+' · 控球率 '+poss+'% : '+(100-poss)+'%</div></div>'
  +'<div class="mr-sec"><h4>🟨 红黄牌</h4><div style="font-size:13px;line-height:1.8;">'+disc+'</div></div>'
  +'<div class="mr-sec"><h4>🚑 伤病</h4><div style="font-size:13px;line-height:1.8;">'+injT+'</div></div>'
  +'<div class="mr-sec"><h4>🕐 关键事件时间线</h4>'+evs+'</div>';
}
function viewStoredReport(src, idx){
  var rec=null;
  if(src==='fx' && G && G.fixtures && G.fixtures[idx]) rec=G.fixtures[idx].result;
  if(src==='lr' && G && G.lastResults && G.lastResults[idx]) rec=G.lastResults[idx];
  if(!rec || !rec.detail){ toast('这场比赛没有详细战报（新版本之前踢的比赛只有比分）'); return; }
  reportOpen=true; reportFromQueue=false;
  showReportDetail(rec, false);
}
/* ---------------- 战报明细生成：只吃已结算的赛果，不碰任何结算数值 ---------------- */
function buildMatchDetail(o){
  var fx=o.fx||{};
  var oppName=o.oppName||fx.opp||'对手';
  var gf=o.gf, ga=o.ga;
  var oppPos=['门将','后卫','后卫','后卫','后卫','中场','中场','中场','前锋','前锋','前锋','中场','前锋','后卫'];
  var oppPool=[], usedN={};
  for(var i=0;i<oppPos.length;i++){
    var nm=randName(), tr=0;
    while(usedN[nm] && tr++<8) nm=randName();
    usedN[nm]=1; oppPool.push({name:nm, pos:oppPos[i]});
  }
  function oppAttacker(){ var c=oppPool.filter(function(p){ return p.pos==='前锋'||p.pos==='中场'; }); return pick(c.length?c:oppPool); }
  var usedMin={};
  function goalMin(){ var m, t=0; do{ m=ri(2,90); }while(usedMin[m] && t++<12); usedMin[m]=1; return m; }
  var lineupNames=(o.lineup||[]).map(function(s){ return s.p.name; });
  var myGoals=(o.myScorers||[]).map(function(n){ return {name:n, min:goalMin()}; });
  while(myGoals.length<gf && lineupNames.length) myGoals.push({name:pick(lineupNames), min:goalMin()});
  myGoals.sort(function(a,b){ return a.min-b.min; });
  var oppGoals=[];
  for(var gi=0; gi<ga; gi++) oppGoals.push({name:oppAttacker().name, min:goalMin()});
  oppGoals.sort(function(a,b){ return a.min-b.min; });
  var evs=[{min:0, type:'info', key:false, side:'', text:'比赛开始！'+G.club+(fx.home?'坐镇主场迎战':'客场挑战')+oppName+'。'}];
  var myAtt=(o.lineup||[]).filter(function(s){ return s.slot==='前锋'||s.slot==='中场'; }).map(function(s){ return s.p.name; });
  function myShooter(){ return pick(myAtt.length?myAtt:(lineupNames.length?lineupNames:[G.club])); }
  var chanceTxt=['的射门被对方门将奋力扑出','的头球攻门稍稍偏出立柱','的远射擦着横梁飞出底线','的单刀被门将用脚挡出','的凌空抽射打在边网上','的任意球绕过人墙，可惜高出横梁','的低射被后卫在门线上解围','的推射滑门而过，看台上一片叹息'];
  var myCh=ri(2,6), oppCh=ri(2,5), ci2;
  for(ci2=0; ci2<myCh; ci2++) evs.push({min:ri(3,89), type:'chance', side:'me', key:true, text:myShooter()+pick(chanceTxt)+'。'});
  for(ci2=0; ci2<oppCh; ci2++) evs.push({min:ri(3,89), type:'chance', side:'opp', key:true, text:oppAttacker().name+pick(chanceTxt)+'。'});
  var cards=[], nCards=ri(0,4);
  for(ci2=0; ci2<nCards; ci2++){
    var cSide=Math.random()<0.5?'me':'opp';
    var cWho= cSide==='me'? pick(lineupNames.length?lineupNames:[G.club]) : pick(oppPool).name;
    var isRed=Math.random()<0.10, cm=ri(8,88);
    cards.push({min:cm, side:cSide, name:cWho, color:isRed?'红牌':'黄牌'});
    evs.push({min:cm, type:isRed?'red':'yellow', side:cSide, key:true, text:(cSide==='me'?G.club:oppName)+'的 '+cWho+' 吃到'+(isRed?'红牌，被直接罚下！':'一张黄牌')+'。'});
  }
  cards.sort(function(a,b){ return a.min-b.min; });
  var inj=(o.injuries||[]).map(function(x){
    var im=ri(10,85);
    evs.push({min:im, type:'injury', side:'me', key:true, text:x.name+' 在拼抢中受伤倒地，队医进场处理后确认无法坚持（预计缺阵约 '+x.days+' 天）。'});
    return {name:x.name, days:x.days, min:im};
  });
  var bench=G.squad.filter(function(p){ return lineupNames.indexOf(p.name)<0 && p.inj===0 && inMatchday(p.name); }).map(function(p){ return p.name; });
  var nSub=ri(1,3);
  for(ci2=0; ci2<nSub; ci2++){
    var sm=ri(55,86);
    if(Math.random()<0.6 && bench.length && lineupNames.length){
      var off=pick(lineupNames), on=bench.splice(Math.floor(Math.random()*bench.length),1)[0];
      evs.push({min:sm, type:'sub', side:'me', key:false, text:'换人调整：'+on+' 替补登场，换下 '+off+'。'});
    } else {
      evs.push({min:sm, type:'sub', side:'opp', key:false, text:'换人调整：'+oppName+' 用 '+pick(oppPool).name+' 换下 '+pick(oppPool).name+'。'});
    }
  }
  myGoals.forEach(function(g){ evs.push({min:g.min, type:'goal', side:'me', key:true, scorer:g.name, text:''}); });
  oppGoals.forEach(function(g){ evs.push({min:g.min, type:'goal', side:'opp', key:true, scorer:g.name, text:''}); });
  evs.push({min:45, type:'ht', key:false, side:'', text:''});
  evs.push({min:90, type:'ft', key:true, side:'', text:''});
  if(o.pens) evs.push({min:91, type:'pens', key:true, side:'me', text:'点球大战：'+G.club+(o.pens==='胜'?'顶住压力，点球击败 '+oppName+'，晋级下一轮！':'遗憾落败，止步本轮。')});
  evs.sort(function(a,b){ return a.min-b.min; });
  var s1=0, s2=0;
  evs.forEach(function(e){
    if(e.type==='goal'){ if(e.side==='me') s1++; else s2++; e.text='进球！'+(e.side==='me'?G.club:oppName)+'的 '+e.scorer+' 在第 '+e.min+' 分钟破门，比分 '+s1+' : '+s2+'。'; }
    else if(e.type==='ht'){ e.text='上半场比赛结束，'+G.club+' '+s1+' : '+s2+' '+oppName+'。'; }
    else if(e.type==='ft'){ e.text='全场比赛结束！'+G.club+' '+gf+' : '+ga+' '+oppName+'。'; }
  });
  var stats={ myShots:gf+myCh, oppShots:ga+oppCh, myOT:gf+ri(0,myCh), oppOT:ga+ri(0,oppCh), poss:clamp(Math.round(50+((o.xg||1.3)-(o.xa||1.2))*5+ri(-5,5)),30,70) };
  var motm=null, cnt={};
  myGoals.forEach(function(g){ cnt[g.name]=(cnt[g.name]||0)+1; });
  var bestMy=null;
  Object.keys(cnt).forEach(function(n){ if(!bestMy || cnt[n]>cnt[bestMy]) bestMy=n; });
  if(bestMy) motm={name:bestMy, side:'me', rating:Math.min(9.9, Math.round((7.4+cnt[bestMy]*0.8+rnd(0,0.4))*10)/10)};
  else if(ga>gf && oppGoals.length) motm={name:oppGoals[0].name, side:'opp', rating:Math.round(rnd(7.8,9.2)*10)/10};
  else if(o.lineup && o.lineup.length){ var bs=o.lineup.slice().sort(function(a,b){ return b.p.ab-a.p.ab; })[0]; motm={name:bs.p.name, side:'me', rating:Math.round(rnd(7.2,8.5)*10)/10}; }
  return {
    opp:oppName, home:!!fx.home, cup:!!fx.cup, tag:fx.tag||'',
    dateTxt:G.year+' 年 '+G.mon+' 月 '+(fx.day||G.day)+' 日',
    gf:gf, ga:ga, res:(o.pens? o.pens : (gf>ga?'胜':(gf===ga?'平':'负'))),
    myGoals:myGoals, oppGoals:oppGoals, events:evs, cards:cards, injuries:inj, motm:motm, stats:stats,
    myLineup:(o.lineup||[]).map(function(s){ return {name:s.p.name, pos:s.slot, ab:s.p.ab}; }),
    oppLineup:oppPool.slice(0,11)
  };
}
/* ---------------- 直播观赛：结算仍走正式引擎（同一套），呈现严格防剧透 ----------------
   内部仍先用正式引擎结算、再逐分钟放出同一份明细，比分与结算永远一致；
   但呈现层只显示「当前分钟为止」的数据：比分/射门随事件逐条出现，控球率
   随分钟从 50:50 逐步走向终场值；终场数据、最终比分、赛后战报只在终场后
   才出现。直播期间不 render() 背景页面（赛程状态/积分/动态不提前刷出
   结果），终场前点「退出直播」也先跳到终场，不会提前弹出战报。 */
var LIVE=null;
function watchLive(){
  if(!G || G.ended || LIVE) return;
  ensureFixtures();
  var fx=nextFixture();
  if(!fx){ toast('本月比赛已踢完，去结束本月结算吧'); return; }
  if(!lineupReady()){ toast('首发还没排满（'+lineupFilledCount()+'/11），先把首发补满才能比赛'); go('squad'); return; }
  var guard=0;
  while(G.day<fx.day && guard++<40){ G.day++; dailyRecovery(); } // 推进到比赛日（下一场之前没有别的比赛）
  playFixture(fx); // 正式引擎结算：积分、进球、射手榜、伤病、门票全部在这一步落账
  // 不在这里 render()：直播结束前不把已结算的比分/积分/动态刷到背景页面上，防剧透；退出直播时再统一 render
  var rec=fx.result;
  if(!rec || !rec.detail){ flushReports(); return; }
  LIVE={ fx:fx, det:rec.detail, min:0, speed:1, paused:false, keyOnly:false, done:false, timer:null };
  showLive();
  LIVE.timer=setInterval(liveTick, 200);
}
function liveEventIcon(t){ return t==='goal'?'⚽': t==='yellow'?'🟨': t==='red'?'🟥': t==='injury'?'🚑': t==='chance'?'🎯': t==='sub'?'🔄': t==='pens'?'🎲': t==='ht'?'⏸️': t==='ft'?'🏁':'📣'; }
function showLive(){
  var d=LIVE.det;
  var myLU=d.myLineup.map(function(p){ return esc(p.name)+'（'+p.pos+' · 能力 '+p.ab+'）'; }).join('<br>')||'—';
  var opLU=d.oppLineup.map(function(p){ return esc(p.name)+'（'+p.pos+'）'; }).join('<br>')||'—';
  $modal.innerHTML='<div class="overlay"><div class="modal live-modal">'
  +'<div class="live-head"><div class="live-title">📺 比赛直播 · '+d.dateTxt+' · '+(d.cup?'🏆 足协杯':'联赛')+(d.tag?' · '+esc(d.tag):'')+'</div>'
  +'<div class="live-score"><span class="lt-name">'+esc(G.club)+'</span><span class="lt-sc num" id="lv-score">0 : 0</span><span class="lt-name r">'+esc(d.opp)+'</span></div>'
  +'<div class="live-clock"><span id="lv-clock">0\'</span> · <span id="lv-phase">上半场</span></div>'
  +'<div class="live-stats" id="lv-stats">射门 0 : 0 · 控球 50% : 50%</div></div>'
  +'<div class="lv-viewbar"><button class="btn sm on" id="lv-vp" onclick="liveSetView(\'pitch\')">🏟️ 球场画面</button><button class="btn sm" id="lv-vt" onclick="liveSetView(\'text\')">📋 文字解说</button><span class="lv-vhint">球场画面：双方球员按阵型站位并随比赛跑动，足球随事件在场上移动，进球时球进网——和文字直播是同一份比赛数据</span></div>'
  +'<div id="lv-pitch-wrap"><canvas id="lv-pitch" width="880" height="430"></canvas></div>'
  +'<div class="live-cols" id="lv-cols" style="display:none;"><div class="live-feed" id="lv-feed"></div>'
  +'<div class="live-side"><h4>🏠 '+esc(G.club)+' 首发</h4><div class="lu">'+myLU+'</div><h4>🚌 '+esc(d.opp)+' 首发</h4><div class="lu">'+opLU+'</div><h4 id="lv-stats-h">📊 实时数据（截至当前分钟）</h4><div class="lu" id="lv-side-stats">射门 0 : 0<br>控球 50% : 50%</div></div></div>'
  +'<div class="live-controls">'
  +'<button class="btn sm" id="lv-pause" onclick="liveTogglePause()">⏸ 暂停</button>'
  +'<button class="btn sm lv-spd on" onclick="liveSetSpeed(1,this)">1× 速度</button>'
  +'<button class="btn sm lv-spd" onclick="liveSetSpeed(2,this)">2× 速度</button>'
  +'<button class="btn sm lv-spd" onclick="liveSetSpeed(4,this)">4× 速度</button>'
  +'<button class="btn sm" onclick="liveNextKey()">⏭ 下一关键时刻</button>'
  +'<button class="btn sm" id="lv-key" onclick="liveToggleKey()">⭐ 只看关键时刻</button>'
  +'<button class="btn sm" onclick="liveSkipEnd()">⏩ 跳到终场</button>'
  +'<button class="btn pri sm" id="lv-exit" onclick="liveExit()">退出直播</button>'
  +'</div></div></div>';
  liveReveal();
  if(typeof pitchStart==='function') pitchStart();
}
function liveNextKeyMin(from){
  var evs=LIVE.det.events;
  for(var i=0;i<evs.length;i++){ if(evs[i].key && evs[i].min>from) return evs[i].min; }
  return null;
}
function liveTick(){
  if(!LIVE || LIVE.paused || LIVE.done) return;
  // 节奏：1× 时 1 分钟比赛 ≈ 5 秒真实时间（每 200ms 推进 0.04 分钟），看得清传球和跑位；2×/4× 按倍率加快
  var step=LIVE.speed*0.04;
  if(LIVE.keyOnly){
    var nk=liveNextKeyMin(LIVE.min);
    step= nk!=null? Math.min(LIVE.speed*1.6, Math.max(0.04, nk-LIVE.min)) : LIVE.speed*1.6;
  }
  LIVE.min+=step;
  liveReveal();
  if(LIVE.min>=91) liveFinish();
}
function liveReveal(){
  if(!LIVE) return;
  var feed=document.getElementById('lv-feed'); if(!feed) return;
  var d=LIVE.det, s1=0, s2=0, sh1=0, sh2=0, html='';
  d.events.forEach(function(e){
    if(e.min>LIVE.min) return;
    if(e.type==='goal'){ if(e.side==='me'){ s1++; sh1++; } else { s2++; sh2++; } }
    else if(e.type==='chance'){ if(e.side==='me') sh1++; else sh2++; }
    html+='<div class="live-ev'+(e.type==='goal'?' goal':'')+'"><span class="mn num">'+e.min+'\'</span><span>'+liveEventIcon(e.type)+' '+esc(e.text)+'</span></div>';
  });
  feed.innerHTML=html||'<div class="live-ev"><span class="mn num">0\'</span><span>📣 双方球员入场，比赛马上开始。</span></div>';
  feed.scrollTop=feed.scrollHeight;
  var sc=document.getElementById('lv-score'); if(sc) sc.textContent=s1+' : '+s2;
  var ck=document.getElementById('lv-clock'); if(ck) ck.textContent=Math.floor(Math.min(90,LIVE.min))+'\'';
  var ph=document.getElementById('lv-phase'); if(ph && !LIVE.done) ph.textContent= LIVE.min<45?'上半场':(LIVE.min<90?'下半场':'全场结束');
  // 控球率随分钟推进：从 50:50 出发，按已踢分钟占比逐步走向终场控球，终场前看不到终场值
  var possNow=Math.round(50+(d.stats.poss-50)*(Math.min(90,Math.max(0,LIVE.min))/90));
  var st=document.getElementById('lv-stats'); if(st) st.textContent='射门 '+sh1+' : '+sh2+' · 控球 '+possNow+'% : '+(100-possNow)+'%';
  var ss=document.getElementById('lv-side-stats'); if(ss && !LIVE.done) ss.innerHTML='射门 '+sh1+' : '+sh2+'<br>控球 '+possNow+'% : '+(100-possNow)+'%';
}
function liveFinish(){
  if(!LIVE || LIVE.done) return;
  LIVE.min=999; liveReveal();
  LIVE.done=true;
  if(LIVE.timer){ clearInterval(LIVE.timer); LIVE.timer=null; }
  var ph=document.getElementById('lv-phase'); if(ph) ph.textContent='全场结束';
  var ck=document.getElementById('lv-clock'); if(ck) ck.textContent='90\'';
  // 终场哨响后才亮出全场数据（射门/射正/控球终场值），直播进行中侧栏只有实时数据
  var d=LIVE.det;
  var sh=document.getElementById('lv-stats-h'); if(sh) sh.textContent='📊 全场数据（终场）';
  var ss=document.getElementById('lv-side-stats'); if(ss) ss.innerHTML='射门 '+d.stats.myShots+' : '+d.stats.oppShots+'<br>射正 '+d.stats.myOT+' : '+d.stats.oppOT+'<br>控球 '+d.stats.poss+'% : '+(100-d.stats.poss)+'%';
  var ex=document.getElementById('lv-exit'); if(ex) ex.textContent='📋 查看赛后战报';
  var pb=document.getElementById('lv-pause'); if(pb){ pb.disabled=true; pb.style.opacity='.5'; }
}
function liveTogglePause(){
  if(!LIVE || LIVE.done) return;
  LIVE.paused=!LIVE.paused;
  var pb=document.getElementById('lv-pause'); if(pb) pb.textContent= LIVE.paused?'▶ 继续':'⏸ 暂停';
}
function liveSetSpeed(s, btn){
  if(!LIVE) return;
  LIVE.speed=s;
  var bs=document.querySelectorAll('.lv-spd');
  for(var i=0;i<bs.length;i++) bs[i].classList.remove('on');
  if(btn) btn.classList.add('on');
}
function liveNextKey(){
  if(!LIVE || LIVE.done) return;
  var nk=liveNextKeyMin(LIVE.min);
  if(nk==null){ liveSkipEnd(); return; }
  LIVE.min=nk; liveReveal();
  if(LIVE.min>=91) liveFinish();
}
function liveToggleKey(){
  if(!LIVE) return;
  LIVE.keyOnly=!LIVE.keyOnly;
  var kb=document.getElementById('lv-key'); if(kb) kb.classList.toggle('on', LIVE.keyOnly);
  toast(LIVE.keyOnly?'⭐ 只看关键时刻：自动快进无事件的分钟':'已恢复正常速度推进');
}
function liveSkipEnd(){ liveFinish(); }
function liveExit(){
  if(LIVE && !LIVE.done){
    // 终场前点退出：先跳到终场把全场呈现完——赛后战报只在终场后出现，不提前剧透
    liveFinish();
    toast('已到终场，点「📋 查看赛后战报」打开本场战报');
    return;
  }
  if(LIVE && LIVE.timer) clearInterval(LIVE.timer);
  LIVE=null;
  $modal.innerHTML='';
  render();
  flushReports(); // 终场后退出直播，照常弹本场赛后战报（同一份已结算赛果）
}
</script>

<script>
"use strict";
/* ================= 新系统：每日任务 / 趣味乐园 / 商务谈判 / 企业上市 =================
   全部状态存进 G（daily / fun / neg / ipo），随自动存档保存；老存档由
   sanitizeSaveData 补默认，这里再兜底一层 ensureNew()。 */
function ensureNew(){
  if(!G) return;
  if(!G.daily) G.daily={dateKey:'', lastDate:'', streak:0, tasks:[], counters:{}, claimed:{}, streakClaimed:{}};
  if(!G.daily.counters) G.daily.counters={}; if(!G.daily.claimed) G.daily.claimed={}; if(!G.daily.streakClaimed) G.daily.streakClaimed={}; if(!G.daily.tasks) G.daily.tasks=[];
  if(!G.fun) G.fun={wheelFree:'', wheelSpins:0, letters:[], letterDay:'', funDay:'', hist:[]};
  if(!G.fun.letters) G.fun.letters=[]; if(!G.fun.hist) G.fun.hist=[];
  if(!G.neg) G.neg={cool:{}, memos:[]};
  if(!G.neg.cool) G.neg.cool={}; if(!G.neg.memos) G.neg.memos=[];
  if(!G.ipo) G.ipo={stage:'none', key:'', stageMonth:0, price:0, raised:0, hist:{}, priceHist:[], lastDiv:-1, inquiries:0, appliedName:''};
  if(!G.ipo.hist) G.ipo.hist={}; if(!G.ipo.priceHist) G.ipo.priceHist=[];
}
function realDayKey(off){
  var d=new Date(Date.now()+(off||0)*86400000);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function seedNum(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; } return h; }
/* ---------------- 每日任务（按真实日期刷新） ---------------- */
var TASK_POOL=[
  {id:'login', nm:'登录游戏', ds:'打开游戏就算完成——坚持每天来看看球队', target:1, rw:{dia:10}, rwTxt:'💎 10 钻'},
  {id:'win', nm:'赢下 1 场比赛', ds:'联赛或足协杯，赢一场就行', target:1, rw:{cash:30}, rwTxt:'现金 30万'},
  {id:'match', nm:'踢完 2 场比赛', ds:'推进赛程，踢完任意 2 场比赛', target:2, rw:{fans:1200}, rwTxt:'球迷 +1,200'},
  {id:'sign', nm:'签下 1 名球员', ds:'去转会市场签一名球员进一线队', target:1, rw:{dia:15}, rwTxt:'💎 15 钻'},
  {id:'train', nm:'完成 1 次球员特训', ds:'在阵容页给任意球员安排一次特训', target:1, rw:{fans:1000}, rwTxt:'球迷 +1,000'},
  {id:'ops', nm:'办 1 次运营活动', ds:'球迷开放日、友谊赛、周边大促、选拔，任选其一', target:1, rw:{dia:10}, rwTxt:'💎 10 钻'},
  {id:'deal', nm:'谈成 1 笔品牌合作', ds:'在品牌合作页签约，或在商务谈判中心谈成一单', target:1, rw:{cash:50}, rwTxt:'现金 50万'},
  {id:'recruit', nm:'完成 1 次钻石招募', ds:'在充值中心用钻石招募一次球星', target:1, rw:{dia:20}, rwTxt:'💎 20 钻'}
];
function taskDef(id){ return TASK_POOL.filter(function(t){ return t.id===id; })[0]; }
function tasksForDay(key){
  var seed=seedNum('tasks-'+key);
  var others=TASK_POOL.filter(function(t){ return t.id!=='login'; });
  var picked=[];
  var pool=others.slice();
  for(var i=0;i<5 && pool.length;i++){ var idx=(seed>>>(i*3))%pool.length; picked.push(pool.splice(idx,1)[0].id); }
  return ['login'].concat(picked);
}
function ensureDaily(){
  if(!G || !G.started) return;
  ensureNew();
  var today=realDayKey(0);
  if(G.daily.dateKey===today) return;
  var yest=realDayKey(-1);
  if(G.daily.lastDate===yest) G.daily.streak=(G.daily.streak||0)+1;
  else if(G.daily.lastDate!==today) G.daily.streak=1;
  G.daily.lastDate=today;
  G.daily.dateKey=today;
  G.daily.tasks=tasksForDay(today);
  G.daily.counters={login:1};
  G.daily.claimed={};
  log('✅ 新的一天（'+today+'）：每日任务已刷新 6 个，连续登录第 '+G.daily.streak+' 天。做完任务领钻石、现金和球迷，明天的任务可以在任务页提前看。','good');
}
function taskBump(kind){
  if(!G || !G.started) return;
  ensureDaily();
  if(!G.daily.tasks || G.daily.tasks.indexOf(kind)<0) return;
  G.daily.counters[kind]=(G.daily.counters[kind]||0)+1;
}
function taskDone(t){ return ((G.daily.counters&&G.daily.counters[t.id])||0) >= t.target; }
function dailyClaimable(){
  if(!G || !G.started) return 0;
  ensureDaily();
  var n=0;
  (G.daily.tasks||[]).forEach(function(id){ var t=taskDef(id); if(t && taskDone(t) && !G.daily.claimed[id]) n++; });
  STREAK_REWARDS.forEach(function(s){ if(G.daily.streak>=s.day && !G.daily.streakClaimed[s.day]) n++; });
  return n;
}
function giveReward(rw){
  var parts=[];
  if(rw.dia){ G.diamonds+=rw.dia; parts.push('💎 +'+rw.dia); }
  if(rw.cash){ G.cash+=rw.cash; parts.push('现金 +'+fmt(rw.cash)); }
  if(rw.fans){ G.fans+=rw.fans; parts.push('球迷 +'+rw.fans.toLocaleString('zh-CN')); }
  if(rw.rep){ G.rep=clamp(G.rep+rw.rep,0,100); parts.push('声望 +'+rw.rep); }
  if(rw.trial){ if(!G.pay2) G.pay2={trialCards:0}; G.pay2.trialCards=(G.pay2.trialCards||0)+rw.trial; parts.push('球星体验卡 ×'+rw.trial); }
  return parts.join(' · ');
}
function claimTask(id){
  ensureDaily();
  var t=taskDef(id); if(!t) return;
  if(!taskDone(t)){ toast('还没完成：'+t.nm); return; }
  if(G.daily.claimed[id]){ toast('这项奖励已经领过了'); return; }
  G.daily.claimed[id]=true;
  var got=giveReward(t.rw);
  log('✅ 每日任务完成并领奖：「'+t.nm+'」→ '+got+'。','good');
  toast('领奖成功：'+got); render();
}
var STREAK_REWARDS=[
  {day:3, rw:{dia:30}, txt:'💎 30 钻'},
  {day:7, rw:{dia:80, cash:100}, txt:'💎 80 钻 + 现金 100万'},
  {day:14, rw:{dia:150, fans:5000}, txt:'💎 150 钻 + 球迷 +5,000'},
  {day:30, rw:{dia:400, trial:1}, txt:'💎 400 钻 + 球星体验卡 ×1'}
];
function claimStreak(day){
  ensureDaily();
  var s=null; STREAK_REWARDS.forEach(function(x){ if(x.day===day) s=x; }); if(!s) return;
  if(G.daily.streak<day){ toast('连续登录 '+day+' 天才能领（当前 '+G.daily.streak+' 天）'); return; }
  if(G.daily.streakClaimed[day]){ toast('这个连登奖励已经领过了'); return; }
  G.daily.streakClaimed[day]=true;
  var got=giveReward(s.rw);
  log('🔥 连续登录 '+day+' 天奖励到账：'+got+'。断签会清零，明天记得来。','good');
  toast('连登奖励：'+got); render();
}
function pageTasks(){
  ensureDaily();
  var rows=G.daily.tasks.map(function(id){
    var t=taskDef(id); if(!t) return '';
    var cur=Math.min((G.daily.counters[id]||0), t.target);
    var done=taskDone(t), claimed=!!G.daily.claimed[id];

function spinWheel(){

<script>
"use strict";
/* ================= 商务谈判中心：电话谈判 + 谈判桌 =================
   在品牌合作（DEAL_BRANDS）的基础上加一层真谈判：每家品牌有虚构对接人和
   电话，性格分强硬 / 豪爽 / 精明，还价空间各不相同。谈成走同一份合同结构
   （G.biz.deal），并生成合作备忘存进 G.neg.memos；谈崩冷却 2 个游戏月。 */
var NEG_PEOPLE={
  nike:{name:'陈嘉铭', title:'大中华区商务合作总监', tel:'138-****-6721', style:'强硬', line:'我们只和有冠军相的球队谈。价格可以聊，但别指望我们让太多。'},
  adidas:{name:'林书瑶', title:'足球品类合作负责人', tel:'139-****-3058', style:'精明', line:'每一分钱我都要算 ROI。你出个数，我看看值不值。'},
  puma:{name:'高天野', title:'中国区赞助业务总经理', tel:'137-****-8842', style:'豪爽', line:'痛快点！条件差不多就签，年轻人就爱我们这股潮劲。'},
  nb:{name:'许文博', title:'品牌合作高级经理', tel:'136-****-1190', style:'精明', line:'我们渠道强、账算得细。拿出诚意，我帮你向总部争取。'},
  lining:{name:'王思远', title:'篮球足球事业部商务总监', tel:'135-****-4417', style:'豪爽', line:'国货挺国货！只要球队有心气，条件好商量。'},
  anta:{name:'郑海峰', title:'专业运动群合作总监', tel:'133-****-9026', style:'豪爽', line:'我们下沉渠道无敌，卖货的事包在我们身上，价格好说。'},
  xtep:{name:'刘子墨', title:'跑步与足球品类合作经理', tel:'131-****-7753', style:'精明', line:'预算有限，但我是真看好你们。咱们把每一块钱都花在刀刃上。'},
  peak:{name:'赵启航', title:'商务拓展经理', tel:'130-****-2284', style:'豪爽', line:'我们门槛最低、诚意最足。先签下来，一起成长嘛。'}
};
function negAsk(d){
  /* 品牌开价：以品牌合作页的标价为锚，按性格微调（强硬开价低、豪爽开价高） */
  var f= d.id==='nike'||d.id==='adidas'? 0.95 : (NEG_PEOPLE[d.id].style==='豪爽'? 1.08 : 1.0);
  return {signFee:Math.round(d.signFee*f), annual:Math.round(d.annual*f), years:d.years, bonus:Math.round(d.bonus*f)};
}
function negCoolLeft(id){ ensureNew(); var until=G.neg.cool[id]||0; return Math.max(0, until-G.month); }
function negFinalize(id, offer, via){
  ensureBiz();
  var d=dealDef(id);
  G.cash+=offer.signFee;
  G.biz.deal={id:id, annual:offer.annual, bonus:offer.bonus, years:offer.years, left:offer.years*12};
  G.biz.dealTitles=G.titles||0;
  G.neg.memos.unshift({brand:d.name, person:NEG_PEOPLE[id].name, month:G.year+'年'+G.mon+'月', via:via, signFee:offer.signFee, annual:offer.annual, years:offer.years, bonus:offer.bonus});
  if(G.neg.memos.length>10) G.neg.memos.length=10;
  if(typeof taskBump==='function') taskBump('deal');
  log('📞 谈判谈成！'+d.name+' 装备赞助合同通过'+via+'敲定：签约费 +'+fmt(offer.signFee)+' 先到账，年费 '+fmt(offer.annual)+' 按月发，合同 '+offer.years+' 年，夺冠奖金 '+fmt(offer.bonus)+'。合作备忘已生成，存在商务谈判中心。','good');
}
function negBreak(id, why){
  ensureNew();
  G.neg.cool[id]=G.month+2;
  var d=dealDef(id);
  log('📞 与 '+d.name+' 的谈判谈崩了（'+why+'）。对方放话：两个月后再谈。这段时间先把声望和成绩打上去，下次开价更有底气。','bad');
}
var _call=null;
function startCall(id){
  ensureBiz(); ensureNew();
  if(!gateOK('deals')){ toast('还没解锁品牌合作：先达成声望 45、球迷 4 万、集团阶段「豪门俱乐部」'); return; }
  var d=dealDef(id); if(!d) return;
  if(negCoolLeft(id)>0){ toast(d.name+' 还在冷却期，'+negCoolLeft(id)+' 个月后再打'); return; }
  if(G.rep<d.rep){ toast(d.name+' 的对接人婉拒了通话：声望要 ≥ '+d.rep+'（当前 '+G.rep+'）才肯谈'); return; }
  var p=NEG_PEOPLE[id];
  _call={id:id, round:1, offer:negAsk(d), log:[['op', p.name+'（'+p.title+'）：你好，我是 '+d.name+' 的 '+p.name+'。'+p.line],['op','这是我们的开价：签约费 '+fmt(_call?_call.offer.signFee:0)+'。']]};
  _call.log[1]=['op','开价如下：签约费 '+fmt(_call.offer.signFee)+' · 年费 '+fmt(_call.offer.annual)+' · 合同 '+_call.offer.years+' 年 · 夺冠奖金 '+fmt(_call.offer.bonus)+'。你看看，怎么回？'];
  renderCall();
}
function renderCall(){
  if(!_call) return;
  var d=dealDef(_call.id), p=NEG_PEOPLE[_call.id];
  var lines=_call.log.map(function(l){ return '<div class="'+(l[0]==='me'?'me':'op')+'">'+(l[0]==='me'?'🗣️ 你：':'📞 '+p.name+'：')+l[1]+'</div>'; }).join('');
  var hasDeal=!!(G.biz && G.biz.deal);
  $modal.innerHTML='<div class="overlay"><div class="modal">'
  +'<div class="hero"><div class="big" style="font-size:22px;">📞 正在通话 · '+d.name+'</div><div class="sub">'+p.name+' · '+p.title+' · '+p.tel+' · 性格：'+p.style+' · 第 '+_call.round+' / 4 轮</div></div>'
  +'<div class="body"><div class="call-log">'+lines+'</div>'
  +'<p class="desc" style="margin-top:10px;">当前报价：签约费 <b>'+fmt(_call.offer.signFee)+'</b> · 年费 <b>'+fmt(_call.offer.annual)+'</b> · <b>'+_call.offer.years+' 年</b> · 夺冠奖金 <b>'+fmt(_call.offer.bonus)+'</b>。'+(hasDeal?'注意：你已有合同在身，谈成也要先解约旧合同才能签这一份（点接受时会提示）。':'')+'</p></div>'
  +'<div class="foot" style="flex-direction:column;align-items:stretch;gap:8px;">'
  +'<button class="btn pri" onclick="callAct(\'accept\')">✅ 接受这个报价，签约</button>'
  +'<button class="btn" onclick="callAct(\'haggle\')">💬 还价：年费和签约费再涨一截</button>'
  +'<button class="btn" onclick="callAct(\'demand\')">🏆 要求加码：夺冠奖金和年限往上谈</button>'
  +'<button class="btn" onclick="callAct(\'shelve\')">⏸️ 暂时搁置，先挂电话（不冷却，随时再打）</button>'
  +'</div></div></div>';
}
function callAct(act){
  if(!_call) return;
  var id=_call.id, d=dealDef(id), p=NEG_PEOPLE[id], o=_call.offer;
  if(act==='shelve'){
    _call.log.push(['me','先这样，我这边再商量商量，改天细聊。']);
    log('📞 与 '+d.name+' 的通话暂时搁置，报价保留着——回谈判中心随时能再打过去。','');
    _call=null; $modal.innerHTML=''; render(); return;
  }
  if(act==='accept'){
    if(G.biz && G.biz.deal){ toast('已有合同在身：先去品牌合作页解约，再来签这一份'); return; }
    negFinalize(id, o, '电话谈判');
    _call=null; $modal.innerHTML=''; toast('签约成功：'+d.name); render(); return;
  }
  if(_call.round>=4){
    _call.log.push(['op','聊了这么多轮还没定，我这边先报总部了。两个月后咱们重新谈。']);
    negBreak(id, '电话里拉扯太久');
    _call=null; renderCallEnd('谈判谈崩：拉扯太久，对方先撤了。冷却 2 个月。'); return;
  }
  _call.round++;
  var style=p.style;
  var acceptP= act==='haggle'? (style==='豪爽'?0.55:(style==='精明'?0.38:0.26)) : (style==='豪爽'?0.5:(style==='精明'?0.4:0.3));
  acceptP += (G.rep-d.rep)*0.008;
  if(Math.random()<acceptP){
    if(act==='haggle'){ o.signFee=Math.round(o.signFee*1.12); o.annual=Math.round(o.annual*1.12); _call.log.push(['me','这个数还是低了点，年费和签约费都再往上走一走。']); _call.log.push(['op','行吧，看在你球队势头不错——签约费和年费各涨 12%，这是我能批的最大额度了。']); }
    else { o.bonus=Math.round(o.bonus*1.25); _call.log.push(['me','夺冠奖金得再厚一点，我们可是冲着冠军去的。']); _call.log.push(['op','有野心，我喜欢。夺冠奖金涨 25%，夺冠那天支票当场开。']); }
  } else if(Math.random()<0.55){
    if(act==='haggle'){ o.annual=Math.round(o.annual*1.05); _call.log.push(['me','再加点吧，就差临门一脚了。']); _call.log.push(['op','真加不了那么多。年费涨 5%，这是我越权批的，签不签一句话。']); }
    else { o.years=Math.min(4, o.years+1); _call.log.push(['me','奖金不动的话，年限能不能拉长一点？我们要的是长期伙伴。']); _call.log.push(['op','年限可以拉长 1 年，稳定性对我们也是好事。就这么定？']); }
  } else {
    _call.log.push(['me', act==='haggle'?'这价格我没法跟董事会交代。':'夺冠奖金这块，必须再谈谈。']);
    _call.log.push(['op', style==='强硬'?'我把话放这儿：这个价，爱签不签。下一轮你再不点头，我就找别家了。':(style==='精明'?'我算过了，你的要价超出我们的模型。下一轮还这样，我只能先撤。':'哈哈，胃口不小。下一轮咱们把话说定，别再绕了。')]);
  }
  renderCall();
}
function renderCallEnd(msg){
  $modal.innerHTML='<div class="overlay"><div class="modal"><div class="hero"><div class="big" style="font-size:22px;">📞 通话结束</div><div class="sub">'+msg+'</div></div><div class="foot"><button class="btn pri" onclick="closeModal();render();">回谈判中心</button></div></div></div>';
}
/* 谈判桌：正式报价单 */
var _tableBrand=null;
function openTable(id){
  ensureBiz(); ensureNew();
  if(!gateOK('deals')){ toast('还没解锁品牌合作，先达成解锁条件'); return; }
  var d=dealDef(id); if(!d) return;
  if(negCoolLeft(id)>0){ toast(d.name+' 还在冷却期，'+negCoolLeft(id)+' 个月后再谈'); return; }
  if(G.rep<d.rep){ toast(d.name+' 要求声望 ≥ '+d.rep+' 才肯上谈判桌（当前 '+G.rep+'）'); return; }
  _tableBrand=id;
  var a=negAsk(d);
  $modal.innerHTML='<div class="overlay"><div class="modal">'
  +'<div class="hero"><div class="big" style="font-size:22px;">📋 谈判桌 · '+d.name+'</div><div class="sub">正式报价单：改数、提交，对方当场评估 · 对接人 '+NEG_PEOPLE[id].name+'（'+NEG_PEOPLE[id].style+'）</div></div>'
  +'<div class="body"><p class="desc">对方开价参考：签约费 '+fmt(a.signFee)+' · 年费 '+fmt(a.annual)+' · '+a.years+' 年 · 夺冠奖金 '+fmt(a.bonus)+'。性格决定让步空间：豪爽的最松，精明的卡模型，强硬的几乎不让。开得太离谱会直接谈崩，冷却 2 个月。</p>'
  +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
  +'<label class="mini">签约费（万）<input id="tb-sign" type="number" value="'+a.signFee+'" style="width:100%;padding:9px;border:1px solid #cfdce5;border-radius:9px;font-size:15px;"></label>'
  +'<label class="mini">年费（万 / 年）<input id="tb-annual" type="number" value="'+a.annual+'" style="width:100%;padding:9px;border:1px solid #cfdce5;border-radius:9px;font-size:15px;"></label>'
  +'<label class="mini">合同年限（年，1–5）<input id="tb-years" type="number" value="'+a.years+'" min="1" max="5" style="width:100%;padding:9px;border:1px solid #cfdce5;border-radius:9px;font-size:15px;"></label>'
  +'<label class="mini">夺冠奖金（万）<input id="tb-bonus" type="number" value="'+a.bonus+'" style="width:100%;padding:9px;border:1px solid #cfdce5;border-radius:9px;font-size:15px;"></label>'
  +'</div><div id="tb-result" style="margin-top:10px;"></div></div>'
  +'<div class="foot"><button class="btn pri" onclick="submitTable()">提交报价</button><button class="btn" onclick="closeModal()">离开谈判桌</button></div></div></div>';
}
function submitTable(){
  var id=_tableBrand; if(!id) return;
  var d=dealDef(id), p=NEG_PEOPLE[id], a=negAsk(d);
  function gv(el){ var v=parseInt(document.getElementById(el).value,10); return isNaN(v)?0:v; }
  var ask={signFee:Math.max(0,gv('tb-sign')), annual:Math.max(0,gv('tb-annual')), years:clamp(gv('tb-years')||a.years,1,5), bonus:Math.max(0,gv('tb-bonus'))};
  var askTot=ask.signFee + ask.annual*ask.years + ask.bonus*0.4;
  var baseTot=a.signFee + a.annual*a.years + a.bonus*0.4;
  var cap= p.style==='豪爽'? 1.22 : (p.style==='精明'? 1.12 : 1.05);
  cap += (G.rep-d.rep)*0.002;
  var box=document.getElementById('tb-result');
  if(askTot<=baseTot*cap){
    if(G.biz && G.biz.deal){ if(box) box.innerHTML='<p class="desc" style="color:var(--red);">对方点头了，但你已有合同在身：先去品牌合作页解约，再回来签这一份。</p>'; return; }
    negFinalize(id, ask, '谈判桌');
    $modal.innerHTML=''; toast('谈判桌签约成功：'+d.name); render(); return;
  }
  if(askTot<=baseTot*cap*1.12){
    var counter={signFee:Math.round((ask.signFee+a.signFee)/2), annual:Math.round((ask.annual+a.annual)/2), years:a.years, bonus:Math.round((ask.bonus+a.bonus)/2)};
    window._counter={id:id, offer:counter};
    if(box) box.innerHTML='<p class="desc">'+p.name+' 摇头又点头：「你的要价高了点。按这个折中数来——签约费 '+fmt(counter.signFee)+' · 年费 '+fmt(counter.annual)+' · '+counter.years+' 年 · 夺冠奖金 '+fmt(counter.bonus)+'，行就签，不行就散。」</p><button class="btn pri sm" onclick="acceptCounter()">接受折中报价，签约</button>';
    return;
  }
  negBreak(id, '谈判桌要价过高');
  $modal.innerHTML=''; renderCallEnd('谈判谈崩：要价超出对方底线太多。冷却 2 个月，期间可以先打打电话探探口风（也不行——冷却期内对方不接）。');
  render();
}
function acceptCounter(){
  var c=window._counter; if(!c) return;
  if(G.biz && G.biz.deal){ toast('已有合同在身：先去品牌合作页解约再签'); return; }
  negFinalize(c.id, c.offer, '谈判桌（折中报价）');
  window._counter=null; $modal.innerHTML=''; toast('签约成功'); render();
}
function pageNeg(){
  ensureBiz(); ensureNew();
  if(!gateOK('deals')) return lockHTML('📞','商务谈判中心','deals','品牌合作的进阶玩法：不只是点一下签约，而是给八大品牌的对接人打电话、坐上谈判桌，一轮一轮把签约费、年费、年限和夺冠奖金谈上去。解锁条件与品牌合作相同：声望 45、球迷 4 万、集团阶段达到「豪门俱乐部」。');
  var cards=DEAL_BRANDS.map(function(d){
    var p=NEG_PEOPLE[d.id], a=negAsk(d), cool=negCoolLeft(d.id), locked=G.rep<d.rep, isCur=G.biz.deal && G.biz.deal.id===d.id;
    return '<div class="rel-card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;"><span class="nm">'+d.name+'</span><span class="pill '+(isCur?'up':'')+'">'+(isCur?'合作中':(cool?'冷却 '+cool+' 个月':(locked?'声望门槛 '+d.rep:'可谈判')))+'</span></div>'
    +'<div class="ben">对接人：<b>'+p.name+'</b> · '+p.title+'<br>📞 '+p.tel+' · 性格：<b>'+p.style+'</b>（'+(p.style==='强硬'?'几乎不让步，开价就是底价':(p.style==='豪爽'?'让步空间最大，谈得爽快':( '精打细算，卡着模型给价')))+'）</div>'
    +'<div class="mini">当前开价：签约费 '+fmt(a.signFee)+' · 年费 '+fmt(a.annual)+' · '+a.years+' 年 · 夺冠奖金 '+fmt(a.bonus)+'</div>'
    +'<div class="acts">'
    +(cool? '<button class="btn sm" disabled>冷却中 · '+cool+' 个月后再联系</button>' : (locked? '<button class="btn sm" disabled>🔒 声望还差 '+(d.rep-G.rep)+'</button>' : '<button class="btn pri sm" onclick="startCall(\''+d.id+'\')">📞 打电话谈</button><button class="btn sm" onclick="openTable(\''+d.id+'\')">📋 上谈判桌</button>'))
    +'</div></div>';
  }).join('');
  var memos=G.neg.memos.length? G.neg.memos.map(function(m){
    return '<div class="item"><div class="grow"><div class="nm" style="font-weight:700;">🤝 '+esc(m.brand)+' 合作备忘</div><div class="meta">'+m.month+' · 经 '+m.via+' 与对接人 '+esc(m.person)+' 敲定：签约费 '+fmt(m.signFee)+' · 年费 '+fmt(m.annual)+' · '+m.years+' 年 · 夺冠奖金 '+fmt(m.bonus)+'。双方签字盖章，合同已在品牌合作页生效。</div></div><span class="pill up">已存档</span></div>';
  }).join('') : '<p class="desc">还没有谈成过合作。在这里谈成的每一单，都会生成一份合作备忘存放在这里。</p>';
  return '<div class="card"><h3>📞 商务谈判中心<span class="hint">打电话 · 上谈判桌 · 把合同一轮一轮谈肥</span></h3>'
  +'<p class="desc">品牌合作页是「明码标价点签约」；这里是<b>真谈判</b>：每家品牌都有专属对接人和电话，点「打电话」进入模拟通话，对方先开价，你可以接受、还价、要求加码或暂时搁置，最多谈 4 轮；「谈判桌」是正式报价单，你改数提交，对方按性格和底线当场评估。谈成的合同与品牌合作页完全互通（同一时间仍只有一份生效合同）；谈崩了冷却 2 个游戏月。当前生效合同：'+(G.biz.deal? (dealDef(G.biz.deal.id)? dealDef(G.biz.deal.id).name:'')+' · 年费 '+fmt(G.biz.deal.annual)+' · 剩 '+G.biz.deal.left+' 个月' : '无（自由身，正是谈判的好时机）')+'。</p>'
  +'<div class="rel-grid">'+cards+'</div></div>'
  +'<div class="card"><h3><span class="no">备忘</span>合作备忘录<span class="hint">谈判中心谈成的合同都在这里留底</span></h3>'+memos
  +'<div class="acts" style="margin-top:10px;"><button class="btn" onclick="go(\'home\')">← 回大厅</button><button class="btn sm" onclick="go(\'deals\')">去品牌合作页 →</button></div></div>';
}
/* ================= 企业上市系统 =================
   政策（与页面说明一致）：上市条件 = 公司估值 ≥ 3,000万 + 最近连续 3 个月
   盈利 + 俱乐部声望 ≥ 50 + 纪检热度 < 40；流程 = 申请 → 辅导期 1 个月 →
   申报审核 1 个月 → 发行上市（发行 25% 股份，募资 = 上市时估值 × 25%）；
   上市后：总股本 1,000 万股，股价每月按公司业绩与球队战绩波动（±12% 封顶），
   每月信息披露；分红 = 市值的 3%（每游戏月最多一次，分红后股价 +4%）；
   纪检热度 ≥ 60 时每月 50% 概率被监管问询：罚款 = 市值 2%，股价 -8%。 */
function ipoCompanies(){
  ensureBiz(); ensureNew();
  var list=[];
  var br=G.biz.brand;
  if(br && br.founded) list.push({key:'brand', name:br.name+'（自有品牌公司）', icon:br.mark||'👕', value:Math.round(br.value||0), net:br.lastNet||0});
  Object.keys(G.biz.cross||{}).forEach(function(id){
    var d=crossDef(id), c=G.biz.cross[id]; if(!d||!c) return;
    list.push({key:'cross:'+id, name:d.name+'公司', icon:d.icon, value:Math.round((c.invested||0)*(0.75+0.2*(c.lv||1))), net:c.lastNet||0});
  });
  return list;
}
function ipoCompany(key){ var f=null; ipoCompanies().forEach(function(c){ if(c.key===key) f=c; }); return f; }
function ipoProfitStreak(key){
  var h=(G.ipo.hist&&G.ipo.hist[key])||[];
  var n=0; for(var i=0;i<h.length;i++){ if(h[i]>0) n++; else break; }
  return n;
}
function ipoConds(c){
  return [
    {label:'公司估值达到 3,000万', cur:c.value, need:3000, txt:fmt(c.value)+' / '+fmt(3000)},
    {label:'最近连续 3 个月盈利', cur:ipoProfitStreak(c.key), need:3, txt:ipoProfitStreak(c.key)+' / 3 个月'},
    {label:'俱乐部声望达到 50', cur:G.rep, need:50, txt:G.rep+' / 50'},
    {label:'纪检热度低于 40', cur:40-G.heat, need:1, txt:'当前热度 '+G.heat+' / 需 < 40'}
  ];
}
function applyIpo(key){
  ensureNew();
  if(G.ipo.stage!=='none'){ toast('已经有一家公司在上市流程中了，先走完这一家'); return; }
  var c=ipoCompany(key); if(!c){ toast('这家公司不存在'); return; }
  var bad=ipoConds(c).filter(function(x){ return x.cur<x.need; });
  if(bad.length){ toast('还不满足上市条件：'+bad[0].label); return; }
  G.ipo.stage='counsel'; G.ipo.key=key; G.ipo.stageMonth=G.month; G.ipo.appliedName=c.name;
  log('📈 企业上市申请已受理：「'+c.name+'」进入上市辅导期（1 个游戏月）。券商和律所进场尽调，这段时间把账做干净、把热度压住。','good');
  toast('已进入上市辅导期'); render();
}
function cancelIpo(){
  ensureNew();
  log('📈 已撤回「'+(G.ipo.appliedName||'公司')+'」的上市申请，流程终止，条件攒够了随时再来。','');
  G.ipo.stage='none'; G.ipo.key=''; G.ipo.appliedName=''; render();
}
function payDividend(){
  ensureNew();
  var ip=G.ipo; if(ip.stage!=='listed') return;
  if(ip.lastDiv===G.month){ toast('本月已经分过红了，下个月再分'); return; }
  var cap=Math.round(ip.price*1000);
  var amt=Math.round(cap*0.03);
  if(G.cash<amt){ toast('分红要拿出 '+fmt(amt)+' 现金，俱乐部现金不够'); return; }
  G.cash-=amt; ip.lastDiv=G.month; ip.price=Math.round(ip.price*1.04*100)/100;
  G.fans+=800; G.rep=clamp(G.rep+1,0,100);
  log('📈 上市公司分红：拿出 '+fmt(amt)+'（市值的 3%）分给股东，市场一片叫好，股价 +4% → '+ip.price.toFixed(2)+' 元，球迷 +800，声望 +1。','good');
  toast('分红完成：-'+fmt(amt)+'，股价 +4%'); render();
}
function processNewMonthly(){
  /* 月末钩子（settleMonth 里在 processBiz 之后调用）：记各公司月度盈亏、
     推进上市流程、更新股价、处理监管问询。 */
  if(!G || !G.biz) return;
  ensureNew();
  ipoCompanies().forEach(function(c){
    if(!G.ipo.hist[c.key]) G.ipo.hist[c.key]=[];
    G.ipo.hist[c.key].unshift(c.net);
    if(G.ipo.hist[c.key].length>6) G.ipo.hist[c.key].length=6;
  });
  var ip=G.ipo;
  if(ip.stage==='counsel' && G.month>ip.stageMonth){
    ip.stage='review'; ip.stageMonth=G.month;
    log('📈 上市进度：「'+ip.appliedName+'」辅导期结束，申报材料已递交，进入审核期（1 个游戏月）。','');
  } else if(ip.stage==='review' && G.month>ip.stageMonth){
    var c=ipoCompany(ip.key);
    var val=c? c.value : 3000;
    ip.stage='listed'; ip.raised=Math.round(val*0.25); ip.price=Math.round((val/1000)*100)/100;
    ip.priceHist=[{m:G.year+'年'+G.mon+'月', p:ip.price, note:'发行上市'}];
    G.cash+=ip.raised;
    log('🎉 上市成功！「'+ip.appliedName+'」正式挂牌：发行 25% 股份，一次性募资 '+fmt(ip.raised)+' 已到账；发行价 '+ip.price.toFixed(2)+' 元/股，总股本 1,000 万股。以后每月信息披露，股价随业绩波动，别忘了分红和合规。','good');
  } else if(ip.stage==='listed'){
    var c2=ipoCompany(ip.key);
    var net=c2? c2.net:0, val2=c2? Math.max(500,c2.value):3000;
    var chg=clamp((net/Math.max(val2,1))*40 + rnd(-4,4), -12, 12);
    ip.price=Math.max(0.2, Math.round(ip.price*(1+chg/100)*100)/100);
    var note='信息披露：本月公司净利 '+(net>=0?'+':'')+fmt(net)+'，股价 '+(chg>=0?'+':'')+chg.toFixed(1)+'%';
    if(G.heat>=60 && Math.random()<0.5){
      var cap=Math.round(ip.price*1000);
      var fine=Math.round(cap*0.02);
      G.cash-=fine; ip.inquiries++; ip.price=Math.max(0.2, Math.round(ip.price*0.92*100)/100);
      note+='；⚠️ 监管问询：因俱乐部纪检热度过高被交易所问询，罚款 '+fmt(fine)+'，股价 -8%';
      log('📉 监管问询！上市公司「'+ip.appliedName+'」被交易所发函问询（纪检热度 '+G.heat+'），罚款 '+fmt(fine)+'，股价下跌 8%。把热度降下来，别让上市公司替俱乐部的灰色操作背锅。','bad');
    }
    ip.priceHist.unshift({m:G.year+'年'+G.mon+'月', p:ip.price, note:note});
    if(ip.priceHist.length>8) ip.priceHist.length=8;
  }
}
function pageIpo(){
  ensureNew();
  var comps=ipoCompanies();
  var ip=G.ipo;
  var policy='<div class="card"><h3>📜 上市政策与流程<span class="hint">条件和数值都写在这里，游戏里严格按这套执行</span></h3>'
  +'<p class="desc"><b>谁能上：</b>你旗下的公司——自有品牌公司（在自有品牌页创立后）、跨行业经营的公司（餐饮/健身/电竞酒店/体育科技/影视/房地产，逐家独立核算）。同一时间只能推进一家上市。</p>'
  +'<p class="desc"><b>上市条件（四条全满足才能申请）：</b>① 公司估值 ≥ 3,000万（品牌公司看品牌价值，跨行业公司看投入与规模折算的估值）；② 最近连续 3 个月盈利（按每月结算的真实净利计，断一个月重新数）；③ 俱乐部声望 ≥ 50；④ 纪检热度 &lt; 40（账要干净，灰色操作玩多了别想过会）。</p>'
  +'<p class="desc"><b>流程：</b>提交申请 → <b>辅导期 1 个游戏月</b>（券商律所尽调）→ <b>申报审核 1 个游戏月</b> → <b>发行上市</b>：公开发行 25% 股份，一次性募资 = 上市时公司估值 × 25%，直接进俱乐部现金；总股本 1,000 万股，发行价 = 估值 ÷ 1,000 万股。</p>'
  +'<p class="desc"><b>上市后规则：</b>① 信息披露：每月结算自动披露公司净利与股价变动，记录在本页；② 股价波动：每月按公司业绩（净利/估值）和球队战绩在 ±12% 内波动，业绩越好涨得越猛；③ 分红：可主动分红，金额 = 当前市值的 3%（从俱乐部现金出，每游戏月最多一次），分红后股价 +4%、声望 +1；④ 监管问询：纪检热度 ≥ 60 时，每月 50% 概率被交易所问询，罚款 = 市值的 2%，股价 -8%——热度越高，上市公司越替你挨打。</p></div>';
  var flow='';
  if(ip.stage==='counsel'||ip.stage==='review'){
    flow='<div class="card" style="border:2px solid var(--gold);"><h3>📈 上市进行中 · '+esc(ip.appliedName)+'</h3>'
    +'<p class="desc">当前阶段：<b>'+(ip.stage==='counsel'?'辅导期':'申报审核期')+'</b>（本阶段还需约 1 个游戏月，推进月份自动流转）。这段时间保持公司盈利、压住纪检热度，别让尽调挑出毛病。</p>'
    +'<div class="acts"><button class="btn sm" onclick="cancelIpo()">撤回申请</button><button class="btn" onclick="go(\'home\')">回大厅</button></div></div>';
  } else if(ip.stage==='listed'){
    var c=ipoCompany(ip.key);
    var cap=Math.round(ip.price*1000);
    var hist=ip.priceHist.map(function(h){ return '<div class="item"><div class="grow"><div class="nm" style="font-weight:600;">'+h.m+' · 股价 '+h.p.toFixed(2)+' 元</div><div class="meta">'+h.note+'</div></div></div>'; }).join('');
    flow='<div class="card" style="border:2px solid var(--green);"><h3>🔔 已上市公司 · '+esc(ip.appliedName)+'<span class="hint">累计被监管问询 '+ip.inquiries+' 次</span></h3>'
    +'<div class="kpis" style="margin:0 0 6px;">'
    +'<div class="kpi"><div class="lb">当前股价</div><div class="vl num">'+ip.price.toFixed(2)+' 元</div><div class="sub">总股本 1,000 万股</div></div>'
    +'<div class="kpi"><div class="lb">当前市值</div><div class="vl num">'+fmt(cap)+'</div><div class="sub">公司经营估值 '+(c?fmt(c.value):'—')+'</div></div>'
    +'<div class="kpi"><div class="lb">上市募资（已到账）</div><div class="vl num">'+fmt(ip.raised)+'</div><div class="sub">发行 25% 股份一次性募资</div></div>'
    +'<div class="kpi"><div class="lb">本月可分红</div><div class="vl num">'+fmt(Math.round(cap*0.03))+'</div><div class="sub">市值的 3% · '+(ip.lastDiv===G.month?'本月已分':'本月未分')+'</div></div></div>'
    +'<div class="acts"><button class="btn pri sm" onclick="payDividend()" '+(ip.lastDiv===G.month?'disabled':'')+'>💰 分红（市值 3%）</button><span class="mini">分红后股价 +4%、声望 +1；纪检热度 ≥ 60 有被监管问询的风险，先把热度降下来</span></div>'
    +'<h3 style="margin-top:14px;"><span class="no">披露</span>信息披露记录</h3>'+hist+'</div>';
  }
  var compCards= comps.length? comps.map(function(c){
    var conds=ipoConds(c);
    var okAll=conds.every(function(x){ return x.cur>=x.need; });
    var rows=conds.map(function(x){
      var ok=x.cur>=x.need, pct=clamp(Math.round(x.cur/x.need*100),0,100);
      return '<div class="item"><div class="grow"><div class="nm">'+(ok?'✅ ':'🔒 ')+x.label+'</div><div class="meta">当前 '+x.txt+'</div><div style="height:6px;background:#e8eef2;border-radius:3px;margin-top:5px;overflow:hidden;"><div style="height:6px;width:'+pct+'%;background:'+(ok?'var(--green)':'var(--orange)')+';"></div></div></div><span class="pill '+(ok?'up':'')+'">'+pct+'%</span></div>';
    }).join('');
    var histTxt=((G.ipo.hist[c.key]||[]).length? '近月净利：'+G.ipo.hist[c.key].map(function(n){ return (n>=0?'+':'')+fmt(n); }).join(' · ') : '暂无月度盈亏记录，推进月份后开始累计（连续盈利从有记录起算）');
    return '<div class="card"><h3>'+c.icon+' '+esc(c.name)+'<span class="hint">估值 '+fmt(c.value)+' · 上月净利 '+(c.net>=0?'+':'')+fmt(c.net)+'</span></h3>'+rows
    +'<p class="mini" style="margin-top:6px;">'+histTxt+'</p>'
    +'<div class="acts" style="margin-top:8px;">'+(ip.stage==='listed'&&ip.key===c.key? '<span class="pill up">已上市</span>' : (ip.stage!=='none'? '<button class="btn sm" disabled>有公司正在上市流程中</button>' : (okAll? '<button class="btn pri sm" onclick="applyIpo(\''+c.key+'\')">📈 申请上市</button>' : '<button class="btn sm" disabled>条件未达标</button>')))+'</div></div>';
  }).join('') : '<div class="card"><h3>📈 还没有可上市的公司</h3><p class="desc">先去创立一家公司：自有品牌（品牌页创立品牌）或跨行业经营（餐饮、健身、电竞酒店、体育科技、影视、房地产任选一家开业），把估值做上去、连着盈利三个月，再回来申请上市。</p><div class="acts"><button class="btn sm" onclick="go(\'brand\')">去自有品牌</button><button class="btn sm" onclick="go(\'cross\')">去跨行业经营</button></div></div>';
  return policy+flow+compCards+'<div class="acts" style="margin:4px 0 10px;"><button class="btn" onclick="go(\'home\')">← 回大厅</button><button class="btn sm" onclick="go(\'empire\')">去集团扩张 →</button></div>';
}

<script>
"use strict";
/* ================= 新系统二：球星抽卡 / 荣耀殿堂 / 直播球场画面 / 体彩竞猜 =================
   状态全部存进 G（pack / hall / bet），随自动存档保存；老存档由
   sanitizeSaveData 补默认，这里再兜底一层 ensureX2()。
   抽卡只花游戏内钻石、竞猜只花游戏内现金，都不涉及真实货币。 */
function ensureX2(){
  if(!G) return;
  if(!G.pack || typeof G.pack!=='object') G.pack={draws:0, hist:[], shards:0, peaks:[]};
  if(!G.pack.hist) G.pack.hist=[]; if(G.pack.shards==null) G.pack.shards=0; if(G.pack.draws==null) G.pack.draws=0;
  if(!G.pack.peaks) G.pack.peaks=[];
  if(!G.hall || typeof G.hall!=='object') G.hall={club:[]};
  if(!G.hall.club) G.hall.club=[];
  if(!G.bet || typeof G.bet!=='object') G.bet={slips:[], rounds:{}, totalBet:0, totalWin:0, settled:0, won:0};
  if(!G.bet.slips) G.bet.slips=[]; if(!G.bet.rounds) G.bet.rounds={};
  if(G.bet.totalBet==null) G.bet.totalBet=0; if(G.bet.totalWin==null) G.bet.totalWin=0; if(G.bet.settled==null) G.bet.settled=0; if(G.bet.won==null) G.bet.won=0;
}

/* ---------------- 球星抽卡：五档卡包 × 六个卡等级 ----------------
   等级与能力区间：普通 60–70 / 优秀 71–78 / 精英 79–85 / 巨星 86–92 / 传奇 93–97 /
   限定 93–99（卡包限定·巅峰池，全游戏最强的一档）。
   每档包的六级概率写死在 PACKS.probs 里（顺序：普通/优秀/精英/巨星/传奇/限定），
   每档合计 100%，页面上完整公开。巨星/传奇卡优先从图鉴真球星里出（按能力区间匹配），
   限定卡只从 PEAK_STARS 里出；抽到已拥有的球员自动转碎片；阵容满时转现金补偿。 */
var CARD_TIERS=[
  {nm:'普通', ab:[60,70], col:'#7d8a96', dup:5,  cash:50},
  {nm:'优秀', ab:[71,78], col:'#2b6cb0', dup:12, cash:100},
  {nm:'精英', ab:[79,85], col:'#0e7a7a', dup:30, cash:200},
  {nm:'巨星', ab:[86,92], col:'#e85d1f', dup:80, cash:400},
  {nm:'传奇', ab:[93,97], col:'#c9930a', dup:200, cash:800},
  {nm:'限定', ab:[93,99], col:'#12263f', dup:400, cash:2000}
];
var PACKS=[
  {id:'rookie', nm:'新秀包', price:60,   probs:[69.9,24,5,0.9,0.1,0.1],  ds:'便宜练手：普通、优秀为主，偶尔蹦出一张精英；限定只有 0.1%，纯属撞大运。'},
  {id:'bronze', nm:'青铜包', price:150,  probs:[49.7,35,12,2.7,0.3,0.3], ds:'精英开始常见，巨星得看运气，传奇和限定基本是梦想。'},
  {id:'silver', nm:'白银包', price:300,  probs:[31,38,22,7,1,1],         ds:'精英概率明显提升，传奇、限定各有 1% 的盼头。'},
  {id:'gold',   nm:'黄金包', price:600,  probs:[12,30,35,17,3,3],        ds:'冲高卡的主力包：巨星 17%、传奇 3%、限定 3%。'},
  {id:'legend', nm:'传奇包', price:1200, probs:[2,18,37,33,5,5],         ds:'传奇 5%、限定 5% 都是全场最高——限定池里是巅峰C罗（99）、巅峰梅西（98）。'}
];
function packDef(id){ var f=null; PACKS.forEach(function(p){ if(p.id===id) f=p; }); return f; }
function rollTier(probs){ var r=Math.random()*100, acc=0; for(var i=0;i<probs.length;i++){ acc+=probs[i]; if(r<acc) return i; } return 0; }
/* ---------------- 卡包限定 · 巅峰池（PEAK_STARS） ----------------
   图鉴里没有、转会市场买不到、现金和直签券都签不到——只能抽卡获得。
   前 10 位是图鉴传奇巨星的巅峰版本（照片复用同一位球员的图鉴照片），

function resolvePackTier(tier){
  var T=CARD_TIERS[tier];
  if(tier===5){
    var pk2=pick(PEAK_STARS);
    if(peakInSquad(pk2)){ G.pack.shards+=T.dup; return {tier:5, peak:pk2, dup:true, txt:'重复！卡包限定 '+pk2.name+' 已经在队里，自动转为球员碎片 +'+T.dup}; }
    if(G.squad.length>=40){ G.cash+=T.cash; return {tier:5, peak:pk2, full:true, txt:'抽中卡包限定 '+pk2.name+'（能力 '+pk2.ab+'），但阵容已满（40人），转为现金补偿 +'+fmt(T.cash)}; }
    grantPeak(pk2);
    if(G.pack.peaks.indexOf(pk2.id)<0) G.pack.peaks.push(pk2.id);
    return {tier:5, peak:pk2, txt:'卡包限定 '+pk2.name+'（'+pk2.pos+' · 能力 '+pk2.ab+'）直接入队！'};
  }
  if(tier>=3){
    var pool=STARS.filter(function(s){ return !s.creator && s.ab>=T.ab[0] && s.ab<=T.ab[1]; }); // 创作者卡不进抽卡池
    var chance= tier===4? 0.75 : 0.5;
    if(pool.length && Math.random()<chance){
      var s=pick(pool);
      if(starInSquad(s)){ G.pack.shards+=T.dup; return {tier:tier, star:s, dup:true, txt:'重复！图鉴球星 '+s.name+' 已经在队里，自动转为球员碎片 +'+T.dup}; }

      grantStar(s,'球星抽卡 · '+s.club);
      return {tier:tier, star:s, txt:'图鉴球星 '+s.name+'（'+s.pos+' · 能力 '+s.ab+'）直接入队！'};
    }
  }
  var ab=ri(T.ab[0], T.ab[1]);
  var foreign=Math.random()<0.45;
  var name= foreign? pick(FOREIGN)[0] : randName();
  var guard=0;
  while(G.squad.some(function(p){ return p.name===name; }) && guard++<10) name=randName();
  if(G.squad.some(function(p){ return p.name===name; })){ G.pack.shards+=T.dup; return {tier:tier, dup:true, txt:'抽到重复球员 '+name+'，自动转为球员碎片 +'+T.dup}; }
  if(G.squad.length>=40){ G.cash+=T.cash; return {tier:tier, full:true, txt:T.nm+'卡球员（能力 '+ab+'），但阵容已满，转为现金补偿 +'+fmt(T.cash)}; }
  var p=mkPlayer(name, pick(POS), ab, ri(17,33), foreign);
  p.pot=Math.min(99, ab+ri(0,6)); p.cost=0; p.signNote='球星抽卡 · '+T.nm+'卡';
  squadPush(p);
  return {tier:tier, txt:T.nm+'卡 · '+p.pos+' '+name+'（能力 '+ab+'）入队'};
}
function drawPack(id, n){
  var pk=packDef(id); if(!pk) return;
  ensureX2();
  var cost=pk.price*n;
  if(G.diamonds<cost){ toast('钻石不够，还差 '+(cost-G.diamonds)+' 钻——去充值中心补钻'); return; }
  G.diamonds-=cost;
  if(typeof taskBump==='function') taskBump('recruit');
  var tiers=[];
  for(var i=0;i<n;i++) tiers.push(rollTier(pk.probs));
  if(n===10 && Math.max.apply(null,tiers)<2) tiers[9]=2; // 十连保底：至少一张精英或更高
  var results=tiers.map(function(t){ return resolvePackTier(t); });
  G.pack.draws+=n;
  results.forEach(function(r){ G.pack.hist.unshift({t:r.txt, tier:r.tier, m:G.year+'/'+G.mon}); });
  if(G.pack.hist.length>20) G.pack.hist.length=20;
  log('🃏 '+pk.nm+(n===10?'十连抽':'单抽')+'（💎 '+cost+'）：'+results.map(function(r){ return r.txt; }).join('；')+'。','good');
  render();

}

/* ---------------- 荣耀殿堂 ----------------
   (a) 本俱乐部名人堂：球员离队（转会卖出 / 解约）时评定，满足任一条件入选：
       累计进球 ≥ 50 / 累计出场 ≥ 80 场 / 夺得过赛季个人奖项且出场 ≥ 30 场 /

function playerSeasonsAtClub(p){ return Math.max(1, Math.ceil((p.played||0)/30)); }
function inductCheck(p){
  var goals=(G.goalTable&&G.goalTable[p.name])||0;
  var played=p.played||0;
  var hon=(G.playerHonors&&G.playerHonors[p.name])||[];
  var reasons=[];
  if(goals>=50) reasons.push('为 '+G.club+' 累计进球 '+goals+' 个（≥ 50）');
  if(played>=80) reasons.push('累计出场 '+played+' 场（≥ 80）');
  if(hon.length && played>=30) reasons.push('效力期间夺得赛季个人奖项（'+hon.map(function(h){ return h.award; }).join('、')+'）');
  if(p.star && played>=40) reasons.push('图鉴球星身份为球队出战 '+played+' 场');
  return reasons;
}
function maybeInduct(p){
  if(!G || !p || !p.name) return;
  ensureX2();
  if(G.hall.club.some(function(h){ return h.name===p.name; })) return;
  var reasons=inductCheck(p);
  if(!reasons.length) return;
  var nums=jerseyNumbers();
  var hon=(G.playerHonors&&G.playerHonors[p.name])||[];
  G.hall.club.unshift({ name:p.name, num:nums[p.name]||'', img:p.img||'', pos:p.pos, ab:p.ab,
    goals:(G.goalTable&&G.goalTable[p.name])||0, played:p.played||0, seasons:playerSeasonsAtClub(p),
