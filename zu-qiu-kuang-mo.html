<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>足球狂魔 · 从中乙到中超冠军</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      :root{
        --ink:#1c2733; --ink2:#5a6a78; --ink3:#8b9aa6;
        --bg:#e9edf0; --card:#ffffff; --line:#dde4e9;
        --navy1:#101d29; --navy2:#1b3049;
        --orange:#e85d1f; --orange-d:#c94c14;
        --green:#1d9e62; --green-d:#14744a;
        --red:#d33f2e; --blue:#2b6cb0; --gold:#c9930a;
        --radius:14px;
        --shadow:0 2px 10px rgba(16,29,41,.07), 0 1px 3px rgba(16,29,41,.05);
      }
      html,body{ margin:0; padding:0; }
      body{
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
        background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
        -webkit-font-smoothing:antialiased;
      }
      .num{ font-family:"Archivo","DIN Alternate","PingFang SC",sans-serif; font-variant-numeric:tabular-nums; }
      button{ font-family:inherit; cursor:pointer; }
      /* ---------- layout ---------- */
      .layout{ display:flex; min-height:100vh; }
      aside{
        width:232px; flex:0 0 232px; position:sticky; top:0; height:100vh; overflow-y:auto;
        background:linear-gradient(168deg,var(--navy2) 0%,var(--navy1) 55%,#0b141d 100%);
        color:#dbe5ee; padding:18px 16px 20px; display:flex; flex-direction:column; gap:12px;
      }
      main{ flex:1; min-width:0; padding:20px 22px 40px; max-width:1180px; margin:0 auto; width:100%; }
      /* ---------- sidebar ---------- */
      .brand-tag{ display:inline-block; border:1.5px solid var(--orange); color:#ff9a66; font-weight:700; letter-spacing:.35em; padding:4px 10px 4px 14px; font-size:13px; border-radius:4px; }
      .club-name{ font-size:24px; font-weight:800; color:#fff; margin-top:10px; line-height:1.25; word-break:break-all; }
      .club-sub{ color:#93a7ba; font-size:12px; margin-top:2px; }
      .month-box{ border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:10px 14px; margin-top:6px; background:rgba(255,255,255,.04); }
      .month-box .m{ font-size:26px; font-weight:800; color:#fff; }
      .month-box .m span{ font-size:13px; color:#9db2c4; font-weight:500; margin-left:6px; }
      .month-box .s{ font-size:12px; color:#9db2c4; }
      .tag-row{ display:flex; gap:6px; flex-wrap:wrap; }
      .tag{ font-size:11px; border:1px solid rgba(255,255,255,.3); color:#c8d6e2; padding:2px 8px; border-radius:20px; }
      .tag.hot{ border-color:var(--orange); color:#ffb38f; }
      nav.side{ display:flex; flex-direction:column; gap:4px; margin-top:4px; }
      nav.side button{
        display:flex; align-items:center; gap:10px; width:100%; text-align:left;
        background:transparent; border:none; color:#c8d6e2; font-size:14px; padding:9px 12px; border-radius:20px; min-height:40px;
      }
      nav.side button .ic{ width:18px; text-align:center; flex:0 0 18px; }
      nav.side button .bdg{ margin-left:auto; background:var(--orange); color:#fff; font-size:11px; border-radius:10px; padding:1px 7px; font-weight:700; }
      nav.side button.on{ background:rgba(255,255,255,.13); color:#fff; font-weight:700; box-shadow:inset 3px 0 0 var(--orange); }
      nav.side button:hover{ background:rgba(255,255,255,.08); color:#fff; }
      .side-stats{ border-top:1px solid rgba(255,255,255,.12); padding-top:10px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; }
      .side-stats .row{ display:flex; justify-content:space-between; color:#9db2c4; }
      .side-stats .row b{ color:#eef4f9; font-weight:700; }
      .side-stats .row b.neg{ color:#ff8f7a; }
      .side-btns{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
      .btn-end{ background:var(--orange); color:#fff; border:none; font-size:15px; font-weight:800; padding:12px; border-radius:10px; }
      .btn-end:hover{ background:var(--orange-d); }
      .btn-ghost{ background:transparent; border:1px solid rgba(255,255,255,.35); color:#dbe5ee; padding:9px; border-radius:10px; font-size:13px; }
      .btn-ghost:hover{ border-color:#fff; color:#fff; }
      .credit{ font-size:11.5px; color:#7e93a7; text-align:center; }
      /* ---------- main generic ---------- */
      .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
      .kpi{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
      .kpi .lb{ font-size:12px; color:var(--ink2); display:flex; align-items:center; gap:6px; }
      .kpi .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
      .kpi .vl{ font-size:24px; font-weight:800; margin-top:2px; }
      .kpi .sub{ font-size:11.5px; color:var(--ink3); }
      .kpi .sub .up{ color:var(--green-d); font-weight:700; } .kpi .sub .dn{ color:var(--red); font-weight:700; }
      .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .grid-main{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:14px; align-items:start; }
      .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px; }
      .card h3{ margin:0 0 4px; font-size:16px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
      .card h3 .no{ background:var(--orange); color:#fff; font-size:11px; padding:2px 7px; border-radius:4px; font-weight:800; }
      .card h3 .hint{ font-size:12px; color:var(--ink3); font-weight:500; }
      .card .desc{ color:var(--ink2); font-size:12.5px; margin:2px 0 10px; }
      .bar{ height:8px; background:#e6ecf0; border-radius:6px; overflow:hidden; }
      .bar > i{ display:block; height:100%; border-radius:6px; background:var(--blue); }
      .bar.g > i{ background:var(--green); } .bar.o > i{ background:var(--orange); } .bar.r > i{ background:var(--red); } .bar.gold > i{ background:var(--gold); }
      .btn{ border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:7px 14px; font-size:13px; font-weight:600; }
      .btn:hover{ border-color:#b9c7d1; }
      .btn:disabled{ opacity:.45; cursor:not-allowed; }
      .btn.pri{ background:var(--orange); border-color:var(--orange); color:#fff; }
      .btn.pri:hover{ background:var(--orange-d); }
      .btn.grn{ background:var(--green); border-color:var(--green); color:#fff; }
      .btn.grn:hover{ background:var(--green-d); }
      .btn.dark{ background:var(--navy1); border-color:var(--navy1); color:#fff; }
      .btn.sm{ padding:4px 10px; font-size:12px; min-height:32px; }
      .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
      .tabs button{ border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 13px; font-size:12.5px; min-height:34px; }
      .tabs button.on{ background:var(--navy1); color:#fff; border-color:var(--navy1); font-weight:700; }
      table{ width:100%; border-collapse:collapse; font-size:13px; }
      th{ text-align:left; color:var(--ink3); font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
      td{ padding:7px 8px; border-bottom:1px solid #eef2f5; vertical-align:middle; }
      tr.me td{ background:#fff4ec; font-weight:700; }
      tr:last-child td{ border-bottom:none; }
      .pill{ display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:#eef3f6; color:var(--ink2); font-weight:600; white-space:nowrap; }
      .pill.fw{ background:#fde8e0; color:var(--orange-d); } .pill.mf{ background:#e2f2e7; color:var(--green-d); }
      .pill.df{ background:#e3ecf7; color:var(--blue); } .pill.gk{ background:#fdf3d3; color:#8a6508; }
      .pill.up{ background:#e2f2e7; color:var(--green-d); } .pill.dn{ background:#fdeaea; color:var(--red); }
      .mini{ font-size:11.5px; color:var(--ink3); }
      .log{ display:flex; flex-direction:column; }
      .log .it{ display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed #e3e9ee; font-size:13px; }
      .log .it:last-child{ border-bottom:none; }
      .log .dt{ color:var(--ink3); font-size:12px; flex:0 0 64px; }
      .log .it.bad{ color:var(--red); } .log .it.good{ color:var(--green-d); }
      /* stadium banner */
      .stadium{ border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:14px; background:linear-gradient(180deg,#bcd8ea 0%,#dcebf3 46%,#3f9e5f 46.2%,#2e7d46 100%); position:relative; }
      .stadium .sky{ padding:18px 20px 0; display:flex; justify-content:space-between; align-items:flex-start; }
      .stadium .ttl{ font-size:21px; font-weight:900; color:#14324a; }
      .stadium .ttl small{ display:block; font-size:12px; font-weight:600; color:#40617c; margin-top:2px; }
      .stadium .score{ background:rgba(16,29,41,.85); color:#fff; border-radius:10px; padding:8px 14px; text-align:center; }
      .stadium .score b{ font-size:19px; }
      .stadium .score div{ font-size:11px; color:#b9cbda; }
      .stadium svg{ display:block; width:100%; height:auto; }
      /* rows / items */
      .item{ display:flex; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid #eef2f5; }
      .item:last-child{ border-bottom:none; }
      .item .grow{ flex:1; min-width:0; }
      .item .nm{ font-weight:700; font-size:14px; }
      .item .meta{ font-size:12px; color:var(--ink2); margin-top:1px; }
      .ab-wrap{ display:flex; align-items:center; gap:8px; min-width:130px; }
      .ab-wrap .bar{ flex:1; }
      .ab-wrap b{ font-size:13px; width:24px; text-align:right; }
      /* relation & gray cards */
      .rel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .rel-card{ border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
      .rel-card .nm{ font-weight:800; font-size:14.5px; }
      .rel-card .role{ font-size:12px; color:var(--orange-d); font-weight:700; }
      .rel-card .ben{ font-size:12px; color:var(--ink2); margin:6px 0 8px; }
      .rel-card .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
      .fac{ display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid #eef2f5; }
      .fac:last-child{ border-bottom:none; }
      .fac .ic{ font-size:24px; width:44px; height:44px; flex:0 0 44px; background:#eef4f8; border-radius:12px; display:flex; align-items:center; justify-content:center; }
      .lv-dots{ letter-spacing:2px; color:var(--orange); font-size:13px; }
      .lv-dots .off{ color:#d4dde4; }
      /* recharge */
      .tiers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
      .tier{ border:2px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; background:#fff; cursor:pointer; min-height:44px; }
      .tier:hover{ border-color:#c3d2dd; }
      .tier.on{ border-color:var(--orange); background:#fff7f1; }
      .tier .amt{ font-size:19px; font-weight:800; }
      .tier .dia{ color:var(--orange-d); font-weight:700; font-size:13px; margin-top:2px; }
      .tier .dbl{ font-size:11px; color:var(--red); font-weight:700; }
      .shop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
      .shop-it{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
      .shop-it .nm{ font-weight:800; }
      .shop-it .ds{ font-size:12px; color:var(--ink2); margin:3px 0 9px; min-height:34px; }
      .qr-box{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
      .qr-box img{ width:190px; height:auto; border-radius:12px; border:1px solid var(--line); }
      /* modal */
      .overlay{ position:fixed; inset:0; background:rgba(13,22,31,.62); z-index:60; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:26px 14px; }
      .modal{ background:#fff; border-radius:16px; max-width:620px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.35); overflow:hidden; }
      .modal .hero{ background:linear-gradient(120deg,#173550,#0e2233); color:#fff; padding:22px 26px 18px; position:relative; }
      .modal .hero .big{ font-size:32px; font-weight:900; letter-spacing:.06em; }
      .modal .hero .big em{ font-style:normal; color:var(--orange); }
      .modal .hero .sub{ color:#a9bfd1; font-size:13px; margin-top:3px; }
      .modal .body{ padding:18px 26px 24px; max-height:62vh; overflow-y:auto; }
      .modal label.fl{ display:block; font-size:12.5px; color:var(--ink2); font-weight:700; margin:14px 0 6px; }
      .modal input[type=text]{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:15px; font-weight:700; font-family:inherit; }
      .opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .opt{ border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; cursor:pointer; background:#fff; text-align:left; width:100%; }
      .opt b{ font-size:14px; display:block; }
      .opt span{ font-size:12px; color:var(--ink2); display:block; margin-top:3px; line-height:1.5; }
      .opt.on{ border-color:var(--orange); background:#fff7f1; box-shadow:inset 3px 0 0 var(--orange); }
      .modal .foot{ padding:0 26px 22px; display:flex; gap:10px; flex-wrap:wrap; }
      .btn-start{ background:var(--orange); color:#fff; border:none; font-size:16px; font-weight:800; padding:12px 30px; border-radius:10px; }
      .btn-start:hover{ background:var(--orange-d); }
      .ev-choices{ display:flex; flex-direction:column; gap:9px; margin-top:12px; }
      .ev-choices button{ text-align:left; }
      .end-grade{ font-size:54px; font-weight:900; color:var(--orange); line-height:1; }
      /* toast */
      #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--navy1); color:#fff; padding:11px 20px; border-radius:24px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:92vw; text-align:center; }
      #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
      .warn-strip{ background:#fdf0ec; border:1px solid #f3c4b2; color:#9c3a17; border-radius:10px; padding:9px 13px; font-size:12.5px; margin-bottom:12px; }
      .ok-strip{ background:#e9f7ef; border:1px solid #bfe6cf; color:var(--green-d); border-radius:10px; padding:9px 13px; font-size:12.5px; margin-bottom:12px; }
      textarea.code{ width:100%; min-height:74px; border:1.5px solid var(--line); border-radius:9px; padding:9px; font-size:11px; font-family:monospace; }
      /* ---------- responsive ---------- */
      .topbar{ display:none; }
      @media (max-width:900px){
        .layout{ flex-direction:column; }
        aside{ display:none; }
        .topbar{ display:block; position:sticky; top:0; z-index:40; background:linear-gradient(120deg,var(--navy2),var(--navy1)); color:#fff; padding:12px 14px 10px; }
        .topbar .r1{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .topbar .cn{ font-size:17px; font-weight:800; }
        .topbar .mm{ margin-left:auto; font-size:13px; color:#b9cbda; }
        .topbar .mm b{ color:#fff; font-size:16px; }
        .topbar nav{ display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
        .topbar nav::-webkit-scrollbar{ display:none; }
        .topbar nav button{ flex:0 0 auto; background:rgba(255,255,255,.1); border:none; color:#c8d6e2; border-radius:18px; padding:7px 14px; font-size:13px; min-height:38px; }
        .topbar nav button.on{ background:var(--orange); color:#fff; font-weight:700; }
        .topbar .r3{ display:flex; gap:8px; margin-top:10px; }
        .topbar .r3 .btn-end{ flex:1; padding:10px; font-size:14px; }
        .topbar .r3 .btn-ghost{ flex:0 0 auto; padding:10px 14px; }
        main{ padding:14px 12px 34px; }
        .kpis{ grid-template-columns:1fr 1fr; }
        .grid2,.grid-main,.rel-grid{ grid-template-columns:1fr; }
        .opt-grid{ grid-template-columns:1fr; }
        .modal .body{ padding:14px 18px 18px; } .modal .hero,.modal .foot{ padding-left:18px; padding-right:18px; }
        .tbl-wrap{ overflow-x:auto; }
        .qr-box img{ width:160px; }
      }
    </style>
  </head>

    <div id="modal-root"></div>

<script>
"use strict";
/* ================= 足球狂魔 · 俱乐部经营模拟 =================
   玩法移植自《基建狂魔》：月度回合 / 转会招标 / 教练组 / 人脉关系 /
   灰色账本 / 银行授信 / 全自动模拟 / 充值中心，目标：36 个月内
   从中乙一路冲到中超并夺冠。进度只保存在本次打开内。 */
var $app = document.getElementById('app');
var $modal = document.getElementById('modal-root');
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'; setTimeout(function(){ t.className=''; },2600); }
function fmt(n){ n=Math.round(n); if(Math.abs(n)>=10000){ return (n/10000).toFixed(2).replace(/\.?0+$/,'')+'亿'; } return n.toLocaleString('zh-CN')+'万'; }
function fmtFans(n){ if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+'万人'; return n.toLocaleString('zh-CN')+'人'; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
</script>

function pois(lambda){ var L=Math.exp(-lambda), k=0, p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1; }
function playMonthMatches(){
  var results=[]; var str=teamStr(); var d=DIVS[G.div];
  var opps=G.table.slice().sort(function(){ return Math.random()-0.5; }).slice(0,3);
  opps.forEach(function(opp,idx){
    var home=idx!==1;
    var diff=str-opp.str + (home?2.5:-1.5) + (G.rel.ref>=60?1.2:0);
    var xg=clamp(1.38+diff*0.085,0.15,4.4), xa=clamp(1.22-diff*0.085,0.1,4.2);
    var gf=pois(xg), ga=pois(xa);
    G.gf+=gf; G.ga+=ga; opp.gf+=ga; opp.ga+=gf;
    var res, cls='';
    if(gf>ga){ G.pts+=3; G.wins++; opp.pts+=0; res='胜'; cls='good'; }
    else if(gf===ga){ G.pts+=1; opp.pts+=1; res='平'; }
    else { opp.pts+=3; res='负'; cls='bad'; }
    results.push({opp:opp.name, score:gf+':'+ga, res:res, home:home, cls:cls});
  });
  // 对手之间互相刷分（按实力漂移）
  G.table.forEach(function(t){ var gain=clamp(Math.round((t.str-d.base)*0.55+rnd(2,8)),0,9); t.pts+=gain; t.gf+=ri(2,6); t.ga+=ri(2,6); });
  return results;
}

  var d=DIVS[G.div];
  var wins=results.filter(function(r){ return r.res==='胜'; }).length;

  var interest=Math.round(G.debt*0.01);
  var income=gate+sponsor+tv, cost=wages+ops+interest;

}

  {t:'队内老将要求涨薪', d:'更衣室领袖觉得自己的工资配不上贡献，年轻球员都在看你怎么处理。', cs:[
    {tx:'给核心涨薪 30%，稳住更衣室', fx:function(){ G.squad.forEach(function(p){ if(p.age>=28) p.wage=Math.round(p.wage*1.3*10)/10; }); G.morale=clamp(G.morale+8,0,100); return '老将们安心了，训练场上嗓门都大了。'; }},
    {tx:'强硬拒绝，谁闹谁走', fx:function(){ G.morale=clamp(G.morale-10,0,100); return '更衣室气氛降到冰点。'; }}]},
  {t:'豪门球探盯上你的头牌', d:'一家中超豪门私下接触你的核心球员，球员本人有点动心。', cs:[
    {tx:'加薪续约，强行留人', fx:function(){ var best=G.squad.slice().sort(function(a,b){return b.ab-a.ab;})[0]; if(best){ best.wage=Math.round(best.wage*1.4*10)/10; } G.cash-=40; return '头牌签了新约，但工资结构被抬高了。'; }},
    {tx:'敞开谈，价高者得', fx:function(){ refreshOffers(); G.offers.forEach(function(o){ o.price=Math.round(o.price*1.3); }); return '转会市场一下子热闹起来，去转会页看看报价。'; }}]},
  {t:'本地企业想冠名球场', d:'一家地产公司开价给主场冠名，球迷觉得名字太土有意见。', cs:[
    {tx:'接冠名：+220万', fx:function(){ G.cash+=220; G.rel.fans=clamp(G.rel.fans-5,0,100); return '钱到账了，球迷在看台上打出了抗议横幅。'; }},
    {tx:'拒绝，保住球场名字', fx:function(){ G.rel.fans=clamp(G.rel.fans+8,0,100); G.rep=clamp(G.rep+2,0,100); return '球迷直呼“这才是自家俱乐部”。'; }}]}
];
function processVentures(){
  if(!G.ventures) G.ventures={};
  var inc=0, up=0, notes=[];
  Object.keys(G.ventures).forEach(function(id){
    var d=ventDef(id); if(!d) return; var lv=G.ventures[id];
    var i=Math.round(ri(d.inc[0],d.inc[1])*(1+0.6*(lv-1)));
    if(id==='brand') i+=Math.round(G.fans*0.0008*lv);
    up+=Math.round(d.upkeep*(1+0.4*(lv-1)));
    inc+=i;
  });
  var net=inc-up; G.cash+=net; G.ventureNet=net;
  if(hasVent('esports')){ G.fans+=150*G.ventures.esports; if(Math.random()<0.14){ var b=ri(80,220); G.cash+=b; G.rep=clamp(G.rep+2,0,100); notes.push('🎮 电竞战队打进联赛决赛，奖金加代言 +'+fmt(b)+'，声望 +2。'); } }
  if(hasVent('basketball') && Math.random()<0.12){ var b2=ri(50,150); G.cash+=b2; notes.push('🏀 篮球队赢下同城德比，门票和周边大卖 +'+fmt(b2)+'。'); }
  if(hasVent('media')){ if(Math.random()<0.4) G.rep=clamp(G.rep+1,0,100); G.rel.media=clamp(G.rel.media+1,0,100); }
  if(hasVent('school') && Math.random()<0.3) G.rep=clamp(G.rep+1,0,100);
  if(hasVent('brand') && Math.random()<0.25) G.rep=clamp(G.rep+1,0,100);
  if(hasVent('overseas') && G.month%6===0 && G.squad.length<22){ var f=pick(FOREIGN); var p=mkPlayer(f[0],pick(POS),ri(55,64),ri(17,20),true); p.pot=ri(74,90); G.squad.push(p); notes.push('🌍 海外卫星俱乐部输送小将 '+p.name+'（'+f[1]+'，潜力 '+p.pot+'）免费加盟一线队。'); }
  if(ventCount()>0) log('🏢 集团板块本月：收入 '+fmt(inc)+' · 支出 '+fmt(up)+' · 净'+(net>=0?'+':'')+fmt(net)+'。', net>=0?'good':'bad');
  notes.forEach(function(n){ log(n,'good'); });
}
function seasonSettle(){
  var rank=myRank(); G.seasonRank=rank; var d=DIVS[G.div];
  var prize=d.prize[rank-1]||50;
  G.cash+=prize;
  var msg='🏁 赛季结束：'+d.short+'第 '+rank+' 名，联赛奖金 +'+fmt(prize)+'。';
  if(rank===1 && G.div===0) G.champion=true;
  var moved='';
  if(G.month>=36){ log(msg,'good'); return; }
  if(rank<=2 && G.div>0){ G.div--; G.promoted++; moved='⬆️ 升级！下赛季踢 '+DIVS[G.div].short+'！'; G.rep=clamp(G.rep+10,0,100); G.fans=Math.round(G.fans*1.35); }
  else if(rank===1 && G.div===0){ moved='🏆 中超冠军！你登顶了！'; }
  else if(rank>=7 && G.div<2){ G.div++; moved='⬇️ 不幸降级，下赛季去 '+DIVS[G.div].short+'。'; G.rep=clamp(G.rep-8,0,100); G.fans=Math.round(G.fans*0.8); }
  log(msg+(moved?' '+moved:''), rank<=2?'good':(rank>=7?'bad':''));
  buildTable(); refreshMarket(true);
}
function checkInvestigation(){
  if(G.heat<65) return false;
  var chance=(G.heat-60)*0.012;
  if(Math.random()<chance){
    if(G.rel.fa>=70 && Math.random()<0.5){ G.heat=45; log('⚠️ 纪检约谈警告：郑国强提前通了气，你连夜整改，热度压回 45。','bad'); return false; }
    var fine=ri(150,400);
    if(G.heat>=96 || Math.random()<0.35){ endGame('caught'); return true; }
    G.cash-=fine; G.pts=Math.max(0,G.pts-6); G.heat=40; G.rep=clamp(G.rep-12,0,100);
    log('🚨 纪律委员会调查落地：罚款 '+fmt(fine)+'、联赛扣 6 分、声望大跌。灰色账本该收手了。','bad');
    toast('被调查了！罚款扣分，热度暂降');
    return false;
  }
  return false;
}
function endMonth(auto){
  if(!G || G.ended) return;
  G.relUsed={}; G.grayUsed={};
  var results=playMonthMatches();
  G.lastResults=results;
  var fin=monthlyFinance(results);
  G.lastFinance=fin;
  processVentures();
  var wins=results.filter(function(r){ return r.res==='胜'; }).length;
  var losses=results.filter(function(r){ return r.res==='负'; }).length;
  G.morale=clamp(G.morale + wins*4 - losses*5 + (G.coach.spec==='体能储备'?2:0), 5, 100);
  var fanCap=[150000,70000,32000][G.div];
  G.fans=Math.max(800, Math.min(fanCap, Math.round(G.fans*(1 + clamp((wins-losses)*0.02,-0.03,0.025) + 0.004) + (G.rel.fans>=60?300:0))));
  G.rep=clamp(G.rep + (myRank()<=2?2: myRank()>=7?-2:0) + (G.rel.media>=60?1:0), 0, 100);
  growPlayers();
  G.heat=clamp(G.heat-Math.max(3, Math.round(G.heat*0.12)),0,100); // 热度按比例消退：偶尔操作能凉下来，长期滥用必爆
  Object.keys(G.rel).forEach(function(k){ G.rel[k]=clamp(G.rel[k]-2,0,100); });
  if(G.grayWinBoost>0) G.grayWinBoost--;
  G.hist.push(Math.round(G.cash)); if(G.hist.length>37) G.hist.shift();
  var sum=results.map(function(r){ return (r.home?'主':'客')+' '+r.score+' '+r.opp+'('+r.res+')'; }).join(' · ');
  log('⚽ 本月战绩 '+wins+'胜：'+sum+'｜净'+(fin.net>=0?'+':'')+fmt(fin.net)+'，现金 '+fmt(G.cash)+'。', wins>=2?'good':(losses>=2?'bad':''));
  if(G.cash<0){ G.negMonths++; if(G.negMonths>=2){ endGame('bankrupt'); render(); return; } log('⚠️ 现金已为负数！再撑一个月还不上，俱乐部就要破产清算。','bad'); }
  else G.negMonths=0;
  if(checkInvestigation()){ render(); return; }
  var isSeasonEnd=(G.mon===12);
  G.mon++; if(G.mon>12){ G.mon=1; G.year++; }
  G.month++;
  refreshMarket(); refreshOffers();
  if(isSeasonEnd){ seasonSettle(); }
  if(G.month>36){ endGame('final'); render(); return; }
  if(!auto && Math.random()<0.38){ showEvent(pick(EVENTS)); }
  render();
}
function endGame(kind){
  G.ended=true; stopAuto();
  var v=valuation(); var rank=myRank(); var e;
  var effDiv=G.div; if(kind==='final' && rank<=2 && G.div>0) effDiv=G.div-1; // 最后一季压哨升级也算数
  if(kind==='bankrupt'){ e={grade:'D', title:'资金链断裂 · 破产清算', text:'工资发不出来，球员集体解约，俱乐部被托管拍卖。'+G.club+'的故事，在第 '+G.month+' 个月戛然而止。'}; }
  else if(kind==='caught'){ e={grade:'D', title:'东窗事发 · 禁赛重罚', text:'调查组带走了账本，俱乐部被取消注册资格。赢球的方式错了，赢多少场都不算数。'}; }
  else if(G.champion && v>=15000){ e={grade:'S', title: groupStage()>=4?'跨国体育帝国 · 王朝奠基':'豪门帝国 · 王朝奠基', text:'中超冠军奖杯在手，俱乐部估值 '+fmt(v)+'，球迷 '+fmtFans(G.fans)+'。你从中乙带出来的球队，成了别人眼里的豪门。'+(ventCount()? '旗下 '+ventCount()+' 个跨界板块横跨电竞、篮球与海外球队——这已经不只是一支球队，而是一个体育帝国。':'')}; }
  else if(G.champion){ e={grade:'A', title:'联赛冠军 · 登顶之夜', text:'你带队拿下了中超冠军！估值 '+fmt(v)+'。从第 1 个月的中乙小球会，到站在领奖台中央，你用了整整三年。'}; }
  else if(effDiv===0 && G.div===1){ e={grade:'A', title:'压哨冲超 · 梦圆顶级联赛', text:'最后一个赛季冲进前二，球队升上中超！估值 '+fmt(v)+'。三年两级跳，这支球队的故事才刚刚开始。'}; }
  else if(effDiv===0){ e={grade:'A', title:'顶级联赛 · 站稳脚跟', text:'球队在中超活了下来，最终排名第 '+rank+'，估值 '+fmt(v)+'。冠军还差一步，但没人再敢小看'+G.club+'。'}; }
  else if(effDiv===1 && G.div===2){ e={grade:'B', title:'压哨夺冠 · 升入中甲', text:'最后一个赛季拿下中乙前二，球队升入中甲，估值 '+fmt(v)+'。中超还远，但这一步迈出去了。'}; }
  else if(effDiv===1){ e={grade:'B', title:'中甲劲旅 · 只差临门一脚', text:'三年带队打到中甲前列，估值 '+fmt(v)+'，最终排名第 '+rank+'。中超的大门已经能看见了，就差最后一个赛季。'}; }
  else if(G.div===2 && rank<=4){ e={grade:'C', title:'中乙劲旅 · 升级未果', text:'球队常年前四却总差一口气，估值 '+fmt(v)+'。球迷还在，故事只能交给下一个三年。'}; }
  else { e={grade:'C', title:'小城球队 · 平凡三年', text:'没有破产，也没有奇迹。估值 '+fmt(v)+'，最终排名第 '+rank+'。这支球队还在踢，这本身就是很多小俱乐部的全部。'}; }
  G.ending=e;
  log('🎬 结局【'+e.title+'】评级 '+e.grade+'：'+e.text,'good');
}
</script>
<script>
"use strict";
/* ---------------- 操作 ---------------- */
function go(p){ PAGE=p; render(); window.scrollTo(0,0); }
function buyPlayer(i){
  var p=G.market[i]; if(!p) return;
  if(G.cash<p.price){ toast('现金不够，还差 '+fmt(p.price-G.cash)); return; }
  if(G.squad.length>=22){ toast('一线队名额已满（22人），先卖掉球员'); return; }
  G.cash-=p.price; G.squad.push(p); G.market.splice(i,1);
  log('✍️ 签下'+p.pos+' '+p.name+'（能力 '+p.ab+'），转会费 '+fmt(p.price)+'，月薪 '+p.wage+'万。','good');
  toast('签下 '+p.name); render();
}
function sellPlayer(i){
  var o=G.offers[i]; if(!o) return;
  if(G.squad.length<=12){ toast('阵容太薄了，不能再卖'); return; }
  var idx=G.squad.indexOf(o.player); if(idx<0){ G.offers.splice(i,1); render(); return; }
  G.cash+=o.price; G.squad.splice(idx,1); G.offers.splice(i,1);
  log('💸 '+o.player.name+' 以 '+fmt(o.price)+' 转会离队（'+o.from+'）。','');
  toast('卖出 '+o.player.name+' +'+fmt(o.price)); render();
}
function releasePlayer(name){
  var idx=-1; G.squad.forEach(function(p,i){ if(p.name===name) idx=i; });
  if(idx<0) return;
  if(G.squad.length<=12){ toast('阵容太薄，不能再解约'); return; }
  var p=G.squad[idx]; G.squad.splice(idx,1);
  log('👋 与 '+p.name+' 解约，省下月薪 '+p.wage+'万。','');
  render();
}
function setFocus(f){ G.focus=f; log('🎯 训练重点调整为：'+f+'。',''); render(); }
function hireCoach(i){
  var c=COACH_POOL[i];
  var fee=Math.round(c.wage*3);
  if(G.cash<fee){ toast('签约费不够'); return; }
  G.cash-=fee;
  log('🧢 换帅：'+G.coach.name+' 下课，'+c.name+' 上任（'+c.spec+'），签约费 '+fmt(fee)+'。','');
  G.coach={name:c.name, spec:c.spec, ab:c.ab, wage:c.wage};
  G.morale=clamp(G.morale+5,0,100);
  render();
}
function hireStaff(i){
  var s=STAFF_POOL[i];
  if(G.staff.some(function(x){ return x.role===s.role; })){ toast('该岗位已有人了'); return; }
  var fee=Math.round(s.wage*3);
  if(G.cash<fee){ toast('签约费不够'); return; }
  G.cash-=fee; G.staff.push({name:s.name, role:s.role, wage:s.wage});
  log('🧑‍💼 '+s.name+' 入职担任'+s.role+'，月薪 '+s.wage+'万。','good');
  render();
}
function fireStaff(role){
  G.staff=G.staff.filter(function(x){ return x.role!==role; });
  log('🧑‍💼 '+role+' 离职，月薪支出减少。',''); render();
}
function relAct(id, kind){
  if(G.relUsed[id]){ toast('本月已经和 TA 打过交道了'); return; }
  var cost= kind==='meal'? 15 : 50;
  if(G.cash<cost){ toast('现金不够'); return; }
  G.cash-=cost; G.relUsed[id]=true;
  var gain= kind==='meal'? 7 : 16;
  G.rel[id]=clamp(G.rel[id]+gain,0,100);
  var r=RELS.filter(function(x){ return x.id===id; })[0];
  log((kind==='meal'?'🍽️ 请 ':'🤝 与 ')+r.name+'（'+r.role+'）'+(kind==='meal'?'吃了顿饭':'谈成一项合作')+'，关系 +'+gain+' → '+G.rel[id]+'。','');
  render();
}
function grayAct(kind){
  if(G.grayUsed[kind]){ toast('本月已经操作过这一项了'); return; }
  G.grayUsed[kind]=true;
  if(kind==='kickback'){
    var amt=ri(60,150); G.cash+=amt; G.heat=clamp(G.heat+10,0,100);
    log('🕶️ 引援返佣：经纪人退回 '+fmt(amt)+' 到账外账户。纪检热度 +10 → '+G.heat+'。','bad');
  } else if(kind==='contract'){
    var save=Math.round(wagesTotal()*0.4); G.cash+=save; G.heat=clamp(G.heat+8,0,100);
    log('🕶️ 阴阳合同：账面工资做低，省下 '+fmt(save)+'。纪检热度 +8 → '+G.heat+'。','bad');
  } else if(kind==='fix'){
    G.grayWinBoost=1; G.heat=clamp(G.heat+16,0,100);
    log('🕶️ 默契球安排上了：本月比赛强度暗中 +7。纪检热度 +16 → '+G.heat+'。','bad');
  } else if(kind==='poach'){
    var p=genPlayer('young'); p.ab=ri(50,58); p.pot=ri(78,90); G.squad.push(p); G.heat=clamp(G.heat+12,0,100);
    log('🕶️ 违规挖角：从别家青训营带走小将 '+p.name+'（潜力 '+p.pot+'）。纪检热度 +12 → '+G.heat+'。','bad');
  }
  render();
}
var FACDEF=[
  {id:'stadium', name:'主场球场', icon:'🏟️', desc:'每升一级：门票收入 +9%，球迷口碑更好。'},
  {id:'academy', name:'青训营', icon:'🌱', desc:'每升一级：年轻球员成长概率提升，梯队更出人才。'},
  {id:'training', name:'训练基地', icon:'🏋️', desc:'每升一级：全队比赛强度 +0.8，球员涨球更快。'},
  {id:'medical', name:'医疗中心', icon:'🏥', desc:'每升一级：伤病概率下降，老将状态保持更好。'}
];
function facCost(lv){ return Math.round(150*Math.pow(lv+1,1.6)); }
function upgradeFac(id){
  var lv=G.fac[id]; if(lv>=5){ toast('已经满级'); return; }
  var cost=facCost(lv);
  if(G.cash<cost){ toast('现金不够，还差 '+fmt(cost-G.cash)); return; }
  G.cash-=cost; G.fac[id]++;
  var f=FACDEF.filter(function(x){ return x.id===id; })[0];
  log('🏗️ '+f.name+' 升到 '+G.fac[id]+' 级，花费 '+fmt(cost)+'。','good');
  render();
}
/* ---- 集团扩张操作 ---- */
function buyVenture(id){
  var d=ventDef(id); if(!d || hasVent(id)) return;
  var req=ventReqOK(d); if(req){ toast(req); return; }
  if(G.cash<d.cost){ toast('现金不够，还差 '+fmt(d.cost-G.cash)); return; }
  if(!G.ventures) G.ventures={};
  G.cash-=d.cost; G.ventures[id]=1;
  log('🏢 集团扩张：'+d.name+'正式成立！投入 '+fmt(d.cost)+'，集团从此多了一条业务线（当前阶段：'+STAGES[groupStage()].name+'）。','good');
  toast(d.name+' 成立！'); render();
}
function upgradeVenture(id){
  var d=ventDef(id); if(!d || !G.ventures) return;
  var lv=G.ventures[id]; if(!lv || lv>=3) return;
  var cost=Math.round(d.cost*0.8*lv);
  if(G.cash<cost){ toast('现金不够，还差 '+fmt(cost-G.cash)); return; }
  G.cash-=cost; G.ventures[id]=lv+1;
  log('🏢 '+d.name+' 扩建到 '+G.ventures[id]+' 级规模，投入 '+fmt(cost)+'，收入盘子更大了。','good');
  render();
}
function borrow(amt){
  var avail=G.credit-G.debt;
  if(amt>avail){ toast('授信额度不够'); return; }
  G.debt+=amt; G.cash+=amt;
  log('🏦 银行借款 +'+fmt(amt)+'，负债 '+fmt(G.debt)+'（月息 1%）。','');
  render();
}
function repay(amt){
  amt=Math.min(amt, G.debt, Math.max(G.cash,0));
  if(amt<=0){ toast('没有可还的借款'); return; }
  G.debt-=amt; G.cash-=amt;
  log('🏦 还款 '+fmt(amt)+'，剩余负债 '+fmt(G.debt)+'。','');
  render();
}
/* ---- 充值 ---- */
var selTier=0;
function selectTier(i){ selTier=i; render(); }
function claimDiamonds(){
  var t=TIERS[selTier];
  var first=!G.claimed[t.amt];
  var gain= first? t.dia*2 : t.dia;
  G.claimed[t.amt]=true; G.diamonds+=gain; G.spent+=t.amt;
  var nv= G.spent>=648?6: G.spent>=328?5: G.spent>=128?4: G.spent>=68?3: G.spent>=30?2: G.spent>=6?1:0;
  if(nv>G.vip){ G.vip=nv; }
  log('💎 充值 '+t.amt+' 元到账 '+(first?'（首充双倍）':'')+gain+' 钻，累计消费 '+G.spent+' 元，VIP'+G.vip+'。','good');
  toast('到账 '+gain+' 钻石'); render();
}
function buyShop(kind){
  var cost=0;
  if(kind==='cash'){ cost=100; if(G.diamonds<cost){ toast('钻石不够'); return; } G.diamonds-=cost; G.cash+=500; log('💎 花 100 钻兑换运营资金 +'+fmt(500)+'。','good'); }
  else if(kind==='rep'){ cost=60; if(G.diamonds<cost){ toast('钻石不够'); return; } G.diamonds-=cost; G.rep=clamp(G.rep+6,0,100); log('💎 花 60 钻做了一轮商业包装，声望 +6 → '+G.rep+'。','good'); }
  else if(kind==='fans'){ cost=60; if(G.diamonds<cost){ toast('钻石不够'); return; } G.diamonds-=cost; G.fans+=15000; log('💎 花 60 钻搞球迷嘉年华，球迷 +15,000 人。','good'); }
  else if(kind==='heat'){ cost=80; if(G.diamonds<cost){ toast('钻石不够'); return; } G.diamonds-=cost; G.heat=clamp(G.heat-25,0,100); log('💎 花 80 钻请危机公关团队灭火，纪检热度 -25 → '+G.heat+'。','good'); }
  else if(kind==='star'){ cost=300; if(G.diamonds<cost){ toast('钻石不够'); return; } if(G.squad.length>=22){ toast('阵容已满'); return; } G.diamonds-=cost; var p=genPlayer('star'); p.wage=Math.round(p.wage*10)/10; G.squad.push(p); log('💎 王牌引援卡生效：'+p.pos+' '+p.name+'（能力 '+p.ab+'）空降球队！','good'); }
  render();
}
/* ---- 自动模拟 ---- */
function autoStep(){
  if(!autoOn || !G || G.ended){ stopAuto(); return; }
  // 简单经营策略：缺人补强、现金多升级、关系低维护
  var sorted=G.squad.slice().sort(function(a,b){ return a.ab-b.ab; });
  var weakest=sorted.length? sorted[0].ab : 0;
  for(var i=0;i<G.market.length;i++){
    var p=G.market[i];
    if(p.ab>=weakest+4 && G.cash>p.price+300 && G.squad.length<20){ buyPlayerSilent(i); break; }
  }
  if(G.rel.sponsor<40 && G.cash>200) relActSilent('sponsor');
  if(G.cash>2600 && ventCount()<4){
    for(var vi=0; vi<VENTURES.length; vi++){
      var vd=VENTURES[vi];
      if(!hasVent(vd.id) && !ventReqOK(vd) && G.cash>vd.cost+1200){ buyVentureSilent(vd); break; }
    }
  }
  endMonth(true);
  render();
}
function buyPlayerSilent(i){ var p=G.market[i]; G.cash-=p.price; G.squad.push(p); G.market.splice(i,1); log('🤖 自动经营：签下 '+p.name+'（能力 '+p.ab+'），转会费 '+fmt(p.price)+'。',''); }
function relActSilent(id){ if(G.relUsed[id]) return; G.cash-=15; G.relUsed[id]=true; G.rel[id]=clamp(G.rel[id]+7,0,100); }
function buyVentureSilent(d){ if(!G.ventures) G.ventures={}; G.cash-=d.cost; G.ventures[d.id]=1; log('🤖 自动经营：成立'+d.name+'，投入 '+fmt(d.cost)+'，集团板块 +1。',''); }
function startAuto(){ if(!G||G.ended) return; autoOn=true; autoTimer=setInterval(autoStep, 650); render(); }
function stopAuto(){ autoOn=false; if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } }
function toggleAuto(){ if(autoOn){ stopAuto(); render(); } else startAuto(); }
function endThree(){ if(!G||G.ended) return; for(var i=0;i<3 && !G.ended;i++) endMonth(true); render(); toast('已连推三个月'); }
function restart(){ stopAuto(); G=null; PAGE='home'; showStart(); render(); }
</script>
<script>

  +'</div>'

  +'<button class="btn-ghost" onclick="endThree()" '+(G.ended?'disabled style="opacity:.5"':'')+'>连推三个月</button>'
  +'<button class="btn-ghost" onclick="restart()">重新开局</button>'
  +'<div class="credit">创作人：邓元元</div>'

  var top='<div class="topbar"><div class="r1"><span class="brand-tag">足球狂魔</span><span class="cn">'+esc(G.club)+'</span><span class="mm"><b class="num">'+G.mon+'月</b> '+G.year+' · '+d.short+'第'+myRank()+'</span></div>'
  +'<nav>'+NAV.map(function(n){ return '<button class="'+(PAGE===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[2]+' '+n[1]+'</button>'; }).join('')+'</nav>'
  +'<div class="r3"><button class="btn-end" onclick="endMonth(false)" '+(G.ended?'disabled style="opacity:.5"':'')+'>结束本月 →</button><button class="btn-ghost" onclick="endThree()">连推三月</button></div></div>';
  var body='';
  if(G.ended && G.ending) body+=endingBanner();
  if(PAGE==='home') body+=pageHome();
  else if(PAGE==='market') body+=pageMarket();
  else if(PAGE==='squad') body+=pageSquad();
  else if(PAGE==='rel') body+=pageRel();
  else if(PAGE==='gray') body+=pageGray();
  else if(PAGE==='club') body+=pageClub();
  else if(PAGE==='empire') body+=pageEmpire();
  else if(PAGE==='pay') body+=pagePay();
  else if(PAGE==='auto') body+=pageAuto();
  $app.innerHTML='<div class="layout"><aside>'+side+'</aside><div style="flex:1;min-width:0;">'+top+'<main>'+body+'</main></div></div>';
}
function endingBanner(){
  var e=G.ending;
  return '<div class="card" style="border:2px solid var(--orange);"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;"><div class="end-grade">'+e.grade+'</div><div style="flex:1;min-width:220px;"><h3 style="margin:0;">🎬 '+e.title+'</h3><p class="desc" style="margin-top:6px;font-size:13.5px;">'+e.text+'</p><div class="mini">最终数据：估值 '+fmt(valuation())+' · 现金 '+fmt(G.cash)+' · 声望 '+G.rep+' · 球迷 '+fmtFans(G.fans)+' · 阵容身价 '+fmt(squadValue())+' · 集团阶段 '+STAGES[groupStage()].name+' · 旗下板块 '+ventCount()+' 个（估值 '+fmt(venturesValue())+'）</div></div><button class="btn pri" onclick="restart()">再来一局</button></div></div>';
}
function kpiHTML(){
  var rank=myRank(); var fin=G.lastFinance;
  var netTxt= fin? ('本月净 '+(fin.net>=0?'<span class="up">+':'<span class="dn">')+fmt(fin.net)+'</span>') : '尚未结算';
  return '<div class="kpis">'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--orange)"></span>现金</div><div class="vl num" style="'+(G.cash<0?'color:var(--red)':'')+'">'+fmt(G.cash)+'</div><div class="sub">'+netTxt+'</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--blue)"></span>俱乐部估值</div><div class="vl num">'+fmt(valuation())+'</div><div class="sub">阵容身价 '+fmt(squadValue())+'</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--green)"></span>联赛排名</div><div class="vl num">第 '+rank+' 名</div><div class="sub">'+DIVS[G.div].short+' · '+G.pts+' 分 · 进'+G.gf+' 失'+G.ga+'</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--gold)"></span>声望 / 球迷</div><div class="vl num">'+G.rep+' <span style="font-size:14px;color:var(--ink3)">· '+fmtFans(G.fans)+'</span></div><div class="sub">士气 '+G.morale+' · 热度 <span style="color:'+(G.heat>=60?'var(--red)':'inherit')+'">'+G.heat+'</span></div></div>'
  +'</div>';
}
function stadiumHTML(){
  var d=DIVS[G.div];
  var stands='';
  for(var i=0;i<9;i++){ var h=26+((i*37)%22); stands+='<rect x="'+(28+i*62)+'" y="'+(118-h)+'" width="46" height="'+h+'" rx="3" fill="#28455e" opacity="'+(0.55+ (i%3)*0.18)+'"/>'; }
  return '<div class="stadium"><div class="sky"><div class="ttl">'+esc(G.club)+'<small>'+d.name+' · 主场 '+['','简陋球场','市体育场','专业足球场','现代化球场','豪门级球场','世界级球场'][G.fac.stadium]+' · 青训营 '+G.fac.academy+' 级</small></div>'
  +'<div class="score"><b class="num">'+G.pts+' 分</b><div>第 '+myRank()+' 名 · '+G.wins+' 胜</div></div></div>'
  +'<svg viewBox="0 0 620 190" preserveAspectRatio="none" style="height:120px;"><circle cx="540" cy="34" r="17" fill="#f7c948" opacity="0.9"/>'+stands+'<rect x="0" y="140" width="620" height="50" fill="#2e7d46"/><ellipse cx="310" cy="168" rx="120" ry="15" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="2"/><line x1="310" y1="142" x2="310" y2="190" stroke="rgba(255,255,255,.5)" stroke-width="2"/></svg></div>';
}
function chartHTML(){
  var h=G.hist; if(h.length<2) return '<p class="mini">结束本月后开始记录。</p>';
  var max=Math.max.apply(null,h.concat([100])), min=Math.min.apply(null,h.concat([0]));
  var W=520,H=130,pad=8; var range=(max-min)||1;
  var pts=h.map(function(v,i){ var x=pad+i*(W-2*pad)/(h.length-1); var y=H-pad-((v-min)/range)*(H-2*pad); return x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;"><polyline points="'+pts+'" fill="none" stroke="#e85d1f" stroke-width="2.5"/><text x="'+pad+'" y="12" font-size="10" fill="#8b9aa6">最高 '+fmt(max)+'</text><text x="'+pad+'" y="'+(H-2)+'" font-size="10" fill="#8b9aa6">最低 '+fmt(min)+'</text></svg>';
}
function tableHTML(){
  var rows=G.table.map(function(t){ return {name:t.name, pts:t.pts, gd:t.gf-t.ga, gf:t.gf, me:false}; });
  rows.push({name:G.club, pts:G.pts, gd:G.gf-G.ga, gf:G.gf, me:true});
  rows.sort(function(a,b){ return b.pts-a.pts || b.gd-a.gd || b.gf-a.gf; });
  var html='<div class="tbl-wrap"><table><tr><th>#</th><th>球队</th><th>积分</th><th>净胜</th><th>进球</th><th>区位</th></tr>';

    if(G.div===0 && i>=7) zone='<span class="pill dn">降级区</span>';
    html+='<tr class="'+(r.me?'me':'')+'"><td class="num">'+(i+1)+'</td><td>'+esc(r.name)+(r.me?'（本队）':'')+'</td><td class="num"><b>'+r.pts+'</b></td><td class="num">'+(r.gd>0?'+':'')+r.gd+'</td><td class="num">'+r.gf+'</td><td>'+zone+'</td></tr>';
  });
  return html+'</table></div>';
}
function stageNextText(s){
  if(s===0) return '下一步：升入中甲，或俱乐部估值达到 3000万 → 升格「职业劲旅」，解锁电竞战队、国内卫星球队、连锁足球学校。';
  if(s===1) return '下一步：升入中超且声望达到 50 → 升格「豪门俱乐部」，解锁职业篮球队、自有运动品牌、经纪公司、传媒公司。';
  if(s===2) return '下一步：估值达到 8000万且声望 60 → 升格「体育集团」，解锁海外卫星俱乐部和主场商业综合体。';
  if(s===3) return '下一步：估值达到 1.5亿、声望 75，且夺冠或拥有海外俱乐部 → 登顶「跨国体育帝国」。';
  return '🏆 你已经站在体育产业的顶层：国内外球队、电竞、篮球、自有品牌全线开花。';
}
function stageCardHTML(withBtn){

    return '<div style="flex:1;min-width:82px;text-align:center;"><div style="font-size:18px;">'+(i<s?'✅':(i===s?'🔵':'⚪'))+'</div><div style="font-weight:'+(i===s?'800':'600')+';font-size:12.5px;color:'+(i===s?'var(--orange-d)':'var(--ink2)')+'">'+st.name+'</div></div>';

  +(withBtn?'<button class="btn pri sm" onclick="go(\'empire\')">去集团扩张 →</button>':'')

}
function pageEmpire(){

      var upCost=Math.round(d.cost*0.8*lv);
      act='<div class="acts"><span class="pill up">运营中 · '+lv+' 级</span>'+(lv>=3?'<span class="pill">已扩到顶级规模</span>':'<button class="btn sm" onclick="upgradeVenture(\''+d.id+'\')">扩建到 '+(lv+1)+' 级 · '+fmt(upCost)+'</button>')+'</div>';

      act='<div class="acts"><button class="btn sm" disabled>🔒 未解锁</button><span class="mini">'+req+'</span></div>';

      act='<div class="acts"><button class="btn pri sm" onclick="buyVenture(\''+d.id+'\')">成立 · '+fmt(d.cost)+'</button><span class="mini">现金 '+fmt(G.cash)+'</span></div>';
    }
    return '<div class="rel-card">'+head+act+'</div>';
  }).join('');
  return '<div class="kpis">'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--orange)"></span>集团阶段</div><div class="vl" style="font-size:20px;">'+STAGES[s].name+'</div><div class="sub">第 '+(s+1)+' / 5 阶段</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--blue)"></span>旗下板块</div><div class="vl num">'+ventCount()+' <span style="font-size:14px;color:var(--ink3)">/ '+VENTURES.length+'</span></div><div class="sub">足球 · 电竞 · 篮球 · 品牌…</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--green)"></span>板块估值</div><div class="vl num">'+fmt(venturesValue())+'</div><div class="sub">已计入俱乐部总估值 '+fmt(valuation())+'</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--gold)"></span>板块上月净额</div><div class="vl num" style="'+(G.ventureNet<0?'color:var(--red)':'')+'">'+(G.ventureNet>=0?'+':'')+fmt(G.ventureNet||0)+'</div><div class="sub">每月随主队账目一起结算</div></div>'
  +'</div>'
  + stageCardHTML(false)
  +'<div class="card"><h3><span class="no">扩张</span>跨界板块<span class="hint">像创业一样一步一步来：先站稳联赛，再开副业，最后铺向海外</span></h3>'
  +'<p class="desc">每个板块成立后每月自动结算收入和支出，等级越高盘子越大（最高 3 级）。板块估值计入俱乐部总估值——冲 S 级「豪门帝国」不只靠夺冠，集团做大了同样算数。注意别在现金紧张时贪多，板块的月支出可是雷打不动的。</p>'
  +'<div class="rel-grid">'+cards+'</div></div>';
}
function pageHome(){
  var fin=G.lastFinance;
  var finHTML= fin? '<div class="item"><div class="grow"><div class="nm">上月账目</div><div class="meta">门票 '+fmt(fin.gate)+' · 赞助 '+fmt(fin.sponsor)+' · 转播 '+fmt(fin.tv)+' ｜ 工资 '+fmt(fin.wages)+' · 运营 '+fmt(fin.ops)+' · 利息 '+fmt(fin.interest)+'</div></div><b class="num" style="color:'+(fin.net>=0?'var(--green-d)':'var(--red)')+'">'+(fin.net>=0?'+':'')+fmt(fin.net)+'</b></div>' : '<p class="desc">点「结束本月」，球队就会踢完本月 3 场比赛并结算账目。</p>';
  var resHTML= G.lastResults.length? G.lastResults.map(function(r){ return '<div class="item"><span class="pill '+(r.res==='胜'?'up':(r.res==='负'?'dn':''))+'">'+r.res+'</span><div class="grow"><div class="nm num">'+esc(G.club)+' '+r.score+' '+esc(r.opp)+'</div><div class="meta">'+(r.home?'主场':'客场')+'</div></div></div>'; }).join('') : '<p class="desc">本赛季还没有比赛记录。</p>';
  var warn='';
  if(G.heat>=60) warn+='<div class="warn-strip">🚨 纪检热度已达 '+G.heat+'：随时可能被调查，罚款、扣分甚至取消资格。去灰色账本收手，或者到充值中心找危机公关。</div>';
  if(G.cash<300) warn+='<div class="warn-strip">💸 现金只剩 '+fmt(G.cash)+'：工资快发不出来了。可以卖球员、去俱乐部页借银行授信，或到转会市场回血。</div>';
  var goal='';
  if(G.div===2) goal='当前目标：赛季结束冲进前 2，升上中甲。';

<script>
"use strict";
/* ---------------- 弹窗：开局 / 事件 ---------------- */
var selOrigin='campus', selDiff='std';
function selOpt(kind, v){ if(kind==='o') selOrigin=v; else selDiff=v; showStart(true); }
function showStart(keep){

    {id:'campus', t:'校园起家', d:'现金 350万 · 声望 22 · 球迷 6,000。钱少，但青训苗子和学生死忠是你的本钱。'},

  ];
  var diffs=[
    {id:'easy', t:'宽松', d:'对手报价保守，现金压力小，意外风险少。'},
    {id:'std', t:'标准', d:'市场环境正常，竞争适中。推荐第一次玩选这个。'},
    {id:'hard', t:'困难', d:'对手更强、工资更高，调查也更勤。'}
  ];

  +'<div class="hero"><div class="big">足球<em>狂魔</em></div><div class="sub">从一支中乙小球队，到中超冠军与豪门帝国 —— 你有 36 个月</div></div>'

  +'<label class="fl">俱乐部名称</label><input type="text" id="club-name" maxlength="10" value="'+esc(nameVal)+'">'
  +'<div class="mini" style="margin-top:4px;">全称：'+esc(nameVal)+'足球俱乐部 · 主场 江州奥体中心</div>'
  +'<label class="fl">出身背景</label><div class="opt-grid">'

  +'</div>'

function beginGame(){

  toast('开局：'+name+'，从中乙踢起！');
}
function showEvent(ev){

  +'<div class="ev-choices">'+ev.cs.map(function(c,i){ return '<button class="btn" onclick="resolveEvent('+i+')">'+c.tx+'</button>'; }).join('')+'</div>'
  +'</div></div></div>';
  window._ev=ev;
}
