<script>
"use strict";
/* ================= 新系统（七大经营系统，全部与钱/士气/能力/声望/热度/球迷/青训/转会/设施挂钩） =================
   1 训练与发展：训练强度 + 理疗投入（growPlayers / 单场引擎 / 月度财务已接入）
   2 转会与建队：足球总监四种策略（含零引援锁买人）
   3 俱乐部运营：董事会耐心/预算/设施拨款 + 城市赛事运营（门票加成已接入 matchGate）
   4 数据球探：残缺报告（完整度=球探+数据中心）、适配度、考察任务带回独家候选
   5 更衣室：心情月结、出场承诺兑现/食言
   6 人际关系：谈话 / 承诺首发 / 续约（续约球员不被报价挖角）
   7 媒体关系：发布会四种表态 + 公开表扬/批评（批评有概率激出状态，growPlayers 已接入） */
function playerByName(name){ var f=null; if(G) G.squad.forEach(function(p){ if(p.name===name) f=p; }); return f; }
function hasScout(){ return !!(G && G.staff.some(function(x){ return x.role==='首席球探'; })); }
function scoutLevel(){ return 1 + (hasScout()?1:0) + ((G&&G.fac.data)||0); } // 报告完整度：1 起步，首席球探 +1，数据中心每级 +1

/* ---- 1. 训练计划 ---- */
function setTrainIntensity(v){
  if(!G.train) G.train={intensity:'标准', physio:1};
  G.train.intensity=v;
  log('🏋️ 训练强度调整为「'+v+'」：'+(v==='高强度'?'成长加速、年轻人涨得更快，但体能掉得快、训练伤和比赛伤都变多，老将掉状态也更快。':(v==='恢复调养'?'成长放缓，换全队体能和健康——赛程密、伤号多的时候用它保人。':'按常规节奏训练，成长、体能、伤病都走中间路线。')),'');
  render();
}
function setPhysio(lv){
  if(!G.train) G.train={intensity:'标准', physio:1};
  G.train.physio=lv;
  log('🩹 理疗投入调整为 '+(lv===0?'0 级（不投入：省钱，但训练伤概率最高）':(lv===1?'标准理疗 · 25万/月':'顶级理疗 · 50万/月（训练伤概率再降，伤员每天多恢复 1 天）'))+'。费用在每月运营费里扣。','');
  render();
}
function trainCardHTML(){
  var t=G.train||{intensity:'标准', physio:1};
  var intens=['恢复调养','标准','高强度'].map(function(v){ return '<button class="btn sm '+(t.intensity===v?'pri':'')+'" onclick="setTrainIntensity(\''+v+'\')">'+v+'</button>'; }).join('');
  var phys=[0,1,2].map(function(lv){ return '<button class="btn sm '+((t.physio||0)===lv?'pri':'')+'" onclick="setPhysio('+lv+')">'+(lv===0?'不投入':(lv===1?'标准理疗 · 25万/月':'顶级理疗 · 50万/月'))+'</button>'; }).join('');
  return '<div class="card"><h3><span class="no">训练</span>训练与球员发展<span class="hint">重点定方向 · 强度定取舍 · 理疗定伤病</span></h3>'
  +'<p class="desc">训练重点在上面阵容卡里选（进攻演练/防守体系/体能储备/青训提拔）。这里定<b>强度</b>和<b>理疗投入</b>：高强度让成长 ×1.5、年轻人涨得更快，但体能消耗、训练伤、比赛伤和老将掉状态全都变多；恢复调养正好反过来。年龄、主教练风格、训练基地、医疗中心和理疗投入一起决定谁涨球、谁受伤——永远在「现在多练」和「以后还有人用」之间取舍。</p>'
  +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;"><span class="mini">训练强度：</span>'+intens+'</div>'
  +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span class="mini">理疗投入：</span>'+phys+'</div>'
  +'<p class="mini" style="margin-top:8px;">当前生效：强度「'+t.intensity+'」· 理疗 '+(t.physio||0)+' 级（每级让训练伤概率 -5%）· 训练基地 '+G.fac.training+' 级 · 医疗中心 '+G.fac.medical+' 级 · 主教练 '+esc(G.coach.name)+'（'+G.coach.spec+'）· 数据分析中心 '+(G.fac.data||0)+' 级</p></div>';
}

/* ---- 4. 数据球探与情报 ---- */
function fitScore(p){
  var F=FORMATIONS[G.formation||'4-3-3']||FORMATIONS['4-3-3'];
  var need={'门将':1,'后卫':F.DF,'中场':F.MF,'前锋':F.FW};
  var have={}; G.squad.forEach(function(q){ have[q.pos]=(have[q.pos]||0)+1; });
  var gap=(need[p.pos]||3)-(have[p.pos]||0);
  var starters=G.squad.slice().sort(function(a,b){ return b.ab-a.ab; }).slice(0,11);
  var avgAb=starters.length? starters.reduce(function(s2,q){ return s2+q.ab; },0)/starters.length : 55;
  var score=55 + gap*7 + (p.ab-avgAb)*2.2 - Math.max(0,p.age-27)*1.6 - Math.max(0,p.wage-6)*1.2 + (p.pot-p.ab)*0.9;
  return Math.round(clamp(score,5,99));
}
function scoutReportFor(p){ if(!G || !G.scout || !p) return null; return G.scout.reports[p.name]||null; }
function makeReport(p){
  var lv=scoutLevel();
  var spread=Math.max(0, 9-lv*2); // 完整度越高，潜力区间越窄：1 级 ±7，3 级 ±3，5 级起精确
  var risks=[];
  if(p.age>=31) risks.push('年龄偏大，状态下滑风险高，买的是即战力');
  if(p.age>=29 && p.pot<=p.ab) risks.push('已过巅峰，没有成长空间');
  if(p.wage>=10) risks.push('工资高，会抬高更衣室薪资结构');
  if(p.pot-p.ab>=14) risks.push('成长空间大，但需要出场时间喂，买回来坐板凳会废');
  if(!risks.length) risks.push('暂无明显风险点');
  var verdict= p.price!=null? (p.price<p.value*0.92? '挂牌价低于身价，属于被低估' : (p.price>p.value*1.25? '挂牌价明显溢价，慎重' : '价格与身价基本匹配')) : '';
  return {lv:lv, potLo:Math.max(p.ab, p.pot-spread), potHi:p.pot+(spread>0? Math.round(spread/2):0), fit:fitScore(p), risks:risks, verdict:verdict, month:G.month};
}
function scoutPlayer(i){
  var p=G.market[i]; if(!p) return;
  if(!G.scout) G.scout={reports:{}, used:0, mission:null};
  if(G.scout.reports[p.name]){ toast('已经有 '+p.name+' 的球探报告了'); return; }
  if(G.scout.used>=3){ toast('球探本月已经出了 3 份报告，下个月再来——情报也是要花时间的'); return; }
  if(G.cash<8){ toast('球探差旅费 8万，现金不够'); return; }
  G.cash-=8; G.scout.used++;
  var r=makeReport(p); G.scout.reports[p.name]=r;
  log('🔭 球探报告：'+p.name+'（'+p.pos+'）—— 适配度 '+r.fit+'/100，真实潜力约 '+r.potLo+'~'+r.potHi+'（报告完整度 '+r.lv+' 级）。'+r.verdict+'。','');
  toast('报告到手：'+p.name+' 适配度 '+r.fit+'/100');
  render();
}
function scoutMission(region){
  if(!G.scout) G.scout={reports:{}, used:0, mission:null};
  if(G.scout.mission){ toast('球探已经在外考察了，等他下个月回来'); return; }
  var cost= region==='国内'? 30 : 60;
  if(G.cash<cost){ toast('考察经费 '+cost+'万，现金不够'); return; }
  G.cash-=cost;
  G.scout.mission={region:region, due:G.month+1};
  log('✈️ 球探团队出发去'+region+'考察（经费 '+fmt(cost)+'），下个月带回 1~2 名独家候选，附完整报告。','');
  render();
}
function scoutMissionArrive(){
  if(!G.scout || !G.scout.mission) return;
  if(G.month < G.scout.mission.due) return;
  var region=G.scout.mission.region; G.scout.mission=null;
  var n=ri(1,2), names=[];
  for(var i=0;i<n;i++){
    var p= region==='国内'? genPlayer(Math.random()<0.5?'young':'good') : genPlayer('star');
    if(region!=='国内' && p.ab<66) p.ab=ri(66,78);
    p.price=Math.round(p.value*rnd(0.95,1.15));
    G.market.unshift(p);
    G.scout.reports[p.name]=makeReport(p);
    names.push(p.name+'（'+p.pos+' · 能力 '+p.ab+' · 潜力 '+p.pot+'）');
  }
  log('✈️ 球探从'+region+'回来了，带回独家候选：'+names.join('、')+'，已置顶放进转会市场，报告一并附上。','good');
}

/* ---- 2. 转会策略与足球总监 ---- */
var DIRECTOR_MODES=[
  {id:'manual', nm:'手动引援', ds:'一切你说了算，足球总监只看不动手。适合每笔钱都要自己拍板的人。'},
  {id:'star', nm:'巨星路线', ds:'每月结算后，总监自动追市场里能力最高的球员（保留 300万 保底现金）；收到高于身价 35% 的报价也会自动卖。没首席球探把关时，每笔自动签约有 20% 概率看走眼（能力 -2）。'},
  {id:'youth', nm:'青训低买高卖', ds:'每月结算后，总监专挑 20 岁以下、潜力 ≥75 的最便宜苗子自动签下（保留 200万 保底现金）；高价报价同样自动卖。买回来靠训练和青训练出来，涨了身价再卖——低买高卖的循环。'},
  {id:'none', nm:'零引援', ds:'关窗锁门：不买任何人，买人按钮直接锁住。只靠原班人马 + 青训提拔过日子，卖人和提拔不受影响。最省钱，也最考验耐心。'}
];
function setDirectorMode(m){
  if(!G.director) G.director={mode:'manual'};
  G.director.mode=m;
  var d=DIRECTOR_MODES.filter(function(x){ return x.id===m; })[0];
  log('🧭 建队策略切换为「'+d.nm+'」：'+d.ds,'');
  toast('建队策略：'+d.nm); render();
}
function directorAct(){
  if(!G.director || G.director.mode==='manual' || G.director.mode==='none') return;
  if(G.board && G.board.frozen>0) return;
  if(G.squad.length<22){
    if(G.director.mode==='star'){
      var best=null; G.market.forEach(function(p){ if(!best || p.ab>best.ab) best=p; });
      if(best && G.cash>best.price+300){
        G.cash-=best.price; best.cost=best.price; best.signNote='';
        var idx=G.market.indexOf(best); if(idx>=0) G.market.splice(idx,1);
        G.squad.push(best);
        if(!hasScout() && Math.random()<0.2){ best.ab=Math.max(40,best.ab-2); best.value=Math.round(Math.max(5,Math.pow(Math.max(best.ab-38,2),2)*0.16*(best.age>30?0.75:1))); log('🧭 足球总监签下 '+best.name+'（签约费 '+fmt(best.cost)+'），但没有首席球探把关，看走眼了：实际能力只有 '+best.ab+'。','bad'); }
        else log('🧭 足球总监按「巨星路线」自动签下 '+best.name+'（能力 '+best.ab+'），签约费 '+fmt(best.cost)+'。','good');
      }
    } else if(G.director.mode==='youth'){
      var cand=null; G.market.forEach(function(p){ if(p.age<=20 && p.pot>=75 && (!cand || p.price<cand.price)) cand=p; });
      if(cand && G.cash>cand.price+200){
        G.cash-=cand.price; cand.cost=cand.price; cand.signNote='';
        var idx2=G.market.indexOf(cand); if(idx2>=0) G.market.splice(idx2,1);
        G.squad.push(cand);
        log('🧭 足球总监按「低买高卖」自动签下小将 '+cand.name+'（'+cand.age+' 岁，潜力 '+cand.pot+'），签约费 '+fmt(cand.cost)+'。练出来就是利润。','good');
      }
    }
  }
  if(G.offers && G.squad.length>15){
    for(var i=0;i<G.offers.length;i++){
      var o=G.offers[i];
      if(o.price>o.player.value*1.35){
        var ix=G.squad.indexOf(o.player); if(ix<0) continue;
        G.cash+=o.price; G.squad.splice(ix,1); G.offers.splice(i,1);
        log('🧭 足球总监自动接受高价报价：'+o.player.name+' 以 '+fmt(o.price)+' 离队（身价 '+fmt(o.player.value)+'，溢价 35% 以上，落袋为安）。','good');
        break;
      }
    }
  }
}
function directorCardHTML(){
  var mode=(G.director&&G.director.mode)||'manual';
  var cur=DIRECTOR_MODES.filter(function(m){ return m.id===mode; })[0];
  var btns=DIRECTOR_MODES.map(function(m){ return '<button class="btn sm '+(mode===m.id?'pri':'')+'" onclick="setDirectorMode(\''+m.id+'\')">'+m.nm+'</button>'; }).join('');
  return '<div class="card"><h3><span class="no">建队</span>转会策略与足球总监<span class="hint">当前：'+cur.nm+'</span></h3>'
  +'<p class="desc">'+cur.ds+'</p>'
  +'<div style="display:flex;gap:8px;flex-wrap:wrap;">'+btns+'</div>'
  +'<p class="mini" style="margin-top:8px;">四条建队路线：自己动手、赌巨星、赌青训低买高卖、或者干脆零引援只靠原班人马和青训。总监的眼光取决于球探团队——首席球探在队，总监从不看走眼；不在队，自动签约有翻车风险。想先看清再下手，就去「数据球探」页拿报告。</p></div>';
}

/* ---- 5+6. 更衣室与球员关系 ---- */
function talkPlayer(name){
  var p=playerByName(name); if(!p) return;
  if(p.talkM===G.month){ toast('本月已经和 '+name+' 谈过了'); return; }
  p.talkM=G.month;
  p.mood=clamp((p.mood||60)+8,0,100); p.trust=clamp((p.trust||55)+4,0,100);
  log('💬 你和 '+name+' 一对一谈了一次：出场、待遇、未来，他都说了，你也给了回应。他的心情 +8、信任 +4（现在心情 '+p.mood+'、信任 '+p.trust+'）。','');
  render();
}
function promisePlayer(name){
  var p=playerByName(name); if(!p) return;
  if(p.promise){ toast(name+' 身上已经有一个承诺在等着兑现了'); return; }
  p.promise={need:2, due:G.month+1, base:p.played||0};
  p.mood=clamp((p.mood||60)+6,0,100); p.trust=clamp((p.trust||55)+3,0,100);
  log('🤝 你向 '+name+' 承诺：下个月至少让他首发 2 场。承诺记在他心里——兑现了信任大涨，食言了整个更衣室都会看不起你。','');
  render();
}
function renewPlayer(name){
  var p=playerByName(name); if(!p) return;
  var fee=Math.round(p.wage*6);
  if(G.cash<fee){ toast('续约签字费 '+fmt(fee)+'，现金不够'); return; }
  G.cash-=fee;
  p.wage=Math.round(p.wage*1.2*10)/10;
  p.trust=clamp((p.trust||55)+20,0,100); p.mood=clamp((p.mood||60)+15,0,100);
  p.value=Math.round(p.value*1.1);
  p.renewedUntil=G.month+3;
  log('✍️ '+name+' 续约完成：签字费 '+fmt(fee)+'，月薪涨到 '+p.wage+'万，身价 +10% → '+fmt(p.value)+'。未来 3 个月不会有球队报价挖他，他的信任 +20、心情 +15。','good');
  render();
}
function processPromises(){
  G.squad.forEach(function(p){
    if(p.promise && G.month>=p.promise.due){
      var played=(p.played||0)-(p.promise.base||0);
      if(played>=p.promise.need){ p.trust=clamp((p.trust||55)+15,0,100); p.mood=clamp((p.mood||60)+10,0,100); log('✅ 承诺兑现：'+p.name+' 上个月首发了 '+played+' 场，你说话算话。他的信任 +15、心情 +10，更衣室都看在眼里。','good'); }
      else { p.trust=clamp((p.trust||55)-25,0,100); p.mood=clamp((p.mood||60)-20,0,100); G.morale=clamp(G.morale-3,5,100); log('❌ 承诺食言：你答应给 '+p.name+' 至少 '+p.promise.need+' 次首发，实际只有 '+played+' 次。他的信任 -25、心情 -20，全队士气 -3——球员记承诺，也记仇。','bad'); }
      p.promise=null;
    }
  });
}
function monthlySystems(){
  processPromises();
  // 更衣室心情月结：能力靠前却打不上比赛的人会一直不满，长期不满拖全队士气
  var sorted=G.squad.slice().sort(function(a,b){ return b.ab-a.ab; });
  var unhappy=[];
  G.squad.forEach(function(p){
    var mp=(p.played||0)-(p.playedSnap||0); p.playedSnap=p.played||0;
    var rank=sorted.indexOf(p);
    if(mp===0 && rank>=0 && rank<14 && !(p.inj>0)) p.mood=clamp((p.mood||60)-6,0,100);
    if(mp>=2) p.mood=clamp((p.mood||60)+3,0,100);
    if(p.trust==null) p.trust=55;
    p.trust=clamp(p.trust+(p.trust<55?1:(p.trust>55?-1:0)),0,100);
    if((p.mood||60)<35) unhappy.push(p.name);
  });
  if(unhappy.length){ G.morale=clamp(G.morale-unhappy.length*2,5,100); log('😤 更衣室有 '+unhappy.length+' 名球员心情低落（'+unhappy.join('、')+'），全队士气 -'+(unhappy.length*2)+'。去阵容页的「更衣室」找他们谈话、给首发承诺，或者用轮换让他们上场。','bad'); }
  // 董事会耐心月结：看排名与声望；耗尽会冻结下个月预算
  var b=G.board;
  if(b){
    var rank=myRank();
    var delta= rank<=2?6 : (rank<=4?2 : (rank>=7?-8 : -2));
    if(G.rep>=60) delta+=2;
    b.patience=clamp((b.patience==null?70:b.patience)+delta,0,100);
    if(b.frozen>0) b.frozen--;
    if(b.patience<=0){ b.frozen=1; b.patience=35; G.rep=clamp(G.rep-3,0,100); log('🏛️ 董事会耐心耗尽！董事会冻结下个月的引援与设施预算，并公开质疑了你的执教（声望 -3）。先把成绩打回来，再谈花钱。','bad'); }
    else if(b.patience<30) log('🏛️ 董事会耐心只剩 '+b.patience+'：再不拿出成绩，下个月的预算可能被冻结。发布会上低调一点、把球赢下来，都能续命。','bad');
  }
}
function dressingCardHTML(){
  var rows=G.squad.slice().sort(function(a,b){ return (a.mood||60)-(b.mood||60); }).map(function(p){
    var mood=p.mood||60, trust=p.trust||55;
    return '<div class="item"><div class="grow"><div class="nm">'+esc(p.name)+' '+posPill(p.pos)+(p.promise?' <span class="pill">🤝 承诺待兑现</span>':'')+(p.renewedUntil&&p.renewedUntil>G.month?' <span class="pill up">已续约</span>':'')+'</div>'
    +'<div class="meta">心情 '+mood+'/100'+(mood<35?' <b style="color:var(--red)">低落 · 在拖士气</b>':'')+' · 信任 '+trust+'/100 · 本赛季出场 '+(p.played||0)+' 次 · 月薪 '+p.wage+'万</div></div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;"><button class="btn sm" onclick="talkPlayer(\''+esc(p.name)+'\')">一对一谈话</button><button class="btn sm" onclick="promisePlayer(\''+esc(p.name)+'\')">承诺首发</button><button class="btn sm" onclick="renewPlayer(\''+esc(p.name)+'\')">续约 · '+fmt(Math.round(p.wage*6))+'</button></div></div>';
  }).join('');

  +'<p class="desc">球员都记承诺、看待遇：<b>谈话</b>每月每人一次，心情 +8、信任 +4；<b>承诺首发</b>是下个月至少首发 2 场，兑现信任 +15、心情 +10，食言信任 -25、心情 -20 还拖全队士气；<b>续约</b>花签字费（月薪 ×6）换工资 +20%、信任 +20、身价 +10%，3 个月内不被报价挖走。能力排前 14 却整月没上场的人，心情每月 -6；心情掉到 35 以下，每人每月拖全队士气 -2。用谈话、承诺、续约和轮换，把派系不满压在冒头之前。</p>'+rows+'</div>';
}

/* ---- 3. 董事会与城市运营 ---- */
function boardBudget(){
  var b=G.board; if(!b) return;
  var season=G.seasonsPlayed||0;
  if(b.budgetSeason===season){ toast('本赛季已经申请过预算了'); return; }
  b.budgetSeason=season;
  if(b.patience>=60){ var amt=ri(200,400); G.cash+=amt; log('🏛️ 董事会预算申请通过：追加运营预算 '+fmt(amt)+'。董事会说：成绩摆在那儿，这钱批得痛快。','good'); }
  else if(b.patience>=40){ var amt2=ri(100,200); G.cash+=amt2; b.patience=clamp(b.patience-3,0,100); log('🏛️ 董事会勉强批了 '+fmt(amt2)+' 预算，但撂下话：下赛季要看到回报（耐心 -3）。',''); }
  else { b.patience=clamp(b.patience-5,0,100); log('🏛️ 预算申请被驳回：“先把成绩打出来，再来谈钱。”董事会耐心 -5。先赢球，再开口。','bad'); }
  render();
}
function boardFacGrant(){
  var b=G.board; if(!b) return;
  var season=G.seasonsPlayed||0;
  if(b.facGrant){ toast('已经有一笔设施拨款没用，下一次升级自动半价'); return; }

  if(b.patience>=50){ b.facGrant=true; log('🏛️ 设施拨款申请通过：下一次设施升级半价，董事会出一半。去俱乐部页升级任意设施时自动抵扣。','good'); }
  else { b.patience=clamp(b.patience-4,0,100); log('🏛️ 设施拨款被驳回：董事会耐心只有 '+b.patience+'，觉得你应该先证明自己（耐心 -4）。','bad'); }
  render();
}
function cityAct(kind){
  var b=G.board; if(!b) return;
  var season=G.seasonsPlayed||0;
  if(kind==='carnival'){
    if(G.cash<60){ toast('嘉年华经费 60万，现金不够'); return; }
    G.cash-=60; b.cityRep=clamp(b.cityRep+5,0,100); G.fans+=2000; G.rel.fans=clamp(G.rel.fans+3,0,100);
    log('🎉 城市足球嘉年华办成了：球迷 +2,000、球迷会关系 +3、城市声望 +5 → '+b.cityRep+(b.cityRep>=60?'（门票 +5% 已生效）':'（到 60 解锁门票 +5%）')+'。','good');
  } else if(kind==='invitational'){
    if(b.citySeason===season){ toast('本赛季已经办过大型赛事了'); return; }
    if(G.cash<120){ toast('邀请赛成本 120万，现金不够'); return; }
    G.cash-=120; b.citySeason=season;

    alt:'《豪门缔造者》游戏创作者宣传海报：游戏创作者邓元元',
    cap:'游 戏 创 作 者 ：邓 元 元' }
];
function posterById(id){ for(var i=0;i<POSTERS.length;i++){ if(POSTERS[i].id===id) return POSTERS[i]; } return null; }
/* 海报加载兜底：偶发加载失败（弱网/缓存异常）时自动带参数重拉，最多两次；
   两次都失败就把图淡化而不是留一块死黑——三张海报文件本身都在 assets 里，
   入口流程开始前还会先预加载一遍，正常情况下弹窗打开时图已经在缓存里。 */
function posterImgErr(img){
  var n=parseInt(img.getAttribute('data-r')||'0',10);
  if(n<2){ img.setAttribute('data-r',String(n+1)); var s=(img.getAttribute('src')||'').split('?')[0]; img.src=s+'?r='+(n+1); }
  else { img.style.opacity='0.3'; }
}
function preloadPosters(){ POSTERS.forEach(function(p){ var im=new Image(); im.src=p.src; }); }
function posterDeleted(p){ try{ return localStorage.getItem(p.delKey)==='1'; }catch(e){ return false; } }
function setPosterDeleted(p, del){
  try{ if(del) localStorage.setItem(p.delKey,'1'); else localStorage.removeItem(p.delKey); }catch(e){}
}
var posterQueue=[], posterThenStart=false, curPosterId='';
function startPosterChain(thenStart){
  // 每次进游戏都跑：把还没被删除的海报按顺序排队，逐张弹出；全删了就直接走后面的流程。
  preloadPosters();
  posterThenStart=!!thenStart;
  posterQueue=POSTERS.filter(function(p){ return !posterDeleted(p); });
  nextPoster();
}
function nextPoster(){
  var p=posterQueue.shift();
  if(!p){ endPosterChain(); return; }
  curPosterId=p.id;
  var r=document.getElementById('creator-root');
  if(!r){ endPosterChain(); return; }
  var last=posterQueue.length===0;
  r.innerHTML='<div class="creator-overlay" role="dialog" aria-modal="true" aria-label="'+p.name+'">'
  +'<div class="creator-card">'
  +'<button type="button" class="creator-close" aria-label="永久删除这张海报" title="永久删除这张海报" onclick="deleteCurrentPoster()">✕</button>'
  +'<img src="'+p.src+'" alt="'+p.alt+'" onerror="posterImgErr(this)" />'
  +'<div class="creator-hint">'+p.cap+'</div>'
  +'<div class="creator-del-note">点右上角 ✕ 永久删除这张海报（删了不再自动弹，可在大厅「海报墙」恢复）</div>'
  +'<button type="button" class="creator-next" onclick="nextPoster()">'+(last?(posterThenStart?'去开局 ›':'进入游戏 ›'):'下一张 ›')+'</button>'
  +'</div></div>';
}
function deleteCurrentPoster(){
  // 点 ✕ = 永久删除当前这张海报（只删这一张），然后接着弹下一张。
  var p=posterById(curPosterId);
  if(p){ setPosterDeleted(p,true); toast('已永久删除「'+p.name+'」，大厅海报墙里可恢复'); }
  nextPoster();
}
function endPosterChain(){
  var r=document.getElementById('creator-root');
  if(r) r.innerHTML='';
  curPosterId='';
  if(posterThenStart){ posterThenStart=false; showStart(false); return; } // 新玩家：海报看完再进开局界面
  chainSignAfterPoster();
}
function chainSignAfterPoster(){
  // 海报流程走完后，接着弹每周签到。只在当天还没领时弹：已领过 signCan() 为 false，不会重复弹。
  if(typeof G!=='undefined' && G && G.started && !G.ended && signCan()) showWeeklySign(false);
}
/* ---------------- 海报墙（大厅入口）：三张海报随时查看，已删除的可恢复 ---------------- */
function showPosterWall(){
  var items=POSTERS.map(function(p){
    var del=posterDeleted(p);
    return '<div class="item pw-item">'
    +'<img src="'+p.src+'" alt="'+p.alt+'" onerror="posterImgErr(this)" onclick="viewPoster(\''+p.id+'\')" />'
    +'<div class="grow"><div class="nm">'+p.name+'</div>'
    +'<div class="meta">'+(del?'已删除 · 进游戏时不再自动弹出':'每次进游戏都会弹出 · 点图片放大看')+'</div></div>'
    +(del?'<button class="btn pri sm" onclick="restorePoster(\''+p.id+'\')">恢复</button>'
         :'<button class="btn sm" onclick="wallDeletePoster(\''+p.id+'\')">删除</button>')
    +'</div>';
  }).join('');
  $modal.innerHTML='<div class="overlay"><div class="modal">'
  +'<div class="hero"><div class="big" style="font-size:23px;">🖼️ 海报墙</div><div class="sub">三张海报都在这里 · 已删除的点「恢复」，下次进游戏就会重新弹出</div></div>'
  +'<div class="body">'+items+'</div>'
  +'<div class="foot"><button class="btn" onclick="closeModal()">关闭</button></div></div></div>';
}
function viewPoster(id){
  var p=posterById(id); if(!p) return;
  $modal.innerHTML='<div class="tribute-overlay" role="dialog" aria-modal="true" aria-label="'+p.name+'">'
  +'<div class="tribute-card">'
  +'<button type="button" class="creator-close" aria-label="返回海报墙" title="返回海报墙" onclick="showPosterWall()">✕</button>'
  +'<img src="'+p.src+'" alt="'+p.alt+'" onerror="posterImgErr(this)" />'
  +'<div class="tribute-cap">'+p.cap+'</div>'
  +'</div></div>';
}
function restorePoster(id){
  var p=posterById(id); if(!p) return;
  setPosterDeleted(p,false);
  toast('已恢复「'+p.name+'」，下次进游戏会重新弹出');
  showPosterWall();
}
function wallDeletePoster(id){
  var p=posterById(id); if(!p) return;
  setPosterDeleted(p,true);
  toast('已删除「'+p.name+'」，进游戏时不再弹出');
  showPosterWall();
}
/* ---------------- 启动：优先自动读档 ----------------
   ⚠️ 启动必须等整个文档解析完（DOMContentLoaded）再跑，绝不能在本脚本块里
   立刻执行：大厅 render() 要用 ensureBiz() / bizValue()，它们定义在后面的
   「深度经营」脚本块里；本脚本块执行时那个脚本块还没跑，直接启动会报
   「ensureBiz is not defined」——有存档时首屏渲染必炸，启动 try/catch 里的
   二次抢救再渲染还是同一个错，于是黑屏 + 看门狗修复面板，点哪个按钮刷新
   都是同样的死循环（新玩家路径在 render 里提前返回、不用 ensureBiz，所以
   空存档看起来正常，偏偏老玩家进不去）。等 DOMContentLoaded 时全部脚本块
   都已执行完，顺序问题不复存在。
   整个启动包在 try 里：万一读档 / 首屏渲染还是报错，也不能白屏、更不能清档——
   原始存档先原样备份到 SAVE_KEY+'-bak'，然后做「二次抢救」：重新读档、强制回
   大厅再渲染一次；连抢救都失败才进开局界面，但自动存档一个字都不删，原样留在
   本机（玩家手动点「清除存档」或之后版本修好，都还能接着用）。 */
function hmBoot(){
try{
  if(loadAutoSave()){
    PAGE='home';
    render();
    toast('💾 已自动读取上次存档：'+G.club+' · 第 '+G.month+' 个月，接着玩！');
    startPosterChain(false); // 每次进游戏：未删除的海报依次全弹（C罗 → 梅西 → 游戏创作者），然后接每周签到
  } else {
    render();
    startPosterChain(true); // 新玩家：先依次看完未删除的海报，再进开局界面
  }
  window.__hmBooted=true;
}catch(bootErr){
  try{
    var badRaw=null;
    try{ badRaw=localStorage.getItem(SAVE_KEY); }catch(e1){}
    if(badRaw){ try{ localStorage.setItem(SAVE_KEY+'-bak', badRaw); }catch(e2){} }
    var rescued=false;
    try{ rescued=loadAutoSave(); }catch(e3){ rescued=false; }
    if(rescued){
      PAGE='home';
      render();
      toast('💾 已自动读取上次存档：'+G.club+' · 第 '+G.month+' 个月，接着玩！');
      startPosterChain(false);
    } else {
      /* 抢救失败也绝不自动清档：存档原样保留，只进开局界面兜底显示。 */
      G=null; PAGE='home';
      render();
      startPosterChain(true);
      toast('⚠️ 这次没能读出旧存档，但它还完整保存在本机、没有被删除。退出重开一次通常就能恢复。');
    }
    window.__hmBooted=true;
  }catch(fallbackErr){ /* 看门狗接管，显示一键修复面板 */ }
}
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', hmBoot); }
else{ hmBoot(); }
</script>

function ensureBiz(){
  if(!G) return;
  if(!G.biz || typeof G.biz!=='object') G.biz=defaultBiz();

  if(!G.biz.cross || typeof G.biz.cross!=='object') G.biz.cross={};
}
function bizValue(){

}

function dealDef(id){ return DEAL_BRANDS.filter(function(d){ return d.id===id; })[0]; }
function signDeal(id){
  ensureBiz();
  if(!gateOK('deals')){ toast('还没解锁品牌合作'); return; }
  var d=dealDef(id); if(!d) return;
  if(G.biz.deal){ toast('已有合同在身：先等到期，或解约后再签新的'); return; }
  if(G.rep<d.rep){ toast(d.name+' 要求声望 ≥ '+d.rep+'（当前 '+G.rep+'），先把声望打上去'); return; }
  G.cash+=d.signFee;
  G.biz.deal={id:id, annual:d.annual, bonus:d.bonus, years:d.years, left:d.years*12};

function renewDeal(){
  ensureBiz(); var dl=G.biz.deal; if(!dl) return;
  var d=dealDef(dl.id); if(!d) return;

  log('🤝 与 '+d.name+' 续约 '+d.years+' 年：续约费 +'+fmt(fee)+(bump?'，声望涨了，年费上浮 15% 到 '+fmt(dl.annual):'，年费维持 '+fmt(dl.annual))+'，合同期延长到还剩 '+dl.left+' 个月。','good');

}

  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--green)"></span>跨行业累计净收益</div><div class="vl num" style="'+((b.crossCum||0)<0?'color:var(--red)':'')+'">'+((b.crossCum||0)>=0?'+':'')+fmt(b.crossCum||0)+'</div><div class="sub">赚赔都已进俱乐部账目</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--blue)"></span>上月合计净额</div><div class="vl num" style="'+((b.crossNet||0)<0?'color:var(--red)':'')+'">'+((b.crossNet||0)>=0?'+':'')+fmt(b.crossNet||0)+'</div><div class="sub">全部行业上月盈亏合计</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--gold)"></span>跨行业资产估值</div><div class="vl num">'+fmt(Object.keys(b.cross).reduce(function(s,id){ var c=b.cross[id]; return s+Math.round((c.invested||0)*(0.75+0.2*c.lv)); },0))+'</div><div class="sub">已计入俱乐部总估值</div></div>'
  +'</div>'
  +'<div class="card"><h3><span class="no">跨界</span>跨行业经营<span class="hint">点「进入经营」看单个行业的月度账本</span></h3><div class="rel-grid">'+cards+'</div></div>';
}
function crossDetailHTML(id){
  var d=crossDef(id), c=G.biz.cross[id]; if(!d || !c) return '';
  var back=Math.round(c.invested*0.8 + Math.max(0,c.cum)*0.3);
  var hist=(c.hist&&c.hist.length)? c.hist.map(function(h){ return '<div class="item"><div class="grow"><div class="nm" style="font-weight:600;">'+h.m+'</div></div><b class="num" style="color:'+(h.net>=0?'var(--green-d)':'var(--red)')+'">'+(h.net>=0?'+':'')+fmt(h.net)+'</b></div>'; }).join('') : '<p class="desc">还没有月度账目——推进一个月后，这里会逐月记下这个行业的盈亏。</p>';
  var upCost=Math.round(d.cost*0.75*c.lv);
  return '<div style="margin-bottom:10px;"><button class="btn sm" onclick="CROSS_SEL=null;render();window.scrollTo(0,0);">← 全部行业</button></div>'
  +'<div class="card"><h3>'+d.icon+' '+d.name+'<span class="hint">'+c.lv+' 级规模 · 独立核算</span></h3><p class="desc">'+d.desc+'</p>'
  +'<div class="kpis" style="margin:0 0 6px;">'
  +'<div class="kpi"><div class="lb">累计投入</div><div class="vl num">'+fmt(c.invested)+'</div><div class="sub">开业 + 历次扩店</div></div>'
  +'<div class="kpi"><div class="lb">累计净收益</div><div class="vl num" style="'+(c.cum<0?'color:var(--red)':'')+'">'+(c.cum>=0?'+':'')+fmt(c.cum)+'</div><div class="sub">开业以来赚赔总账</div></div>'
  +'<div class="kpi"><div class="lb">上月净额</div><div class="vl num" style="'+(c.lastNet<0?'color:var(--red)':'')+'">'+(c.lastNet>=0?'+':'')+fmt(c.lastNet)+'</div><div class="sub">月固定支出约 '+fmt(Math.round(d.up*(1+0.3*(c.lv-1))))+'</div></div>'
  +'<div class="kpi"><div class="lb">退出回款价</div><div class="vl num">'+fmt(back)+'</div><div class="sub">随时可卖，落袋为安</div></div>'
  +'</div>'
  +'<div class="acts">'+(c.lv>=3?'<span class="pill up">已顶级规模</span>':'<button class="btn pri sm" onclick="upgradeCross(\''+id+'\')">扩店升 '+(c.lv+1)+' 级 · '+fmt(upCost)+'</button>')+'<button class="btn sm" onclick="sellCross(\''+id+'\')">退出这个行业</button></div>'
  +'<p class="mini" style="margin-top:8px;">经营要点：扩店能放大收入盘子，也放大固定支出；行情差的月份可能亏钱，连亏时可以退出止损，盈利的行业退出时还能按累计利润加价回款。</p></div>'
  +'<div class="card"><h3><span class="no">账本</span>月度盈亏<span class="hint">每月结算后自动记账，最多保留近 8 个月</span></h3>'+hist+'</div>';
}
/* ---------------- 深度经营月度结算（月末随主账一起走） ---------------- */
function processBiz(){
  if(!G || !G.biz) return;
  var b=G.biz, notes=[], bizNet=0;
  /* 海外俱乐部：每月 3 场联赛 + 收入支出 + 青训出苗 */
  Object.keys(b.overseas||{}).forEach(function(id){
    var d=ovDef(id), c=b.overseas[id]; if(!d || !c) return;
    if(!c.squad) c.squad=[]; if(!c.youth) c.youth=[]; if(!c.results) c.results=[];
    var avg=ovAvgAb(c), w=0, dr=0, l=0, res=[];
    for(var i=0;i<3;i++){
      var pWin=clamp(0.34+(c.lv-1)*0.09+(avg-58)*0.012, 0.12, 0.72), r=Math.random();
      if(r<pWin){ res.push('胜'); w++; } else if(r<pWin+0.27){ res.push('平'); dr++; } else { res.push('负'); l++; }
      c.squad.forEach(function(p){ if(p.age<=24 && Math.random()<0.10 && p.ab<85) p.ab++; });
    }
    c.w+=w; c.d+=dr; c.l+=l;
    c.rank=clamp(c.rank + (l>=2? ri(0,2):0) - (w>=2? ri(0,2):0), 1, 10);
    c.results.unshift(G.year+'年'+G.mon+'月 · '+res.join(' ')+' · 第 '+c.rank+' 名');
    if(c.results.length>8) c.results.length=8;
    var inc=Math.round(ri(d.inc[0],d.inc[1])*(1+0.55*(c.lv-1))*(c.rank<=3?1.25:(c.rank>=8?0.8:1)));
    var up=Math.round(d.upkeep*(1+0.35*(c.lv-1)));
    var net=inc-up; c.lastNet=net; c.cumNet=(c.cumNet||0)+net; b.ovCum=(b.ovCum||0)+net; bizNet+=net;
    if(c.rank<=2 && Math.random()<0.3){ G.rep=clamp(G.rep+1,0,100); notes.push('🌍 '+d.club+' 在'+d.league+'高居第 '+c.rank+' 名，当地媒体报道母队 '+G.club+'，声望 +1。'); }
    if(c.youth.length<3 && Math.random()<0.30+0.06*c.lv){
      var yp=mkPlayer(pick(d.names), pick(POS), ri(50,60), ri(16,19), true);
      yp.pot=ri(74,90); yp.cost=0; yp.signNote=d.city+'青训输送';
      c.youth.push(yp);
      notes.push('🌍 '+d.club+' 青训营冒出苗子：'+yp.name+'（'+yp.pos+'，'+yp.age+' 岁，潜力 '+yp.pot+'），去海外俱乐部页可以把他输送回主队免签。');
    }
  });
  /* 自有品牌：销量与品牌价值 */
  var br=b.brand;
  if(br && br.founded){
    var bestAb=G.squad.length? G.squad.slice().sort(function(a2,b2){ return b2.ab-a2.ab; })[0].ab : 60;
    var starIn=br.star && G.squad.some(function(p){ return p.name===br.star; });
    var starOn=starIn && br.starUntil>=G.month;
    var expo=0.45 + G.fans/70000 + G.rep/130 + Math.max(0,(bestAb-60))/55 + (starOn?0.28:0);
    var vol=[1.35,1,0.6][br.price]||1, rev=[0.85,1.35,2.3][br.price]||1.35;
    var units=(br.lines.jersey*26 + br.lines.scarf*14 + br.lines.shoe*34);
    var sales=Math.round(units*expo*vol*rev*(br.mktUntil>=G.month?1.5:1));
    var bcost=Math.round(22 + (br.lines.jersey+br.lines.scarf+br.lines.shoe)*9 + (starOn?15:0));
    var bnet=sales-bcost;
    br.lastNet=bnet; br.cum=(br.cum||0)+bnet; bizNet+=bnet;
    var newTitle=(G.titles||0)>(br.lt||0);
    var growth=Math.round(bnet*0.5 + expo*22 + (newTitle?300:0));
    if(hasVent('brand')) growth=Math.round(growth*1.3);
    br.value=Math.max(50, Math.round((br.value||0)+growth));
    if(newTitle) notes.push('👕 球队夺冠，品牌「'+br.name+'」价值跳涨 +'+fmt(300)+'：冠军同款球衣卖断货了。');
    br.lt=G.titles||0;
  }
  /* 品牌合作：年费按月发 + 夺冠奖金 + 到期 */
  if(b.deal){
    var fee=Math.round(b.deal.annual/12);
    bizNet+=fee; b.dealCum=(b.dealCum||0)+fee;
    b.deal.left--;
    if(b.deal.left<=0){ var dn=dealDef(b.deal.id); notes.push('🤝 与 '+(dn? dn.name : '赞助商')+' 的合同到期结束。去品牌合作页续约或换一家更大的。'); b.deal=null; }
  }
  if((G.titles||0)>(b.dealTitles||0) && b.deal){
    var nb=(G.titles||0)-(b.dealTitles||0);
    var bonus=b.deal.bonus*nb;
    bizNet+=bonus; b.dealCum=(b.dealCum||0)+bonus;
    var dd=dealDef(b.deal.id);
    notes.push('🤝 夺冠奖金到账：'+(dd? dd.name : '赞助商')+' 按合同支付 '+fmt(bonus)+'，大字标题都帮你想好了。');
  }
  b.dealTitles=G.titles||0;
  /* 跨行业：逐个行业算月度盈亏，行情有波动 */
  var crossSum=0;
  Object.keys(b.cross||{}).forEach(function(id){
    var d=crossDef(id), c=b.cross[id]; if(!d || !c) return;
    if(!c.hist) c.hist=[];
    var net=Math.round(ri(d.inc[0],d.inc[1])*(1+0.55*(c.lv-1)) - d.up*(1+0.3*(c.lv-1)));
    if(Math.random()<0.07){ var wind=ri(150,400); net+=wind; notes.push('🏭 '+d.name+' 撞上风口：单月额外 +'+fmt(wind)+'，账面一下就好看了。'); }
    else if(Math.random()<0.05){ var loss=ri(80,200); net-=loss; notes.push('🏭 '+d.name+' 踩了个坑：单月额外 -'+fmt(loss)+'，做生意就是有赚有赔。'); }
    c.lastNet=net; c.cum=(c.cum||0)+net; b.crossCum=(b.crossCum||0)+net; crossSum+=net; bizNet+=net;
    c.hist.unshift({m:G.year+'年'+G.mon+'月', net:net});
    if(c.hist.length>8) c.hist.length=8;
  });
  b.crossNet=crossSum;
  if(bizNet!==0) G.cash+=bizNet;
  var hasBiz=Object.keys(b.overseas||{}).length || (br && br.founded) || b.deal || Object.keys(b.cross||{}).length;
  if(hasBiz) log('🏢 深度经营本月合计：'+(bizNet>=0?'+':'')+fmt(bizNet)+'（海外俱乐部 / 自有品牌 / 品牌合作 / 跨行业，明细在各自页面）。', bizNet>=0?'good':'bad');
  notes.forEach(function(n){ log(n,'good'); });
}
</script>
<script>
"use strict";
/* ================= 赛后战报 + 直播观赛 =================
   战报明细由比赛结算的那一刻、按已定的真实赛果生成（进球分钟、红黄牌、
   伤病、事件时间线、最佳球员、双方阵容与数据），挂在 result.detail 上随
   存档保存。直播观赛先用正式引擎把下一场结算掉，再把这份明细按分钟
   逐条放出来——所以直播里看到的比分、进球者与积分/射手榜结算完全一致，
   不存在看一场算一场。每场踢完把战报排进 pendingReports，推进动作结束
   后统一弹：单场弹完整战报，连推多场弹汇总（可逐场看详情），一场不丢。
   全自动模拟期间只攒不弹，停下时再出汇总。 */
var pendingReports=[], reportOpen=false, reportFromQueue=false, batchDepth=0, flushTries=0;
function queueMatchReport(result){ if(result && result.detail) pendingReports.push(result); if(result && result.detail && result.detail.res==='胜') noteMatchWin(); }
function flushReports(){
  if(reportOpen || !pendingReports.length || !G || G.ended) return;
  if($modal.innerHTML.trim()){ if(flushTries++<60) setTimeout(flushReports, 700); return; } // 有别的弹窗（如突发事件）先让它处理完
  flushTries=0; reportOpen=true; reportFromQueue=true;
  noteTitleWin();
  if(pendingReports.length===1) showReportDetail(pendingReports[0], false);
  else showReportSummary();
}
function closeReport(){
  reportOpen=false;
  if(reportFromQueue){ pendingReports=[]; reportFromQueue=false; }
  $modal.innerHTML='';
  maybeCelebPopup(); // 战报关掉后，若有赢球/夺冠限时礼包，顺势弹出来
}
function showReportSummary(){
  var rows=pendingReports.map(function(rec,i){
    var d=rec.detail; if(!d) return '';
    return '<div class="mr-row"><span class="pill '+(d.res==='胜'?'up':(d.res==='负'?'dn':''))+'">'+d.res+'</span><div class="grow"><div style="font-weight:700;" class="num">'+esc(G.club)+' '+d.gf+' : '+d.ga+' '+esc(d.opp)+'</div><div class="mini">'+d.dateTxt+(d.cup?' · 🏆 足协杯':' · 联赛')+(d.myGoals.length?' · 进球：'+d.myGoals.map(function(g){ return esc(g.name)+' '+g.min+'\''; }).join('、'):' · 无进球')+'</div></div><button class="btn sm" onclick="showQueuedReport('+i+')">详情</button></div>';
  }).join('');
  $modal.innerHTML='<div class="overlay"><div class="modal"><div class="hero"><div class="big" style="font-size:22px;">📋 比赛战报汇总</div><div class="sub">这段时间一共踢了 '+pendingReports.length+' 场，逐场结果都在这里，点「详情」看完整战报</div></div>'
  +'<div class="body"><div class="mr-list">'+rows+'</div></div>'
  +'<div class="foot"><button class="btn pri" onclick="closeReport()">关闭，继续经营</button></div></div></div>';
}
function showQueuedReport(i){ var rec=pendingReports[i]; if(rec && rec.detail) showReportDetail(rec, true); }
function showReportDetail(rec, fromList){
  var d=rec.detail; if(!d) return;
  $modal.innerHTML='<div class="overlay"><div class="modal"><div class="hero"><div class="big" style="font-size:22px;">📋 赛后战报</div><div class="sub">'+d.dateTxt+' · '+(d.cup?'🏆 足协杯':'联赛')+(d.tag?' · '+esc(d.tag):'')+'</div></div>'
  +'<div class="body">'+reportBodyHTML(rec)+'</div>'
  +'<div class="foot">'+(fromList?'<button class="btn" onclick="showReportSummary()">← 返回汇总</button>':'')+'<button class="btn pri" onclick="closeReport()">关闭，继续</button></div></div></div>';
}
function reportBodyHTML(rec){
  var d=rec.detail;
  var myG= d.myGoals.length? d.myGoals.map(function(g){ return '<div class="gl"><span class="mn num">'+g.min+'\'</span><span>⚽ '+esc(g.name)+'</span></div>'; }).join('') : '<div class="gl"><span class="mini">无进球</span></div>';
  var opG= d.oppGoals.length? d.oppGoals.map(function(g){ return '<div class="gl opp"><span>⚽ '+esc(g.name)+'</span><span class="mn num">'+g.min+'\'</span></div>'; }).join('') : '<div class="gl opp"><span class="mini">无进球</span></div>';
  var evs=d.events.map(function(e){
    var cls= e.type==='goal'?'goal':'';
    var icon= e.type==='goal'?'⚽': e.type==='yellow'?'🟨': e.type==='red'?'🟥': e.type==='injury'?'🚑': e.type==='chance'?'🎯': e.type==='sub'?'🔄': e.type==='pens'?'🎲': e.type==='ht'?'⏸️': e.type==='ft'?'🏁':'📣';
    return '<div class="mr-ev '+cls+'"><span class="mn num">'+e.min+'\'</span><span>'+icon+' '+esc(e.text)+'</span></div>';
  }).join('');
  var disc= d.cards.length? d.cards.map(function(c){ return (c.color==='红牌'?'🟥':'🟨')+' '+esc(c.name)+'（'+(c.side==='me'?esc(G.club):esc(d.opp))+'）'+c.min+'\' '+c.color; }).join('<br>') : '全场无红黄牌，踢得干净。';
  var injT= d.injuries.length? d.injuries.map(function(x){ return '🚑 '+esc(x.name)+'（'+x.min+'\' 受伤，预计缺阵约 '+x.days+' 天）'; }).join('<br>') : '双方均无新增伤病。';
  var poss=d.stats.poss;
  return '<div class="mr-score"><span class="tm">'+esc(G.club)+'</span><span class="sc num">'+d.gf+' : '+d.ga+'</span><span class="tm">'+esc(d.opp)+'</span></div>'
  +'<div style="text-align:center;"><span class="pill '+(d.res==='胜'?'up':(d.res==='负'?'dn':''))+'">'+d.res+'</span><span class="mini" style="margin-left:8px;">'+(d.home?'主场':'客场')+(rec.gate?' · 门票 +'+fmt(rec.gate):'')+'</span></div>'
  +'<div class="mr-sec"><h4>⚽ 进球时间</h4><div class="mr-goals"><div>'+myG+'</div><div>'+opG+'</div></div></div>'
  +(d.motm? '<div class="mr-sec"><h4>⭐ 全场最佳球员</h4><div style="font-size:14px;"><b>'+esc(d.motm.name)+'</b>（'+(d.motm.side==='me'?esc(G.club):esc(d.opp))+'）· 评分 <b class="num">'+d.motm.rating.toFixed(1)+'</b></div></div>' : '')
  +'<div class="mr-sec"><h4>📊 本场数据</h4><div class="mini" style="font-size:12.5px;line-height:1.9;">射门 '+d.stats.myShots+' : '+d.stats.oppShots+' · 射正 '+d.stats.myOT+' : '+d.stats.oppOT+' · 控球率 '+poss+'% : '+(100-poss)+'%</div></div>'
  +'<div class="mr-sec"><h4>🟨 红黄牌</h4><div style="font-size:13px;line-height:1.8;">'+disc+'</div></div>'
  +'<div class="mr-sec"><h4>🚑 伤病</h4><div style="font-size:13px;line-height:1.8;">'+injT+'</div></div>'
  +'<div class="mr-sec"><h4>🕐 关键事件时间线</h4>'+evs+'</div>';
}
function viewStoredReport(src, idx){
  var rec=null;
  if(src==='fx' && G && G.fixtures && G.fixtures[idx]) rec=G.fixtures[idx].result;
  if(src==='lr' && G && G.lastResults && G.lastResults[idx]) rec=G.lastResults[idx];
  if(!rec || !rec.detail){ toast('这场比赛没有详细战报（新版本之前踢的比赛只有比分）'); return; }
  reportOpen=true; reportFromQueue=false;
  showReportDetail(rec, false);
}
/* ---------------- 战报明细生成：只吃已结算的赛果，不碰任何结算数值 ---------------- */
function buildMatchDetail(o){
  var fx=o.fx||{};
  var oppName=o.oppName||fx.opp||'对手';
  var gf=o.gf, ga=o.ga;
  var oppPos=['门将','后卫','后卫','后卫','后卫','中场','中场','中场','前锋','前锋','前锋','中场','前锋','后卫'];
  var oppPool=[], usedN={};
  for(var i=0;i<oppPos.length;i++){
    var nm=randName(), tr=0;
    while(usedN[nm] && tr++<8) nm=randName();
    usedN[nm]=1; oppPool.push({name:nm, pos:oppPos[i]});
  }
  function oppAttacker(){ var c=oppPool.filter(function(p){ return p.pos==='前锋'||p.pos==='中场'; }); return pick(c.length?c:oppPool); }
  var usedMin={};
  function goalMin(){ var m, t=0; do{ m=ri(2,90); }while(usedMin[m] && t++<12); usedMin[m]=1; return m; }
  var lineupNames=(o.lineup||[]).map(function(s){ return s.p.name; });
  var myGoals=(o.myScorers||[]).map(function(n){ return {name:n, min:goalMin()}; });
  while(myGoals.length<gf && lineupNames.length) myGoals.push({name:pick(lineupNames), min:goalMin()});
  myGoals.sort(function(a,b){ return a.min-b.min; });
  var oppGoals=[];
  for(var gi=0; gi<ga; gi++) oppGoals.push({name:oppAttacker().name, min:goalMin()});
  oppGoals.sort(function(a,b){ return a.min-b.min; });
  var evs=[{min:0, type:'info', key:false, side:'', text:'比赛开始！'+G.club+(fx.home?'坐镇主场迎战':'客场挑战')+oppName+'。'}];
  var myAtt=(o.lineup||[]).filter(function(s){ return s.slot==='前锋'||s.slot==='中场'; }).map(function(s){ return s.p.name; });
  function myShooter(){ return pick(myAtt.length?myAtt:(lineupNames.length?lineupNames:[G.club])); }
  var chanceTxt=['的射门被对方门将奋力扑出','的头球攻门稍稍偏出立柱','的远射擦着横梁飞出底线','的单刀被门将用脚挡出','的凌空抽射打在边网上','的任意球绕过人墙，可惜高出横梁','的低射被后卫在门线上解围','的推射滑门而过，看台上一片叹息'];
  var myCh=ri(2,6), oppCh=ri(2,5), ci2;
  for(ci2=0; ci2<myCh; ci2++) evs.push({min:ri(3,89), type:'chance', side:'me', key:true, text:myShooter()+pick(chanceTxt)+'。'});
  for(ci2=0; ci2<oppCh; ci2++) evs.push({min:ri(3,89), type:'chance', side:'opp', key:true, text:oppAttacker().name+pick(chanceTxt)+'。'});
  var cards=[], nCards=ri(0,4);
  for(ci2=0; ci2<nCards; ci2++){
    var cSide=Math.random()<0.5?'me':'opp';
    var cWho= cSide==='me'? pick(lineupNames.length?lineupNames:[G.club]) : pick(oppPool).name;
    var isRed=Math.random()<0.10, cm=ri(8,88);
    cards.push({min:cm, side:cSide, name:cWho, color:isRed?'红牌':'黄牌'});
    evs.push({min:cm, type:isRed?'red':'yellow', side:cSide, key:true, text:(cSide==='me'?G.club:oppName)+'的 '+cWho+' 吃到'+(isRed?'红牌，被直接罚下！':'一张黄牌')+'。'});
  }
  cards.sort(function(a,b){ return a.min-b.min; });
  var inj=(o.injuries||[]).map(function(x){
    var im=ri(10,85);
    evs.push({min:im, type:'injury', side:'me', key:true, text:x.name+' 在拼抢中受伤倒地，队医进场处理后确认无法坚持（预计缺阵约 '+x.days+' 天）。'});
    return {name:x.name, days:x.days, min:im};
  });
  var bench=G.squad.filter(function(p){ return lineupNames.indexOf(p.name)<0 && p.inj===0; }).map(function(p){ return p.name; });
  var nSub=ri(1,3);
  for(ci2=0; ci2<nSub; ci2++){
    var sm=ri(55,86);
    if(Math.random()<0.6 && bench.length && lineupNames.length){
      var off=pick(lineupNames), on=bench.splice(Math.floor(Math.random()*bench.length),1)[0];
      evs.push({min:sm, type:'sub', side:'me', key:false, text:'换人调整：'+on+' 替补登场，换下 '+off+'。'});
    } else {
      evs.push({min:sm, type:'sub', side:'opp', key:false, text:'换人调整：'+oppName+' 用 '+pick(oppPool).name+' 换下 '+pick(oppPool).name+'。'});
    }
  }
  myGoals.forEach(function(g){ evs.push({min:g.min, type:'goal', side:'me', key:true, scorer:g.name, text:''}); });
  oppGoals.forEach(function(g){ evs.push({min:g.min, type:'goal', side:'opp', key:true, scorer:g.name, text:''}); });
  evs.push({min:45, type:'ht', key:false, side:'', text:''});
  evs.push({min:90, type:'ft', key:true, side:'', text:''});
  if(o.pens) evs.push({min:91, type:'pens', key:true, side:'me', text:'点球大战：'+G.club+(o.pens==='胜'?'顶住压力，点球击败 '+oppName+'，晋级下一轮！':'遗憾落败，止步本轮。')});
  evs.sort(function(a,b){ return a.min-b.min; });
  var s1=0, s2=0;
  evs.forEach(function(e){
    if(e.type==='goal'){ if(e.side==='me') s1++; else s2++; e.text='进球！'+(e.side==='me'?G.club:oppName)+'的 '+e.scorer+' 在第 '+e.min+' 分钟破门，比分 '+s1+' : '+s2+'。'; }
    else if(e.type==='ht'){ e.text='上半场比赛结束，'+G.club+' '+s1+' : '+s2+' '+oppName+'。'; }
    else if(e.type==='ft'){ e.text='全场比赛结束！'+G.club+' '+gf+' : '+ga+' '+oppName+'。'; }
  });
  var stats={ myShots:gf+myCh, oppShots:ga+oppCh, myOT:gf+ri(0,myCh), oppOT:ga+ri(0,oppCh), poss:clamp(Math.round(50+((o.xg||1.3)-(o.xa||1.2))*5+ri(-5,5)),30,70) };
  var motm=null, cnt={};
  myGoals.forEach(function(g){ cnt[g.name]=(cnt[g.name]||0)+1; });
  var bestMy=null;
  Object.keys(cnt).forEach(function(n){ if(!bestMy || cnt[n]>cnt[bestMy]) bestMy=n; });
  if(bestMy) motm={name:bestMy, side:'me', rating:Math.min(9.9, Math.round((7.4+cnt[bestMy]*0.8+rnd(0,0.4))*10)/10)};
  else if(ga>gf && oppGoals.length) motm={name:oppGoals[0].name, side:'opp', rating:Math.round(rnd(7.8,9.2)*10)/10};
  else if(o.lineup && o.lineup.length){ var bs=o.lineup.slice().sort(function(a,b){ return b.p.ab-a.p.ab; })[0]; motm={name:bs.p.name, side:'me', rating:Math.round(rnd(7.2,8.5)*10)/10}; }
  return {
    opp:oppName, home:!!fx.home, cup:!!fx.cup, tag:fx.tag||'',
    dateTxt:G.year+' 年 '+G.mon+' 月 '+(fx.day||G.day)+' 日',
    gf:gf, ga:ga, res:(o.pens? o.pens : (gf>ga?'胜':(gf===ga?'平':'负'))),
    myGoals:myGoals, oppGoals:oppGoals, events:evs, cards:cards, injuries:inj, motm:motm, stats:stats,
    myLineup:(o.lineup||[]).map(function(s){ return {name:s.p.name, pos:s.slot, ab:s.p.ab}; }),
    oppLineup:oppPool.slice(0,11)
  };
}
/* ---------------- 直播观赛：结算仍走正式引擎（同一套），呈现严格防剧透 ----------------
   内部仍先用正式引擎结算、再逐分钟放出同一份明细，比分与结算永远一致；
   但呈现层只显示「当前分钟为止」的数据：比分/射门随事件逐条出现，控球率
   随分钟从 50:50 逐步走向终场值；终场数据、最终比分、赛后战报只在终场后
   才出现。直播期间不 render() 背景页面（赛程状态/积分/动态不提前刷出
   结果），终场前点「退出直播」也先跳到终场，不会提前弹出战报。 */
var LIVE=null;
function watchLive(){
  if(!G || G.ended || LIVE) return;
  ensureFixtures();
  var fx=nextFixture();
  if(!fx){ toast('本月比赛已踢完，去结束本月结算吧'); return; }
  var guard=0;
  while(G.day<fx.day && guard++<40){ G.day++; dailyRecovery(); } // 推进到比赛日（下一场之前没有别的比赛）
  playFixture(fx); // 正式引擎结算：积分、进球、射手榜、伤病、门票全部在这一步落账
  // 不在这里 render()：直播结束前不把已结算的比分/积分/动态刷到背景页面上，防剧透；退出直播时再统一 render
  var rec=fx.result;
  if(!rec || !rec.detail){ flushReports(); return; }
  LIVE={ fx:fx, det:rec.detail, min:0, speed:1, paused:false, keyOnly:false, done:false, timer:null };
  showLive();
  LIVE.timer=setInterval(liveTick, 200);
}
function liveEventIcon(t){ return t==='goal'?'⚽': t==='yellow'?'🟨': t==='red'?'🟥': t==='injury'?'🚑': t==='chance'?'🎯': t==='sub'?'🔄': t==='pens'?'🎲': t==='ht'?'⏸️': t==='ft'?'🏁':'📣'; }
function showLive(){
  var d=LIVE.det;
  var myLU=d.myLineup.map(function(p){ return esc(p.name)+'（'+p.pos+' · 能力 '+p.ab+'）'; }).join('<br>')||'—';
  var opLU=d.oppLineup.map(function(p){ return esc(p.name)+'（'+p.pos+'）'; }).join('<br>')||'—';
  $modal.innerHTML='<div class="overlay"><div class="modal live-modal">'
  +'<div class="live-head"><div class="live-title">📺 比赛直播 · '+d.dateTxt+' · '+(d.cup?'🏆 足协杯':'联赛')+(d.tag?' · '+esc(d.tag):'')+'</div>'
  +'<div class="live-score"><span class="lt-name">'+esc(G.club)+'</span><span class="lt-sc num" id="lv-score">0 : 0</span><span class="lt-name r">'+esc(d.opp)+'</span></div>'
  +'<div class="live-clock"><span id="lv-clock">0\'</span> · <span id="lv-phase">上半场</span></div>'
  +'<div class="live-stats" id="lv-stats">射门 0 : 0 · 控球 50% : 50%</div></div>'
  +'<div class="live-cols"><div class="live-feed" id="lv-feed"></div>'
  +'<div class="live-side"><h4>🏠 '+esc(G.club)+' 首发</h4><div class="lu">'+myLU+'</div><h4>🚌 '+esc(d.opp)+' 首发</h4><div class="lu">'+opLU+'</div><h4 id="lv-stats-h">📊 实时数据（截至当前分钟）</h4><div class="lu" id="lv-side-stats">射门 0 : 0<br>控球 50% : 50%</div></div></div>'
  +'<div class="live-controls">'
  +'<button class="btn sm" id="lv-pause" onclick="liveTogglePause()">⏸ 暂停</button>'
  +'<button class="btn sm lv-spd on" onclick="liveSetSpeed(1,this)">1× 速度</button>'
  +'<button class="btn sm lv-spd" onclick="liveSetSpeed(2,this)">2× 速度</button>'
  +'<button class="btn sm lv-spd" onclick="liveSetSpeed(4,this)">4× 速度</button>'
  +'<button class="btn sm" onclick="liveNextKey()">⏭ 下一关键时刻</button>'
  +'<button class="btn sm" id="lv-key" onclick="liveToggleKey()">⭐ 只看关键时刻</button>'
  +'<button class="btn sm" onclick="liveSkipEnd()">⏩ 跳到终场</button>'
  +'<button class="btn pri sm" id="lv-exit" onclick="liveExit()">退出直播</button>'
  +'</div></div></div>';
  liveReveal();
}
function liveNextKeyMin(from){
  var evs=LIVE.det.events;
  for(var i=0;i<evs.length;i++){ if(evs[i].key && evs[i].min>from) return evs[i].min; }
  return null;
}
function liveTick(){
  if(!LIVE || LIVE.paused || LIVE.done) return;
  var step=LIVE.speed;
  if(LIVE.keyOnly){
    var nk=liveNextKeyMin(LIVE.min);
    step= nk!=null? Math.min(LIVE.speed*6, Math.max(1, nk-LIVE.min)) : LIVE.speed*6;
  }
  LIVE.min+=step;
  liveReveal();
  if(LIVE.min>=91) liveFinish();
}
function liveReveal(){
  if(!LIVE) return;
  var feed=document.getElementById('lv-feed'); if(!feed) return;
  var d=LIVE.det, s1=0, s2=0, sh1=0, sh2=0, html='';
  d.events.forEach(function(e){
    if(e.min>LIVE.min) return;
    if(e.type==='goal'){ if(e.side==='me'){ s1++; sh1++; } else { s2++; sh2++; } }
    else if(e.type==='chance'){ if(e.side==='me') sh1++; else sh2++; }
    html+='<div class="live-ev'+(e.type==='goal'?' goal':'')+'"><span class="mn num">'+e.min+'\'</span><span>'+liveEventIcon(e.type)+' '+esc(e.text)+'</span></div>';
  });
  feed.innerHTML=html||'<div class="live-ev"><span class="mn num">0\'</span><span>📣 双方球员入场，比赛马上开始。</span></div>';
  feed.scrollTop=feed.scrollHeight;
  var sc=document.getElementById('lv-score'); if(sc) sc.textContent=s1+' : '+s2;
  var ck=document.getElementById('lv-clock'); if(ck) ck.textContent=Math.min(90,LIVE.min)+'\'';
  var ph=document.getElementById('lv-phase'); if(ph && !LIVE.done) ph.textContent= LIVE.min<45?'上半场':(LIVE.min<90?'下半场':'全场结束');
  // 控球率随分钟推进：从 50:50 出发，按已踢分钟占比逐步走向终场控球，终场前看不到终场值
  var possNow=Math.round(50+(d.stats.poss-50)*(Math.min(90,Math.max(0,LIVE.min))/90));
  var st=document.getElementById('lv-stats'); if(st) st.textContent='射门 '+sh1+' : '+sh2+' · 控球 '+possNow+'% : '+(100-possNow)+'%';
  var ss=document.getElementById('lv-side-stats'); if(ss && !LIVE.done) ss.innerHTML='射门 '+sh1+' : '+sh2+'<br>控球 '+possNow+'% : '+(100-possNow)+'%';
}
function liveFinish(){
  if(!LIVE || LIVE.done) return;
  LIVE.min=999; liveReveal();
  LIVE.done=true;
  if(LIVE.timer){ clearInterval(LIVE.timer); LIVE.timer=null; }
  var ph=document.getElementById('lv-phase'); if(ph) ph.textContent='全场结束';
  var ck=document.getElementById('lv-clock'); if(ck) ck.textContent='90\'';
  // 终场哨响后才亮出全场数据（射门/射正/控球终场值），直播进行中侧栏只有实时数据
  var d=LIVE.det;
  var sh=document.getElementById('lv-stats-h'); if(sh) sh.textContent='📊 全场数据（终场）';
  var ss=document.getElementById('lv-side-stats'); if(ss) ss.innerHTML='射门 '+d.stats.myShots+' : '+d.stats.oppShots+'<br>射正 '+d.stats.myOT+' : '+d.stats.oppOT+'<br>控球 '+d.stats.poss+'% : '+(100-d.stats.poss)+'%';
  var ex=document.getElementById('lv-exit'); if(ex) ex.textContent='📋 查看赛后战报';
  var pb=document.getElementById('lv-pause'); if(pb){ pb.disabled=true; pb.style.opacity='.5'; }
}
function liveTogglePause(){
  if(!LIVE || LIVE.done) return;
  LIVE.paused=!LIVE.paused;
  var pb=document.getElementById('lv-pause'); if(pb) pb.textContent= LIVE.paused?'▶ 继续':'⏸ 暂停';
}
function liveSetSpeed(s, btn){
  if(!LIVE) return;
  LIVE.speed=s;
  var bs=document.querySelectorAll('.lv-spd');
  for(var i=0;i<bs.length;i++) bs[i].classList.remove('on');
  if(btn) btn.classList.add('on');
}
function liveNextKey(){
  if(!LIVE || LIVE.done) return;
  var nk=liveNextKeyMin(LIVE.min);
  if(nk==null){ liveSkipEnd(); return; }
  LIVE.min=nk; liveReveal();
  if(LIVE.min>=91) liveFinish();
}
function liveToggleKey(){
  if(!LIVE) return;
  LIVE.keyOnly=!LIVE.keyOnly;
  var kb=document.getElementById('lv-key'); if(kb) kb.classList.toggle('on', LIVE.keyOnly);
  toast(LIVE.keyOnly?'⭐ 只看关键时刻：自动快进无事件的分钟':'已恢复正常速度推进');
}
function liveSkipEnd(){ liveFinish(); }
function liveExit(){
  if(LIVE && !LIVE.done){
    // 终场前点退出：先跳到终场把全场呈现完——赛后战报只在终场后出现，不提前剧透
    liveFinish();
    toast('已到终场，点「📋 查看赛后战报」打开本场战报');
    return;
  }
  if(LIVE && LIVE.timer) clearInterval(LIVE.timer);
  LIVE=null;
  $modal.innerHTML='';
  render();
  flushReports(); // 终场后退出直播，照常弹本场赛后战报（同一份已结算赛果）
}
</script>
</body>
