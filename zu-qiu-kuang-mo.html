/* ---------------- 直播球场画面（canvas 俯视 2D · 连续运动模拟） ----------------
   与文字直播共用 LIVE.det 同一份比赛数据：比分、分钟、进球/机会事件完全一致，
   进球与机会的射门严格按事件分钟、事件方发生，进球后比分与战报一致。
   画面是一套连续运动模拟（按真实时间步进，速度随直播倍率缩放）：
   · 球永远沿连续轨迹运动——带球时粘在持球人脚下；传球按距离定飞行时间
     （短传约 1 秒、长传约 2.5 秒），起脚快、到脚前减速停稳，贴地滚动；
     射门/传中带一点平滑弧线（用 z 高度只影响阴影与球大小，不跳跃）。
   · 球员有位置/速度/加速度：起步加速、停下减速，按阵型站位整体随球移动，
     有接应、前插、盯人、门将站位；无球时慢速回位，绝不瞬移（用户点
     「下一关键时刻/跳到终场」造成分钟跳变时才整体重排一次）。
   · 节奏有呼吸感：后场/中场倒脚时持球人多停顿、多横传回传；进入进攻
     三区后传球间隔变短、前插变多。机会/进球前约 1 分钟比赛时间开始由
     事件方组织进攻，射门在事件分钟打出。进球/半场后双方回位、球自然
     滚回中圈由失球方开球。 */
var PITCH={raf:0, built:false, players:[], ball:null, carrier:null, poss:'me',
  state:'play', stateT:0, dwell:1.4, passInfo:null, shotInfo:null, pendingShot:null, looseTarget:null, kickoffPlayer:null,
  kickoffSide:'me', htDone:false, slowT:0, lastMin:-1, lastFrame:0, lastSeenEv:-1, keyIdx:0,
  flashUntil:0, flashTxt:''};
var PXM=880/105; // 画布像素/米（球场按 105m×68m 折算）
function liveSetView(v){
  var w=document.getElementById('lv-pitch-wrap'), c=document.getElementById('lv-cols');
  var bp=document.getElementById('lv-vp'), bt=document.getElementById('lv-vt');
  if(w) w.style.display= v==='pitch'? 'block':'none';
  if(c) c.style.display= v==='pitch'? 'none':'grid';
  if(bp) bp.classList.toggle('on', v==='pitch');
  if(bt) bt.classList.toggle('on', v==='text');
  if(v==='text' && typeof liveReveal==='function') liveReveal();
}
function pitchStart(){
  PITCH.built=false; PITCH.players=[]; PITCH.ball=null; PITCH.carrier=null; PITCH.poss='me';
  PITCH.state='play'; PITCH.stateT=0; PITCH.dwell=1.4; PITCH.passInfo=null; PITCH.shotInfo=null; PITCH.pendingShot=null; PITCH.looseTarget=null; PITCH.keyIdx=0;
  PITCH.kickoffSide='me'; PITCH.htDone=false; PITCH.slowT=0; PITCH.lastMin=-1; PITCH.lastFrame=0; PITCH.lastSeenEv=-1;
  PITCH.flashUntil=0; PITCH.flashTxt='';
  if(PITCH.raf) cancelAnimationFrame(PITCH.raf);
  var step=function(){
    var cv=document.getElementById('lv-pitch');
    if(!cv || typeof LIVE==='undefined' || !LIVE){ PITCH.raf=0; return; }
    pitchDraw(cv);
    PITCH.raf=requestAnimationFrame(step);
  };
  step();
}
function pitchBuild(){
  var d=LIVE.det, nums={}; try{ nums=jerseyNumbers(); }catch(e){}
  var mine=pitchLineCoords(d.myLineup||[], true, nums);
  var opps=pitchLineCoords(d.oppLineup||[], false, nums);
  PITCH.players=[];
  mine.concat(opps).forEach(function(pl,i){
    PITCH.players.push({x:pl.x, y:pl.y, vx:0, vy:0, hx:pl.x, hy:pl.y, num:pl.num, name:pl.name,
      gk:pl.gk, mine:pl.mine, team:pl.mine?'me':'opp', idx:i, tx:pl.x, ty:pl.y, cap:30});
  });
  PITCH.ball={x:440, y:215, z:0};
  // 开球：我方一名中场在中圈持球
  var cands=PITCH.players.filter(function(p){ return p.team==='me' && !p.gk; });
  cands.sort(function(a,b){ return (Math.abs(a.hx-440)+Math.abs(a.hy-215))-(Math.abs(b.hx-440)+Math.abs(b.hy-215)); });
  PITCH.carrier=cands[0]||PITCH.players[0];
  if(PITCH.carrier){ PITCH.carrier.x=440; PITCH.carrier.y=215; }
  PITCH.poss='me'; PITCH.state='play'; PITCH.dwell=1.6;
  PITCH.keyIdx=0;
  PITCH.built=true;
}
function pitchReset(kickoffSide, dur){
  PITCH.state='reset'; PITCH.stateT=dur||3.0; PITCH.kickoffSide=kickoffSide;
  PITCH.passInfo=null; PITCH.shotInfo=null; PITCH.pendingShot=null; PITCH.carrier=null; PITCH.looseTarget=null;
  // 指定开球球员：回位阶段他就走向中圈站在球旁，开球时不瞬移
  var cc=pitchTeam(kickoffSide).filter(function(p){ return !p.gk; });
  cc.sort(function(a,b){ return (Math.abs(a.hx-440)+Math.abs(a.hy-215))-(Math.abs(b.hx-440)+Math.abs(b.hy-215)); });
  PITCH.kickoffPlayer=cc[0]||null;
}
function pitchTeam(side){ return PITCH.players.filter(function(p){ return p.team===side; }); }
function pitchOther(side){ return side==='me'?'opp':'me'; }
function pitchAtkDir(side){ return side==='me'? 1 : -1; }
function pitchGoalX(side){ return side==='me'? 872 : 8; } // 该方进攻的球门
function pitchOwnGoalX(side){ return side==='me'? 8 : 872; }
function pitchDist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function pitchNextKeyEv(){
  // 指针式：返回第一个尚未上演的进球/机会事件（哪怕其分钟刚被越过也不会漏掉）
  var evs=LIVE.det.events, i=PITCH.keyIdx||0;
  while(i<evs.length && evs[i].type!=='goal' && evs[i].type!=='chance') i++;
  PITCH.keyIdx=i;
  return i<evs.length? evs[i] : null;
}
function pitchAttack(ev){
  // 组织事件方的这次进攻：球权不对先断球，位置太远先一脚直塞，都到位了直接射门
  var c=PITCH.carrier; if(!c) return;
  if(PITCH.poss!==ev.side){
    var op=pitchTeam(ev.side).filter(function(p){ return !p.gk; });
    op.sort(function(a,b){ return pitchDist(a,c)-pitchDist(b,c); });
    if(!op.length) return;
    var stealer=op[0];
    pitchStartPass(c, {x:stealer.x, y:stealer.y}, { recv:stealer, dur:0.7, onDone:function(){
      PITCH.poss=ev.side; PITCH.carrier=stealer; PITCH.state='play'; PITCH.dwell=99;
    }});
    return;
  }
  var gx=pitchGoalX(ev.side);
  var mates=pitchTeam(ev.side).filter(function(p){ return p!==c && !p.gk; });
  mates.sort(function(a,b){ return Math.abs(a.x-gx)-Math.abs(b.x-gx); });
  if(Math.abs(c.x-gx)>330 && mates.length && Math.abs(mates[0].x-gx)<Math.abs(c.x-gx)-90){
    PITCH.pendingShot=ev;
    var recv=mates[0];
    pitchStartPass(c, {x:recv.x, y:recv.y}, { recv:recv, dur:0.8, onDone:function(){
      PITCH.carrier=recv; PITCH.state='play'; PITCH.dwell=99;
    }});
  } else pitchShoot(ev);
}
function pitchStartPass(from, to, opts){
  opts=opts||{};
  var dx=to.x-from.x, dy=to.y-from.y, dist=Math.sqrt(dx*dx+dy*dy), distM=dist/PXM;
  var dur= opts.dur || Math.min(2.9, Math.max(0.75, 0.35+distM*0.06)); // 短传(12m)≈1.1s · 长传(35m)≈2.5s
  PITCH.passInfo={ fx:from.x, fy:from.y, tx:to.x, ty:to.y, t:0, dur:dur,
    recv:opts.recv||null, inter:opts.inter||null, cross:!!opts.cross, onDone:opts.onDone||null };
  PITCH.state='pass';
  if(opts.recv){ opts.recv.tx=to.x; opts.recv.ty=to.y; }
}
function pitchDoPass(){
  var c=PITCH.carrier; if(!c) return;
  var mates=pitchTeam(PITCH.poss).filter(function(p){ return p!==c && !p.gk; });
  if(!mates.length) return;
  var dir=pitchAtkDir(PITCH.poss), gx=pitchGoalX(PITCH.poss);
  // 接应点权重：靠前、距离适中（多在 8~35 米）者优先；后场多横传/回传，前场多向前
  var scored=mates.map(function(m){
    var dM=pitchDist(c,m)/PXM;
    var fwd=(m.x-c.x)*dir/PXM; // 向前米数（可负）
    var w=1/(1+Math.abs(dM-16)*0.16);
    if(fwd>2) w*=1.5; else if(fwd<-4) w*=0.75;
    if(m.gk) w*=0.1;
    if(Math.random()<0.10) w*=2.6; // 偶尔一脚长传转移
    return {m:m, w:w*Math.random()};
  });
  scored.sort(function(a,b){ return b.w-a.w; });
  var recv=scored[0].m;
  // 抢断：传球线路附近有对方球员时有概率被断
  var inter=null;
  var opps=pitchTeam(pitchOther(PITCH.poss));
  for(var i=0;i<opps.length;i++){
    var o=opps[i]; if(o.gk) continue;
    var mx=(c.x+recv.x)/2, my=(c.y+recv.y)/2;
    if(Math.abs(o.x-mx)<46 && Math.abs(o.y-my)<40 && Math.random()<0.4){ inter=o; break; }
  }
  if(inter){
    pitchStartPass(c, {x:inter.x, y:inter.y}, { recv:inter, onDone:function(){
      PITCH.poss=pitchOther(PITCH.poss); PITCH.carrier=inter; PITCH.state='play'; PITCH.dwell=0.9+Math.random()*0.9;
    }});
    return;
  }
  // 传中：持球人在对方禁区两侧且接应点在禁区内 → 带弧线
  var cross = Math.abs(c.x-gx)<190 && Math.abs(recv.x-gx)<130 && Math.abs(recv.y-215)<95 && Math.abs(c.y-215)>55;
  pitchStartPass(c, {x:recv.x+recv.vx*0.25, y:recv.y+recv.vy*0.25}, { recv:recv, cross:cross, onDone:function(){
    PITCH.carrier=recv; PITCH.state='play';
    PITCH.dwell=pitchDwellFor(recv);
  }});
}
function pitchDwellFor(p){
  // 节奏呼吸：后场/中场倒脚慢（1.4~3.0s），进攻三区快（0.7~1.5s）
  var dir=pitchAtkDir(PITCH.poss), gx=pitchGoalX(PITCH.poss);
  var toGoal=Math.abs(p.x-gx);
  if(toGoal<250) return 0.7+Math.random()*0.8;
  if(toGoal<480) return 1.1+Math.random()*1.2;
  return 1.5+Math.random()*1.6;
}
function pitchShoot(ev){
  var c=PITCH.carrier; if(!c) return;
  PITCH.keyIdx=(PITCH.keyIdx||0)+1; // 该事件已上演，指针后移
  var side=ev.side, gx=pitchGoalX(side);
  var isGoal= ev.type==='goal';
  var ty, kind;
  if(isGoal){ ty=215+(Math.random()*44-22); kind='goal'; }
  else if(Math.random()<0.55){ ty=215+(Math.random()*36-18); kind='saved'; } // 被门将扑住/挡出
  else { ty=215+(Math.random()<0.5?-1:1)*(52+Math.random()*26); kind='wide'; } // 偏出立柱
  var dist=Math.abs(gx-c.x), dur=Math.min(1.15, Math.max(0.38, dist/560));
  PITCH.shotInfo={ fx:PITCH.ball.x, fy:PITCH.ball.y, tx:gx, ty:ty, t:0, dur:dur, kind:kind, ev:ev };
  PITCH.state='shot';
}
function pitchSim(dt){
  var d=LIVE.det, min=LIVE.min;
  // 分钟跳变（点「下一关键时刻/跳到终场」）：整体重排一次，其余时间绝不瞬移
  if(PITCH.lastMin>=0 && Math.abs(min-PITCH.lastMin)>1.5){
    PITCH.players.forEach(function(p){ p.x=p.hx; p.y=p.hy; p.vx=0; p.vy=0; });
    PITCH.ball.x=440; PITCH.ball.y=215; PITCH.ball.z=0;
    PITCH.passInfo=null; PITCH.shotInfo=null; PITCH.pendingShot=null; PITCH.looseTarget=null;
    // 跳过的旧事件不再补演：指针推进到当前分钟的事件为止
    var evsJ=d.events;
    while(PITCH.keyIdx<evsJ.length){
      var ej=evsJ[PITCH.keyIdx];
      if((ej.type==='goal'||ej.type==='chance') && ej.min>=min-0.02) break;
      PITCH.keyIdx++;
    }
    var nk=pitchNextKeyEv();
    PITCH.poss= nk? nk.side : 'me';
    var cc=pitchTeam(PITCH.poss).filter(function(p){ return !p.gk; });
    cc.sort(function(a,b){ return (Math.abs(a.hx-440)+Math.abs(a.hy-215))-(Math.abs(b.hx-440)+Math.abs(b.hy-215)); });
    PITCH.carrier=cc[0]||null; PITCH.state='play'; PITCH.dwell=1.2;
  }
  PITCH.lastMin=min;
  // 红黄牌/伤病事件刚揭示时，场上短暂放慢（裁判中断比赛的感觉）
  var seen=-1;
  d.events.forEach(function(e,i){ if(e.min<=min) seen=i; });
  if(seen>PITCH.lastSeenEv){
    for(var i=Math.max(0,PITCH.lastSeenEv+1); i<=seen; i++){
      var et=d.events[i].type;
      if(et==='yellow'||et==='red'||et==='injury') PITCH.slowT=1.1;
      if(et==='ht' && !PITCH.htDone){ PITCH.htDone=true; pitchReset(pitchOther(PITCH.kickoffSide), 3.4); }
    }
    PITCH.lastSeenEv=seen;
  }
  if(LIVE.done){ if(PITCH.state!=='reset') pitchReset('me', 3.0); }
  if(PITCH.slowT>0) PITCH.slowT-=dt;
  var nextEv=pitchNextKeyEv();
  var slowMul= PITCH.slowT>0? 0.35 : 1;

  /* ---------- 状态机 ---------- */
  if(PITCH.state==='reset'){
    PITCH.stateT-=dt;
    // 球自然滚回中圈（匀速偏减速，不闪现）
    var bx=PITCH.ball.x-440, by=PITCH.ball.y-215, bd=Math.sqrt(bx*bx+by*by);
    if(bd>2){
      var sp=Math.min(bd, 130*dt*(0.4+0.6*bd/160));
      PITCH.ball.x-=bx/bd*sp; PITCH.ball.y-=by/bd*sp;
    }
    PITCH.ball.z=0;
    if(PITCH.stateT<=0 && !LIVE.done){
      PITCH.poss=PITCH.kickoffSide;
      PITCH.carrier=PITCH.kickoffPlayer||null;
      if(!PITCH.carrier){
        var cc2=pitchTeam(PITCH.poss).filter(function(p){ return !p.gk; });
        cc2.sort(function(a,b){ return pitchDist(a,PITCH.ball)-pitchDist(b,PITCH.ball); });
        PITCH.carrier=cc2[0]||null;
      }
      PITCH.state='play'; PITCH.dwell=1.5;
    }
  }
  else if(PITCH.state==='pass'){
    var pi=PITCH.passInfo;
    pi.t+=dt/Math.max(0.2,pi.dur);
    var tt=Math.min(1, pi.t), e2=1-Math.pow(1-tt,1.8); // 起脚快、临到脚下减速
    PITCH.ball.x=pi.fx+(pi.tx-pi.fx)*e2;
    PITCH.ball.y=pi.fy+(pi.ty-pi.fy)*e2;
    PITCH.ball.z= pi.cross? Math.sin(tt*Math.PI)*13 : 0;
    if(tt>=1){
      var cb=pi.onDone; PITCH.passInfo=null; PITCH.ball.z=0;
      if(cb) cb();
      if(PITCH.pendingShot && PITCH.state==='play'){
        var ev2=PITCH.pendingShot; PITCH.pendingShot=null; pitchShoot(ev2);
      } else if(PITCH.state==='play'){
        var dev=pitchNextKeyEv();
        if(dev && min>=dev.min-0.02) pitchAttack(dev); // 传球途中越过事件分钟：接球后立刻补上这次进攻
      }
    }
  }
  else if(PITCH.state==='loose'){
    // 球被扑出/偏出后滚向防守方门将，门将拿到球再开出——全程滚动，不瞬移
    var gt=PITCH.looseTarget;
    if(gt){
      var lx=gt.x-PITCH.ball.x, ly=gt.y-PITCH.ball.y, ld=Math.sqrt(lx*lx+ly*ly);
      if(ld<10){
        PITCH.carrier=gt; PITCH.state='play'; PITCH.dwell=1.1; PITCH.looseTarget=null;
      } else {
        var ls=Math.min(ld, 165*dt);
        PITCH.ball.x+=lx/ld*ls; PITCH.ball.y+=ly/ld*ls;
      }
    } else PITCH.state='play';
    PITCH.ball.z=0;
  }
  else if(PITCH.state==='shot'){
    var si=PITCH.shotInfo;
    si.t+=dt/Math.max(0.2,si.dur);
    var st2=Math.min(1, si.t), se=st2*st2*0.25+st2*0.75; // 出脚即高速、略带加速感
    PITCH.ball.x=si.fx+(si.tx-si.fx)*se;
    PITCH.ball.y=si.fy+(si.ty-si.fy)*se;
    PITCH.ball.z=Math.sin(st2*Math.PI)*9;
    if(st2>=1){
      var ev3=si.ev; PITCH.shotInfo=null; PITCH.ball.z=0;
      if(si.kind==='goal'){
        PITCH.flashTxt='⚽ 进球！'+(ev3.side==='me'? G.club : d.opp)+' · '+(ev3.scorer||'');
        PITCH.flashUntil=performance.now()+2600;
        pitchReset(pitchOther(ev3.side), 3.4); // 失球方中圈开球
      } else {
        // 没进：球滚向防守方门将（扑出/偏出的余势），门将拿到后把球开出，比赛继续
        var defSide=pitchOther(ev3.side);
        var gk=pitchTeam(defSide).filter(function(p){ return p.gk; })[0];
        PITCH.poss=defSide; PITCH.carrier=null;
        if(gk){ PITCH.looseTarget=gk; PITCH.state='loose'; }
        else { PITCH.state='play'; PITCH.dwell=1.0; }
      }
    }
  }
  else { // play：持球推进 / 组织
    var c=PITCH.carrier;
    if(!c){ var cc3=pitchTeam(PITCH.poss).filter(function(p){ return !p.gk; }); PITCH.carrier=cc3[0]||PITCH.players[0]; c=PITCH.carrier; }
    if(c){
      // 球粘在脚下：略在身前，跟随球员速度
      var fx2=c.x, fy2=c.y;
      var spd=Math.sqrt(c.vx*c.vx+c.vy*c.vy);
      if(spd>4){ fx2+=c.vx/spd*11; fy2+=c.vy/spd*11; }
      else { fx2+=pitchAtkDir(PITCH.poss)*9; }
      var kk=1-Math.pow(0.0001, dt); // 强跟随但仍平滑
      PITCH.ball.x+=(fx2-PITCH.ball.x)*kk;
      PITCH.ball.y+=(fy2-PITCH.ball.y)*kk;
      PITCH.ball.z=0;
      // 事件临近：提前约 1 分钟由事件方抢回球权组织进攻；到事件分钟打出射门
      if(nextEv && nextEv.side!==PITCH.poss && min>=nextEv.min-1.0){
        pitchAttack(nextEv);
      }
      else if(nextEv && nextEv.side===PITCH.poss && min>=nextEv.min-0.02){
        pitchAttack(nextEv);
      }
      else {
        PITCH.dwell-=dt*slowMul;
        if(PITCH.dwell<=0 && PITCH.state==='play') pitchDoPass();
      }
    }
  }

  /* ---------- 球员目标点与移动（加速度平滑，速度分档） ---------- */
  var ball=PITCH.ball;
  var shiftX=(ball.x-440)*0.11, shiftY=(ball.y-215)*0.06;
  var presser=null, container=null;
  if(PITCH.carrier && PITCH.state!=='reset'){
    var defs=pitchTeam(pitchOther(PITCH.poss)).filter(function(p){ return !p.gk; });
    defs.sort(function(a,b){ return pitchDist(a,PITCH.carrier)-pitchDist(b,PITCH.carrier); });
    presser=defs[0]||null; container=defs[1]||null;
  }
  var support=null;
  if(PITCH.carrier){
    var ms=pitchTeam(PITCH.poss).filter(function(p){ return p!==PITCH.carrier && !p.gk; });
    ms.sort(function(a,b){ return pitchDist(a,PITCH.carrier)-pitchDist(b,PITCH.carrier); });
    support=ms[0]||null;
  }
  PITCH.players.forEach(function(p){
    var tx=p.hx+shiftX, ty=p.hy+shiftY, cap=26; // 默认：慢速回位/走动
    var dir=pitchAtkDir(p.team), gxA=pitchGoalX(p.team), gxO=pitchOwnGoalX(p.team);
    if(p.gk){
      tx=gxO+(p.team==='me'? 26 : -26);
      ty=215+(ball.y-215)*0.42;
      cap=44;
    } else if(PITCH.state==='reset' && p===PITCH.kickoffPlayer){
      tx=440; ty=215; cap=46; // 开球球员走向中圈，站到球旁
    } else if(PITCH.state==='reset'){
      tx=p.hx; ty=p.hy; cap=42; // 回阵型：小跑
    } else if(p===PITCH.carrier){
      // 持球人：向对方球门方向盘带，进攻三区更坚决；被逼近时略横移护球
      var adv= nextEv && nextEv.side===p.team? 150 : 62;
      tx=p.x+dir*adv; ty=p.y+(215-p.y)*0.12+Math.sin(performance.now()/2400+p.idx)*14;
      if(Math.abs(p.x-gxA)<215) tx=gxA-dir*36; // 临门一带直冲球门
      cap= (nextEv && nextEv.side===p.team)? 66 : 46;
      if(PITCH.dwell>90) cap=66; // 已进入事件进攻：冲刺
    } else if(PITCH.passInfo && PITCH.passInfo.recv===p){
      tx=PITCH.passInfo.tx; ty=PITCH.passInfo.ty; cap=58; // 接应跑向落点
    } else if(p===presser){
      tx=PITCH.carrier.x-dir*10; ty=PITCH.carrier.y; cap=76; // 上抢：冲刺
    } else if(p===container){
      tx=(PITCH.carrier.x+gxO)/2; ty=(PITCH.carrier.y+215)/2; cap=58; // 协防封堵线路
    } else if(p===support && p.team===PITCH.poss){
      tx=p.hx+shiftX+dir*36; ty=p.hy+shiftY; cap=50; // 最近接应者前插
    } else if(p.team===PITCH.poss){
      tx=p.hx+shiftX+dir*14; ty=p.hy+shiftY; cap=34; // 有球方整体前压、保持阵型
    } else {
      tx=p.hx+shiftX; ty=p.hy+shiftY; cap=30; // 无球方回防保持阵型
    }
    if(PITCH.slowT>0) cap*=0.4;
    tx=Math.max(18, Math.min(862, tx)); ty=Math.max(30, Math.min(400, ty));
    // 转向带加速度的期望速度（arrive：越近越慢）→ 平滑起步/停下
    var dx=tx-p.x, dy=ty-p.y, dd=Math.sqrt(dx*dx+dy*dy);
    var want= dd>1? Math.min(cap, dd*1.5) : 0;
    var wvx= dd>1? dx/dd*want : 0, wvy= dd>1? dy/dd*want : 0;
    var acc=170*dt, dvx=wvx-p.vx, dvy=wvy-p.vy, dl=Math.sqrt(dvx*dvx+dvy*dvy);
    if(dl>acc){ dvx*=acc/dl; dvy*=acc/dl; }
    p.vx+=dvx; p.vy+=dvy;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.tx=tx; p.ty=ty;
  });
}
function pitchLineCoords(lineup, mine, nums){
  var groups={'门将':[],'后卫':[],'中场':[],'前锋':[]};
  lineup.forEach(function(p,i){ (groups[p.pos]||groups['中场']).push({p:p, i:i}); });
  var xs= mine? {'门将':58,'后卫':205,'中场':425,'前锋':630} : {'门将':822,'后卫':675,'中场':455,'前锋':250};
  var out=[];
  Object.keys(groups).forEach(function(k){
    var g=groups[k];
    g.forEach(function(it,j){
      out.push({ x:xs[k], y:(j+1)*(430/(g.length+1)), num: mine? (nums[it.p.name]||it.i+1) : it.i+1, name:it.p.name, gk:k==='门将', mine:mine, idx:out.length });
    });
  });
  return out;
}
function pitchDraw(cv){
  var ctx=cv.getContext('2d'); if(!ctx) return;
  var W=880, H=430, d=LIVE.det;
  var now=performance.now();
  if(!PITCH.built) pitchBuild();
  // 按真实时间步进模拟（暂停时冻结；倍率与直播速度一致），单步钳制防卡顿跳变
  var dtR= PITCH.lastFrame? Math.min(0.05, (now-PITCH.lastFrame)/1000) : 0.016;
  PITCH.lastFrame=now;
  var dt= LIVE.paused? 0 : dtR*(LIVE.speed||1);
  if(dt>0) pitchSim(dt);
  var ball=PITCH.ball;
  // 1) 球场
  ctx.fillStyle='#1a6e3e'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1e7d46';
  for(var sx=0;sx<8;sx+=2) ctx.fillRect(sx*(W/8),0,W/8,H);
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2;
  ctx.strokeRect(24,24,W-48,H-48);
  ctx.beginPath(); ctx.moveTo(W/2,24); ctx.lineTo(W/2,H-24); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,62,0,Math.PI*2); ctx.stroke();
  ctx.strokeRect(24,95,120,H-190); ctx.strokeRect(W-144,95,120,H-190);
  ctx.strokeRect(24,155,48,H-310); ctx.strokeRect(W-72,155,48,H-310);
  ctx.fillStyle='#0b2e1a'; ctx.fillRect(6,175,18,80); ctx.fillRect(W-24,175,18,80);
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.strokeRect(6,175,18,80); ctx.strokeRect(W-24,175,18,80);
  // 2) 球员（位置来自模拟，带朝向小三角表示跑动方向）
  PITCH.players.forEach(function(p){
    ctx.beginPath(); ctx.arc(p.x,p.y,13.5,0,Math.PI*2);
    ctx.fillStyle= p.gk? '#e8b71f' : (p.mine? '#2f7fe0' : '#e05252');
    ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#ffffff'; ctx.stroke();
    ctx.fillStyle= p.gk? '#101d29' : '#ffffff';
    ctx.font='800 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(p.num), p.x, p.y+0.5);
    if(p.mine){ ctx.font='10px sans-serif'; ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillText(p.name, p.x, p.y+21); }
    if(p===PITCH.carrier){ // 持球人脚下高亮环
      ctx.beginPath(); ctx.arc(p.x,p.y,17.5,0,Math.PI*2);
      ctx.lineWidth=2; ctx.strokeStyle='rgba(255,215,106,.95)'; ctx.stroke();
    }
  });
  // 3) 足球：贴地滚动；传中/射门时略离地（z 只抬高阴影间距与球径，轨迹仍连续平滑）
  var bz=ball.z||0;
  ctx.beginPath(); ctx.ellipse(ball.x, ball.y+5, 6.5, 2.6, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,'+(0.30-Math.min(0.18, bz*0.012))+')'; ctx.fill();
  ctx.beginPath(); ctx.arc(ball.x, ball.y-bz, 6.5+bz*0.16, 0, Math.PI*2);
  ctx.fillStyle='#ffffff'; ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle='#101d29'; ctx.stroke();
  ctx.fillStyle='#101d29'; ctx.beginPath(); ctx.arc(ball.x, ball.y-bz, 2.2, 0, Math.PI*2); ctx.fill();
  // 4) 队名与进球闪字
  ctx.font='800 12px sans-serif'; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillText('🔵 '+G.club+'（向右攻）', 30, 16);
  ctx.textAlign='right'; ctx.fillText('🔴 '+d.opp+'（向左攻）', W-30, 16);
  if(now<PITCH.flashUntil){
    ctx.font='900 34px sans-serif'; ctx.textAlign='center';
    ctx.lineWidth=6; ctx.strokeStyle='rgba(16,29,41,.75)'; ctx.strokeText(PITCH.flashTxt, W/2, H/2-84);
    ctx.fillStyle='#ffd76a'; ctx.fillText(PITCH.flashTxt, W/2, H/2-84);
  }
}

/* ---------------- 体彩竞猜（只用游戏内现金 · 虚拟玩法） ----------------
   赔率按双方球队强度算：用与比赛引擎同口径的期望进球推胜平负 / 比分 /
   总进球概率，赔率 = 0.92 / 概率（庄家留 8% 边际），强队赔率低、弱队高。
   本队比赛的注单在本场踢完时按真实赛果结算（playFixture 钩子）；
   其他球队的比赛在月末统一模拟开奖（settleMonth 钩子）。 */
var BET_SCORES=['0:0','1:0','2:0','2:1','3:0','3:1','3:2','1:1','2:2','0:1','0:2','1:2','2:3','0:3','1:3'];
var betSel={key:'', market:'wdl', pick:''};
function poisPmf(k, lam){ var p=Math.exp(-lam); for(var i=1;i<=k;i++) p*=lam/i; return p; }
function betXG(m){
  var adv= m.mine? (m.fx && m.fx.home? 2.5 : -1.5) : 1.5;
  var dd=(m.hs-m.as)+adv;
  return { xg:clamp(1.38+dd*0.085,0.15,4.4), xa:clamp(1.22-dd*0.085,0.1,4.2) };
}
function betProbs(m){
  var e=betXG(m), pw=0, pd=0, pl=0, scores={}, totals={};
  for(var i=0;i<=8;i++) for(var j=0;j<=8;j++){
    var p=poisPmf(i,e.xg)*poisPmf(j,e.xa);
    if(i>j) pw+=p; else if(i===j) pd+=p; else pl+=p;
    scores[i+':'+j]=p;
    var tt=i+j; totals[tt]=(totals[tt]||0)+p;
  }
  var t6=0; Object.keys(totals).forEach(function(k){ if(+k>=6) t6+=totals[k]; });
  totals['6+']=t6;
  return { w:pw, d:pd, l:pl, scores:scores, totals:totals };
}
function betOdds(p){ return Math.min(80, Math.max(1.02, Math.round(0.92/Math.max(p,0.004)*100)/100)); }
function betRound(){
  ensureX2();
  var key='R'+G.month;
  if(!G.bet.rounds[key]){
    var teams=G.table.slice(), ms=[];
    for(var i=0;i+1<teams.length;i+=2){
      ms.push({ key:key+'-'+i, mine:false, h:teams[i].name, a:teams[i+1].name, hs:teams[i].str, as:teams[i+1].str, day:8+(i/2)*7, played:false, score:'', res:'' });
    }
    G.bet.rounds[key]=ms;
  }
  return G.bet.rounds[key];
}
function betMatches(){
  ensureX2(); ensureFixtures();
  var list=[];
  (G.fixtures||[]).forEach(function(fx){
    var opp=null; G.table.forEach(function(t){ if(t.name===fx.opp) opp=t; });
    list.push({ key:'M'+G.month+'-'+fx.day+'-'+fx.opp, mine:true, fx:fx, cup:!!fx.cup,
      h: fx.home? G.club : fx.opp, a: fx.home? fx.opp : G.club,
      hs: teamStr(), as: opp? opp.str : (fx.cup? ((G.div>0?DIVS[G.div-1]:DIVS[0]).base+8) : DIVS[G.div].base),
      day: fx.day, played: !!fx.played, score: fx.result? fx.result.score : '', res: fx.result? fx.result.res : '' });
  });
  betRound().forEach(function(m){ list.push(m); });
  return list;
}
function betSelect(key){ betSel={key:key, market:'wdl', pick:''}; render(); }
function betSetMarket(mk){ betSel.market=mk; betSel.pick=''; render(); }
function betSetPick(p){ betSel.pick=p; render(); }
function betQuick(v){ var el=document.getElementById('bet-amt'); if(el) el.value=v; }
function placeBet(){
  ensureX2();
  var m=null; betMatches().forEach(function(x){ if(x.key===betSel.key) m=x; });
  if(!m){ toast('先选一场比赛'); return; }
  if(m.played){ toast('这场比赛已经开赛/结束，不能下注了'); return; }
  if(!betSel.pick){ toast('先选一个投注选项（点上面的赔率按钮）'); return; }
  var amtEl=document.getElementById('bet-amt');
  var amt=parseInt(amtEl? amtEl.value : '', 10);
  if(isNaN(amt) || amt<10){ toast('单注最低 10万'); return; }
  if(amt>500){ toast('单注上限 500万'); return; }
  if(G.cash<amt){ toast('现金不够下注，还差 '+fmt(amt-G.cash)); return; }
  var used=0; G.bet.slips.forEach(function(s){ if(s.key===m.key && s.status==='待开赛') used+=s.amt; });
  if(used+amt>1000){ toast('这场已投 '+fmt(used)+'，单场累计上限 1000万'); return; }
  var pr=betProbs(m), o, pickTxt;
  if(betSel.market==='wdl'){ o=betOdds(betSel.pick==='主胜'? pr.w : betSel.pick==='平局'? pr.d : pr.l); pickTxt= betSel.pick==='主胜'? m.h+' 获胜' : betSel.pick==='客胜'? m.a+' 获胜' : '双方战平'; }
  else if(betSel.market==='score'){ var sp= betSel.pick==='其他比分'? Math.max(0.004, 1-BET_SCORES.reduce(function(sm,x){ return sm+(pr.scores[x]||0); },0)) : (pr.scores[betSel.pick]||0.004); o=betOdds(sp); pickTxt='比分 '+betSel.pick; }
  else { o=betOdds(pr.totals[betSel.pick]||0.004); pickTxt='总进球 '+betSel.pick+(betSel.pick==='6+'?' 个或更多':' 个'); }
  G.cash-=amt; G.bet.totalBet+=amt;
  G.bet.slips.unshift({ key:m.key, label:m.h+' vs '+m.a, mine:!!m.mine, market:betSel.market, pick:betSel.pick, pickTxt:pickTxt, odds:o, amt:amt, status:'待开赛', payout:0, score:'', when:G.year+'/'+G.mon });
  log('🎟️ 体彩竞猜下注：'+m.h+' vs '+m.a+'，'+pickTxt+'，赔率 '+o+'，注金 '+fmt(amt)+'（游戏内现金）。比赛结束自动结算。','');
  toast('下注成功：'+pickTxt+' · '+fmt(amt)+' · 赔率 '+o);
  betSel.pick='';
  render();
}
function settleSlip(s, hg, ag, wdlOver){
  var win=false;
  if(s.market==='wdl'){ var r= wdlOver || (hg>ag? '主胜' : hg===ag? '平局' : '客胜'); win= s.pick===r; }
  else if(s.market==='score'){ win= s.pick===(hg+':'+ag) || (s.pick==='其他比分' && BET_SCORES.indexOf(hg+':'+ag)<0); }
  else { var tt=hg+ag; win= s.pick===(tt>=6? '6+' : String(tt)); }
  s.score=hg+':'+ag;
  G.bet.settled++;
  if(win){
    s.payout=Math.round(s.amt*s.odds); s.status='已中奖'; G.cash+=s.payout; G.bet.totalWin+=s.payout; G.bet.won++;
    log('🎟️ 体彩中奖！'+s.label+'（'+s.pickTxt+'）实际比分 '+s.score+'，注金 '+fmt(s.amt)+' × 赔率 '+s.odds+'，派奖 +'+fmt(s.payout)+' 已到账。','good');
  } else {
    s.payout=0; s.status='未中奖';
    log('🎟️ 体彩未中：'+s.label+'（'+s.pickTxt+'）实际比分 '+s.score+'，注金 '+fmt(s.amt)+' 没了。小赌怡情，别上头。','bad');
  }
}
function settleBetsForMatch(fx){
  if(!G || !G.bet || !fx || !fx.result) return;
  ensureX2();
  var key='M'+G.month+'-'+fx.day+'-'+fx.opp;
  var pend=G.bet.slips.filter(function(s){ return s.key===key && s.status==='待开赛'; });
  if(!pend.length) return;
  var mm=String(fx.result.score||'').match(/(\d+)\s*[:：]\s*(\d+)/);
  if(!mm) return;
  var myG=+mm[1], opG=+mm[2];
  var hg= fx.home? myG:opG, ag= fx.home? opG:myG;
  var wdlOver=null;

  pend.forEach(function(s){ settleSlip(s, hg, ag, wdlOver); });
  if(typeof autoSave==='function') autoSave();
}
function settleOtherBets(upTo){
  if(!G || !G.bet) return;
  ensureX2();
  Object.keys(G.bet.rounds).forEach(function(rk){
    var mon=parseInt(rk.slice(1),10);
    if(isNaN(mon) || mon>upTo) return;
    G.bet.rounds[rk].forEach(function(m){
      if(m.played) return;
      var e=betXG(m);
      var hg=pois(e.xg), ag=pois(e.xa);
      m.played=true; m.score=hg+':'+ag; m.res= hg>ag?'主胜': hg===ag?'平局':'客胜';
      G.bet.slips.forEach(function(s){ if(s.key===m.key && s.status==='待开赛') settleSlip(s, hg, ag, null); });
    });
  });

function nmBlindFor(p){
  var nm=ensureNM(); if(!nm) return null;
  var it=nm.blind.intel[p.name];
  if(!it){
    var cred=ri(38,97);
    var fake=Math.random() < (cred<60? 0.5 : (cred<80? 0.25 : 0.1));
    var delta= fake? (Math.random()<0.72? -ri(6,14) : ri(4,9)) : ri(-2,2);
    it={cred:cred, fake:fake, delta:delta, bought:false,
        rumor:pick(['经纪人放风：多家豪门在抢人，身价要涨','小道消息：球员和现东家闹矛盾，急着走','媒体爆料：体检报告有一项存疑','经纪人放话：不续约，今夏必走','传闻：球员私下更想去大城市球队','小道消息：他的真实年龄可能比登记大 2 岁'])};
    nm.blind.intel[p.name]=it;
  }
  return it;
}
function nmOnSign(p){
  var nm=ensureNM(); if(!nm) return;
  var it=nm.blind.intel[p.name];
  var trueAb=p.ab;
  if(it) trueAb=clamp(p.ab + (it.bought? it.delta : it.delta), 30, 99);
  if(it && it.delta<=-6 && !it.bought){
    p.ab=trueAb; p.pot=clamp((p.pot||p.ab)+it.delta, p.ab, 99); p.value=Math.max(10, Math.round(p.value*(p.ab/ (p.ab-it.delta)) ));
    nm.blind.burned++;
    log('🕶️ 双盲市场翻车：'+p.name+' 的球探报告注水了！标称能力虚高，真实能力只有 '+trueAb+'。没买深度情报就下手，这就是信息不对称的代价。','bad');
    toast('买亏了：'+p.name+' 真实能力 '+trueAb);
  } else if(it && it.delta>=4){
    p.ab=trueAb; p.pot=clamp((p.pot||p.ab)+2, p.ab, 99);
    log('🎯 双盲市场捡漏：'+p.name+' 被低估了，真实能力 '+trueAb+'，比标称还强！','good');
  } else if(it && it.bought){
    p.ab=trueAb; log('🔎 '+p.name+' 的深度情报兑现：真实能力 '+trueAb+'，和情报一致，这钱花得值。','');
  }
  nmDecide('转会','签下 '+p.name+'（'+p.pos+'），转会费 '+fmt(p.cost||0)+'，真实能力 '+p.ab, Math.round(((p.ab||55)-58)*0.5));

}

function nmLeagueSim(rules, seasons, names, worldLevel){
  var clubs=names.map(function(n,i){ return {name:n, str:ri(52,72), fin:ri(200,600), youth:0}; });
  for(var s=0;s<seasons;s++){
    clubs.forEach(function(c){
      var eff=c.str;
      if(rules.cap>0){ var over=Math.max(0, c.str- (55+rules.cap/12)); eff-= over*0.7; }
      c.pts=Math.round(30 + (eff-50)*1.6 + ri(-8,8));
      var spend= ri(150,300) + (c.str-55)*6 - (rules.ffp===3? 40: rules.ffp===1? -30:0);
      var income= ri(200,340) + c.pts*2;
      c.fin+= income-spend;
      if(rules.ffp===3 && c.fin<0){ c.pts=Math.max(0,c.pts-6); c.fin+=120; }
      var yBase= rules.youth===3? ri(1,3) : rules.youth===2? ri(0,2) : ri(0,1);
      c.youth+=yBase; c.str=clamp(c.str + (yBase? ri(0,2):0) + ri(-2,2), 45, 85);
      if(rules.winLen===3) c.str=clamp(c.str+ri(-1,3),45,85);
    });
  }
  clubs.sort(function(a,b){ return b.pts-a.pts; });
  return clubs;
}

function nmPcTrain(){
  var nm=ensureNM(), P=nm.pcareer; if(!P||P.retired) return;
  P.psy=clamp(P.psy-8,0,100);
  if(P.inj>0){ toast('还伤着呢，先养伤'); return; }
  if(Math.random()<0.45 && P.ab<P.pot){ P.ab++; P.peak=Math.max(P.peak,P.ab); nmPcLog('🏋️ 加练见效，能力涨到 '+P.ab+'。天赋兑现了一点点。'); toast('能力 +1 → '+P.ab); }
  else if(Math.random()<0.12){ P.inj=ri(7,20); nmPcLog('🤕 加练过猛拉伤了，伤停约 '+P.inj+' 天。欲速则不达。'); toast('练伤了！伤停 '+P.inj+' 天'); }
  else { nmPcLog('🏋️ 完成一堂加练课，状态保持住了（能力没涨，但也没退）。'); toast('加练完成'); }
  render();
}

function nmMonthly(){
  if(!G || !G.started || G.ended) return;
  var nm=ensureNM(); if(!nm) return;
  /* 俱乐部网络：卫星队月结 */
  nm.net.sats.forEach(function(s){
    var back=[];
    s.loans.forEach(function(l){
      if(Math.random()<0.4 && l.p.ab<l.p.pot) l.p.ab++;
      if(G.month>=l.back && G.squad.length<40){ squadPush(l.p); log('↩️ 租借到期：'+l.p.name+' 从卫星队「'+s.name+'」回归主队，能力 '+l.p.ab+'。','good'); }
      else if(G.month>=l.back){ l.back=G.month+1; back.push(l); }
      else back.push(l);
    });
    s.loans=back;
    var power= s.coachAb*2 + Math.min(20, s.budget/25) + (s.loans.length? nmSatAvg(s)/6 : 0);
    var w=0,d=0,l2=0;
    for(var gi=0; gi<3; gi++){ var roll=power + ri(-14,14); if(roll>16) w++; else if(roll>6) d++; else l2++; }
    s.w+=w; s.d+=d; s.l+=l2;
    var pts=w*3+d;
    s.rank=clamp(s.rank + (pts>=7? -1 : (pts<=2? 1:0)) + (Math.random()<0.3? ri(-1,1):0), 1, 10);
    var net= ri(20,55) + (10-s.rank)*6 - ri(28,48);
    s.budget+=net;
    if(s.budget<0){ var drag=Math.min(G.cash, -s.budget); G.cash-=drag; s.budget=0; if(drag>0) log('🕸️ 卫星队「'+s.name+'」预算池见底，主队被迫输血 '+fmt(drag)+'——网络的钱，是连着的。','bad'); }
    if(s.rank<=2 && Math.random()<0.5){ s.seasons++; G.rep=clamp(G.rep+2,0,100); var div2=ri(80,160); G.cash+=div2; log('🕸️ 卫星队「'+s.name+'」冲进升级区（第 '+s.rank+' 名）：集团声望 +2，分红 '+fmt(div2)+' 到账。','good'); }
  });
  /* 海外队网络预算 */
  ensureBiz();
  Object.keys(nm.net.ovBudget).forEach(function(id){
    var c=G.biz.overseas && G.biz.overseas[id];
    if(!c){ delete nm.net.ovBudget[id]; return; }
    var bud=nm.net.ovBudget[id];
    if(bud>0){ var use=Math.min(50, bud); nm.net.ovBudget[id]-=use; if(Math.random()<0.45) c.rank=Math.max(1, c.rank-1); }
  });
  /* 经纪人：旗下球员身价漂移 + 续约小佣金 */
  nm.agent.clients.forEach(function(c){
    c.value=Math.max(10, Math.round(c.value*rnd(0.96,1.05)));
    if(Math.random()<0.18){ var fee=ri(5,18); nm.agent.cash+=fee; nm.agent.earned+=fee; }
    if(Math.random()<0.1) c.hot=true;
  });
  nmAgentGen();
  /* 球员生涯月结 */
  var P=nm.pcareer;
  if(P && !P.retired){
    P.ageM++; if(P.ageM>=12){ P.ageM=0; P.age++; P.seasons++; if(P.age>=36){ P.retired=true; nmPcLog('🎂 36 岁，'+P.name+' 挂靴退役。'); nmFeed('球员 '+P.name+' 36 岁退役，生涯 '+P.apps+' 场 '+P.goals+' 球。'); } }
    if(!P.retired){
      if(P.inj>0){ P.inj=Math.max(0, P.inj-3); }
      else {
        var teamAvg= G.squad.length? G.squad.reduce(function(a,p){ return a+p.ab; },0)/G.squad.length : 55;
        var apps= P.ab>=teamAvg-4? ri(2,3) : ri(0,2);
        P.apps+=apps;
        var gr= P.pos==='前锋'? 0.5 : P.pos==='中场'? 0.28 : P.pos==='后卫'? 0.08 : 0.01;
        var goals=Math.round(apps*gr*(P.ab/65)*rnd(0.4,1.4));
        P.goals+=goals;
        if(apps===0){ P.mood=clamp(P.mood-5,0,100); if(Math.random()<0.3) nmPcLog('😤 这个月没捞到出场，NPC 经理 '+G.coach.name+' 说「再等等」。板凳的滋味不好受。'); }
        if(goals>=2) nmPcLog('⚽ 这个月出场 '+apps+' 次打进 '+goals+' 球！球迷开始唱你的名字了。');
        if(Math.random()<0.1){ P.inj=ri(5,18); nmPcLog('🤕 训练中受伤，伤停约 '+P.inj+' 天。职业球员的命，一半在脚上，一半在运气上。'); }
      }
      P.savings+=P.wage; P.earned+=P.wage;
      if(Math.random()<0.2 && P.ab<68) nmPcLog('📋 NPC 经理在队内会议上点了你的名：数据还不够，续约先搁置。');
    }
  }
  /* 监管者生态漂移 + 新案子 */
  var R=nm.reg; R.months++;
  var eco=nmRegEcoInit();
  eco.forEach(function(c){
    var spend= ri(120,260) + (R.cap>0? 0 : ri(0,90));
    var income= ri(170,300) + (R.dens===3? 40:0);
    c.fin+= income-spend;

    if(R.ffp===3 && c.fin<0){ c.pts=Math.max(0,c.pts-3); c.fin+=100; }

  });
  if(R.cases.length<2 && Math.random()<0.7) R.cases.push({club:pick(eco).name, txt:pick(['被举报拖欠球员奖金','青训梯队违规招生被投诉','主场安保不达标被球迷联名投诉','财务报表被质疑注水','疑似默契球，赛风赛纪部门要求说明'])});
  /* 记者：新线索 */
  if(nm.reporter.cases.length<3 && Math.random()<0.5) nm.reporter.cases.push(nmRepNewCase());

  var ready=nmCityReady();

  /* 危机管理倒计时 */
  var K=nm.crisis;
  if(K && !K.done){
    K.debt=Math.round(K.debt*1.05);
    K.funds-= ri(40,70);
    K.morale=clamp(K.morale + (K.qual>=55? ri(-2,4) : ri(-6,0)), 0, 100);
    K.left--;
    nmCrisisLog('月结：债务利息滚到 '+fmt(K.debt)+'，发完工资账上剩 '+fmt(Math.max(0,K.funds))+'，还剩 '+K.left+' 个月。');
    if(K.funds<0){ K.funds=0; K.morale=clamp(K.morale-8,0,100); nmCrisisLog('⚠️ 账上没钱了，工资拖欠，更衣室士气 -8。'); }
    if(K.debt<=0 && K.morale>=45) nmCrisisFinish(true);
    else if(K.left<=0) nmCrisisFinish(false);
  }
  /* 媒体生态漂移 */
  var M=nm.media;
  M.sent=clamp(M.sent + (myRank()<=3? 2 : myRank()>=7? -3 : 0) + ri(-2,2), 0, 100);
  if(M.sent>=65 && Math.random()<0.4){ G.rel.media=clamp(G.rel.media+1,0,100); }
  if(M.sent<=30 && Math.random()<0.4){ G.rel.media=clamp(G.rel.media-1,0,100); G.rep=clamp(G.rep-1,0,100); }
  /* 董事会派系好感随成绩漂移 */
  var B=nm.board;
  B.good['成绩派']=clamp(B.good['成绩派'] + (myRank()<=2? 3 : myRank()>=7? -4 : 0), 0, 100);
  B.good['盈利派']=clamp(B.good['盈利派'] + ((G.lastFinance&&G.lastFinance.net>0)? 2 : -1), 0, 100);
  B.good['青训派']=clamp(B.good['青训派'] + ((G.youthPromoted||0)>0? 1:0), 0, 100);
  /* AI 叙事导演：每月按规则扫描一次 */
  if(Math.random()<0.55) nmDirectorGen();
  /* 世界动态：每月一条世界新闻 */
  if(Math.random()<0.5){
    var others=(DIVS[G.div].clubs||[]).filter(function(c){ return c!==G.club; });
    if(others.length) nmFeed(pick(others)+' '+pick(['官宣换帅，功勋教练下课','签下了一名强援，转会费创队史纪录','青训小将上演首秀破门','被曝出财政吃紧，正在寻求注资','主场扩建计划获批'])+'。');
  }
}
function nmSeasonEnd(){
  if(!G || !G.started) return;
  var nm=ensureNM(); if(!nm) return;
  var h=(G.seasonHistory||[])[0];
  if(h){
    nm.causal.snap={season:h.season, div:h.div, rank:h.rank, cash:G.cash, titles:G.titles||0, decCount:nm.causal.dec.filter(function(d){ return d.m>=G.month-12; }).length};

}

}

}

<script>
"use strict";
/* ================= 新系统三件套（一）：默契球操盘 + 场馆比赛日运营 + 足球法庭 =================
   全部为游戏内虚构玩法，与现有系统打通：现金 / 纪检热度（G.heat）/ 球迷满意度（G.fanSat）/
   声望（G.rep）/ 积分（G.pts）/ 球员停赛（复用伤停天数 p.inj，期间不可出场）/ 体彩竞猜（注单按真实赛果结算）。
   老存档由 sanitizeSaveData 补默认字段，这里再兜底一次，任何入口都先 ensureNew3()。 */
function ensureNew3(){
  if(!G) return;
  if(!G.rig || typeof G.rig!=='object') G.rig={plan:null, log:[], ops:0, caught:0};
  if(!G.rig.log) G.rig.log=[]; if(G.rig.ops==null) G.rig.ops=0; if(G.rig.caught==null) G.rig.caught=0; if(G.rig.plan===undefined) G.rig.plan=null;
  if(!G.venue || typeof G.venue!=='object') G.venue={ticket:1, security:1, food:1, transport:1, exp:1, reports:[]};
  ['ticket','security','food','transport','exp'].forEach(function(k){ if(G.venue[k]==null) G.venue[k]=1; });
  if(!G.venue.reports) G.venue.reports=[];
  if(!G.court || typeof G.court!=='object') G.court={cases:[], history:[], seq:0, banUntil:0};
  if(!G.court.cases) G.court.cases=[]; if(!G.court.history) G.court.history=[]; if(G.court.seq==null) G.court.seq=0; if(G.court.banUntil==null) G.court.banUntil=0;
}
/* ---------------- 一、默契球操盘（假球/默契球 + 竞猜回报） ---------------- */

    toast('默契球已安排：目标「'+RIG_TARGETS[rigTarget]+'」，别忘了去体彩竞猜下注');
  }
  render();
}
function rigCancel(){
  ensureNew3(); if(!G.rig.plan) return;
  rigLog('🎭【灰账】你临时取消了对 '+G.rig.plan.opp+' 的赛前安排——打点的钱和涨过的热度都退不回来。', false);
  G.rig.plan=null;
  toast('已取消安排（费用与热度不退）');
  render();
}
function rigResolve(plan, forced, result){
  ensureNew3();
  if(G.rig.plan && G.rig.plan.key===plan.key) G.rig.plan=null;
  if(plan.type==='arrange' && !forced){
    rigLog('🎭 默契球没谈拢：中间人临时变卦，对 '+plan.opp+' 这场照常踢完了（'+result.score+'）。'+fmt(plan.cost)+' 打了水漂，热度也白涨了。', true);
  } else {
    rigLog('🎭 赛前安排已生效：对 '+plan.opp+' 最终比分 '+result.score+'（'+result.res+'）'+(plan.type==='arrange'?'，目标结果达成——去体彩竞猜看看押的注单中没中。':'，球队明显没尽全力。'), false);
  }
  var chance= plan.type==='hint'? 0.06 : (forced? 0.20 : 0.12);
  chance += G.rig.ops*0.012 + (G.heat>=60? 0.05 : 0);
  if(Math.random()<chance){
    G.rig.caught++;
    var fine=ri(200,500);
    G.cash-=fine; G.pts=Math.max(0, G.pts-6); G.rep=clamp(G.rep-10,0,100); G.heat=45;
    var suspTxt='';
    var starters=pickLineup();
    if(starters.length){
      var sp=starters[Math.floor(Math.random()*starters.length)].p;
      var days=ri(20,40);
      sp.inj=(sp.inj||0)+days;
      suspTxt='、主力 '+sp.name+' 被停赛 '+days+' 天';
    }
    rigLog('🚨 操盘被查出来了！纪律委员会调查落地：罚款 '+fmt(fine)+'、联赛扣 6 分、声望 -10'+suspTxt+'。纪检热度暂降到 45，案底记在灰账里——操作越多、热度越高，越容易被查。', true);
    toast('被查了！罚款扣分，还有球员停赛');
    if(typeof courtPush==='function') courtPush('discipline', {preset:'fix'});
  }
}
function pageRig(){

    planHTML='<div class="warn-strip">🎭 已安排：对 '+esc(plan.opp)+'（'+plan.when+'）· '+(plan.type==='hint'?'暗示球员放水':('默契球目标【'+RIG_TARGETS[plan.target]+'】'))+' · 花费 '+fmt(plan.cost)+'。'+(planForNext?'这场踢完自动生效结算。':'（这场还没轮到踢）')+' <button class="btn sm" onclick="rigCancel()">取消安排（钱和热度不退）</button></div>';
  }
  var tgtBtns=Object.keys(RIG_TARGETS).map(function(k){

  return '<div class="card"><h3><span class="no">操盘</span>默契球操盘<span class="hint">累计操作 '+G.rig.ops+' 次 · 被查 '+G.rig.caught+' 次 · 当前纪检热度 '+G.heat+'</span></h3>'
  +'<div class="warn-strip">⚠️ 本页全部是<b>游戏里的虚构玩法</b>，不是真事、更不是教你做真事。每一次操作都会涨纪检热度、记进灰账；被查出来会触发调查：罚款、扣联赛积分、球员停赛、声誉下降，热度冲顶还可能直接取消资格。操作越明目张胆、次数越多，被发现的概率越高。</div>'
  + fxHTML + planHTML
  +'<div class="grid2" style="margin-top:10px;">'
  +'<div class="card" style="margin:0;"><h3>🗣️ 暗示球员</h3><p class="desc">低成本、低风险、成功率一般：花 '+fmt(15)+' 疏通更衣室，让球队这场踢得差一点——放水、不全力拼。本队进攻明显变弱、对手更容易进球，但比分到底怎么样还看临场。</p><div class="meta" style="margin:6px 0;"><span class="pill dn">热度 +6</span> <span class="pill">被查概率低</span></div><button class="btn dark" onclick="rigDo(\'hint\')" '+((!fx||fx.cup||plan)?'disabled':'')+'>暗示球员 · '+fmt(15)+'</button></div>'
  +'<div class="card" style="margin:0;"><h3>🤝 安排默契球</h3><p class="desc">花钱贿赂球员/对方：成本高、风险高、成功率约 85%。先选一个指定结果，比赛会按安排走（谈拢的情况下）；谈成之后，去体彩竞猜押这个结果，押中了赚钱。</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;">'+tgtBtns+'</div><div class="meta" style="margin:6px 0;"><span class="pill dn">热度 +18</span> <span class="pill dn">被查概率高</span></div><button class="btn dark" onclick="rigDo(\'arrange\')" '+((!fx||fx.cup||plan)?'disabled':'')+'>安排默契球 · '+fmt(150)+'</button> <button class="btn pri" onclick="go(\'bet\')">🎟️ 去体彩竞猜下注</button></div>'
  +'</div>'
  +'<p class="mini" style="margin-top:10px;">配合玩法：先在这里把结果安排好（比如平局），再到「体彩竞猜」押同一场的结果——竞猜注单按比赛的真实赛果结算，安排生效就等于押中。被查概率 = 基础概率 + 累计操作次数加成 + 热度加成；热度 65 以上每月还有纪律委员会的常规调查（灰色账本里那套）。</p>'
  +'</div>'
  +'<div class="card"><h3>🕶️ 操盘灰账记录<span class="hint">每一次操作都记在这里，和灰色账本共用纪检热度</span></h3>'+logs+'</div>';
}
function rigGrayHTML(){

/* ---------------- 二、场馆与比赛日运营 ---------------- */
var VENUE_TICKET=[
  {n:'亲民', price:0.7, att:1.18, sat:2, ds:'票价低三成：上座率明显涨、球迷满意度 +2，但单场票房打折'},

];
var VENUE_SECURITY=[
  {n:'基础', cost:5, risk:0.16, ds:'只花 '+fmt(5)+'：便宜，但球迷骚乱概率高，出事要被足协罚款、扣声誉'},
  {n:'标准', cost:12, risk:0.06, ds:'花 '+fmt(12)+'：骚乱概率低不少'},

];
var VENUE_FOOD=[
  {n:'基础', cost:5, spend:12, sat:0, ds:'成本 '+fmt(5)+'：只有水和简餐，人均消费低'},
  {n:'丰富', cost:12, spend:30, sat:1, ds:'成本 '+fmt(12)+'：小吃饮料齐全，餐饮收入明显涨，满意度 +1'},
  {n:'豪华', cost:25, spend:55, sat:2, ds:'成本 '+fmt(25)+'：美食街区级别，人均消费最高，满意度 +2'}
];
var VENUE_TRANSPORT=[

  {n:'地铁专线', cost:18, att:1.15, sat:2, ds:'花 '+fmt(18)+'：协调专线直达，上座率 +15%，满意度 +2'}
];
var VENUE_EXP=[
  {n:'不投入', cost:0, sat:0, ds:'不花钱：氛围和设施维持现状'},

];
function venueSet(k, lv){ ensureNew3(); G.venue[k]=lv; render(); }
function venueSettle(fx, res, gate){
  ensureNew3();
  var V=G.venue;
  var cap=8000+G.fac.stadium*9000;
  var att0=Math.min(G.fans, cap);
  var tk=VENUE_TICKET[V.ticket], sc=VENUE_SECURITY[V.security], fd=VENUE_FOOD[V.food], tr=VENUE_TRANSPORT[V.transport], ex=VENUE_EXP[V.exp];
  var attMult=tk.att*tr.att;
  var attendees=Math.max(0, Math.min(cap, Math.round(att0*attMult)));
  var attRate=cap>0? Math.round(attendees/cap*100) : 0;
  var ticketDelta=Math.round(gate*(tk.price*attMult-1));
  G.cash+=ticketDelta; G.monthGate=(G.monthGate||0)+ticketDelta;
  var foodRev=Math.round(attendees*fd.spend/10000);
  var costs=sc.cost+fd.cost+tr.cost+ex.cost;
  G.cash+=foodRev-costs;
  var incident='', fine=0;
  var risk=sc.risk+(attRate>=90?0.04:0);
  if(Math.random()<risk){
    fine=ri(20,60); G.cash-=fine;
    incident='安保不足，看台出现球迷骚乱，被足协罚款 '+fmt(fine)+'、声誉 -2';
    G.rep=clamp(G.rep-2,0,100);
  }
  var satDelta=tk.sat+fd.sat+tr.sat+ex.sat+(incident?-5:0);
  G.fanSat=clamp((G.fanSat==null?62:G.fanSat)+satDelta,0,100);
  var rep={opp:fx.opp, when:G.year+'/'+G.mon+'月'+fx.day+'日', score:'', attRate:attRate, attendees:attendees,
    gate:gate+ticketDelta, foodRev:foodRev, costs:costs, fine:fine, incident:incident, satDelta:satDelta,
    net:ticketDelta+foodRev-costs-fine};
  V.reports.unshift(rep); if(V.reports.length>12) V.reports.length=12;
  log('🏟️ 比赛日结算 vs '+fx.opp+'：上座率 '+attRate+'%（'+attendees.toLocaleString('zh-CN')+' 人），门票 '+fmt(rep.gate)+'、餐饮收入 '+fmt(foodRev)+'、运营成本 '+fmt(costs)+(incident?'；⚠️ '+incident:'')+'，球迷满意度 '+(satDelta>=0?'+':'')+satDelta+' → '+(G.fanSat==null?62:G.fanSat)+'。', incident?'bad':'');
  return {ticketDelta:ticketDelta, report:rep};
}

  ensureNew3();
  var fx=nextFixture();
  var nextHome=null;
  if(G.fixtures){ for(var i=0;i<G.fixtures.length;i++){ if(!G.fixtures[i].played && G.fixtures[i].home){ nextHome=G.fixtures[i]; break; } } }
  var cap=8000+G.fac.stadium*9000;
  var reps=G.venue.reports.length
    ? G.venue.reports.map(function(r){
        return '<div class="item"><div class="grow"><div class="nm">'+esc(r.when)+' · 主场 vs '+esc(r.opp)+(r.score?' · '+esc(r.score):'')+'</div><div class="meta">上座率 '+r.attRate+'%（'+Number(r.attendees).toLocaleString('zh-CN')+' 人）· 门票 '+fmt(r.gate)+' · 餐饮 '+fmt(r.foodRev)+' · 运营成本 '+fmt(r.costs)+(r.fine?' · 骚乱罚款 '+fmt(r.fine):'')+' · 本场运营净'+(r.net>=0?'+':'')+fmt(r.net)+' · 球迷满意度 '+(r.satDelta>=0?'+':'')+r.satDelta+(r.incident?'<br>⚠️ '+esc(r.incident):'')+'</div></div><span class="pill '+(r.net>=0?'up':'dn')+'">'+(r.net>=0?'赚':'亏')+' '+fmt(Math.abs(r.net))+'</span></div>';
      }).join('')
    : '<p class="desc">还没有主场比赛日结算——踢完第一场主场比赛，这里就会出结算单。</p>';
  return '<div class="card"><h3><span class="no">场馆</span>场馆与比赛日运营<span class="hint">球场容量 '+cap.toLocaleString('zh-CN')+' 人（设施「主场球场」'+G.fac.stadium+' 级）· 球迷满意度 '+(G.fanSat==null?62:G.fanSat)+'</span></h3>'
  +'<p class="desc">这里管每一个<b>主场</b>比赛日：设置会一直生效到你下次修改，每个主场比赛后自动按这套设置结算——门票、餐饮、安保事件、球迷满意度变化，全都算进现金和满意度。客场比赛不走场馆运营。</p>'
  +(nextHome? '<div class="item"><div class="grow"><div class="nm">下一个主场：'+G.mon+'月'+nextHome.day+'日 vs '+esc(nextHome.opp)+(nextHome.tag?' · '+nextHome.tag:'')+'</div><div class="meta">在比赛日之前把下面五项定好，踢完立刻出结算单。</div></div></div>' : '<p class="desc">本月剩下的比赛没有主场了，下个月主场再结算。</p>')
  + venueSeg('🎟️ 票务 · 票价档次', 'ticket', VENUE_TICKET)
  + venueSeg('🛡️ 安保 · 安保级别', 'security', VENUE_SECURITY)
  + venueSeg('🍔 餐饮 · 餐饮档次', 'food', VENUE_FOOD)
  + venueSeg('🚌 交通 · 球迷交通', 'transport', VENUE_TRANSPORT)
  + venueSeg('🎉 球迷体验 · 氛围与设施投入', 'exp', VENUE_EXP)
  +'<p class="mini" style="margin-top:8px;">算账方式：门票收入按票价档次和实际上座人数修正基础门票；餐饮收入 = 到场人数 × 人均消费；安保/餐饮/交通/体验的钱在比赛日直接从现金扣。球迷满意度长期偏高，上座率和门票还会更好（满意度本身也影响基础门票）。</p>'
  +'</div>'
  +'<div class="card"><h3>🧾 比赛日结算记录<span class="hint">最近 '+G.venue.reports.length+' 场主场</span></h3>'+reps+'</div>';
}
</script>
<script>
"use strict";
/* ================= 新系统三件套（二）：足球法庭 / 仲裁 =================
   三类案子：合同纠纷 / 转会违规 / 纪律处罚。来源：每月随机出现、热度过高滋生、
   操盘被查后追加听证。裁决真实影响现金、声望、热度、球员去留与停赛、转会禁令
   （禁令期内 buyPlayer 直接拦下）。案子拖过 2 个月不处理，自动按最不利结果结案。 */
function courtBanActive(){ ensureNew3(); return G.court.banUntil>G.month; }
function courtHist(title, act, outcome){
  ensureNew3();
  G.court.history.unshift({when:G.year+'/'+G.mon, title:title, act:act, outcome:outcome});
  if(G.court.history.length>30) G.court.history.length=30;
}
function courtPush(type, opts){
  ensureNew3(); opts=opts||{};
  if(G.court.cases.length>=4) return null;
  G.court.seq++;
  var squad=G.squad||[];
  var rp=squad.length? squad[Math.floor(Math.random()*squad.length)] : null;
  var c={id:'C'+G.month+'-'+G.court.seq, type:type, variant:'', player:rp? rp.name:'', amount:50, susp:0, month:G.month, created:G.year+'/'+G.mon, title:'', desc:''};
  if(type==='contract'){
    c.amount=rp? Math.max(30, Math.round((rp.wage||2)*14)) : 60;
    c.title='合同纠纷 · '+(c.player||'球员')+' 要求加薪';
    c.desc=(c.player||'队内球员')+'（能力 '+(rp?rp.ab:'—')+'，月薪 '+(rp?rp.wage:'—')+'万）的经纪人找上门：现在的工资配不上他的表现，要求涨薪约五成，外加一笔签字费，否则就寻求转会。你可以谈判（小幅涨薪留人）、接受要求（大幅涨薪 + 签字费），或走仲裁——仲裁可能判他留队（新条件）、判他走人（你收一笔转会费），也可能判俱乐部赔钱。';
  } else if(type==='transfer'){
    c.variant= opts.variant || (Math.random()<0.5? 'accused':'victim');
    c.amount=ri(80,220);
    if(c.variant==='accused'){
      c.title='转会违规 · 被指控违规接触球员';
      c.desc='足协收到举报：你方在没有通过对方俱乐部的情况下，私下接触了对方球员谈转会。对方要求严惩。你可以辩护（拿证据自证清白，成败看运气和足协关系）、和解（赔一笔钱息事宁人），或上诉仲裁（赢了无罪，输了罚款加重 + 转会禁令 2 个月）。';
    } else {
      c.title='转会违规 · 对手违规挖角你的球员';
      c.player=rp? rp.name:'';
      c.desc='你发现同联赛对手绕过俱乐部，私下接触了你的球员 '+(c.player||'')+' 谈转会，还许了高薪。你可以向足协投诉（赢了对方赔钱）、私下和解（拿一笔封口费），或上诉仲裁（赢了赔更多，输了球员可能被直接挖走、一分钱转会费都没有）。';
    }
  } else {
    c.susp=ri(10,30);
    c.amount=ri(40,120);
    if(opts.preset==='fix'){
      c.title='纪律处罚 · 操盘调查追加听证';
      c.desc='默契球操盘被查之后，足协纪律委员会追加了一场听证：除了已经执行的罚款扣分，还要追加罚款 '+fmt(c.amount)+(c.player?'，并拟对 '+c.player+' 停赛 '+c.susp+' 天':'')+'。你可以接受处罚，或上诉——上诉结果可能是减轻、维持，也可能加重。';
    } else {
      var ev=pick(['在比赛中暴力犯规，赛后被追罚','在更衣室顶撞教练组，视频被发到了网上','场外深夜泡吧被拍，还和球迷起了冲突','训练中故意铲伤队友，队内影响很坏']);
      c.title='纪律处罚 · '+(c.player||'球员')+' 违纪';
      c.desc=(c.player||'队内球员')+' 出了事：'+ev+'。足协拟罚款 '+fmt(c.amount)+'，并对他停赛 '+c.susp+' 天。你可以接受处罚（照单全收），或上诉——上诉可能减轻、维持，也可能加重（罚款和停赛都涨）。';
    }
  }
  G.court.cases.push(c);
  return c;
}
function courtFind(id){
  ensureNew3();
  for(var i=0;i<G.court.cases.length;i++) if(G.court.cases[i].id===id) return G.court.cases[i];
  return null;
}
function courtClose(c){ G.court.cases=G.court.cases.filter(function(x){ return x.id!==c.id; }); }
function courtPlayer(name){ if(!name) return null; for(var i=0;i<G.squad.length;i++) if(G.squad[i].name===name) return G.squad[i]; return null; }
function courtSuspend(c, days){
  var p=courtPlayer(c.player); if(!p || !days) return '';
  p.inj=(p.inj||0)+days;
  return '，'+p.name+' 停赛 '+days+' 天（期间不可出场）';
}
function courtRemovePlayer(c){
  var p=courtPlayer(c.player); if(!p) return 0;
  var idx=G.squad.indexOf(p); if(idx<0) return 0;
  var fee=p.value||0;
  G.squad.splice(idx,1);
  if(typeof migrateLineupData==='function') migrateLineupData(G);
  return fee;
}
function courtAct(id, act){
  ensureNew3();
  var c=courtFind(id); if(!c){ toast('这个案子已经结案了'); render(); return; }
  var outcome='';
  if(c.type==='contract'){
    var p=courtPlayer(c.player);
    if(act==='negotiate'){
      var fee=Math.round(c.amount*0.3);
      G.cash-=fee;
      if(p){ p.wage=Math.round(p.wage*1.2*10)/10; p.mood=clamp((p.mood||60)+8,0,100); p.trust=clamp((p.trust||55)+6,0,100); }
      outcome='谈判达成：签字费 '+fmt(fee)+'，'+(c.player||'球员')+' 月薪上调约两成留队，更衣室心情变好。';
    } else if(act==='accept'){
      var fee2=Math.round(c.amount*0.5);
      G.cash-=fee2;
      if(p){ p.wage=Math.round(p.wage*1.5*10)/10; p.mood=clamp((p.mood||60)+12,0,100); p.trust=clamp((p.trust||55)+10,0,100); }
      outcome='接受要求：签字费 '+fmt(fee2)+'，'+(c.player||'球员')+' 月薪上调约五成，心满意足续约留队（以后每月工资支出更高）。';
    } else {
      var r=Math.random();
      if(r<0.4){
        var fee3=Math.round(c.amount*0.3); G.cash-=fee3;
        if(p){ p.wage=Math.round(p.wage*1.3*10)/10; }
        outcome='仲裁裁决：球员留队，但俱乐部要按新条件涨薪约三成，并补签字费 '+fmt(fee3)+'。';
      } else if(r<0.7){
        var fee4=courtRemovePlayer(c); G.cash+=fee4;
        outcome='仲裁裁决：球员获准转会离队，对方支付转会费 '+fmt(fee4)+' 已到账。他已从阵容、大名单和首发里移除，空位记得去阵容页补人。';
      } else {
        G.cash-=c.amount;
        if(p) p.mood=clamp((p.mood||60)-10,0,100);
        outcome='仲裁裁决：俱乐部败诉，赔偿 '+fmt(c.amount)+'，球员留队但心情受了影响。';
      }
    }
  } else if(c.type==='transfer'){
    if(c.variant==='accused'){
      if(act==='defend'){
        var ch=0.45+((G.rel&&G.rel.fa)||30)*0.003;
        if(Math.random()<ch){ G.rep=clamp(G.rep+1,0,100); outcome='辩护成功：证据链完整，足协认定接触发生在合规窗口内，无罪，声望 +1。'; }
        else { G.cash-=c.amount; G.heat=clamp(G.heat+8,0,100); outcome='辩护失败：罚款 '+fmt(c.amount)+'，纪检热度 +8 → '+G.heat+'。'; }
      } else if(act==='settle'){
        var s1=Math.round(c.amount*0.6); G.cash-=s1;
        outcome='庭外和解：赔付 '+fmt(s1)+' 息事宁人，对方撤诉，不留案底。';
      } else {
        if(Math.random()<0.5){ outcome='上诉仲裁胜诉：指控不成立，无罪结案，一分钱不用赔。'; }
        else { var f1=Math.round(c.amount*1.2); G.cash-=f1; G.court.banUntil=G.month+2; outcome='上诉仲裁败诉：罚款加重到 '+fmt(f1)+'，外加转会禁令 2 个月——禁令期内转会市场签不了人。'; }
      }
    } else {
      if(act==='defend'){
        if(Math.random()<0.55){ G.cash+=c.amount; G.rep=clamp(G.rep+2,0,100); outcome='投诉成功：足协认定对方违规挖角，对方俱乐部赔偿 '+fmt(c.amount)+'，声望 +2，你的球员留队。'; }
        else outcome='投诉被驳回：证据不足，足协不予立案。球员留队，但这事在圈子里传开了。';
      } else if(act==='settle'){
        var s2=Math.round(c.amount*0.5); G.cash+=s2;
        outcome='私下和解：对方赔了 '+fmt(s2)+' 封口费，承诺不再私下接触你的球员。';
      } else {
        if(Math.random()<0.5){ var w=Math.round(c.amount*1.5); G.cash+=w; outcome='上诉仲裁大胜：对方被重罚，赔偿 '+fmt(w)+'，还被警告再犯就扣分。'; }
        else { var fee5=courtRemovePlayer(c); outcome='上诉仲裁败诉：仲裁庭反而认定球员有权自由接触，'+(c.player||'球员')+' 被对方直接挖走，转会费一分没有（本可收约 '+fmt(fee5)+'）。他已从阵容移除，空位去阵容页补。'; }
      }
    }
  } else {
    if(act==='accept'){
      G.cash-=c.amount;
      outcome='接受处罚：罚款 '+fmt(c.amount)+' 已缴'+courtSuspend(c, c.susp)+'。';
    } else {
      var r2=Math.random();
      if(r2<0.38){ var f2=Math.round(c.amount*0.4); G.cash-=f2; outcome='上诉成功，处罚减轻：罚款降到 '+fmt(f2)+courtSuspend(c, Math.ceil(c.susp/2))+'。'; }
      else if(r2<0.72){ G.cash-=c.amount; outcome='上诉被驳回，维持原判：罚款 '+fmt(c.amount)+courtSuspend(c, c.susp)+'。'; }
      else { var f3=Math.round(c.amount*1.6); G.cash-=f3; G.rep=clamp(G.rep-3,0,100); G.heat=clamp(G.heat+5,0,100); outcome='上诉反而激怒了纪律委员会，处罚加重：罚款 '+fmt(f3)+courtSuspend(c, Math.round(c.susp*1.5))+'，声望 -3、热度 +5。'; }
    }
  }
  courtClose(c);
  courtHist(c.title, act, outcome);
  log('⚖️ 足球法庭结案【'+c.title+'】：'+outcome, '');
  toast('已结案：'+c.title);
  render();
}
function courtAutoResolve(c){
  var outcome='';
  if(c.type==='contract'){ G.cash-=c.amount; outcome='拖过期限未处理，自动按最不利结果结案：俱乐部赔偿 '+fmt(c.amount)+'，球员留队。'; }
  else if(c.type==='transfer' && c.variant==='victim'){ courtRemovePlayer(c); outcome='拖过期限未处理，自动按最不利结果结案：对方把 '+(c.player||'球员')+' 直接挖走，转会费一分没有。'; }
  else if(c.type==='transfer'){ G.cash-=c.amount; G.court.banUntil=G.month+2; outcome='拖过期限未处理，自动按最不利结果结案：罚款 '+fmt(c.amount)+' + 转会禁令 2 个月。'; }
  else { G.cash-=c.amount; var s=courtSuspend(c, c.susp); outcome='拖过期限未处理，自动按最不利结果结案：罚款 '+fmt(c.amount)+s+'。'; }
  courtClose(c);
  courtHist(c.title, '超期自动结案', outcome);
  log('⚖️ 足球法庭【'+c.title+'】超期未处理，自动结案：'+outcome, 'bad');
}
function courtMonthlyTick(){
  if(!G || !G.started) return;
  ensureNew3();
  if(G.court.banUntil && G.month>=G.court.banUntil && G.court.banUntil>0 && G._banNoted!==G.court.banUntil){
    G._banNoted=G.court.banUntil; G.court.banUntil=0;
    log('⚖️ 转会禁令已到期，转会市场恢复正常签人。','good');
  }
  var expired=G.court.cases.filter(function(c){ return G.month-(c.month||G.month)>=2; });
  expired.forEach(function(c){ courtAutoResolve(c); });
  if(G.court.cases.length<3){
    var ch=0.45 + (G.heat>=50? 0.2:0);
    if(Math.random()<ch){
      var t=pick(['contract','transfer','discipline']);
      var c=courtPush(t, {});
      if(c) log('⚖️ 足球法庭来新案子了：'+c.title+'。去「足球法庭」页处理——拖过 2 个月不处理，会自动按最不利结果结案。','bad');
    }
  }
}
function courtActionsHTML(c){
  var b='';
  if(c.type==='contract'){
    b='<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'negotiate\')">🤝 谈判（小幅涨薪留人）</button>'
     +'<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'accept\')">✅ 接受要求（大幅涨薪+签字费）</button>'
     +'<button class="btn pri sm" onclick="courtAct(\''+c.id+'\',\'arbitrate\')">⚖️ 走仲裁（留队/走人/赔钱看裁决）</button>';
  } else if(c.type==='transfer' && c.variant==='accused'){
    b='<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'defend\')">🛡️ 辩护（自证清白）</button>'
     +'<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'settle\')">💸 和解（赔六成息事宁人）</button>'
     +'<button class="btn pri sm" onclick="courtAct(\''+c.id+'\',\'appeal\')">⚖️ 上诉（赢了无罪，输了加重+禁转会）</button>';
  } else if(c.type==='transfer'){
    b='<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'defend\')">📣 向足协投诉</button>'
     +'<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'settle\')">🤝 私下和解（拿封口费）</button>'
     +'<button class="btn pri sm" onclick="courtAct(\''+c.id+'\',\'appeal\')">⚖️ 上诉仲裁（赢赔更多，输人被挖走）</button>';
  } else {
    b='<button class="btn sm" onclick="courtAct(\''+c.id+'\',\'accept\')">✅ 接受处罚（罚款'+(c.susp?' + 停赛':'')+'）</button>'
     +'<button class="btn pri sm" onclick="courtAct(\''+c.id+'\',\'appeal\')">⚖️ 上诉（减轻 / 维持 / 加重）</button>';
  }
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">'+b+'</div>';
}
var COURT_TYPE_NM={contract:'📄 合同纠纷', transfer:'🔁 转会违规', discipline:'🚨 纪律处罚'};
function pageCourt(){
  ensureNew3();
  var open=G.court.cases.map(function(c){
    return '<div class="card" style="margin:0 0 10px;"><h3>'+(COURT_TYPE_NM[c.type]||'案子')+'<span class="hint">'+esc(c.created)+' 立案 · 拖过 2 个月自动按最不利结果结案</span></h3>'
    +'<div class="nm" style="font-weight:800;">'+esc(c.title)+'</div>'
    +'<p class="desc" style="margin-top:6px;">'+esc(c.desc)+'</p>'
    + courtActionsHTML(c)+'</div>';
  }).join('');
  var hist=G.court.history.length
    ? G.court.history.map(function(h){ return '<div class="item"><div class="grow"><div class="nm" style="font-weight:700;">'+esc(h.title)+'</div><div class="meta">'+esc(h.when)+' · 处理方式：'+esc(h.act)+' —— '+esc(h.outcome)+'</div></div></div>'; }).join('')
    : '<p class="desc">还没有裁决记录。</p>';
  return '<div class="card"><h3><span class="no">法庭</span>足球法庭 / 仲裁<span class="hint">待办案件 '+G.court.cases.length+' 件 · 裁决会影响钱、声望、热度、球员去留与停赛</span></h3>'
  +'<p class="desc">合同纠纷、转会违规、纪律处罚都在这里审：案子会随时间随机出现，也会被你的行为触发（比如操盘被查、热度太高）。每个案子都有几种处理方式，后果当场生效、记入裁决记录。<b>拖着不管超过 2 个月，自动按最不利结果结案。</b></p>'
  +(courtBanActive()? '<div class="warn-strip">🚫 转会禁令生效中：还剩 '+(G.court.banUntil-G.month)+' 个月，禁令期内转会市场签不了人（卖人、青训提拔不受影响）。</div>':'')
  +'</div>'
  +(G.court.cases.length? open : '<div class="card"><p class="desc">⚖️ 目前没有待办案件。踢球、经营、操盘都可能把案子招来——案子出现时大厅和侧边栏会有提示。</p></div>')
  +'<div class="card"><h3>📜 裁决记录<span class="hint">最近 '+G.court.history.length+' 条</span></h3>'+hist+'</div>';
}
</script>
