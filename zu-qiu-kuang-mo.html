<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="足球俱乐部经营模拟：无限生涯、转会市场、青训体系、集团扩张，从中乙一路踢到中超冠军。可安装到手机主屏幕，像 App 一样打开。" />
    <meta name="theme-color" content="#101d29" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="豪门缔造者" />
    <link rel="manifest" href="manifest.webmanifest" /> />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" /> />
    <link rel="icon" type="image/png" sizes="192x192" href="photo-09.png" />
    <title>豪门缔造者 · 从中乙到中超冠军</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      :root{
        --ink:#1c2733; --ink2:#5a6a78; --ink3:#8b9aa6;
        --bg:#e9edf0; --card:#ffffff; --line:#dde4e9;
        --navy1:#101d29; --navy2:#1b3049;
        --orange:#e85d1f; --orange-d:#c94c14;
        --green:#1d9e62; --green-d:#14744a;
        --red:#d33f2e; --blue:#2b6cb0; --gold:#c9930a;
        --radius:14px;
        --shadow:0 2px 10px rgba(16,29,41,.07), 0 1px 3px rgba(16,29,41,.05);
      }
      html,body{ margin:0; padding:0; }
      html{ overscroll-behavior-y:none; }
      body{
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
        background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
        -webkit-font-smoothing:antialiased;
        -webkit-tap-highlight-color:transparent;
        touch-action:manipulation;
        overscroll-behavior-y:none;
      }
      button{ -webkit-user-select:none; user-select:none; }
      /* ---------- App 模式 ---------- */
      .app-install-card{ display:flex; gap:12px; align-items:center; background:linear-gradient(120deg,#173550,#0e2233); color:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px; }
      .app-install-card img{ width:52px; height:52px; border-radius:12px; flex:0 0 52px; }
      .app-install-card .t{ font-weight:800; font-size:15px; }
      .app-install-card .d{ font-size:12.5px; color:#a9bfd1; margin-top:2px; line-height:1.5; }
      .app-install-card .acts{ margin-left:auto; display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
      @media (max-width:560px){ .app-install-card{ flex-wrap:wrap; } .app-install-card .acts{ margin-left:0; flex-direction:row; } }
      .install-steps{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
      .install-steps .st{ display:flex; gap:11px; align-items:flex-start; background:#f4f7f9; border-radius:10px; padding:10px 12px; font-size:13.5px; }
      .install-steps .st b.n{ background:var(--orange); color:#fff; width:22px; height:22px; flex:0 0 22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; margin-top:1px; }
      @media (display-mode: standalone){
        body{ background:var(--navy1); }
        .layout, .topbar{ padding-top:env(safe-area-inset-top); }
        main{ padding-bottom:calc(40px + env(safe-area-inset-bottom)); }
        #toast{ bottom:calc(26px + env(safe-area-inset-bottom)); }
      }
      .num{ font-family:"Archivo","DIN Alternate","PingFang SC",sans-serif; font-variant-numeric:tabular-nums; }
      button{ font-family:inherit; cursor:pointer; }
      /* ---------- layout ---------- */
      .layout{ display:flex; min-height:100vh; }
      aside{
        width:232px; flex:0 0 232px; position:sticky; top:0; height:100vh; overflow-y:auto;
        background:linear-gradient(168deg,var(--navy2) 0%,var(--navy1) 55%,#0b141d 100%);
        color:#dbe5ee; padding:18px 16px 20px; display:flex; flex-direction:column; gap:12px;
      }
      main{ flex:1; min-width:0; padding:20px 22px 40px; max-width:1180px; margin:0 auto; width:100%; }
      /* ---------- sidebar ---------- */
      /* ---------- 游戏 Logo（用户提供的《豪门缔造者》标志图，透明底） ---------- */
      .game-logo{ display:block; height:auto; }
      aside .game-logo{ width:188px; max-width:100%; }
      .topbar .game-logo{ height:38px; width:auto; }
      .modal .hero .game-logo{ width:min(330px,84%); margin:2px 0 6px; }
      .app-install-card img.game-logo{ width:104px; height:auto; flex:0 0 104px; border-radius:6px; }
      .club-name{ font-size:24px; font-weight:800; color:#fff; margin-top:10px; line-height:1.25; word-break:break-all; }
      .club-sub{ color:#93a7ba; font-size:12px; margin-top:2px; }
      .month-box{ border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:10px 14px; margin-top:6px; background:rgba(255,255,255,.04); }
      .month-box .m{ font-size:26px; font-weight:800; color:#fff; }
      .month-box .m span{ font-size:13px; color:#9db2c4; font-weight:500; margin-left:6px; }
      .month-box .s{ font-size:12px; color:#9db2c4; }
      .tag-row{ display:flex; gap:6px; flex-wrap:wrap; }
      .tag{ font-size:11px; border:1px solid rgba(255,255,255,.3); color:#c8d6e2; padding:2px 8px; border-radius:20px; }
      .tag.hot{ border-color:var(--orange); color:#ffb38f; }
      nav.side{ display:flex; flex-direction:column; gap:4px; margin-top:4px; }
      nav.side button{
        display:flex; align-items:center; gap:10px; width:100%; text-align:left;
        background:transparent; border:none; color:#c8d6e2; font-size:14px; padding:9px 12px; border-radius:20px; min-height:40px;
      }
      nav.side button .ic{ width:18px; text-align:center; flex:0 0 18px; }
      nav.side button .bdg{ margin-left:auto; background:var(--orange); color:#fff; font-size:11px; border-radius:10px; padding:1px 7px; font-weight:700; }
      nav.side button.on{ background:rgba(255,255,255,.13); color:#fff; font-weight:700; box-shadow:inset 3px 0 0 var(--orange); }
      nav.side button:hover{ background:rgba(255,255,255,.08); color:#fff; }
      .side-stats{ border-top:1px solid rgba(255,255,255,.12); padding-top:10px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; }
      .side-stats .row{ display:flex; justify-content:space-between; color:#9db2c4; }
      .side-stats .row b{ color:#eef4f9; font-weight:700; }
      .side-stats .row b.neg{ color:#ff8f7a; }
      .side-btns{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
      .btn-end{ background:var(--orange); color:#fff; border:none; font-size:15px; font-weight:800; padding:12px; border-radius:10px; }
      .btn-end:hover{ background:var(--orange-d); }
      .btn-ghost{ background:transparent; border:1px solid rgba(255,255,255,.35); color:#dbe5ee; padding:9px; border-radius:10px; font-size:13px; }
      .btn-ghost:hover{ border-color:#fff; color:#fff; }
      .credit{ font-size:11.5px; color:#7e93a7; text-align:center; }
      /* ---------- main generic ---------- */
      .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
      .kpi{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
      .kpi .lb{ font-size:12px; color:var(--ink2); display:flex; align-items:center; gap:6px; }
      .kpi .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
      .kpi .vl{ font-size:24px; font-weight:800; margin-top:2px; }
      .kpi .sub{ font-size:11.5px; color:var(--ink3); }
      .kpi .sub .up{ color:var(--green-d); font-weight:700; } .kpi .sub .dn{ color:var(--red); font-weight:700; }
      .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .grid-main{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:14px; align-items:start; }
      .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px; }
      .card h3{ margin:0 0 4px; font-size:16px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
      .card h3 .no{ background:var(--orange); color:#fff; font-size:11px; padding:2px 7px; border-radius:4px; font-weight:800; }
      .card h3 .hint{ font-size:12px; color:var(--ink3); font-weight:500; }
      .card .desc{ color:var(--ink2); font-size:12.5px; margin:2px 0 10px; }
      .bar{ height:8px; background:#e6ecf0; border-radius:6px; overflow:hidden; }
      .bar > i{ display:block; height:100%; border-radius:6px; background:var(--blue); }
      .bar.g > i{ background:var(--green); } .bar.o > i{ background:var(--orange); } .bar.r > i{ background:var(--red); } .bar.gold > i{ background:var(--gold); }
      .btn{ border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:7px 14px; font-size:13px; font-weight:600; }
      .btn:hover{ border-color:#b9c7d1; }
      .btn:disabled{ opacity:.45; cursor:not-allowed; }
      .btn.pri{ background:var(--orange); border-color:var(--orange); color:#fff; }
      .btn.pri:hover{ background:var(--orange-d); }
      .btn.grn{ background:var(--green); border-color:var(--green); color:#fff; }
      .btn.grn:hover{ background:var(--green-d); }
      .btn.dark{ background:var(--navy1); border-color:var(--navy1); color:#fff; }
      .btn.sm{ padding:4px 10px; font-size:12px; min-height:32px; }
      .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
      .tabs button{ border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 13px; font-size:12.5px; min-height:34px; }
      .tabs button.on{ background:var(--navy1); color:#fff; border-color:var(--navy1); font-weight:700; }
      table{ width:100%; border-collapse:collapse; font-size:13px; }
      th{ text-align:left; color:var(--ink3); font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
      td{ padding:7px 8px; border-bottom:1px solid #eef2f5; vertical-align:middle; }
      tr.me td{ background:#fff4ec; font-weight:700; }
      tr:last-child td{ border-bottom:none; }
      .pill{ display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:#eef3f6; color:var(--ink2); font-weight:600; white-space:nowrap; }
      .pill.fw{ background:#fde8e0; color:var(--orange-d); } .pill.mf{ background:#e2f2e7; color:var(--green-d); }
      .pill.df{ background:#e3ecf7; color:var(--blue); } .pill.gk{ background:#fdf3d3; color:#8a6508; }
      .pill.up{ background:#e2f2e7; color:var(--green-d); } .pill.dn{ background:#fdeaea; color:var(--red); }
      .mini{ font-size:11.5px; color:var(--ink3); }
      .log{ display:flex; flex-direction:column; }
      .log .it{ display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed #e3e9ee; font-size:13px; }
      .log .it:last-child{ border-bottom:none; }
      .log .dt{ color:var(--ink3); font-size:12px; flex:0 0 64px; }
      .log .it.bad{ color:var(--red); } .log .it.good{ color:var(--green-d); }
      /* stadium banner */
      .stadium{ border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:14px; background:linear-gradient(180deg,#bcd8ea 0%,#dcebf3 46%,#3f9e5f 46.2%,#2e7d46 100%); position:relative; }
      .stadium .sky{ padding:18px 20px 0; display:flex; justify-content:space-between; align-items:flex-start; }
      .stadium .ttl{ font-size:21px; font-weight:900; color:#14324a; }
      .stadium .ttl small{ display:block; font-size:12px; font-weight:600; color:#40617c; margin-top:2px; }
      .stadium .score{ background:rgba(16,29,41,.85); color:#fff; border-radius:10px; padding:8px 14px; text-align:center; }
      .stadium .score b{ font-size:19px; }
      .stadium .score div{ font-size:11px; color:#b9cbda; }
      .stadium svg{ display:block; width:100%; height:auto; }
      /* rows / items */
      .item{ display:flex; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid #eef2f5; }
      .item:last-child{ border-bottom:none; }
      .item .grow{ flex:1; min-width:0; }
      .item .nm{ font-weight:700; font-size:14px; }
      .item .meta{ font-size:12px; color:var(--ink2); margin-top:1px; }
      .ab-wrap{ display:flex; align-items:center; gap:8px; min-width:130px; }
      .ab-wrap .bar{ flex:1; }
      .ab-wrap b{ font-size:13px; width:24px; text-align:right; }
      /* relation & gray cards */
      .rel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .rel-card{ border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
      .rel-card .nm{ font-weight:800; font-size:14.5px; }
      .rel-card .role{ font-size:12px; color:var(--orange-d); font-weight:700; }
      .rel-card .ben{ font-size:12px; color:var(--ink2); margin:6px 0 8px; }
      .rel-card .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
      .fac{ display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid #eef2f5; }
      .fac:last-child{ border-bottom:none; }
      .fac .ic{ font-size:24px; width:44px; height:44px; flex:0 0 44px; background:#eef4f8; border-radius:12px; display:flex; align-items:center; justify-content:center; }
      .lv-dots{ letter-spacing:2px; color:var(--orange); font-size:13px; }
      .lv-dots .off{ color:#d4dde4; }
      /* recharge */
      .tiers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
      .tier{ border:2px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; background:#fff; cursor:pointer; min-height:44px; }
      .tier:hover{ border-color:#c3d2dd; }
      .tier.on{ border-color:var(--orange); background:#fff7f1; }
      .tier .amt{ font-size:19px; font-weight:800; }
      .tier .dia{ color:var(--orange-d); font-weight:700; font-size:13px; margin-top:2px; }
      .tier .dbl{ font-size:11px; color:var(--red); font-weight:700; }
      .shop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
      .shop-it{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
      .shop-it .nm{ font-weight:800; }
      .shop-it .ds{ font-size:12px; color:var(--ink2); margin:3px 0 9px; min-height:34px; }
      .qr-box{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
      .qr-box img{ width:190px; height:auto; border-radius:12px; border:1px solid var(--line); }
      /* modal */
      .overlay{ position:fixed; inset:0; background:rgba(13,22,31,.62); z-index:60; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:26px 14px; }
      .modal{ background:#fff; border-radius:16px; max-width:620px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.35); overflow:hidden; }
      .modal .hero{ background:linear-gradient(120deg,#173550,#0e2233); color:#fff; padding:22px 26px 18px; position:relative; }
      .modal .hero .big{ font-size:32px; font-weight:900; letter-spacing:.06em; }
      .modal .hero .big em{ font-style:normal; color:var(--orange); }
      .modal .hero .sub{ color:#a9bfd1; font-size:13px; margin-top:3px; }
      .modal .body{ padding:18px 26px 24px; max-height:62vh; overflow-y:auto; }
      .modal label.fl{ display:block; font-size:12.5px; color:var(--ink2); font-weight:700; margin:14px 0 6px; }
      .modal input[type=text]{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:15px; font-weight:700; font-family:inherit; }
      .opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .opt{ border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; cursor:pointer; background:#fff; text-align:left; width:100%; }
      .opt b{ font-size:14px; display:block; }
      .opt span{ font-size:12px; color:var(--ink2); display:block; margin-top:3px; line-height:1.5; }
      .opt.on{ border-color:var(--orange); background:#fff7f1; box-shadow:inset 3px 0 0 var(--orange); }
      .modal .foot{ padding:0 26px 22px; display:flex; gap:10px; flex-wrap:wrap; }
      .btn-start{ background:var(--orange); color:#fff; border:none; font-size:16px; font-weight:800; padding:12px 30px; border-radius:10px; }
      .btn-start:hover{ background:var(--orange-d); }
      .ev-choices{ display:flex; flex-direction:column; gap:9px; margin-top:12px; }
      .ev-choices button{ text-align:left; }
      .end-grade{ font-size:54px; font-weight:900; color:var(--orange); line-height:1; }
      /* ---------- 入口海报弹窗（每次进游戏，未删除的海报依次全弹；右上角 ✕ = 永久删除） ---------- */
      .creator-overlay{ position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center; padding:24px 16px; overflow-y:auto;
        background:
          radial-gradient(420px 200px at 12% -40px, rgba(255,214,120,.28), rgba(255,214,120,0) 70%),
          radial-gradient(420px 200px at 88% -40px, rgba(255,214,120,.28), rgba(255,214,120,0) 70%),
          radial-gradient(900px 480px at 50% 115%, rgba(38,110,60,.35), rgba(38,110,60,0) 65%),
          linear-gradient(180deg, rgba(6,12,22,.93), rgba(4,8,14,.96));
        animation:creatorFade .28s ease-out; }
      .creator-card{ position:relative; background:linear-gradient(180deg,#141a21,#0a0e13); border:2px solid #d4af37; border-radius:18px; padding:10px 10px 8px;
        box-shadow:0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(212,175,55,.25), 0 0 46px rgba(212,175,55,.16);
        max-width:min(430px,94vw); animation:creatorPop .3s ease-out; }
      .creator-card img{ display:block; width:auto; height:auto; max-width:100%; max-height:min(76vh,760px); margin:0 auto; border-radius:10px; }
      .creator-hint{ text-align:center; color:#e8cf8a; font-size:12.5px; letter-spacing:.14em; padding:8px 4px 4px; }
      .creator-del-note{ text-align:center; color:#c3cedb; font-size:11.5px; line-height:1.55; padding:2px 8px 0; }
      .creator-next{ display:block; margin:10px auto 5px; background:linear-gradient(180deg,#f3cd6b,#d4af37); color:#241a02; border:none; font-size:15px; font-weight:800; padding:10px 36px; border-radius:10px; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.4); }
      .creator-next:active{ transform:scale(.97); }
      .pw-item img{ width:52px; height:70px; object-fit:cover; object-position:top center; border-radius:8px; border:1.5px solid #d4af37; cursor:pointer; flex:0 0 52px; display:block; }
      .creator-close{ position:absolute; top:-15px; right:-9px; width:46px; height:46px; min-height:46px; border-radius:50%; z-index:2;
        background:radial-gradient(circle at 32% 30%, #ffe9a8, #e3b93e 55%, #b8860b); border:2px solid #fff3c4; color:#2a1e02;
        font-size:23px; font-weight:900; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
        box-shadow:0 6px 18px rgba(0,0,0,.55), 0 0 14px rgba(212,175,55,.45); }
      .creator-close:active{ transform:scale(.94); }
      @keyframes creatorFade{ from{ opacity:0; } to{ opacity:1; } }
      @keyframes creatorPop{ from{ opacity:0; transform:scale(.96) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
      @media (prefers-reduced-motion: reduce){ .creator-overlay,.creator-card{ animation:none; } }
      /* ---------- 按天模拟 / 每周签到 / 赛程 / 致敬传奇 ---------- */
      .sim-row{ display:flex; gap:6px; }
      .sim-row button{ flex:1; }
      .sign-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 4px; }
      .sign-cell{ border:1.5px solid var(--line); border-radius:11px; padding:9px 4px 7px; text-align:center; background:#fbfcfe; position:relative; }
      .sign-cell .sd{ font-size:11.5px; color:var(--ink2); font-weight:700; }
      .sign-cell .sr{ font-size:14.5px; font-weight:800; margin-top:2px; }
      .sign-cell .sr small{ display:block; font-size:10.5px; color:var(--gold-d,#a87b12); font-weight:700; }
      .sign-cell.done{ border-color:var(--green); background:#eefaf2; color:var(--green-d); }
      .sign-cell.today{ border-color:var(--gold,#d4af37); background:#fff8e2; box-shadow:0 0 0 2px rgba(212,175,55,.25); }
      .sign-cell.big{ grid-column:span 2; border-color:var(--gold,#d4af37); background:linear-gradient(180deg,#fff6d8,#ffedb3); }
      .fx-row{ display:flex; align-items:center; gap:9px; padding:7px 2px; border-bottom:1px dashed var(--line); font-size:13.5px; }
      .fx-row:last-child{ border-bottom:none; }
      .fx-row .fd{ font-weight:800; min-width:64px; }
      .fx-row .fo{ flex:1; min-width:0; }
      .tribute-overlay{ position:fixed; inset:0; z-index:130; display:flex; align-items:center; justify-content:center; padding:20px 14px; overflow-y:auto;

    train:{intensity:'标准', physio:1}, scout:{reports:{}, used:0, mission:null}, director:{mode:'manual'}, board:{patience:70, cityRep:35, frozen:0, budgetSeason:-1, grantSeason:-1, facGrant:false, citySeason:-1}, mediaUsed:false

function buildTable(){
  var d=DIVS[G.div]; G.table=d.clubs.map(function(n,i){ return {name:n, str:d.base+ri(-4,7), pts:0, gf:0, ga:0}; });

}
function log(msg, cls){ G.log.unshift({m:G.year+'/'+G.mon, t:msg, cls:cls||''}); if(G.log.length>60) G.log.length=60; }
function squadValue(){ return G.squad.reduce(function(s,p){ return s+p.value; },0); }
function fmtSign(p){ if(p.cost===0) return p.signNote||'免签'; if(p.cost==null) return fmt(p.value)+'（初始身价）'; return fmt(p.cost); }
function signCost(p){ return p.cost==null? p.value : p.cost; }
function signProfit(p, price){ return price - signCost(p); }
function facValue(){ var f=G.fac; return (f.stadium+f.academy+f.training+f.medical+(f.data||0))*120; }
function valuation(){ return Math.round(G.cash - G.debt + squadValue() + facValue() + venturesValue() + G.rep*15 + G.fans*0.04); }
function fatPenalty(p){ var f=p.fat||0; return f>=75?4 : f>=50?2 : f>=30?1 : 0; }
function effAb(p){ return p.ab - fatPenalty(p); }
function teamStr(){
  var sorted=G.squad.slice().sort(function(a,b){ return effAb(b)-effAb(a); });
  var top=sorted.slice(0,11); if(!top.length) return 40;
  var avg=top.reduce(function(s,p){ return s+effAb(p); },0)/top.length;
  var s=avg + G.coach.ab*0.7 + (G.morale-60)*0.06 + G.fac.training*0.8;
  if(G.staff.some(function(x){ return x.role==='数据分析师'; })) s+=2;
  s+=(G.fac.data||0)*0.4; // 数据分析中心：情报越准，临场越占便宜
  if(G.grayWinBoost>0) s+=7;

function wagesTotal(){ return G.squad.reduce(function(s,p){ return s+p.wage; },0) + G.coach.wage + G.staff.reduce(function(s,x){ return s+x.wage; },0); }
function myRank(){
  var rows=G.table.map(function(t){ return {name:t.name, pts:t.pts, gd:t.gf-t.ga, gf:t.gf}; });
  rows.push({name:G.club, pts:G.pts, gd:G.gf-G.ga, gf:G.gf});
  rows.sort(function(a,b){ return b.pts-a.pts || b.gd-a.gd || b.gf-a.gf; });

/* ---------------- 转会窗：1 月（冬窗）与 7 月（夏窗） ----------------
   窗口期：市场人数更多、必有好货、挂牌价打折，每天有概率上新；
   窗口最后 3 天是压哨期，折扣更狠。窗口外市场照常营业，只是不打折、不上新。 */
function isWindow(){ return !!G && (G.mon===1 || G.mon===7); }
function isDeadline(){ return isWindow() && G.day>=28; }
function windowDaysLeft(){ return isWindow()? 31-G.day : 0; }
function daysToWindow(){
  if(!G) return 0;
  if(isWindow()) return 0;
  var m=G.mon, add=0;
  while(m!==1 && m!==7){ m++; if(m>12) m=1; add++; }
  return add*30 + (31-G.day);
}
function refreshMarket(first){
  var d=G.div; G.market=[];

}
function refreshOffers(){

/* ---------------- 青训体系：数据与生成 ---------------- */
var YOUTH_TRAITS=['勤奋自律','天赋异禀','大心脏','玻璃人','团队型','独狼型','领袖气质','慢热型'];
var YOUTH_PLANS=['均衡培养','技术打磨','体能强化','战术意识'];
function youthCap(){ return 10 + (G? G.fac.academy*3 : 0); }
function youthLog(msg){ if(!G) return; if(!G.youthLog) G.youthLog=[]; G.youthLog.unshift({m:G.year+'/'+G.mon, t:msg}); if(G.youthLog.length>30) G.youthLog.length=30; }
function genYouthPlayer(source){

function youthSignFee(p){ return Math.round(Math.max(5,(p.pot-58)*2.2 + p.ab*0.4)); }
function youthSellPrice(p){ return Math.round(Math.max(8, Math.pow(Math.max(p.ab-36,2),2)*0.11 + (p.pot-p.ab)*2.4) * (p.age<=16?1.1:1)); }
function refreshYouthCandidates(){

function youthByName(name){ if(!G||!G.youth) return null; var f=null; G.youth.forEach(function(p){ if(p.name===name) f=p; }); return f; }
function youthGrowthChance(p){
  var ch=0.26 + G.fac.academy*0.055 + (G.rel.youth>=60?0.08:0) + (G.coach.spec==='青训提拔'?0.10:0)
    + (hasVent('school')?0.05:0) + (hasVent('satellite')?0.04:0)
    + ((G.youthBudget||0)>=60?0.12 : (G.youthBudget||0)>=30?0.07 : (G.youthBudget||0)>=15?0.03 : 0);
  if(p.trait==='勤奋自律') ch+=0.10;
  if(p.trait==='天赋异禀') ch+=0.07;
  if(p.trait==='慢热型') ch-=0.05;
  if(p.plan==='技术打磨') ch+=0.02;
  return clamp(ch,0.05,0.85);
}
function processYouth(){
  if(!G.youth) G.youth=[];
  if(!G.youthCandidates || !G.youthCandidates.length) refreshYouthCandidates();
  var budget=G.youthBudget||0;
  if(budget>0){
    if(G.cash>=budget){ G.cash-=budget; }
    else { log('🌱 青训投入 '+fmt(budget)+' 本月没扣成：现金不够，成材率按无投入计算。去青训页把投入调低一点。','bad'); budget=0; G.youthBudget=0; }
  }
  var grown=[];
  G.youth.forEach(function(p){
    p.months++;
    p.ageM++; if(p.ageM>=12){ p.ageM=0; p.age++; }
    if(p.inj>0){ p.inj--; return; }
    if(p.trait==='玻璃人' && Math.random()<0.05){ p.inj=ri(1,2); youthLog('🚑 青训小将 '+p.name+' 受伤休养 '+p.inj+' 个月（特质：玻璃人）。'); return; }
    if(Math.random()<youthGrowthChance(p) && p.ab<p.pot){
      p.ab++;
      if(p.trait==='天赋异禀' && Math.random()<0.06 && p.pot<95){ p.pot++; }
      if(p.ab>=55 || p.ab>=p.pot-2) grown.push(p.name+' → '+p.ab);
    }
  });
  if(grown.length) youthLog('📈 本月成长：'+grown.join('、')+'。');
  // 梯队比赛：每 3 个月一场
  if(G.mon%3===0 && G.youth.length>=5){
    var avg=G.youth.reduce(function(s,p){ return s+p.ab; },0)/G.youth.length;
    var win= Math.random() < clamp(0.35 + (avg-48)*0.03 + G.fac.academy*0.03, 0.15, 0.85);
    if(win){ G.fans+=600; G.rep=clamp(G.rep+1,0,100); youthLog('🏆 梯队比赛获胜！青年队平均能力 '+avg.toFixed(1)+'，小将们士气大涨，声望 +1、球迷 +600。'); var star=G.youth.slice().sort(function(a,b){return b.pot-a.pot;})[0]; if(star && star.ab<star.pot){ star.ab++; youthLog('⭐ 本场最佳 '+star.name+' 能力 +1 → '+star.ab+'（潜力 '+star.pot+'）。'); } }
    else youthLog('🏟️ 梯队比赛惜败。输球也是学费——青训营等级和投入越高，赢面越大。');
  }
  // 超龄处理：19 岁还没提拔，自动评估去留
  var keep=[];
  G.youth.forEach(function(p){
    if(p.age>=19){
      if(p.ab>=58 && G.squad.length<22){ var np=promoteYouthSilent(p); youthLog('🎓 '+p.name+' 满 19 岁，能力 '+p.ab+' 达标，自动提拔进一线队。'); if(np) G.youthPromoted=(G.youthPromoted||0)+1; }
      else if(p.ab>=50){ var pr=youthSellPrice(p); G.cash+=pr; G.youthSold=(G.youthSold||0)+1; G.youthSoldIncome=(G.youthSoldIncome||0)+pr; youthLog('💸 '+p.name+' 满 19 岁未获提拔，以 '+fmt(pr)+' 转会去其他球队梯队，青训回了一口血。'); }
      else youthLog('👋 '+p.name+' 满 19 岁，能力 '+p.ab+' 未达职业门槛，离队另谋出路。青训就是这样，大浪淘沙。');
    } else keep.push(p);
  });
  G.youth=keep;
  // 每月候选名单小刷新：有空位时补 1 名新人
  if(G.youthCandidates.length<3) { var nc=genYouthPlayer('球探推荐'); nc.fee=youthSignFee(nc); G.youthCandidates.push(nc); }
}
function promoteYouthSilent(p){
  var wage=Math.round(Math.max(0.4,Math.pow(Math.max(p.ab-40,2),2)*0.016)*10)/10;
  var val=Math.round(Math.max(5,Math.pow(Math.max(p.ab-38,2),2)*0.16));
  var np={name:p.name,pos:p.pos,ab:p.ab,age:p.age,wage:wage,value:val,foreign:false,inj:0,cost:0,signNote:'青训提拔',pot:p.pot};
  G.squad.push(np); return np;
}
function youthIntake(){
  if(!G.youth) G.youth=[];
  var room=youthCap()-G.youth.length; if(room<=0){ youthLog('🌱 新赛季招生：梯队已满员（'+youthCap()+' 人），本期没有招新。先提拔或出售几名小将腾位置。'); return; }
  var n=Math.min(room, ri(2,3)); var names=[];
  for(var i=0;i<n;i++){ var p=genYouthPlayer('年度招生'); G.youth.push(p); names.push(p.name+'（潜力 '+p.pot+'）'); }
  youthLog('🌱 新赛季青训招生：'+n+' 名小将入营——'+names.join('、')+'。');
  log('🌱 新赛季青训招生 '+n+' 人入营，梯队现有 '+G.youth.length+'/'+youthCap()+' 人。去「青训体系」页看他们的潜力和培养方案。','good');
}

<script>
"use strict";
/* ---------------- 月度引擎 ---------------- */
function pois(lambda){ var L=Math.exp(-lambda), k=0, p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1; }
/* ---------------- 赛程与单场引擎（按天推进） ----------------
   每月 3 场联赛分布在上旬/中旬/下旬（约第 6 / 15 / 24 天，绝不同日连赛）；
   6 月另有一场足协杯（约第 12 天）。门票在比赛日当天入账（只有主场收门票，
   客场计少量分成），工资/赞助/转播/运营仍在月末统一结算。 */
function genFixtures(){
  if(!G) return;
  var opps=G.table.slice().sort(function(){ return Math.random()-0.5; }).slice(0,3);
  var start=Math.max(4, G.day+2);
  var rank=myRank();
  var prevDay=0;
  G.fixtures=opps.map(function(opp,i){
    var day=Math.min(28, Math.max(start+i*9+ri(0,2), prevDay+3)); // 强制拉开间隔，绝不同日/隔日连赛
    prevDay=day;
    var tag='';
    if(i===2 && G.mon===12) tag= rank<=3? '🏆 争冠关键战' : (rank>=7? '⚠️ 保级关键战' : '🎬 赛季收官战');
    else if(opp.str>=DIVS[G.div].base+5) tag='🔥 强强对话';
    else if(rank<=2 && opp.pts>=G.pts) tag='🏆 榜首关键战';
    return {day:day, opp:opp.name, home:i!==1, played:false, result:null, tag:tag, cup:false};
  });
  if(G.mon===6){
    var cupDay=Math.min(27, Math.max(12, G.day+3));
    while(G.fixtures.some(function(f){ return f.day===cupDay; })) cupDay++;
    G.fixtures.push({day:cupDay, opp:'足协杯对手（高一级联赛）', home:true, played:false, result:null, tag:'🏆 足协杯', cup:true});
  }
  G.fixtures.sort(function(a,b){ return a.day-b.day; });
  G.fixturesMonth=G.month;
}
function ensureFixtures(){
  if(!G || !G.started) return;
  if(!G.fixtures || G.fixturesMonth!==G.month) genFixtures();
}
function nextFixture(){ ensureFixtures(); if(!G.fixtures) return null; for(var i=0;i<G.fixtures.length;i++){ if(!G.fixtures[i].played) return G.fixtures[i]; } return null; }
function matchGate(win){
  var d=DIVS[G.div];
  var attend=Math.min(G.fans, 8000+G.fac.stadium*9000);
  var satMult=0.82+(G.fanSat||60)*0.0036; // 球迷满意度直接影响上座与门票
  return Math.round(attend*d.ticket/100*(0.55+(win?0.48:0)+G.fac.stadium*0.09)*(G.rel.fans>=60?1.15:1)*(G.staff.some(function(x){return x.role==='商务总监';})?1.06:1)*((G.board&&G.board.cityRep>=60)?1.05:1)*satMult/2); // 城市声望 ≥60：这座城市以球队为荣，门票 +5%
}
function playSingleMatch(fx){
  var opp=null; G.table.forEach(function(t){ if(t.name===fx.opp) opp=t; });
  if(!opp) opp={name:fx.opp, str:DIVS[G.div].base, pts:0, gf:0, ga:0};

  var xg=clamp(1.38+diff*0.085,0.15,4.4), xa=clamp(1.22-diff*0.085,0.1,4.2);
  var tac=G.tactic||'均衡攻守';
  if(tac==='全攻全守'){ xg*=1.28; xa*=1.18; }
  else if(tac==='防守反击'){ xg*=0.94; xa*=0.72; }
  else if(tac==='高压逼抢'){ xg*=1.14; xa*=1.06; }
  else if(tac==='青春风暴'){ var yb=G.squad.filter(function(q){ return q.age<=23; }).length>=6?1:0; xg+=yb*0.32; xa-=yb*0.14; }
  // 赛前部署：只对下一场比赛生效，踢完自动清空

    prepName=prep.name;
    if(prep.type==='speech'){ xg*=1.13; }
    else if(prep.type==='calm'){ xa*=0.82; }
    else if(prep.type==='rotate'){ xg*=0.94; fatScale=0.45; injScale=0.45; }
    G.prep=null;
  }
  var gf=pois(xg), ga=pois(xa);
  G.gf+=gf; G.ga+=ga; opp.gf+=ga; opp.ga+=gf;
  var res, cls='';
  if(gf>ga){ G.pts+=3; G.wins++; res='胜'; cls='good'; }
  else if(gf===ga){ G.pts+=1; opp.pts+=1; res='平'; }
  else { opp.pts+=3; res='负'; cls='bad'; }
  // 进球归属：每粒进球记到具体球员名下（签下的球星权重更高），首页赛果与球星页进球榜都会显示
  var scorers=[];
  if(!G.goalTable) G.goalTable={};
  if(!G.seasonGoals) G.seasonGoals={};
  for(var gi=0; gi<gf; gi++){
    var sc=pickScorer();
    if(sc){ scorers.push(sc.name); G.goalTable[sc.name]=(G.goalTable[sc.name]||0)+1; G.seasonGoals[sc.name]=(G.seasonGoals[sc.name]||0)+1; }
  }
  // 首发体能消耗与伤病：踢满一场的球员疲劳上升，疲劳越高越容易受伤；没上场的恢复
  var starters={};
  pickLineup().forEach(function(s){ starters[s.p.name]=s.p; });
  G.squad.forEach(function(p){
    if(starters[p.name]){
      p.played=(p.played||0)+1; // 出场计数：出场承诺兑现、更衣室心情都看它
      var intenFat=(G.train&&G.train.intensity)==='高强度'?6:((G.train&&G.train.intensity)==='恢复调养'?-5:0);
      p.fat=clamp((p.fat||0)+Math.round(ri(16,26)*fatScale)+intenFat,0,100);
      var injCh=(0.035 + ((p.fat||0)>=70?0.06:0) - G.fac.medical*0.006 - ((G.train&&G.train.physio)||0)*0.004 + ((G.train&&G.train.intensity)==='高强度'?0.015:0)) * injScale;
      if(p.inj===0 && Math.random()<injCh){ p.inj=ri(10,40); log('🚑 '+p.name+' 在对阵 '+fx.opp+' 的比赛中受伤，预计缺阵约 '+p.inj+' 天（医疗中心等级越高、轮换越合理，伤病越少）。','bad'); }
    } else {
      p.fat=clamp((p.fat||0)-12,0,100);
    }
  });
  // 球迷满意度：赢球涨、输球跌，关键战翻倍；满意度反过来影响门票收入
  var satDelta= res==='胜'?5 : res==='平'?1 : -6;
  if(fx.tag) satDelta*=2;
  G.fanSat=clamp((G.fanSat==null?62:G.fanSat)+satDelta,0,100);
  // 门票：比赛日当天入账
  var gate=0;
  if(fx.home){ gate=matchGate(res==='胜'); G.cash+=gate; G.monthGate=(G.monthGate||0)+gate; }

    else { G.rep=clamp(G.rep-3,0,100); G.fans=Math.round(G.fans*0.97); log('📋 董事会目标落空：「'+bt.desc+'」没完成。声望 -3，球迷流失 3%，董事会在会议室里脸色很难看。','bad'); }
  }
  var moved='';
  var wasChamp=(rank===1 && G.div===0);
  if(rank===1 && G.div===0){ G.champion=true; G.titles=(G.titles||0)+1; moved='🏆 中超冠军！这是你第 '+G.titles+' 次夺冠——奖杯放进荣誉室，故事继续，下赛季卫冕战开打！'; G.fans=Math.round(G.fans*1.15); }
  if(rank<=2 && G.div>0){ G.div--; G.promoted++; moved='⬆️ 升级！下赛季踢 '+DIVS[G.div].short+'！'; G.rep=clamp(G.rep+10,0,100); G.fans=Math.round(G.fans*1.35); }
  else if(rank>=7 && G.div<2){ G.div++; moved='⬇️ 不幸降级，下赛季去 '+DIVS[G.div].short+'。别灰心，降级不是结局，打回来就是。'; G.rep=clamp(G.rep-8,0,100); G.fans=Math.round(G.fans*0.8); }
  computeSeasonAwards(rank);
  if(!G.seasonHistory) G.seasonHistory=[];
  G.seasonHistory.unshift({season:G.seasonsPlayed, year:G.year, div:d.short, rank:rank, champion:wasChamp});
  log(msg+(moved?' '+moved:''), rank<=2?'good':(rank>=7?'bad':''));
  buildTable(); refreshMarket(true);
  youthIntake();
  G.boardTarget=mkBoardTarget();
  log('📋 新赛季董事会目标：「'+G.boardTarget.desc+'」，达成奖金 '+fmt(G.boardTarget.bonus)+'。赛季无限循环，想玩多久玩多久。','');
}
function checkInvestigation(){
  if(G.heat<65) return false;
  var chance=(G.heat-60)*0.012;
  if(Math.random()<chance){
    if(G.rel.fa>=70 && Math.random()<0.5){ G.heat=45; log('⚠️ 纪检约谈警告：郑国强提前通了气，你连夜整改，热度压回 45。','bad'); return false; }
    var fine=ri(150,400);
    if(G.heat>=96 || Math.random()<0.35){ endGame('caught'); return true; }
    G.cash-=fine; G.pts=Math.max(0,G.pts-6); G.heat=40; G.rep=clamp(G.rep-12,0,100);
    log('🚨 纪律委员会调查落地：罚款 '+fmt(fine)+'、联赛扣 6 分、声望大跌。灰色账本该收手了。','bad');
    toast('被调查了！罚款扣分，热度暂降');
    return false;
  }
  return false;
}
/* ---------------- 时间推进：按天模拟 + 月末结算 ----------------
   玩家自选推进粒度：1 天 / 3 天 / 7 天 / 1 个月（连推三月、连推一年保留）。
   比赛只在赛程日开踢；伤病、体能按天恢复；工资、赞助、转播、集团板块、
   青训成长、颁奖这些月度/赛季结算仍在月末与赛季末统一走。 */
function dailyRecovery(){
  var medic=G.staff.some(function(x){ return x.role==='队医主管'; });
  G.squad.forEach(function(p){
    if(p.inj>0) p.inj=Math.max(0, p.inj-(medic?2:1)-(((G.train&&G.train.physio)||0)>=2?1:0)); // 队医主管恢复翻倍；顶级理疗再 +1 天/日
    p.fat=clamp((p.fat||0)-(p.rest?7:3)-((G.train&&G.train.intensity)==='恢复调养'?2:0),0,100); // 轮休恢复更快；恢复调养周全队体能回得更快
  });
}
function settleMonth(manual){
  G.relUsed={}; G.grayUsed={}; G.opsUsed={};
  if(G.scout) G.scout.used=0; G.mediaUsed=false; monthlySystems(); // 承诺兑现/食言、更衣室心情、董事会耐心都在这里月结
  var results=G.monthResults||[];
  opponentDrift(); worldNewsTick();
  var fin=monthlyFinance(results);
  G.lastFinance=fin; G.lastResults=results;
  processVentures();
  var wins=results.filter(function(r){ return r.res==='胜'; }).length;
  G.totalWins=(G.totalWins||0)+wins;
  var losses=results.filter(function(r){ return r.res==='负'; }).length;
  G.morale=clamp(G.morale + wins*4 - losses*5 + (G.coach.spec==='体能储备'?2:0), 5, 100);
  var fanCap=[150000,70000,32000][G.div];
  G.fans=Math.max(800, Math.min(fanCap, Math.round(G.fans*(1 + clamp((wins-losses)*0.02,-0.03,0.025) + 0.004 + ((G.fanSat==null?62:G.fanSat)-55)*0.0006) + (G.rel.fans>=60?300:0))));
  G.fanSat=clamp(Math.round((G.fanSat==null?62:G.fanSat) + (58-(G.fanSat==null?62:G.fanSat))*0.1),0,100); // 满意度每月向中位回归
  G.rep=clamp(G.rep + (myRank()<=2?2: myRank()>=7?-2:0) + (G.rel.media>=60?1:0), 0, 100);
  growPlayers();
  processYouth();
  refreshYouthCandidates();
  G.heat=clamp(G.heat-Math.max(3, Math.round(G.heat*0.12)),0,100); // 热度按比例消退：偶尔操作能凉下来，长期滥用必爆
  Object.keys(G.rel).forEach(function(k){ G.rel[k]=clamp(G.rel[k]-2,0,100); });
  if(G.grayWinBoost>0) G.grayWinBoost--;
  G.hist.push(Math.round(G.cash)); if(G.hist.length>61) G.hist.shift();
  var sum=results.map(function(r){ return (r.home?'主':'客')+' '+r.score+' '+r.opp+'('+r.res+')'; }).join(' · ');
  log('🗓️ '+G.mon+'月结算：战绩 '+wins+'胜'+(sum?'（'+sum+'）':'')+'｜门票 '+fmt(fin.gate)+' · 赞助 '+fmt(fin.sponsor)+' · 转播 '+fmt(fin.tv)+' ｜ 工资 '+fmt(fin.wages)+' · 运营 '+fmt(fin.ops)+'，本月净'+(fin.net>=0?'+':'')+fmt(fin.net)+'，现金 '+fmt(G.cash)+'。', wins>=2?'good':(losses>=2?'bad':''));
  G.monthResults=[]; G.monthGate=0; G.fixtures=null;
  if(G.cash<0){ G.negMonths++; if(G.negMonths>=2){ endGame('bankrupt'); return; } log('⚠️ 现金已为负数！再撑一个月还不上，俱乐部就要破产清算。','bad'); }
  else G.negMonths=0;
  if(checkInvestigation()){ return; }
  var isSeasonEnd=(G.mon===12);
  G.mon++; if(G.mon>12){ G.mon=1; G.year++; }
  G.month++;
  refreshMarket(); refreshOffers();
  scoutMissionArrive(); directorAct(); // 球探考察归队带回独家候选；足球总监按建队策略自动操作
  if(isSeasonEnd){ seasonSettle(); }
  if(manual && !G.ended && Math.random()<0.38){ showEvent(pick(EVENTS)); }
}
function advanceDays(n, manual){
  if(!G || G.ended) return;
  ensureFixtures();
  for(var i=0;i<n;i++){
    if(G.ended) break;
    G.day++; dailyRecovery();
    if(G.day>30){
      G.day=1;
      settleMonth(manual);
      if(G.ended) break;
      ensureFixtures();
    } else {
      var fx=null;
      if(G.fixtures) for(var j=0;j<G.fixtures.length;j++){ if(!G.fixtures[j].played && G.fixtures[j].day===G.day){ fx=G.fixtures[j]; break; } }
      if(fx) playFixture(fx);
      if(isWindow() && Math.random()<0.3){ refreshMarket(); log('📰 转会窗动态：市场名单刷新了一批人。窗口期签约费有折扣'+(isDeadline()?'，现在是压哨期，折扣最狠，手快有手慢无':'')+'，去转会市场看看。',''); }
    }
  }
}
function endMonth(auto){
  if(!G || G.ended) return;
  advanceDays(31-G.day, !auto);
  render();
}
function simDays(n){
  if(!G || G.ended) return;
  var m0=G.month;
  advanceDays(n, true);
  render();
  toast('已模拟 '+n+' 天 · 现在是 '+G.year+' 年 '+G.mon+' 月 '+G.day+' 日'+(G.month!==m0?'（已跨月结算）':''));
}
function simToNextMatch(){
  if(!G || G.ended) return;
  ensureFixtures();
  var fx=nextFixture();
  if(!fx){ endMonth(false); return; }
  advanceDays(Math.max(0, fx.day-G.day), true);
  render();
  toast(fx.cup? '🏆 足协杯比赛日到了，结果已出' : '⚽ 比赛日：'+(fx.home?'主场':'客场')+' vs '+fx.opp+(fx.tag?' · '+fx.tag:'')+'，结果已出');
}
function endGame(kind){
  G.ended=true; stopAuto();
  var v=valuation(); var rank=myRank(); var e;
  var effDiv=G.div; if(kind==='final' && rank<=2 && G.div>0) effDiv=G.div-1; // 最后一季压哨升级也算数
  if(kind==='bankrupt'){ e={grade:'D', title:'资金链断裂 · 破产清算', text:'工资发不出来，球员集体解约，俱乐部被托管拍卖。'+G.club+'的故事，在第 '+G.month+' 个月戛然而止。'}; }
  else if(kind==='caught'){ e={grade:'D', title:'东窗事发 · 禁赛重罚', text:'调查组带走了账本，俱乐部被取消注册资格。赢球的方式错了，赢多少场都不算数。'}; }
  else if(G.champion && v>=15000){ e={grade:'S', title: groupStage()>=4?'跨国体育帝国 · 王朝奠基':'豪门帝国 · 王朝奠基', text:'中超冠军奖杯在手，俱乐部估值 '+fmt(v)+'，球迷 '+fmtFans(G.fans)+'。你从中乙带出来的球队，成了别人眼里的豪门。'+(ventCount()? '旗下 '+ventCount()+' 个跨界板块横跨电竞、篮球与海外球队——这已经不只是一支球队，而是一个体育帝国。':'')}; }
  else if(G.champion){ e={grade:'A', title:'联赛冠军 · 登顶之夜', text:'你带队拿下了中超冠军！估值 '+fmt(v)+'。从第 1 个月的中乙小球会，到站在领奖台中央，你用了整整三年。'}; }
  else if(effDiv===0 && G.div===1){ e={grade:'A', title:'压哨冲超 · 梦圆顶级联赛', text:'最后一个赛季冲进前二，球队升上中超！估值 '+fmt(v)+'。三年两级跳，这支球队的故事才刚刚开始。'}; }
  else if(effDiv===0){ e={grade:'A', title:'顶级联赛 · 站稳脚跟', text:'球队在中超活了下来，最终排名第 '+rank+'，估值 '+fmt(v)+'。冠军还差一步，但没人再敢小看'+G.club+'。'}; }
  else if(effDiv===1 && G.div===2){ e={grade:'B', title:'压哨夺冠 · 升入中甲', text:'最后一个赛季拿下中乙前二，球队升入中甲，估值 '+fmt(v)+'。中超还远，但这一步迈出去了。'}; }
  else if(effDiv===1){ e={grade:'B', title:'中甲劲旅 · 只差临门一脚', text:'三年带队打到中甲前列，估值 '+fmt(v)+'，最终排名第 '+rank+'。中超的大门已经能看见了，就差最后一个赛季。'}; }
  else if(G.div===2 && rank<=4){ e={grade:'C', title:'中乙劲旅 · 升级未果', text:'球队常年前四却总差一口气，估值 '+fmt(v)+'。球迷还在，故事只能交给下一个三年。'}; }
  else { e={grade:'C', title:'小城球队 · 平凡三年', text:'没有破产，也没有奇迹。估值 '+fmt(v)+'，最终排名第 '+rank+'。这支球队还在踢，这本身就是很多小俱乐部的全部。'}; }
  G.ending=e;
  log('🎬 结局【'+e.title+'】评级 '+e.grade+'：'+e.text,'good');
}
</script>
<script>
"use strict";
/* ---------------- 操作 ---------------- */
function go(p){ PAGE=p; render(); window.scrollTo(0,0); }
function buyPlayer(i){
  var p=G.market[i]; if(!p) return;
  if(G.director && G.director.mode==='none'){ toast('当前是「零引援」建队策略：只靠原阵容和青训。去转会页把策略改掉才能买人。'); return; }
  if(G.board && G.board.frozen>0){ toast('董事会冻结了本月预算，先把成绩打回来，下个月再买。'); return; }
  if(G.cash<p.price){ toast('现金不够，还差 '+fmt(p.price-G.cash)); return; }
  if(G.squad.length>=22){ toast('一线队名额已满（22人），先卖掉球员'); return; }
  G.cash-=p.price; p.cost=p.price; p.signNote=''; G.squad.push(p); G.market.splice(i,1);
  log('✍️ 签下'+p.pos+' '+p.name+'（能力 '+p.ab+'），签约费（转会费）'+fmt(p.price)+'，当前身价 '+fmt(p.value)+'，月薪 '+p.wage+'万。这笔签约价会一直记在他的档案里，卖出时能看到赚了还是亏了。','good');
  toast('签下 '+p.name); render();
}
function sellPlayer(i){
  var o=G.offers[i]; if(!o) return;
  if(G.squad.length<=12){ toast('阵容太薄了，不能再卖'); return; }
  var idx=G.squad.indexOf(o.player); if(idx<0){ G.offers.splice(i,1); render(); return; }
  var pr=signProfit(o.player, o.price);
  G.cash+=o.price; G.squad.splice(idx,1); G.offers.splice(i,1);
  log('💸 '+o.player.name+' 以 '+fmt(o.price)+' 转会离队（'+o.from+'）。当初签约价 '+fmtSign(o.player)+'，这笔交易'+(pr>=0?'赚了 +':'亏了 ')+fmt(pr)+'。','');
  toast('卖出 '+o.player.name+' +'+fmt(o.price)+'（'+(pr>=0?'赚':'亏')+' '+fmt(Math.abs(pr))+'）'); render();
}
function releasePlayer(name){
  var idx=-1; G.squad.forEach(function(p,i){ if(p.name===name) idx=i; });
  if(idx<0) return;
  if(G.squad.length<=12){ toast('阵容太薄，不能再解约'); return; }
  var p=G.squad[idx]; G.squad.splice(idx,1);
  log('👋 与 '+p.name+' 解约，省下月薪 '+p.wage+'万。','');
  render();
}
function setFocus(f){ G.focus=f; log('🎯 训练重点调整为：'+f+'。',''); render(); }
function hireCoach(i){
  var c=COACH_POOL[i];
  var fee=Math.round(c.wage*3);
  if(G.cash<fee){ toast('签约费不够'); return; }
  G.cash-=fee;
  log('🧢 换帅：'+G.coach.name+' 下课，'+c.name+' 上任（'+c.spec+'），签约费 '+fmt(fee)+'。','');
  G.coach={name:c.name, spec:c.spec, ab:c.ab, wage:c.wage};
  G.morale=clamp(G.morale+5,0,100);
  render();
}
function hireStaff(i){
  var s=STAFF_POOL[i];
  if(G.staff.some(function(x){ return x.role===s.role; })){ toast('该岗位已有人了'); return; }
  var fee=Math.round(s.wage*3);
  if(G.cash<fee){ toast('签约费不够'); return; }
  G.cash-=fee; G.staff.push({name:s.name, role:s.role, wage:s.wage});
  log('🧑‍💼 '+s.name+' 入职担任'+s.role+'，月薪 '+s.wage+'万。','good');
  render();
}
function fireStaff(role){
  G.staff=G.staff.filter(function(x){ return x.role!==role; });
  log('🧑‍💼 '+role+' 离职，月薪支出减少。',''); render();
}
function relAct(id, kind){
  if(G.relUsed[id]){ toast('本月已经和 TA 打过交道了'); return; }
  var cost= kind==='meal'? 15 : 50;
  if(G.cash<cost){ toast('现金不够'); return; }
  G.cash-=cost; G.relUsed[id]=true;
  var gain= kind==='meal'? 7 : 16;
  G.rel[id]=clamp(G.rel[id]+gain,0,100);
  var r=RELS.filter(function(x){ return x.id===id; })[0];
  log((kind==='meal'?'🍽️ 请 ':'🤝 与 ')+r.name+'（'+r.role+'）'+(kind==='meal'?'吃了顿饭':'谈成一项合作')+'，关系 +'+gain+' → '+G.rel[id]+'。','');
  render();
}
function grayAct(kind){
  if(G.grayUsed[kind]){ toast('本月已经操作过这一项了'); return; }
  G.grayUsed[kind]=true;
  if(kind==='kickback'){
    var amt=ri(60,150); G.cash+=amt; G.heat=clamp(G.heat+10,0,100);
    log('🕶️ 引援返佣：经纪人退回 '+fmt(amt)+' 到账外账户。纪检热度 +10 → '+G.heat+'。','bad');
  } else if(kind==='contract'){
    var save=Math.round(wagesTotal()*0.4); G.cash+=save; G.heat=clamp(G.heat+8,0,100);
    log('🕶️ 阴阳合同：账面工资做低，省下 '+fmt(save)+'。纪检热度 +8 → '+G.heat+'。','bad');
  } else if(kind==='fix'){
    G.grayWinBoost=1; G.heat=clamp(G.heat+16,0,100);
    log('🕶️ 默契球安排上了：本月比赛强度暗中 +7。纪检热度 +16 → '+G.heat+'。','bad');
  } else if(kind==='poach'){
    var p=genPlayer('young'); p.ab=ri(50,58); p.pot=ri(78,90); p.cost=0; p.signNote='违规挖角（免签）'; G.squad.push(p); G.heat=clamp(G.heat+12,0,100);
    log('🕶️ 违规挖角：从别家青训营带走小将 '+p.name+'（潜力 '+p.pot+'）。纪检热度 +12 → '+G.heat+'。','bad');
  }
  render();
}
var FACDEF=[
  {id:'stadium', name:'主场球场', icon:'🏟️', desc:'每升一级：门票收入 +9%，球迷口碑更好。'},
  {id:'academy', name:'青训营', icon:'🌱', desc:'每升一级：年轻球员成长概率提升，梯队更出人才。'},
  {id:'training', name:'训练基地', icon:'🏋️', desc:'每升一级：全队比赛强度 +0.8，球员涨球更快。'},
  {id:'medical', name:'医疗中心', icon:'🏥', desc:'每升一级：伤病概率下降，老将状态保持更好。'},
  {id:'data', name:'数据分析中心', icon:'📊', desc:'每升一级：球探报告更完整（潜力区间更准）、球队强度 +0.4，足球总监更不容易看走眼。'}
];
function facCost(lv){ return Math.round(150*Math.pow(lv+1,1.6)); }
function upgradeFac(id){
  var lv=G.fac[id]||0; if(lv>=5){ toast('已经满级'); return; }
  if(G.board && G.board.frozen>0){ toast('董事会冻结了本月预算，设施升级也要等下个月。'); return; }
  var cost=facCost(lv);
  var grant=false;
  if(G.board && G.board.facGrant){ cost=Math.round(cost/2); grant=true; } // 董事会设施拨款：半价
  if(G.cash<cost){ toast('现金不够，还差 '+fmt(cost-G.cash)); return; }
  G.cash-=cost; G.fac[id]=lv+1;
  if(grant) G.board.facGrant=false;
  var f=FACDEF.filter(function(x){ return x.id===id; })[0];
  log('🏗️ '+f.name+' 升到 '+G.fac[id]+' 级，花费 '+fmt(cost)+(grant?'（用了董事会设施拨款，半价）':'')+'。','good');
  render();
}
/* ---- 集团扩张操作 ---- */
function buyVenture(id){
  var d=ventDef(id); if(!d || hasVent(id)) return;
  var req=ventReqOK(d); if(req){ toast(req); return; }
  if(G.cash<d.cost){ toast('现金不够，还差 '+fmt(d.cost-G.cash)); return; }
  if(!G.ventures) G.ventures={};
  G.cash-=d.cost; G.ventures[id]=1;
  log('🏢 集团扩张：'+d.name+'正式成立！投入 '+fmt(d.cost)+'，集团从此多了一条业务线（当前阶段：'+STAGES[groupStage()].name+'）。','good');
  toast(d.name+' 成立！'); render();
}
function upgradeVenture(id){
  var d=ventDef(id); if(!d || !G.ventures) return;

function autoStep(){
  if(!autoOn || !G || G.ended){ stopAuto(); return; }
  // 简单经营策略：缺人补强、现金多升级、关系低维护
  var sorted=G.squad.slice().sort(function(a,b){ return a.ab-b.ab; });
  var weakest=sorted.length? sorted[0].ab : 0;
  for(var i=0;i<G.market.length;i++){
    var p=G.market[i];
    if(p.ab>=weakest+4 && G.cash>p.price+300 && G.squad.length<20){ buyPlayerSilent(i); break; }
  }
  if(G.rel.sponsor<40 && G.cash>200) relActSilent('sponsor');
  // 青训托管：达标小将自动提拔，梯队有空位且现金宽裕时自动签潜力最高的候选
  if(G.youth && G.squad.length<20){
    var ready=G.youth.filter(function(p){ return p.age>=16 && p.ab>=52; }).sort(function(a,b){ return b.ab-a.ab; })[0];
    if(ready){ G.youth=G.youth.filter(function(q){ return q!==ready; }); promoteYouthSilent(ready); G.youthPromoted=(G.youthPromoted||0)+1; youthLog('🎓 自动经营：'+ready.name+' 达标，提拔进一线队。'); log('🤖 自动经营：青训小将 '+ready.name+'（能力 '+ready.ab+'）提拔进一线队。',''); }
  }
  if(G.youth && G.youthCandidates && G.youth.length<youthCap()-2 && G.cash>400){
    var cand=G.youthCandidates.slice().sort(function(a,b){ return b.pot-a.pot; })[0];
    if(cand && cand.pot>=78){ var cfee=cand.fee||youthSignFee(cand); if(G.cash>cfee+300){ G.cash-=cfee; G.youthCandidates.splice(G.youthCandidates.indexOf(cand),1); G.youth.push({name:cand.name,pos:cand.pos,age:cand.age,ageM:cand.ageM||0,ab:cand.ab,pot:cand.pot,trait:cand.trait,plan:'均衡培养',months:0,inj:0,source:cand.source,id:cand.id}); log('🤖 自动经营：签下青训苗子 '+cand.name+'（潜力 '+cand.pot+'），培养费 '+fmt(cfee)+'。',''); } }
  }
  if(ventCount()<9){
    for(var vi=0; vi<VENTURES.length; vi++){
      var vd=VENTURES[vi];
      if(!hasVent(vd.id) && !ventReqOK(vd) && G.cash>vd.cost+700){ buyVentureSilent(vd); break; }
    }
  }
  endMonth(true);
  render();
}
function buyPlayerSilent(i){ var p=G.market[i]; G.cash-=p.price; p.cost=p.price; p.signNote=''; G.squad.push(p); G.market.splice(i,1); log('🤖 自动经营：签下 '+p.name+'（能力 '+p.ab+'），签约费 '+fmt(p.price)+'。',''); }
function relActSilent(id){ if(G.relUsed[id]) return; G.cash-=15; G.relUsed[id]=true; G.rel[id]=clamp(G.rel[id]+7,0,100); }
function buyVentureSilent(d){ if(!G.ventures) G.ventures={}; G.cash-=d.cost; G.ventures[d.id]=1; log('🤖 自动经营：成立'+d.name+'，投入 '+fmt(d.cost)+'，集团板块 +1。',''); }
function startAuto(){ if(!G||G.ended) return; autoOn=true; autoTimer=setInterval(autoStep, 650); render(); }
function stopAuto(){ autoOn=false; if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } }
function toggleAuto(){ if(autoOn){ stopAuto(); render(); } else startAuto(); }
function endThree(){ if(!G||G.ended) return; for(var i=0;i<3 && !G.ended;i++) endMonth(true); render(); toast('已连推三个月'); }
function endYear(){ if(!G||G.ended) return; for(var i=0;i<12 && !G.ended;i++) endMonth(true); render(); toast('已连推一整年（12 个月）· 当前第 '+G.month+' 个月，赛季无限循环，想玩多久玩多久'); }
function restart(){ stopAuto(); clearAutoSave(); G=null; PAGE='home'; showStart(); render(); }

function pageEmpire(){
  var s=groupStage();
  var cards=VENTURES.map(function(d){
    var lv=(G.ventures && G.ventures[d.id])||0;
    var req=ventReqOK(d);
    var head='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;"><span class="nm">'+d.icon+' '+d.name+'</span><span class="pill">'+d.sector+' · '+STAGES[d.stage].name+'解锁</span></div>'
    +'<div class="ben">'+d.desc+'</div>'
    +'<div class="ben" style="color:var(--ink);">💡 '+d.fx+'</div>'
    +'<div class="mini">投入 '+fmt(d.cost)+' · 月支出 '+fmt(d.upkeep)+' · 月收入约 '+fmt(d.inc[0])+'~'+fmt(d.inc[1])+(d.id==='brand'?'+球迷加成':'')+' · 计入集团估值</div>';
    var act='';
    if(lv>0){
      var upCost=Math.round(d.cost*0.8*lv);
      act='<div class="acts"><span class="pill up">运营中 · '+lv+' 级</span>'+(lv>=3?'<span class="pill">已扩到顶级规模</span>':'<button class="btn sm" onclick="upgradeVenture(\''+d.id+'\')">扩建到 '+(lv+1)+' 级 · '+fmt(upCost)+'</button>')+'</div>';
    } else if(req){
      act='<div class="acts"><button class="btn sm" disabled>🔒 未解锁</button><span class="mini">'+req+'</span></div>';
    } else {
      act='<div class="acts"><button class="btn pri sm" onclick="buyVenture(\''+d.id+'\')">成立 · '+fmt(d.cost)+'</button><span class="mini">现金 '+fmt(G.cash)+'</span></div>';
    }
    return '<div class="rel-card">'+head+act+'</div>';
  }).join('');
  return '<div class="kpis">'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--orange)"></span>集团阶段</div><div class="vl" style="font-size:20px;">'+STAGES[s].name+'</div><div class="sub">第 '+(s+1)+' / 5 阶段</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--blue)"></span>旗下板块</div><div class="vl num">'+ventCount()+' <span style="font-size:14px;color:var(--ink3)">/ '+VENTURES.length+'</span></div><div class="sub">足球 · 电竞 · 篮球 · 品牌…</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--green)"></span>板块估值</div><div class="vl num">'+fmt(venturesValue())+'</div><div class="sub">已计入俱乐部总估值 '+fmt(valuation())+'</div></div>'
  +'<div class="kpi"><div class="lb"><span class="dot" style="background:var(--gold)"></span>板块上月净额</div><div class="vl num" style="'+(G.ventureNet<0?'color:var(--red)':'')+'">'+(G.ventureNet>=0?'+':'')+fmt(G.ventureNet||0)+'</div><div class="sub">每月随主队账目一起结算</div></div>'
  +'</div>'
  + stageCardHTML(false)
  +'<div class="card"><h3><span class="no">扩张</span>跨界板块<span class="hint">像创业一样一步一步来：先站稳联赛，再开副业，最后铺向海外</span></h3>'
  +'<p class="desc">每个板块成立后每月自动结算收入和支出，等级越高盘子越大（最高 3 级）。板块估值计入俱乐部总估值——冲 S 级「豪门帝国」不只靠夺冠，集团做大了同样算数。注意别在现金紧张时贪多，板块的月支出可是雷打不动的。</p>'
  +'<div class="rel-grid">'+cards+'</div></div>';
}
function scheduleCardHTML(){
  ensureFixtures();
  var rows=(G.fixtures||[]).map(function(fx){
    if(fx.cup) return '<div class="fx-row"><span class="fd num">'+G.mon+'月'+fx.day+'日</span><span class="fo">🏆 足协杯 · 主场迎战高一级联赛球队</span>'+(fx.played?'<span class="pill up">已赛</span>':'<span class="pill">待赛</span>')+'</div>';
    var r=fx.result;
    return '<div class="fx-row"><span class="fd num">'+G.mon+'月'+fx.day+'日</span><span class="fo">'+(fx.home?'主场':'客场')+' vs '+esc(fx.opp)+(fx.tag?' · '+fx.tag:'')+'</span>'+(r? '<span class="pill '+(r.res==='胜'?'up':(r.res==='负'?'dn':''))+'">'+r.score+' '+r.res+'</span>' : '<span class="pill">待赛</span>')+'</div>';
  }).join('');
  var nf=nextFixture();
  return '<div class="card"><h3><span class="no">赛程</span>本月赛程<span class="hint">'+G.year+' 年 '+G.mon+' 月 · 今天 '+G.day+' 日 · 每月 3 场联赛分散在全月，不会扎堆</span></h3>'+rows
  +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;"><button class="btn sm" onclick="simDays(1)">模拟 1 天</button><button class="btn sm" onclick="simDays(3)">模拟 3 天</button><button class="btn sm" onclick="simDays(7)">模拟 7 天</button>'+(nf?'<button class="btn pri sm" onclick="simToNextMatch()">直达下一场（'+G.mon+'月'+nf.day+'日）</button>':'')+'<button class="btn sm" onclick="endMonth(false)">结束本月</button></div>'
  +'<p class="mini" style="margin-top:8px;">推进粒度随你选：按天慢慢过、直达下一场，或整月结算。门票在比赛日当天入账（球迷满意度越高卖得越好）；工资、赞助、转播在月末统一结算。赛前部署在「运营活动」页，只对下一场生效。</p></div>';
}
function pageHome(){
  var fin=G.lastFinance;
  var finHTML= fin? '<div class="item"><div class="grow"><div class="nm">上月账目</div><div class="meta">门票 '+fmt(fin.gate)+' · 赞助 '+fmt(fin.sponsor)+' · 转播 '+fmt(fin.tv)+' ｜ 工资 '+fmt(fin.wages)+' · 运营 '+fmt(fin.ops)+' · 利息 '+fmt(fin.interest)+'</div></div><b class="num" style="color:'+(fin.net>=0?'var(--green-d)':'var(--red)')+'">'+(fin.net>=0?'+':'')+fmt(fin.net)+'</b></div>' : '<p class="desc">本月比赛按赛程逐场踢：门票当天入账，月末统一发工资、结赞助和转播。</p>';
  var resHTML= G.lastResults.length? G.lastResults.map(function(r){ return '<div class="item"><span class="pill '+(r.res==='胜'?'up':(r.res==='负'?'dn':''))+'">'+r.res+'</span><div class="grow"><div class="nm num">'+esc(G.club)+' '+r.score+' '+esc(r.opp)+'</div><div class="meta">'+(r.home?'主场':'客场')+'</div>'+(r.scorers&&r.scorers.length?'<div class="scorer-line">⚽ 进球：'+r.scorers.map(function(n){ return esc(n); }).join('、')+'</div>':'')+'</div></div>'; }).join('') : '<p class="desc">本赛季还没有比赛记录。</p>';
  var warn='';
  if(G.heat>=60) warn+='<div class="warn-strip">🚨 纪检热度已达 '+G.heat+'：随时可能被调查，罚款、扣分甚至取消资格。去灰色账本收手，或者到充值中心找危机公关。</div>';
  if(G.cash<300) warn+='<div class="warn-strip">💸 现金只剩 '+fmt(G.cash)+'：工资快发不出来了。可以卖球员、去俱乐部页借银行授信，或到转会市场回血。</div>';
  if(G.youth){ var prY=G.youth.filter(function(p){ return p.age>=16 && p.ab>=50; }); if(prY.length) warn+='<div class="ok-strip">🌱 青训提醒：'+prY.length+' 名小将已达提拔门槛（'+prY.map(function(p){return p.name+' '+p.ab;}).join('、')+'），去「青训体系」页把他们提拔进一线队，签约价 0。梯队现有 '+G.youth.length+' 人。</div>'; }
  var goal='';
  if(G.div===2) goal='当前目标：赛季结束冲进前 2，升上中甲。';
  else if(G.div===1) goal='当前目标：赛季结束冲进前 2，升上中超。';
  else if(!G.champion) goal='当前目标：拿下中超第 1，把冠军奖杯带回家。';
  else goal='🏆 已夺冠（累计 '+(G.titles||0)+' 冠）！继续卫冕、扩集团、打杯赛，把王朝评级冲到 S。';
  if(G.boardTarget) goal+=' 董事会目标：'+G.boardTarget.desc+'（达成奖金 '+fmt(G.boardTarget.bonus)+'）。';
  goal+=' 当前战术：'+(G.tactic||'均衡攻守')+'（在「运营活动」页切换）。';
  return kpiHTML()+warn+stadiumHTML()+stageCardHTML(true)+scheduleCardHTML()
  +'<div class="grid-main"><div>'
  +'<div class="card"><h3><span class="no">1/3</span>最近赛果<span class="hint">'+goal+'</span></h3>'+resHTML+finHTML+'</div>'
  +'<div class="card"><h3><span class="no">2/3</span>经营动态</h3><div class="log">'+(G.log.slice(0,10).map(function(l){ return '<div class="it '+l.cls+'"><span class="dt num">'+l.m+'</span><span>'+l.t+'</span></div>'; }).join('')||'<p class="desc">暂无动态。</p>')+'</div></div>'
  +'</div><div>'
  +'<div class="card"><h3>'+DIVS[G.div].short+'积分榜</h3>'+tableHTML()+'<p class="mini" style="margin-top:8px;">每赛季 12 个月；前 2 名升级、后 2 名降级（中乙不再降）；每年 6 月还有一场足协杯。没有强制结局：赛季无限循环，冠军、杯赛、成就与王朝评级一直累计，想玩多久玩多久。</p></div>'
  +'<div class="card"><h3>现金走势</h3>'+chartHTML()+'</div>'
  +'</div></div>';
}
</script>
<script>
"use strict";
/* ---------------- 各页面 ---------------- */
function abBar(p){
  return '<div class="ab-wrap"><div class="bar '+(p.ab>=75?'g':(p.ab>=62?'':'o'))+'"><i style="width:'+p.ab+'%"></i></div><b class="num">'+p.ab+'</b></div>';
}
function posPill(pos){ var c= pos==='前锋'?'fw': pos==='中场'?'mf': pos==='后卫'?'df':'gk'; return '<span class="pill '+c+'">'+pos+'</span>'; }
function pageMarket(){
  var buy=G.market.map(function(p,i){
    var r=scoutReportFor(p);
    return '<div class="item"><div class="grow"><div class="nm">'+esc(p.name)+(p.foreign?' <span class="pill">外援</span>':'')+' '+posPill(p.pos)+'</div><div class="meta">'+p.age+' 岁 · 潜力 '+p.pot+' · 月薪 '+p.wage+'万 · 当前身价 '+fmt(p.value)+'</div>'
    +(r? '<div class="meta">🔭 球探报告：适配度 <b>'+r.fit+'/100</b> · 真实潜力约 '+r.potLo+'~'+r.potHi+' · '+r.verdict+'</div>' : '<div class="meta">🔭 暂无球探报告：标称潜力是经纪人嘴里的话，派球探实地看过（8万/份）才算数。</div>')
    +'</div>'+abBar(p)+'<div style="text-align:right;"><div class="mini">签约费（转会费）</div><div class="num" style="font-weight:800;">'+fmt(p.price)+'</div>'+(r?'':'<button class="btn sm" onclick="scoutPlayer('+i+')">情报 · 8万</button> ')+'<button class="btn pri sm" onclick="buyPlayer('+i+')">签下</button></div></div>';
  }).join('') || '<p class="desc">本月市场已空，下个月刷新。</p>';
  var sell=G.offers.map(function(o,i){
    var pr=signProfit(o.player, o.price);
    return '<div class="item"><div class="grow"><div class="nm">'+esc(o.player.name)+' '+posPill(o.player.pos)+'</div><div class="meta">'+o.from+' 报价 · <b>当初签约价 '+fmtSign(o.player)+'</b> · 当前身价 '+fmt(o.player.value)+' · 月薪 '+o.player.wage+'万 · 这笔卖出'+(pr>=0?'<span style="color:var(--green-d);font-weight:700;">赚 +'+fmt(pr)+'</span>':'<span style="color:var(--red);font-weight:700;">亏 '+fmt(pr)+'</span>')+'</div></div>'+abBar(o.player)+'<div style="text-align:right;"><div class="mini">对方报价</div><div class="num" style="font-weight:800;">'+fmt(o.price)+'</div><button class="btn sm" onclick="sellPlayer('+i+')">卖出</button></div></div>';
  }).join('') || '<p class="desc">暂时没人给你的球员报价，赢球涨身价后自然有人来。</p>';
  var winBanner= isWindow()
    ? '<div class="ok-strip" style="margin-bottom:10px;">🪟 转会窗（'+(G.mon===1?'冬窗':'夏窗')+'）开启中 · 还剩 '+windowDaysLeft()+' 天'+(isDeadline()?' · <b>压哨期！全场挂牌价已打八折，窗口关门前最后的机会</b>':' · 窗口期挂牌价九二折，每天有新面孔上架')+'</div>'
    : '<div class="item" style="margin-bottom:10px;"><div class="grow"><div class="nm">🪟 转会窗未开启</div><div class="meta">冬窗 1 月 / 夏窗 7 月开启：人数更多、必有好货、价格打折，最后 3 天压哨八折。距离下个窗口还有 '+daysToWindow()+' 天。窗口外市场照常营业，就是不打折、不上新。</div></div></div>';
  return winBanner+'<div class="card"><h3><span class="no">转会</span>球员市场<span class="hint">每月刷新 · 现金 '+fmt(G.cash)+' · 阵容 '+G.squad.length+'/22</span></h3><p class="desc">买人看能力与潜力：能力决定现在的战绩，潜力决定年轻球员能涨多高。外援和明星球员贵，但能直接把球队抬一个档次。每名球员的<b>签约价会被记进档案</b>：以后卖他的时候，报价旁边会直接标出当初多少钱签的、这笔买卖赚了还是亏了（阵容页也能查每个人的签约价）。</p>'+buy+'</div>'
  +'<div class="card"><h3><span class="no">卖出</span>收到的报价<span class="hint">每笔报价都标了当初签约价和卖出盈亏</span></h3>'+sell+'</div>'+directorCardHTML();
}
function pageOps(){
  var bt=G.boardTarget;
  var boardHTML= bt? '<div class="item"><div class="grow"><div class="nm">📋 本赛季目标：'+bt.desc+'</div><div class="meta">达成奖金 '+fmt(bt.bonus)+' · 赛季末（12 月）结算 · 当前 '+DIVS[G.div].short+'第 '+myRank()+' 名</div></div><span class="pill">进行中</span></div>' : '<p class="desc">暂无目标。</p>';
  var tacHTML=TACTICS.map(function(t){
    var on=(G.tactic||'均衡攻守')===t.id;
    return '<div class="item"><div class="grow"><div class="nm">'+t.id+(on?' <span class="pill up">使用中</span>':'')+'</div><div class="meta">'+t.ds+'</div></div>'+(on?'':'<button class="btn sm" onclick="setTactic(\''+t.id+'\')">切换</button>')+'</div>';
  }).join('');
  var opsHTML=OPS.map(function(o){
    var used=G.opsUsed && G.opsUsed[o.id];
    return '<div class="rel-card"><div class="nm">'+o.icon+' '+o.nm+'</div><div class="ben">'+o.ds+'</div><div class="mini">费用 '+fmt(o.cost)+' · 每月限办 1 次</div><div class="acts"><button class="btn '+(used?'':'pri')+' sm" '+(used?'disabled':'')+' onclick="opsAct(\''+o.id+'\')">'+(used?'本月已办':'举办 · '+fmt(o.cost))+'</button></div></div>';
  }).join('');
  var nfx=nextFixture();
  var prepHTML=PREPS.map(function(p){
    var on=G.prep && G.prep.type===p.type;
    return '<div class="rel-card"><div class="nm">'+p.icon+' '+p.nm+(on?' <span class="pill up">已部署</span>':'')+'</div><div class="ben">'+p.ds+'</div><div class="acts">'+(on?'<button class="btn sm" onclick="clearPrep()">取消部署</button>':'<button class="btn pri sm" onclick="setPrep(\''+p.type+'\')">部署这场</button>')+'</div></div>';
  }).join('');
  var prepCard='<div class="card"><h3><span class="no">部署</span>赛前部署<span class="hint">'+(nfx? '下一场：'+G.mon+'月'+nfx.day+'日 · '+(nfx.home?'主场':'客场')+' vs '+esc(nfx.opp)+(nfx.tag?' · '+nfx.tag:'') : '本月比赛已踢完')+'</span></h3>'
  +'<p class="desc">比赛开踢前最后能做的事：只对<b>下一场</b>生效，踢完自动清空，下一场要重新部署。跟战术体系（长期）不是一回事——战术管整个赛季的打法，部署管这一场的临场状态。</p>'
  +'<div class="rel-grid">'+prepHTML+'</div></div>';
  return '<div class="card"><h3><span class="no">目标</span>董事会赛季目标</h3>'+boardHTML+'<p class="desc" style="margin-top:8px;">每个赛季董事会都会下目标：低级别要升级，到了中超就要夺冠。达成有奖金和声望，落空会被扣声望、流失球迷——但不会强制结束游戏，下赛季接着打。</p></div>'
  +'<div class="card"><h3><span class="no">战术</span>战术体系<span class="hint">当前：'+(G.tactic||'均衡攻守')+' · 每场比赛按此结算</span></h3>'+tacHTML+'</div>'
  + prepCard
  +'<div class="card"><h3><span class="no">活动</span>运营活动<span class="hint">每项每月限办 1 次 · 现金 '+fmt(G.cash)+'</span></h3><p class="desc">比赛之外也能经营：办活动涨球迷、赚外快、挖苗子。每月四项都能办一遍，是中乙小球队早期回血和攒球迷的好路子。</p><div class="rel-grid">'+opsHTML+'</div></div>'
  +'<div class="card"><h3><span class="no">杯赛</span>足协杯<span class="hint">已赢下关键战 '+(G.cupWins||0)+' 次</span></h3><p class="desc">每个赛季的 6 月自动打一场足协杯，对手是高一级联赛的球队：赢了拿高额奖金（中乙赢球 +250万 / 中甲 +500万 / 中超 +1200万）+声望，平局踢点球。用「防守反击」战术爆冷的概率更高。</p></div>';
}
/* ---------------- 阵容球场：阵型图（球场上印着每名首发的位置、名字与踢的位置） ---------------- */
var FORMATIONS={'4-3-3':{DF:4,MF:3,FW:3},'4-4-2':{DF:4,MF:4,FW:2},'4-2-3-1':{DF:4,MF:5,FW:1},'3-5-2':{DF:3,MF:5,FW:2},'5-3-2':{DF:5,MF:3,FW:2},'3-4-3':{DF:3,MF:4,FW:3}};
var POS_ORDER={'门将':0,'后卫':1,'中场':2,'前锋':3};
function setFormation(f){ G.formation=f; log('🧭 阵型切换为 '+f+'，球场上的首发站位已按新阵型排好。',''); render(); }
function jerseyNumbers(){
  var sorted=G.squad.slice().sort(function(a,b){ return (POS_ORDER[a.pos]-POS_ORDER[b.pos]) || b.ab-a.ab; });
  var map={}; sorted.forEach(function(p,i){ map[p.name]=i+1; });
  return map;
}
function pickLineup(){
  var F=FORMATIONS[G.formation||'4-3-3']||FORMATIONS['4-3-3'];
  var need={'门将':1,'后卫':F.DF,'中场':F.MF,'前锋':F.FW};
  var groups={'门将':[],'后卫':[],'中场':[],'前锋':[]};
  G.squad.forEach(function(p){ (groups[p.pos]||groups['中场']).push(p); });
  Object.keys(groups).forEach(function(k){ groups[k].sort(function(a,b){ return ((a.inj>0)-(b.inj>0)) || ((a.rest?1:0)-(b.rest?1:0)) || effAb(b)-effAb(a); }); });
  var used={}, slots=[];
  ['门将','后卫','中场','前锋'].forEach(function(pos){
    groups[pos].slice(0,need[pos]).forEach(function(p){ used[p.name]=1; slots.push({p:p, slot:pos}); });
  });
  // 某个位置人数不够时，从其余位置能力最高的人里补位（图上会标出他实际踢的位置）
  ['门将','后卫','中场','前锋'].forEach(function(pos){
    var have=slots.filter(function(s){ return s.slot===pos; }).length;
    while(have<need[pos]){
      var rest=G.squad.filter(function(p){ return !used[p.name]; }).sort(function(a,b){ return ((a.rest?1:0)-(b.rest?1:0)) || effAb(b)-effAb(a); });
      if(!rest.length) break;
      used[rest[0].name]=1; slots.push({p:rest[0], slot:pos}); have++;
    }
  });
  // 排坐标：球场竖版，上方是进攻方向。前锋 y=15，门将 y=88
  function rowY(slot, count, idxInRow){
    if(slot==='门将') return 88;
    if(slot==='后卫') return 69;
    if(slot==='前锋') return 15;
    return count===5? (idxInRow<3? 38:57) : 43; // 中场 5 人时分两排：前腰排 + 后腰排
  }
  var bySlot={};
  slots.forEach(function(s){ (bySlot[s.slot]=bySlot[s.slot]||[]).push(s); });
  Object.keys(bySlot).forEach(function(slot){
    var row=bySlot[slot];
    var front=null, back=null;
    if(slot==='中场' && row.length===5){ front=row.slice(0,3); back=row.slice(3); }
    function place(r, y){
      r.forEach(function(s,i){ s.x=Math.round((i+1)*100/(r.length+1)); s.y=y; });
    }
    if(front){ place(front,38); place(back,57); }
    else place(row, rowY(slot,row.length,0));
  });
  return slots;
}

function cnClubHonors(name, divIdx){
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%997;
  var parts=[];
  if(divIdx===0){
    var t=h%4, c=(h>>2)%3;
    if(t) parts.push('联赛冠军 ×'+t);
    if(c) parts.push('足协杯冠军 ×'+c);
    parts.push('队史最佳排名 第 '+(1+(h>>3)%3)+' 名');
    if((h>>4)%2) parts.push('亚冠参赛经历');
  } else if(divIdx===1){
    if((h>>2)%2) parts.push('中乙冠军 ×1');
    parts.push('冲超成功 ×'+(1+(h>>3)%2));
    parts.push('队史最佳排名 中甲第 '+(2+(h>>4)%5)+' 名');
  } else {
    parts.push('地区联赛冠军 ×'+(1+h%3));
    parts.push('队史最佳排名 中乙第 '+(3+(h>>3)%5)+' 名');
  }
  parts.push('建队 '+(1988+h%30)+' 年');
  return parts.join(' · ');
}
function starById(id){ var f=null; STARS.forEach(function(s){ if(s.id===id) f=s; }); return f; }
function starWage(ab){ return Math.round(Math.max(0.4, Math.pow(Math.max(ab-40,2),2)*0.016)*10)/10; }
function starInSquad(s){ return G.squad.some(function(p){ return p.star===s.id || p.name===s.name; }); }
function signStar(id){
  var s=starById(id); if(!s) return;
  if(starInSquad(s)){ toast(s.name+' 已经在你的球队里了'); return; }
  if(G.squad.length>=22){ toast('一线队名额已满（22人），先卖掉或解约一名球员'); return; }
  if(G.cash<s.fee){ toast('现金不够签 '+s.name+'，还差 '+fmt(s.fee-G.cash)+'——先冲上中超、多夺冠攒钱'); return; }
  G.cash-=s.fee;
  var p=mkPlayer(s.name, s.pos, s.ab, s.age, s.league!=='中超');
  p.pot=Math.min(99, s.ab + (s.age<=23?5:1));
  p.cost=s.fee; p.signNote='球星签约 · '+s.club; p.star=s.id; p.img=s.img;
  G.squad.push(p);
  var fanAdd= s.league==='中超'? 6000 : 20000;
  G.fans+=fanAdd; G.rep=clamp(G.rep+(s.league==='中超'?2:4),0,100);
  log('⭐ 重磅签约！'+s.name+'（'+s.club+' · '+s.league+'）以 '+fmt(s.fee)+' 加盟 '+G.club+'！能力 '+s.ab+'，月薪 '+p.wage+'万。消息一出，球迷 +'+fanAdd.toLocaleString('zh-CN')+'，声望上涨。接下来就看他在场上进球了。','good');
  toast('签下 '+s.name+'！去首页开始比赛，看他进球');
  render();
}
function pickScorer(){
  var pool=[];
  G.squad.forEach(function(p){
    if(p.inj>0 || p.rest) return; // 伤停和轮休的球员不上场，自然不会进球
    var w= p.pos==='前锋'? p.ab*3 : p.pos==='中场'? p.ab*1.4 : p.pos==='后卫'? p.ab*0.35 : p.ab*0.04;
    if(p.star) w*=1.7;
    pool.push({p:p, w:w});
  });
  if(!pool.length) return null;
  var tot=pool.reduce(function(s,x){ return s+x.w; },0), r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){ r-=pool[i].w; if(r<=0) return pool[i].p; }
  return pool[pool.length-1].p;
}

function closeModal(){ $modal.innerHTML=''; }

var SIGN_REWARDS=[10,15,20,30,40,60,150];

function showWeeklySign(thenStart){

    var dn=i+1;
    var cls= dn<next || (!can && dn===next)? 'done' : (can && dn===next? 'today':'');

  +'<div class="body"><div class="sign-grid">'+cells+'</div>'
  +'<p class="desc">今天是 '+G.year+' 年 '+G.mon+' 月 '+G.day+' 日'+(G.sign.streak>0?'，本轮已领到第 '+(((G.sign.streak-1)%7)+1)+' 天':'')+(G.sign.streak>=7?'（已完整领过 '+Math.floor(G.sign.streak/7)+' 轮）':'')+'。'+(can?'点下面按钮领第 '+next+' 天的奖励。':'今天的已经领过了——模拟推进到新的一天再来领第 '+next+' 天。')+'</p></div>'
  +'<div class="foot">'+(can?'<button class="btn-start" onclick="claimWeeklySign()">领取第 '+next+' 天 · 💎 '+SIGN_REWARDS[next-1]+(next===7?' + 现金 100万':'')+'</button>':'<button class="btn pri" onclick="closeSignModal()">明天再来</button>')+'<button class="btn" onclick="closeSignModal()">关闭</button></div></div></div>';
}
function claimWeeklySign(){
  if(!signCan()){ toast('今天已经签到过了，推进到新的一天再来'); return; }
  var next=signNextDay();
  var rw=SIGN_REWARDS[next-1];

  return '<div class="card"><h3><span class="no">生涯</span>我的生涯<span class="hint">'+esc(G.club)+' · 已运营 '+(G.seasonsPlayed||0)+' 个赛季 / '+G.month+' 个月</span></h3>'
  +'<p class="desc">这是你一个人的荣誉室：王朝评级、成就墙、长期目标、历届冠军和我的荣誉都在这一页，随经营实时更新。</p></div>'
  +'<div class="grid2">'
  +'<div class="card"><h3>👑 王朝评级</h3><p class="desc">夺冠次数、杯赛、集团阶段、估值、声望、资历和胜场都算分，评级随经营一直涨。</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;"><div class="end-grade">'+dg.grade+'</div><div><b>'+dg.title+'</b><div class="mini" style="margin-top:3px;">王朝积分 '+dg.score+' · 中超冠军 '+(G.titles||0)+' 次 · 足协杯关键战 '+(G.cupWins||0)+' 胜 · 累计胜场 '+(G.totalWins||0)+' · 集团阶段 '+STAGES[groupStage()].name+'</div></div></div></div>'
  +'<div class="card"><h3>🏆 我的荣誉</h3><p class="desc">中超冠军 '+(G.titles||0)+' 次 · 足协杯关键战 '+(G.cupWins||0)+' 胜 · 累计胜场 '+(G.totalWins||0)+' 场 · 已运营 '+(G.seasonsPlayed||0)+' 个赛季 · 声望 '+G.rep+' · 球迷 '+fmtFans(G.fans)+' · 俱乐部估值 '+fmt(v)+'</p><img src="photo-08.webp" alt="球队捧起冠军奖杯的真实照片" style="width:100%;border-radius:10px;display:block;"></div>'
  +'</div>'
  +'<div class="card"><h3><span class="no">冠军</span>历届冠军<span class="hint">累计 '+(G.titles||0)+' 冠</span></h3>'+champHTML+'</div>'

}
function pageHonors(){

  var past=G.awards||[];

  }).join('') : '<p class="desc">还没有颁过奖。打完第一个赛季（12 个月），12 月结算时自动举行第一次颁奖典礼，获奖名单会记在这里，球员的奖项也会记进他的球员卡。</p>';
  // 我的俱乐部荣誉（真实经营数据）
  var myHon='<div class="hon-card me"><div class="hn">⭐ '+esc(G.club)+'（我的俱乐部）</div><div class="hl trophy-line">'
  +'中超冠军 ×'+(G.titles||0)+' · 足协杯关键战 '+(G.cupWins||0)+' 胜 · 升级 '+(G.promoted||0)+' 次<br>'
  +'累计胜场 '+(G.totalWins||0)+' · 王朝评级 '+dynastyGrade().grade+'（'+dynastyGrade().title+'）· 集团阶段 '+STAGES[groupStage()].name+'<br>'
  +'当前 '+DIVS[G.div].short+'第 '+myRank()+' 名 · 声望 '+G.rep+' · 球迷 '+fmtFans(G.fans)+'</div></div>';
  // 三级联赛每支俱乐部的荣誉
  var cnHTML=DIVS.map(function(dd,di){
    var cards=dd.clubs.map(function(cn){ return '<div class="hon-card"><div class="hn">'+cn+'</div><div class="hl">'+cnClubHonors(cn,di)+'</div></div>'; }).join('');
    return '<div style="margin-top:12px;"><div style="font-weight:800;margin-bottom:6px;">'+dd.name+'<span class="mini" style="margin-left:8px;">游戏世界荣誉档案</span></div><div class="hon-grid">'+cards+'</div></div>';
  }).join('');

  var worldHTML=STAR_LEAGUES.map(function(L){
    var cards=L.teams.map(function(t){ return '<div class="hon-card"><div class="hn">'+t+'</div><div class="hl">'+(CLUB_HONORS[t]||'欧洲老牌球队')+'</div></div>'; }).join('');
    return '<div style="margin-top:12px;"><div style="font-weight:800;margin-bottom:6px;">'+L.name+'<span class="mini" style="margin-left:8px;">'+L.en+'</span></div><div class="hon-grid">'+cards+'</div></div>';
  }).join('');
  // 我的球员荣誉
  var nums=jerseyNumbers();
  var myPlayers=G.squad.slice().sort(function(a,b){ return ((G.goalTable||{})[b.name]||0)-((G.goalTable||{})[a.name]||0) || b.ab-a.ab; }).map(function(p){
    var hon=(G.playerHonors&&G.playerHonors[p.name])||[];
    var star=null; STARS.forEach(function(s){ if(s.id===p.star || s.name===p.name) star=s; });
    var lines=[];
    if(hon.length) lines.push('🏆 '+hon.map(function(h){ return '第 '+h.season+' 赛季'+h.award; }).join('、'));
    lines.push('本队累计进球 '+((G.goalTable&&G.goalTable[p.name])||0)+' · 本赛季 '+((G.seasonGoals&&G.seasonGoals[p.name])||0)+' 球');
    if(star && STAR_HONORS[star.id]) lines.push('真实荣誉：'+STAR_HONORS[star.id]);
    return '<div class="hon-card"><div class="hn">'+(p.img?'<img class="star-thumb" src="'+p.img+'" alt="'+esc(p.name)+'的真实照片"> ':'')+nums[p.name]+' 号 '+esc(p.name)+' <span class="mini">'+p.pos+' · 能力 '+p.ab+'</span></div><div class="hl">'+lines.join('<br>')+'</div><div style="margin-top:6px;"><button class="btn sm" onclick="showPlayer(\''+esc(p.name)+'\')">看球员卡</button></div></div>';
  }).join('');
  // 球星荣誉档案
  var starHon=STARS.map(function(s){
    return '<div class="hon-card"><div class="hn"><img class="star-thumb" src="'+s.img+'" alt="'+s.name+'的真实照片"> '+s.name+' <span class="mini">'+s.club+' · '+s.league+'</span></div><div class="hl">🏅 '+(STAR_HONORS[s.id]||'')+'<br>'+s.tag+'</div></div>';
  }).join('');
  return hero
  +'<div class="card"><h3><span class="no">颁奖</span>历届获奖名单<span class="hint">累计已颁 '+(past.length)+' 个奖项</span></h3>'+pastHTML+'</div>'
  +'<div class="card"><h3><span class="no">俱乐部</span>俱乐部荣誉室<span class="hint">我的俱乐部 + 三级联赛全部 24 支球队</span></h3><div class="hon-grid">'+myHon+'</div>'+cnHTML+'</div>'
  +'<div class="card"><h3><span class="no">世界</span>五大联赛俱乐部荣誉<span class="hint">27 支欧洲球队的队史荣誉</span></h3>'+worldHTML+'</div>'
  +'<div class="card"><h3><span class="no">球员</span>我的球员荣誉<span class="hint">点「看球员卡」查每个人的奖项和进球账</span></h3><div class="hon-grid">'+myPlayers+'</div></div>'
  +'<div class="card"><h3><span class="no">球星</span>球星荣誉档案<span class="hint">图鉴球星的真实个人荣誉</span></h3><div class="hon-grid">'+starHon+'</div></div>';
}
